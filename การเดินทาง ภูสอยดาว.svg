<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <!-- Filter เงาสำหรับกล่องข้อความ -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- เส้นทางหลัก (เส้นขอบเข้มเพื่อความชัดเจนบนทุกพื้นหลัง + เส้นประสีขาว) -->
  <path d="M 70,460 C 110,460 150,430 190,410 C 230,390 270,370 310,350 C 350,330 400,300 440,280 C 480,260 530,220 570,210 C 610,200 650,160 690,150 C 730,140 770,110 810,110 L 930,110"
        fill="none" stroke="#1A252C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 70,460 C 110,460 150,430 190,410 C 230,390 270,370 310,350 C 350,330 400,300 440,280 C 480,260 530,220 570,210 C 610,200 650,160 690,150 C 730,140 770,110 810,110 L 930,110"
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="8 4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- จุดที่ 1: จุดเริ่มต้น -->
  <g filter="url(#shadow)">
    <line x1="70" y1="460" x2="70" y2="485" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="70" cy="460" r="7" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="20" y="485" width="100" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="70" y="505" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">จุดเริ่มต้น</text>
  </g>

  <!-- จุดที่ 2: เนินส่งญาติ -->
  <g filter="url(#shadow)">
    <line x1="190" y1="410" x2="190" y2="360" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="190" cy="410" r="7" fill="#E65100" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="130" y="320" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="190" y="338" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">เนินส่งญาติ</text>
    <text x="190" y="353" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">1,600 ม.</text>
  </g>

  <!-- จุดที่ 3: เนินปราบเซียน -->
  <g filter="url(#shadow)">
    <line x1="310" y1="350" x2="310" y2="395" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="310" cy="350" r="7" fill="#E65100" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="250" y="395" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="310" y="413" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">เนินปราบเซียน</text>
    <text x="310" y="428" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">2,300 ม.</text>
  </g>

  <!-- จุดที่ 4: เนินป่าก่อ -->
  <g filter="url(#shadow)">
    <line x1="440" y1="280" x2="440" y2="230" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="440" cy="280" r="7" fill="#E65100" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="380" y="190" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="440" y="208" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">เนินป่าก่อ</text>
    <text x="440" y="223" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">3,200 ม.</text>
  </g>

  <!-- จุดที่ 5: เนินเสือโคร่ง -->
  <g filter="url(#shadow)">
    <line x1="570" y1="210" x2="570" y2="255" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="570" cy="210" r="7" fill="#E65100" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="510" y="255" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="570" y="273" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">เนินเสือโคร่ง</text>
    <text x="570" y="288" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">4,700 ม.</text>
  </g>

  <!-- จุดที่ 6: เนินมรณะ -->
  <g filter="url(#shadow)">
    <line x1="690" y1="150" x2="690" y2="100" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="690" cy="150" r="7" fill="#C0392B" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="630" y="60" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="690" y="78" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#C0392B">เนินมรณะ</text>
    <text x="690" y="93" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">4,900 ม.</text>
  </g>

  <!-- จุดที่ 7: จุดผู้พิชิตลานสนภูสอยดาว -->
  <g filter="url(#shadow)">
    <line x1="810" y1="110" x2="810" y2="155" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="810" cy="110" r="7" fill="#16A085" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="725" y="155" width="170" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="810" y="173" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="12" font-weight="bold" fill="#16A085">จุดผู้พิชิตลานสนภูสอยดาว</text>
    <text x="810" y="188" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">5,700 ม.</text>
  </g>

  <!-- จุดที่ 8: ลานกางเต็นท์ -->
  <g filter="url(#shadow)">
    <line x1="930" y1="110" x2="930" y2="60" stroke="#1A252C" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="930" cy="110" r="7" fill="#2980B9" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="870" y="20" width="120" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E0E0" stroke-width="1"/>
    <text x="930" y="38" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="13" font-weight="bold" fill="#2980B9">ลานกางเต็นท์</text>
    <text x="930" y="53" text-anchor="middle" font-family="'Kanit', 'Thonburi', sans-serif" font-size="11" fill="#7F8C8D">6,500 ม.</text>
  </g>
</svg>
