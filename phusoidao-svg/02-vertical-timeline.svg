<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 960" width="100%" height="100%">
  <!--
    แบบที่ 2: VERTICAL TIMELINE — ไทม์ไลน์แนวตั้งบนแผ่นโปร่งแสง (เหมาะกับคลิปแนวตั้ง / วางชิดขอบจอ)
    จุดต่ออนิเมชัน:
      #progress-line : pathLength=100 -> animate stroke-dashoffset 100 → 0 (เส้นไหลลงตามลำดับ)
      #stop-1..8     : animate opacity 0→1 + transform translate(-12,0)→(0,0)
      #panel         : fade in ก่อนทุกอย่าง
  -->
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4ADE80"/>
      <stop offset="45%"  stop-color="#FB923C"/>
      <stop offset="68%"  stop-color="#F87171"/>
      <stop offset="86%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <style>
    .nm { font-family: Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif; font-size: 20px; font-weight: 600; fill: #F1F6FA; }
    .ds { font-family: Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif; font-size: 14px; fill: #93A9BE; }
  </style>

  <!-- แผ่นพื้นโปร่งแสง -->
  <rect id="panel" x="20" y="20" width="580" height="920" rx="28" fill="#0B1622" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <g id="title">
    <text x="52" y="88" font-family="Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">การเดินทาง ภูสอยดาว</text>
    <text x="52" y="118" font-family="Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif" font-size="15" fill="#8FA6BC">ระยะทางรวม 6,500 เมตร · 8 จุดสำคัญ</text>
    <line x1="52" y1="140" x2="568" y2="140" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <!-- เส้นไทม์ไลน์ -->
  <g id="timeline">
    <line x1="76" y1="180" x2="76" y2="900" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <line id="progress-line" x1="76" y1="180" x2="76" y2="900" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" pathLength="100"/>
  </g>

  <g id="stop-1">
    <circle cx="76" cy="180" r="9" fill="#4ADE80" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="187">จุดเริ่มต้น</text>
    <text class="ds" x="568" y="186" text-anchor="end">0 ม.</text>
  </g>

  <g id="stop-2">
    <circle cx="76" cy="283" r="9" fill="#FB923C" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="290">เนินส่งญาติ</text>
    <text class="ds" x="568" y="289" text-anchor="end">1,600 ม.</text>
  </g>

  <g id="stop-3">
    <circle cx="76" cy="386" r="9" fill="#FB923C" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="393">เนินปราบเซียน</text>
    <text class="ds" x="568" y="392" text-anchor="end">2,300 ม.</text>
  </g>

  <g id="stop-4">
    <circle cx="76" cy="489" r="9" fill="#FB923C" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="496">เนินป่าก่อ</text>
    <text class="ds" x="568" y="495" text-anchor="end">3,200 ม.</text>
  </g>

  <g id="stop-5">
    <circle cx="76" cy="591" r="9" fill="#FB923C" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="598">เนินเสือโคร่ง</text>
    <text class="ds" x="568" y="597" text-anchor="end">4,700 ม.</text>
  </g>

  <g id="stop-6">
    <circle cx="76" cy="694" r="11" fill="none" stroke="#F87171" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="76" cy="694" r="9" fill="#F87171" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="701" fill="#FCA5A5">เนินมรณะ</text>
    <text class="ds" x="568" y="700" text-anchor="end">4,900 ม.</text>
  </g>

  <g id="stop-7">
    <circle cx="76" cy="797" r="9" fill="#2DD4BF" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="804" fill="#7FF0E0">จุดผู้พิชิตลานสนภูสอยดาว</text>
    <text class="ds" x="568" y="803" text-anchor="end">5,700 ม.</text>
  </g>

  <g id="stop-8">
    <circle cx="76" cy="900" r="14" fill="none" stroke="#60A5FA" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="76" cy="900" r="9" fill="#60A5FA" stroke="#0B1622" stroke-width="3"/>
    <text class="nm" x="112" y="907" fill="#BFDBFE">ลานกางเต็นท์</text>
    <text class="ds" x="568" y="906" text-anchor="end">6,500 ม.</text>
  </g>
</svg>
