<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="100%" height="100%">
  <!--
    แบบที่ 3 · NUMBERED — หมุดใส่ลำดับ 1–8 และมีเส้นขีดบางคั่นระหว่างชื่อเนินกับระยะทาง
    พิกัดหมุดเดียวกับต้นฉบับ (ป้าย "จุดเริ่มต้น" ขยับขวา 10px เพื่อหลบหมุดที่ใหญ่ขึ้น)
    อนิเมชัน: #route-reveal (dashoffset 100→0), #dot-1..8, #label-1..8, #tent
  -->
  <defs>
    <mask id="route-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="1200">
      <path id="route-reveal"
            d="M 114,943 L 249,858 L 340,762 L 452,642 L 522,554 L 605,427 L 690,379 L 843,380"
            fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="butt"
            pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0"/>
    </mask>
    <filter id="txtShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    text { font-family: Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif; fill: #FFFFFF; }
    .nm  { font-size: 30px; font-weight: 600; }
    .big { font-size: 34px; font-weight: 600; }
    .km  { font-size: 18px; letter-spacing: .5px; }
    .sub { font-size: 18px; }
    .no  { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .rule { stroke: #FFFFFF; stroke-opacity: .55; stroke-width: 1.5; }
  </style>

  <g id="route" mask="url(#route-mask)">
    <path id="route-line" d="M 114,943 L 249,858 L 340,762 L 452,642 L 522,554 L 605,427 L 690,379 L 843,380"
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="9 8" stroke-linecap="butt"/>
  </g>

  <g filter="url(#txtShadow)">
    <g id="label-1"><text class="nm" x="133" y="950">จุดเริ่มต้น</text></g>

    <g id="label-2">
      <text class="nm" x="181" y="825" text-anchor="middle">เนินส่งญาติ</text>
      <line class="rule" x1="114" y1="836" x2="248" y2="836"/>
      <text class="km" x="181" y="857" text-anchor="middle">1.6 กม.</text>
    </g>

    <g id="label-3">
      <text class="nm" x="272" y="738" text-anchor="middle">เนินปราบเซียน</text>
      <line class="rule" x1="184" y1="749" x2="360" y2="749"/>
      <text class="km" x="272" y="770" text-anchor="middle">2.3 กม.</text>
    </g>

    <g id="label-4">
      <text class="nm" x="386" y="619" text-anchor="middle">เนินป่ากอ</text>
      <line class="rule" x1="330" y1="630" x2="442" y2="630"/>
      <text class="km" x="386" y="651" text-anchor="middle">3.2 กม.</text>
    </g>

    <g id="label-5">
      <text class="nm" x="460" y="526" text-anchor="middle">เนินเสือโคร่ง</text>
      <line class="rule" x1="387" y1="537" x2="533" y2="537"/>
      <text class="km" x="460" y="558" text-anchor="middle">4.7 กม.</text>
    </g>

    <g id="label-6">
      <text class="nm" x="528" y="430" text-anchor="middle">เนินมรณะ</text>
      <line class="rule" x1="472" y1="441" x2="584" y2="441"/>
      <text class="km" x="528" y="462" text-anchor="middle">4.9 กม.</text>
    </g>

    <g id="label-7">
      <text class="sub" x="631" y="308" text-anchor="middle">ความสูง 1,633 ม.</text>
      <text class="big" x="631" y="339" text-anchor="middle">ผู้พิชิตภูสอยดาว</text>
      <line class="rule" x1="522" y1="349" x2="740" y2="349"/>
      <text class="km"  x="631" y="364" text-anchor="middle">5.7 กม.</text>
    </g>

    <g id="label-8">
      <text class="sub" x="853" y="308" text-anchor="middle">ลานสนภูสอยดาว</text>
      <text class="big" x="853" y="339" text-anchor="middle">ลานกางเต็นท์</text>
      <line class="rule" x1="762" y1="349" x2="944" y2="349"/>
      <text class="km"  x="853" y="364" text-anchor="middle">6.5 กม.</text>
    </g>
  </g>

  <g id="dots">
    <g id="dot-1"><circle cx="114" cy="943" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="114" y="948" text-anchor="middle">1</text></g>
    <g id="dot-2"><circle cx="249" cy="858" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="249" y="863" text-anchor="middle">2</text></g>
    <g id="dot-3"><circle cx="340" cy="762" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="340" y="767" text-anchor="middle">3</text></g>
    <g id="dot-4"><circle cx="452" cy="642" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="452" y="647" text-anchor="middle">4</text></g>
    <g id="dot-5"><circle cx="522" cy="554" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="522" y="559" text-anchor="middle">5</text></g>
    <g id="dot-6"><circle cx="605" cy="427" r="13" fill="#E4553C" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="605" y="432" text-anchor="middle">6</text></g>
    <g id="dot-7"><circle cx="690" cy="379" r="13" fill="#F69052" stroke="#FFFFFF" stroke-width="2"/><text class="no" x="690" y="384" text-anchor="middle">7</text></g>
    <g id="dot-8"><circle cx="843" cy="380" r="13" fill="#FFFFFF" stroke="#F69052" stroke-width="3"/><text class="no" x="843" y="385" text-anchor="middle" fill="#E4553C">8</text></g>
  </g>

  <g id="tent" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="812.5" y1="449" x2="843" y2="398.5"/>
    <line x1="862.5" y1="449" x2="832.5" y2="398.5"/>
    <line x1="812.5" y1="449" x2="862.5" y2="449"/>
    <line x1="837.2" y1="412" x2="837.2" y2="431"/>
    <polyline points="827.5,449 837.2,430.5 847,449"/>
  </g>
</svg>
