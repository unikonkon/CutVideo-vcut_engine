<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <!--
    แบบที่ 4: METRO LINE — เส้นตรงสไตล์แผนที่รถไฟฟ้า เรียบสุด ใช้เป็นแถบล่างจอ (lower third) ได้
    จุดต่ออนิเมชัน:
      #progress : pathLength=100 -> animate stroke-dashoffset 100 → 0 (สีวิ่งไปตามเส้น)
      #stop-1..8 : animate opacity / scale ให้ป้ายเด้งขึ้นตอนเส้นวิ่งถึง
      พื้นหลังโปร่งใส + ตัวอักษรมีขอบขาว อ่านได้บนทุกพื้นหลัง
  -->
  <defs>
    <linearGradient id="metroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2E7D32"/>
      <stop offset="42%"  stop-color="#E65100"/>
      <stop offset="68%"  stop-color="#C0392B"/>
      <stop offset="86%"  stop-color="#16A085"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
  </defs>

  <style>
    .nm { font-family: Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif; font-size: 15px; font-weight: 600;
          fill: #16242F; stroke: #FFFFFF; stroke-width: 4; stroke-linejoin: round; paint-order: stroke; }
    .ds { font-family: Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif; font-size: 12px;
          fill: #5A7183; stroke: #FFFFFF; stroke-width: 3.5; stroke-linejoin: round; paint-order: stroke; }
    .tk { stroke: #16242F; stroke-width: 1.6; stroke-opacity: .6; }
  </style>

  <text x="60" y="42" font-family="Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif" font-size="26" font-weight="700"
        fill="#10202B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">การเดินทาง ภูสอยดาว</text>
  <text x="940" y="42" text-anchor="end" font-family="Kanit, 'Noto Sans Thai', Sarabun, Thonburi, sans-serif" font-size="14"
        fill="#33505F" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6,500 เมตร · 8 จุด</text>

  <g id="line">
    <line x1="60" y1="160" x2="940" y2="160" stroke="#0F1E28" stroke-width="16" stroke-linecap="round" stroke-opacity=".9"/>
    <line id="progress" x1="60" y1="160" x2="940" y2="160" stroke="url(#metroGrad)" stroke-width="11" stroke-linecap="round" pathLength="100"/>
  </g>

  <g id="stop-1">
    <line class="tk" x1="60" y1="172" x2="60" y2="186"/>
    <text class="nm" x="60" y="204" text-anchor="middle" fill="#2E7D32">จุดเริ่มต้น</text>
    <text class="ds" x="60" y="222" text-anchor="middle">0 ม.</text>
    <circle cx="60" cy="160" r="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/>
  </g>

  <g id="stop-2">
    <line class="tk" x1="186" y1="148" x2="186" y2="134"/>
    <text class="nm" x="186" y="128" text-anchor="middle">เนินส่งญาติ</text>
    <text class="ds" x="186" y="108" text-anchor="middle">1,600 ม.</text>
    <circle cx="186" cy="160" r="8" fill="#FFFFFF" stroke="#E65100" stroke-width="4"/>
  </g>

  <g id="stop-3">
    <line class="tk" x1="311" y1="172" x2="311" y2="186"/>
    <text class="nm" x="311" y="204" text-anchor="middle">เนินปราบเซียน</text>
    <text class="ds" x="311" y="222" text-anchor="middle">2,300 ม.</text>
    <circle cx="311" cy="160" r="8" fill="#FFFFFF" stroke="#E65100" stroke-width="4"/>
  </g>

  <g id="stop-4">
    <line class="tk" x1="437" y1="148" x2="437" y2="134"/>
    <text class="nm" x="437" y="128" text-anchor="middle">เนินป่าก่อ</text>
    <text class="ds" x="437" y="108" text-anchor="middle">3,200 ม.</text>
    <circle cx="437" cy="160" r="8" fill="#FFFFFF" stroke="#E65100" stroke-width="4"/>
  </g>

  <g id="stop-5">
    <line class="tk" x1="563" y1="172" x2="563" y2="186"/>
    <text class="nm" x="563" y="204" text-anchor="middle">เนินเสือโคร่ง</text>
    <text class="ds" x="563" y="222" text-anchor="middle">4,700 ม.</text>
    <circle cx="563" cy="160" r="8" fill="#FFFFFF" stroke="#E65100" stroke-width="4"/>
  </g>

  <g id="stop-6">
    <line class="tk" x1="689" y1="148" x2="689" y2="134"/>
    <text class="nm" x="689" y="128" text-anchor="middle" fill="#C0392B">เนินมรณะ</text>
    <text class="ds" x="689" y="108" text-anchor="middle">4,900 ม.</text>
    <circle cx="689" cy="160" r="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="4"/>
  </g>

  <g id="stop-7">
    <line class="tk" x1="814" y1="172" x2="814" y2="186"/>
    <text class="nm" x="814" y="204" text-anchor="middle" fill="#16A085">จุดผู้พิชิตลานสนภูสอยดาว</text>
    <text class="ds" x="814" y="222" text-anchor="middle">5,700 ม.</text>
    <circle cx="814" cy="160" r="8" fill="#FFFFFF" stroke="#16A085" stroke-width="4"/>
  </g>

  <g id="stop-8">
    <line class="tk" x1="940" y1="148" x2="940" y2="134"/>
    <text class="nm" x="940" y="128" text-anchor="middle" fill="#2980B9">ลานกางเต็นท์</text>
    <text class="ds" x="940" y="108" text-anchor="middle">6,500 ม.</text>
    <circle cx="940" cy="160" r="10" fill="#FFFFFF" stroke="#2980B9" stroke-width="4"/>
  </g>
</svg>
