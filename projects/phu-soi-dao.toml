# โปรเจกต์จริง: เดินป่าภูสอยดาว — ฟุตเทจ 273 คลิป 51 นาที
#
# ใช้:  ./vcut run -c projects/phu-soi-dao.toml
#       ./vcut decide -c projects/phu-soi-dao.toml --set broll.run_max=4
extends = "hiking-vlog"

[project]
name   = "phu-soi-dao"
source = "/Users/macbook3lf1/web work/ตัดต่อ vido/vido"
work   = "/Users/macbook3lf1/web work/CutVideo-vcut_engine/.vcut"
out    = "/Users/macbook3lf1/web work/CutVideo-vcut_engine/final.mp4"

[listen]
# มี transcript จากรอบก่อนอยู่แล้ว — ดึงมาใช้ ไม่ต้องถอดเสียงใหม่ 12 นาที
import_dir = "/Users/macbook3lf1/web work/ตัดต่อ vido/v2_transcripts"

[render]
min_free_gb = 4.0        # ดิสก์เหลือน้อย เตือนไว้ต่ำหน่อยแต่ยังกันพลาด

[run]
advise = true

[ai]
enabled = false

[scan.rotation_overrides]
IMG_7079 = "transpose=2"
IMG_7170 = "transpose=2"

[jumpcut]
enabled = true

[prepare]
keep = ["IMG_7075", "IMG_7080", "IMG_7099", "IMG_7118", "IMG_7142", "IMG_7152", "IMG_7162", "IMG_7195", "IMG_7232", "IMG_7379", "IMG_7382", "IMG_7384", "IMG_7401", "IMG_7404", "IMG_7405", "IMG_7411", "IMG_7424", "IMG_7425", "IMG_7440", "IMG_7441", "IMG_7444", "IMG_7449", "IMG_7452", "IMG_7457", "IMG_7458", "IMG_7508", "IMG_7509", "IMG_7514", "IMG_7529", "IMG_7560", "IMG_7572", "IMG_7589", "IMG_7594", "IMG_7598", "IMG_7618", "IMG_7632", "IMG_7662", "IMG_7672", "IMG_7678", "IMG_7682", "IMG_7689", "IMG_7713", "IMG_7714", "IMG_7715", "IMG_7719", "IMG_7735"]

