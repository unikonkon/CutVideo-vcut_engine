<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vcut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d; --dim:#8a8378;
  --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a; --ok:#3d7d5a;
  --off:#f2efe9; --radius:7px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da; --dim:#8f877b;
         --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
         --ok:#6fbf92; --off:#252320; }
}
:root[data-theme=dark]{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da;
  --dim:#8f877b; --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
  --ok:#6fbf92; --off:#252320; }
:root[data-theme=light]{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d;
  --dim:#8a8378; --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a;
  --ok:#3d7d5a; --off:#f2efe9; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.42em .9em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.sm{padding:.25em .6em;font-size:12.5px}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:.2em .5em}
button.ghost:hover{color:var(--fg)}
input[type=text],input[type=number],select,textarea{width:100%;padding:.38em .55em;
  background:var(--bg);border:1px solid var(--line);border-radius:5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical}

header{position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem}
h1{font-size:15px;margin:0;font-weight:700}
.spacer{flex:1}
.chip{border:1px solid var(--line);border-radius:100px;padding:.15em .7em;
  font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip.warn{border-color:var(--warn);color:var(--warn)} .chip.warn b{color:var(--warn)}

/* แถบขั้นตอน */
.steps{display:flex;gap:0;padding:0 1rem;overflow-x:auto}
.steps button{border:0;border-bottom:2px solid transparent;border-radius:0;
  background:none;padding:.5rem .9rem .6rem;display:flex;gap:.5rem;align-items:center;
  color:var(--dim);white-space:nowrap}
.steps button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--fg)}
.steps .n{background:var(--off);color:var(--dim);border-radius:100px;width:1.5em;
  height:1.5em;display:grid;place-items:center;font-size:11px;font-weight:800}
.steps button[aria-selected=true] .n{background:var(--accent);color:#fff}
.steps .n.done{background:var(--ok);color:#fff}
.steps .lab{font-weight:600;font-size:13.5px}
.steps .st{font-size:11.5px;color:var(--dim)}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1rem;
  padding:1rem;align-items:start;max-width:1560px;margin:0 auto}
@media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr)} aside{position:static!important} }
aside{position:sticky;top:104px;display:flex;flex-direction:column;gap:.75rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.9rem;margin-bottom:.8rem}
.card h2{font-size:14px;margin:0 0 .2rem;font-weight:700}
.card h3{font-size:12px;margin:0 0 .55rem;color:var(--dim);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.card .lead{font-size:12.5px;color:var(--dim);margin:0 0 .8rem}
.acts{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.note{font-size:12px;color:var(--dim);margin:.45rem 0 0}
.probe{font-size:12px;margin-top:.3rem}
.probe.ok{color:var(--ok)} .probe.bad{color:var(--warn)}

/* ฟอร์ม */
.field{display:grid;grid-template-columns:1fr 220px;gap:.6rem;align-items:center;
  padding:.5rem 0;border-bottom:1px solid var(--off)}
.field:last-child{border-bottom:0}
.field .nm{font-size:13px;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.field .hlp{font-size:11.5px;color:var(--dim);margin-top:.1rem}
.field .key{font:11px ui-monospace,Menlo,monospace;color:var(--dim);opacity:.65}
.field.on input,.field.on select,.field.on textarea{border-color:var(--accent)}
.tier{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700;
  border:1px solid currentColor;opacity:.8}
.t-render,.t-scan,.t-listen{color:var(--warn)}
.t-ai{color:#a8571f} .t-edl,.t-thumbs{color:var(--ok)} .t-free{color:var(--dim)}
.rng{display:flex;gap:.5rem;align-items:center}
.rng input[type=range]{flex:1;min-width:0}
.rng output{font-size:12px;font-variant-numeric:tabular-nums;min-width:3.6em;
  text-align:right;color:var(--dim)}
label.ck{display:flex;gap:.4rem;align-items:center;cursor:pointer;font-size:12.5px}
.multi{display:flex;flex-direction:column;gap:.2rem}
details.adv{border-top:1px solid var(--off);margin-top:.7rem}
details.adv>summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:.55rem 0;
  list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸ ";}
details.adv[open]>summary::before{content:"▾ ";}

/* คลัง / ไทม์ไลน์ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:820px){ .two{grid-template-columns:1fr} }
.colhead{display:flex;gap:.5rem;align-items:center;font-size:12.5px;font-weight:700;
  margin-bottom:.4rem}
.kind{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700}
.kind.TALK{background:color-mix(in srgb,var(--talk) 18%,transparent);color:var(--talk)}
.kind.BROLL{background:color-mix(in srgb,var(--broll) 18%,transparent);color:var(--broll)}
ul{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:26px 62px 1fr auto;gap:.55rem;align-items:center;
  padding:.35rem .5rem;border:1px solid transparent;border-radius:var(--radius)}
li.row:hover{background:var(--off);border-color:var(--line)}
li.row.sel{border-color:var(--accent)}
li.row.off{opacity:.4} li.row.off .name{text-decoration:line-through}
li.row.bad{opacity:.55}
li.row.drag{opacity:.35} li.row.over{border-top:2px solid var(--accent)}
.idx{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:62px;height:35px;object-fit:cover;border-radius:4px;background:var(--off);
  display:block;cursor:grab}
.mid{min-width:0}
.name{font-size:12.5px;font-weight:600;display:flex;gap:.4rem;align-items:center}
.sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rowacts{display:flex;gap:.15rem;align-items:center}
.dur{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:3.2em;text-align:right}
.scroll{max-height:30em;overflow:auto}
.empty{color:var(--dim);font-size:12.5px;padding:1.6rem 0;text-align:center}
.chapter{margin:1rem 0 .3rem;display:flex;align-items:center;gap:.6rem}
.chapter h4{font-size:12.5px;margin:0;font-weight:700}
.chapter hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

/* โหมดของขั้น 3 */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.4rem}
.modes button{text-align:left;padding:.5rem .7rem;line-height:1.35}
.modes button[aria-pressed=true]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modes .mt{font-weight:600;font-size:13px;display:block}
.modes .md{font-size:11px;color:var(--dim)}

/* AI review */
.summary{font-size:12.5px;border-left:2px solid var(--accent);padding-left:.6rem;margin:.6rem 0}
.ops{display:flex;flex-direction:column;gap:.35rem;max-height:20em;overflow:auto;margin-top:.5rem}
.op{display:grid;grid-template-columns:auto 1fr;gap:.5rem;font-size:12px;
  border:1px solid var(--line);border-radius:5px;padding:.4rem .5rem}
.op.taken{opacity:.45;border-style:dashed}
.op .t{font-weight:700} .op .t.drop{color:var(--warn)} .op .t.move{color:var(--accent)}
.op .w{color:var(--dim);font-size:11.5px}
.op .jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;
  font-size:11.5px;text-align:left}
.stale{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:5px;
  padding:.4em .6em;margin-top:.5rem}
.big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big.hot{color:var(--warn)} .big.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.2rem .7rem;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
video{width:100%;border-radius:5px;background:#000;display:block}
.quote{font-size:12px;color:var(--dim);margin-top:.5rem;max-height:7em;overflow:auto;
  border-left:2px solid var(--line);padding-left:.6rem}
#log{font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:15em;
  overflow:auto;color:var(--dim);word-break:break-word}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--fg);color:var(--bg);padding:.55em 1.1em;border-radius:100px;
  font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.25);max-width:80vw}
.toast.err{background:var(--warn);color:#fff}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">vcut</h1>
    <span class="chip" id="c-proj">—</span>
    <span class="spacer"></span>
    <span class="chip" id="c-dirty" hidden></span>
    <button id="save" disabled>บันทึกค่า</button>
    <button id="run" class="primary">ทำทุกขั้น</button>
  </div>
  <div class="steps" id="steps"></div>
</header>

<main>
  <section id="body"></section>
  <aside>
    <div class="card" id="side-est" hidden>
      <h3>ถ้าสร้างไฟล์ตอนนี้</h3>
      <div id="est"></div>
    </div>
    <div class="card" id="side-prev" hidden>
      <h3>ตัวอย่าง</h3>
      <div id="preview"></div>
    </div>
    <div class="card">
      <h3>บันทึกการทำงาน</h3>
      <div id="log">ยังไม่มีงานที่สั่ง</div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let D = null, POOL = null, S = null, RV = null;
let step = 1, edits = {}, items = [], sel = -1, dragFrom = -1;
let logSince = 0, polling = null, estTimer = null, taken = new Set();

const mmss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const hhmm = s => s < 60 ? `${Math.round(s)} วิ`
  : s < 3600 ? `${Math.round(s/60)} นาที` : `${(s/3600).toFixed(1)} ชม.`;
const val = k => k in edits ? edits[k] : (D && D.values[k]);
const tlDirty = () => items.some(x => x.off) || items.some((x,i) => x.i !== i);

function toast(msg, err){
  const t = el('div', 'toast' + (err ? ' err' : ''), msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 2600);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}
const post = (p, b) => api(p, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(b || {})});

// ── โหลดสถานะทั้งหมด ─────────────────────────────────────────────

async function load(keepEdits){
  const [d, pool, st] = await Promise.all([
    api('/api/setup'), api('/api/pool').catch(() => ({has:false, pieces:[]})),
    api('/api/state').catch(() => null)]);
  D = d; POOL = pool; S = st;
  if (!keepEdits) edits = {};
  if (S && S.timeline){ items = S.timeline.map(x => ({...x, off:false})); sel = -1; }
  $('#title').textContent = D.values['project.name'] || 'vcut';
  $('#c-proj').textContent = D.project.path || 'ยังไม่มีไฟล์โปรเจกต์';
  renderSteps(); render();
  loadReview();
}

function stepState(n){
  const ph = D.phases[n-1];
  if (!ph) return {};
  const done = ph.steps.filter(s => s.exists).length;
  return {done, total: ph.steps.length, ph};
}

function renderSteps(){
  const box = $('#steps'); box.innerHTML = '';
  D.phases.forEach((ph, i) => {
    const n = i + 1;
    const {done, total} = stepState(n);
    const b = el('button');
    b.setAttribute('aria-selected', step === n);
    b.append(el('span', 'n' + (done === total ? ' done' : ''), String(n)));
    const c = el('span'); c.style.textAlign = 'left';
    c.append(el('span', 'lab', ph.label),
             el('span', 'st', done === total ? 'ทำแล้ว'
                : done ? `ทำไป ${done}/${total}` : 'ยังไม่ได้ทำ'));
    c.querySelector('.lab').style.display = 'block';
    c.querySelector('.st').style.display = 'block';
    b.append(c);
    b.onclick = () => { step = n; renderSteps(); render(); };
    box.appendChild(b);
  });
  const n = Object.keys(edits).length;
  $('#save').disabled = !n;
  $('#save').textContent = n ? `บันทึกค่า (${n})` : 'บันทึกค่า';
  $('#c-dirty').hidden = !n;
  $('#c-dirty').className = 'chip warn';
  $('#c-dirty').innerHTML = `<b>${n}</b> ค่าที่ยังไม่บันทึก`;
}

function render(){
  const b = $('#body'); b.innerHTML = '';
  $('#side-est').hidden = step !== 3;
  $('#side-prev').hidden = step === 1;
  if (step === 1) stepSource(b);
  if (step === 2) stepPrepare(b);
  if (step === 3) stepCompose(b);
  if (step === 3) scheduleEstimate();
}

// ── ขั้น 1 · เลือกฟุตเทจ ─────────────────────────────────────────

function stepSource(box){
  const c = el('div', 'card');
  c.append(el('h2', null, 'ขั้น 1 · เลือกฟุตเทจ'),
           el('p', 'lead', 'ชี้ไปที่โฟลเดอร์คลิปดิบ แล้วอ่านคุณสมบัติทุกคลิปครั้งเดียวจบ '
                         + '— หลังจากนี้ไม่ต้องแตะไฟล์วิดีโออีกเลย'));
  ['project.source', 'project.name', 'project.out'].forEach(k => {
    const f = D.fields.find(x => x.key === k);
    if (f) c.appendChild(field(f));
  });
  const a = el('div', 'acts');
  const btn = el('button', 'primary runbtn', 'อ่านคลิปทั้งโฟลเดอร์');
  btn.onclick = () => runStep('source');
  a.append(btn);
  const sc = D.steps.find(s => s.id === 'scan');
  if (sc && sc.exists) a.append(el('span', 'note', sc.summary));
  c.appendChild(a);
  c.appendChild(advanced(['scan', 'thumbs']));
  box.appendChild(c);

  if (POOL.has || (sc && sc.exists)) box.appendChild(clipGrid());
}

function clipGrid(){
  const c = el('div', 'card');
  c.append(el('h3', null, 'คลิปที่อ่านได้'));
  const names = [...new Set((POOL.pieces || []).map(p => p.name))].slice(0, 120);
  if (!names.length){ c.appendChild(el('p', 'empty', 'ยังไม่มีคลิป')); return c; }
  const g = el('div');
  g.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.35rem';
  names.forEach(n => {
    const i = el('img'); i.src = `/thumb/${n}.jpg`; i.loading = 'lazy'; i.title = n;
    i.style.cssText = 'width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px';
    g.appendChild(i);
  });
  c.appendChild(g);
  const total = [...new Set((POOL.pieces || []).map(p => p.name))].length;
  if (total > names.length)
    c.appendChild(el('p', 'note', `แสดง ${names.length} จาก ${total} คลิป`));
  return c;
}

// ── ขั้น 2 · เตรียมวิดีโอ ────────────────────────────────────────

function stepPrepare(box){
  const c = el('div', 'card');
  c.append(el('h2', null, 'ขั้น 2 · เตรียมวิดีโอ'),
           el('p', 'lead', 'ดูทีละคลิป — แยกคลิปพูดกับคลิปวิว ตัดเอาเฉพาะช่วงที่ใช้ได้ '
                         + 'เก็บเข้าคลังไว้รอประกอบในขั้นถัดไป'));

  const jobs = el('div', 'acts');
  [['listen', 'ดึงบทพูด', 'ถอดเสียงทุกคลิปด้วย whisper'],
   ['ai', 'ดึงความหมาย (AI)', 'ให้ AI อ่านว่าคลิปไหนเล่าอะไร'],
   ['prepare', 'ตัดทีละคลิป', 'สร้างคลังชิ้นจากค่าที่ตั้งไว้']].forEach(([id, lab, tip]) => {
    const s = D.steps.find(x => x.id === id) || {};
    const b = el('button', 'runbtn' + (id === 'prepare' ? ' primary' : ''), lab);
    b.title = tip;
    b.onclick = () => runStep(id);
    jobs.appendChild(b);
    if (s.exists) jobs.appendChild(el('span', 'note', s.summary));
  });
  c.appendChild(jobs);

  const aiF = D.fields.find(f => f.key === 'ai.enabled');
  if (aiF){
    const w = el('div'); w.style.marginTop = '.8rem';
    w.appendChild(field(aiF));
    if (val('ai.enabled')){
      ['ai.goal', 'ai.tasks', 'ai.model'].forEach(k => {
        const f = D.fields.find(x => x.key === k); if (f) w.appendChild(field(f));
      });
    }
    c.appendChild(w);
  }
  const ds = D.fields.find(f => f.key === 'prepare.drop_silent');
  if (ds) c.appendChild(field(ds));

  c.appendChild(advanced(['listen', 'prepare', 'ai']));
  box.appendChild(c);

  if (POOL.has) box.appendChild(poolView());
}

function poolView(){
  const c = el('div', 'card');
  const s = POOL.summary || {};
  c.append(el('h3', null, `คลังชิ้น — ${s.usable} ชิ้นใช้ได้`
    + (s.excluded ? ` · ${s.excluded} ชิ้นถูกกรองออก` : '')));
  const two = el('div', 'two');
  [['TALK', 'วิดีโอพูด', s.talk, s.duration_talk],
   ['BROLL', 'วิดีโอวิว', s.broll, s.duration_broll]].forEach(([k, lab, n, dur]) => {
    const col = el('div');
    const h = el('div', 'colhead');
    h.append(el('span', 'kind ' + k, lab), el('span', 'sub',
      `${n} ชิ้น · ${mmss(dur || 0)}`));
    col.appendChild(h);
    const wrap = el('div', 'scroll'), ul = el('ul');
    (POOL.pieces || []).filter(p => p.kind === k).slice(0, 400)
      .forEach(p => ul.appendChild(poolRow(p)));
    wrap.appendChild(ul); col.appendChild(wrap);
    two.appendChild(col);
  });
  c.appendChild(two);
  return c;
}

function poolRow(p){
  const li = el('li', 'row' + (p.ok ? '' : ' bad'));
  li.append(el('div', 'idx', ''));
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.src = `/thumb/${p.name}.jpg`;
  li.append(img);
  const mid = el('div', 'mid');
  const nm = el('div', 'name'); nm.append(p.name);
  if (p.used) nm.append(el('span', 'sub', '· อยู่ในหนังแล้ว'));
  if (!p.ok) nm.append(el('span', 'sub', '· ' + (p.why || 'ถูกกรองออก')));
  mid.append(nm, el('div', 'sub', p.meaning || p.text
    || `motion ${p.motion ?? '—'} · สว่าง ${p.bright ?? '—'}`));
  li.append(mid, el('div', 'dur', p.dur.toFixed(1) + 'ว'));
  li.onclick = () => previewPiece(p);
  return li;
}

  pattern: ['สลับตามรูปแบบ', 'พูด → วิว → วิว วนไป'],
  budget: ['กำหนดเวลารวม', 'พูดกี่นาที วิวกี่นาที'],
  numbers: ['ตามเลขคลิป', 'เช่น 7068-7200, 7305'],
  timerange: ['ตามช่วงเวลาถ่าย', 'เอาเฉพาะวันที่ระบุ'],
  manual: ['เลือกทีละชิ้น', 'ติ๊กเองจากคลัง'],
  ai: ['ให้ AI เลือก', 'อิงจากความหมาย + โจทย์ที่สั่ง'],
};
const MODE_FIELDS = {
  all: [], pattern: ['compose.pattern', 'compose.target_minutes'],
  budget: ['compose.talk_minutes', 'compose.broll_minutes', 'compose.avoid_adjacent'],

function stepCompose(box){

  const modes = el('div', 'modes');
  Object.entries(MODE_HELP).forEach(([m, [t, d]]) => {
    const b = el('button');
    b.setAttribute('aria-pressed', m === mode);

    b.onclick = () => { setKey('compose.mode', D.values['compose.mode'], m); render(); };

  });

    a.append(el('span', 'note',
      `ตอนนี้ ${S.summary.segments} ชิ้น · ${mmss(S.summary.duration_total)}`));

function pickList(){
  const c = el('div', 'card');
  c.append(el('h3', null, 'เลือกชิ้นที่จะใส่'));
  const chosen = new Set(val('compose.manual') || []);

    cb.onchange = () => {
      const now = new Set(val('compose.manual') || []);
      cb.checked ? now.add(p.id) : now.delete(p.id);
      setKey('compose.manual', D.values['compose.manual'],
             (POOL.pieces || []).filter(x => now.has(x.id)).map(x => x.id));
      renderSteps();
    };
    li.append(cb);
    const img = el('img', 'thumb'); img.loading = 'lazy'; img.src = `/thumb/${p.name}.jpg`;
    li.append(img);
    const mid = el('div', 'mid');

    nm.append(el('span', 'kind ' + p.kind, p.kind === 'TALK' ? 'พูด' : 'วิว'), p.id);

function timeline(){
  const c = el('div', 'card');
  const st = items.filter(x => !x.off);
  c.append(el('h3', null, `ไทม์ไลน์ — ${st.length} ชิ้น · `
    + mmss(st.reduce((a,b) => a + b.dur, 0))));
  const bar = el('div', 'acts'); bar.style.marginTop = '0';
  const sv = el('button', 'sm', 'บันทึกไทม์ไลน์');
  sv.disabled = !tlDirty(); sv.onclick = saveTimeline;
  const ud = el('button', 'sm', 'ย้อนกลับ');
  ud.onclick = async () => { try { await post('/api/undo'); await load(true);
    toast('ย้อนกลับแล้ว'); } catch(e){ toast(e.message, true); } };
  bar.append(sv, ud);
  c.appendChild(bar);

  const wrap = el('div', 'scroll'); wrap.style.maxHeight = '40em';
  let chap = ' ', ul = null;
  items.forEach((x, i) => {
    if (x.chapter !== chap){
      chap = x.chapter;
      if (chap){
        const h = el('div', 'chapter');
        h.append(el('h4', null, x.chapter_title || chap), el('hr'));
        wrap.appendChild(h);
      }
      ul = el('ul'); wrap.appendChild(ul);
    }
    if (!ul){ ul = el('ul'); wrap.appendChild(ul); }
    ul.appendChild(tlRow(x, i));
  });
  c.appendChild(wrap);
  return c;
}

function tlRow(x, i){
  const li = el('li', 'row' + (x.off ? ' off' : '') + (i === sel ? ' sel' : ''));
  li.append(el('div', 'idx', String(i + 1)));
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.draggable = true;
  img.src = `/thumb/${x.name}.jpg`;
  li.append(img);
  const mid = el('div', 'mid');
  const nm = el('div', 'name');
  nm.append(el('span', 'kind ' + x.kind, x.kind === 'TALK' ? 'พูด' : 'วิว'), x.name);
  mid.append(nm, el('div', 'sub', x.text || x.meaning
    || `motion ${x.motion ?? '—'} · สว่าง ${x.bright ?? '—'}`));
  li.append(mid);
  const acts = el('div', 'rowacts');
  acts.append(el('div', 'dur', x.dur.toFixed(1) + 'ว'),
              mk('↑', () => move(i, -1)), mk('↓', () => move(i, 1)),
              mk(x.off ? '↺' : '✕', () => { x.off = !x.off; render(); }));
  li.append(acts);
  li.onclick = e => { if (e.target.tagName !== 'BUTTON'){ sel = i; render();
                                                          previewPiece(x); } };
  img.addEventListener('dragstart', e => { dragFrom = i; li.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move'; });
  img.addEventListener('dragend', () => { li.classList.remove('drag'); dragFrom = -1; });
  li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
  li.addEventListener('dragleave', () => li.classList.remove('over'));
  li.addEventListener('drop', e => {
    e.preventDefault(); li.classList.remove('over');
    if (dragFrom >= 0 && dragFrom !== i){
      const [m] = items.splice(dragFrom, 1); items.splice(i, 0, m); sel = i; render();
    }
  });
  return li;
}

function mk(label, fn){
  const b = el('button', 'ghost', label);
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}
function move(i, d){
  const j = i + d; if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  if (sel === i) sel = j; else if (sel === j) sel = i;
  render();
}

function previewPiece(x){
  const box = $('#preview'); box.innerHTML = '';
  $('#side-prev').hidden = false;
  if (x.seg){
    const v = el('video'); v.controls = true; v.preload = 'metadata';
    v.src = `/seg/${x.seg}`; box.appendChild(v);
  } else {
    const i = el('img'); i.src = `/thumb/${x.name}.jpg`;
    i.style.cssText = 'width:100%;border-radius:5px'; box.appendChild(i);
  }
  const kv = [['คลิป', x.name],
              ['ช่วง', `${x.start.toFixed(2)} – ${(x.end ?? x.start + x.dur).toFixed(2)} วิ`],
              ['ยาว', x.dur.toFixed(2) + ' วิ'],
              ['ประเภท', x.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว']];
  if (x.meaning) kv.push(['ความหมาย', x.meaning]);
  if (x.chapter_title) kv.push(['บท', x.chapter_title]);
  if (x.ai_score != null) kv.push(['คะแนน AI', (+x.ai_score).toFixed(2)]);
  const dl = el('dl', 'kv'); dl.style.marginTop = '.6rem';
  kv.forEach(([k, v]) => { dl.append(el('dt', null, k), el('dd', null, v)); });
  box.appendChild(dl);
  if (x.text) box.appendChild(el('div', 'quote', x.text));
}

function advanced(stages){
  const d = el('details', 'adv');
  d.appendChild(el('summary', null, 'ตั้งค่าเพิ่มเติม'));
  const fs = D.fields.filter(f => stages.includes(f.stage)
    && !['project.source','project.name','project.out','ai.enabled','ai.goal',
         'ai.tasks','ai.model','prepare.drop_silent','compose.mode']
        .includes(f.key)
    && !Object.values(MODE_FIELDS).flat().includes(f.key));
  if (!fs.length) d.appendChild(el('p', 'note', 'ไม่มีค่าเพิ่มเติมในขั้นนี้'));
  fs.forEach(f => d.appendChild(field(f)));
  return d;
}

function setKey(key, orig, v){
  if (JSON.stringify(v) === JSON.stringify(orig)) delete edits[key];
  else edits[key] = v;
  renderSteps();
  if (step === 3) scheduleEstimate();
}

function field(f){
  const row = el('div', 'field' + (f.key in edits ? ' on' : ''));
  const lab = el('div');
  const nm = el('div', 'nm'); nm.append(f.label);
  nm.append(el('span', 'tier t-' + f.tier, D.tiers[f.tier].label),
            el('span', 'key', f.key));
  lab.appendChild(nm);
  if (f.help) lab.appendChild(el('div', 'hlp', f.help));
  const ctl = el('div');
  ctl.appendChild(widget(f, row));
  if (f.type === 'path' && f.key === 'project.source'){
    const p = el('div', 'probe'); p.id = 'probe-src'; ctl.appendChild(p);
    setTimeout(probe, 0);
  }
  row.append(lab, ctl);
  return row;
}

function widget(f, row){
  const v = val(f.key), set = x => { setKey(f.key, D.values[f.key], x);
    row.classList.toggle('on', f.key in edits); };
  if (f.type === 'bool'){
    const l = el('label', 'ck');
    const i = el('input'); i.type = 'checkbox'; i.checked = !!v;
    i.onchange = () => { set(i.checked); if (f.key === 'ai.enabled') render(); };
    l.append(i); return l;
  }
  if (f.type === 'select'){
    const s = el('select');
    (f.options || []).forEach(o => {
      const op = el('option', null, (f.labels && f.labels[o]) || o); op.value = o;
      s.appendChild(op);
    });
    s.value = v == null ? '' : String(v);
    s.onchange = () => set(s.value); return s;
  }
  if (f.type === 'multi' || f.type === 'multi_order'){
    const d = el('div', 'multi');
    const cur = Array.isArray(v) ? v.slice() : [];
    if (f.type === 'multi_order'){
      const i = el('input'); i.type = 'text'; i.value = cur.join(', ');
      i.placeholder = 'TALK, BROLL, BROLL';
      i.onchange = () => set(i.value.split(',').map(x => x.trim().toUpperCase())
                              .filter(x => x === 'TALK' || x === 'BROLL'));
      d.appendChild(i);
      d.appendChild(el('div', 'hlp', 'พิมพ์ TALK / BROLL คั่นด้วยจุลภาค'));
      return d;
    }
    (f.options || []).forEach(o => {
      const l = el('label', 'ck');
      const i = el('input'); i.type = 'checkbox'; i.checked = cur.includes(o);
      i.dataset.o = o;
      i.onchange = () => set((f.options || []).filter(x =>
        d.querySelector(`input[data-o="${x}"]`).checked));
      l.append(i, document.createTextNode((f.labels && f.labels[o]) || o));
      d.appendChild(l);
    });
    return d;
  }
  if ((f.type === 'int' || f.type === 'float') && f.min != null){
    const d = el('div', 'rng');
    const i = el('input'); i.type = 'range'; i.min = f.min; i.max = f.max;
    i.step = f.step || 1; i.value = v ?? f.min;
    const o = el('output');
    const show = x => o.textContent = x + (f.unit ? ' ' + f.unit : '');
    show(i.value);
    i.oninput = () => show(i.value);
    i.onchange = () => set(f.type === 'int' ? parseInt(i.value,10) : parseFloat(i.value));
    d.append(i, o); return d;
  }
  if (f.type === 'list_float'){
    const i = el('input'); i.type = 'text'; i.value = (v || []).join(', ');
    i.onchange = () => set(i.value.split(',').map(x => parseFloat(x.trim()))
                            .filter(x => !isNaN(x)));
    return i;
  }
  if (f.type === 'text'){
    const i = el('textarea'); i.rows = 2; i.value = v || '';
    i.placeholder = f.placeholder || ''; i.onchange = () => set(i.value); return i;
  }
  const i = el('input');
  i.type = (f.type === 'int' || f.type === 'float') ? 'number' : 'text';
  if (f.step) i.step = f.step;
  i.value = v == null ? '' : v; i.placeholder = f.placeholder || '';
  i.onchange = () => set(f.type === 'int' ? parseInt(i.value,10)
                    : f.type === 'float' ? parseFloat(i.value) : i.value);
  return i;
}

async function probe(){
  const e = $('#probe-src'); if (!e) return;
  e.textContent = '…'; e.className = 'probe';
  try {
    const r = await api('/api/probe_dir?path=' + encodeURIComponent(val('project.source') || ''));
    e.textContent = r.msg; e.className = 'probe ' + (r.ok ? 'ok' : 'bad');
  } catch(_){ e.textContent = ''; }
}

function scheduleEstimate(){ clearTimeout(estTimer); estTimer = setTimeout(estimate, 400); }

async function estimate(){

  catch(err){ box.innerHTML = ''; box.appendChild(el('p','note',err.message)); return; }

  box.appendChild(el('div', 'big ' + (e.new ? 'hot' : 'ok'),
    e.new ? `render ใหม่ ${e.new} ชิ้น` : 'ไม่ต้อง render ใหม่'));

                ['จำนวนชิ้น', `${e.segments} (${e.talk} พูด + ${e.broll} วิว)`],

async function saveConfig(){
  if (!Object.keys(edits).length) return;
  try {
    const r = await post('/api/setup', {path: D.project.path || 'projects/untitled.toml',
                                        values: edits});
    edits = {}; toast('บันทึกลง ' + r.path + ' แล้ว'); await load();
  } catch(e){ toast(e.message, true); }
}

async function runStep(id){
  if (Object.keys(edits).length){
    if (!confirm('ยังมีค่าที่ยังไม่บันทึก — บันทึกก่อนแล้วรันเลยไหม?')) return;
    await saveConfig();
  }
  try { await post('/api/job', {step: id}); logSince = 0; $('#log').textContent = '';
        poll(); } catch(e){ toast(e.message, true); }
}

async function doCompose(mode){
  try {
    await post('/api/compose', {values: edits, ask: mode === 'ai',
                                context: val('compose.context') || ''});
    edits = {}; logSince = 0; $('#log').textContent = ''; poll();
  } catch(e){ toast(e.message, true); }
}

async function saveTimeline(){
  const keep = items.filter(x => !x.off).map(({name, start, dur}) => ({name, start, dur}));
  if (!keep.length) return toast('ต้องเหลืออย่างน้อย 1 ชิ้น', true);
  try {
    const r = await post('/api/edl', {keep});
    toast(`บันทึกแล้ว · ${r.summary.segments} ชิ้น · ${mmss(r.summary.duration_total)}`);
    await load(true);
  } catch(e){ toast(e.message, true); }
}

async function buildFile(){
  if (tlDirty()) return toast('ยังไม่ได้บันทึกไทม์ไลน์ — กดบันทึกก่อน', true);
  let p;
  try { p = await api('/api/plan'); } catch(e){ return toast(e.message, true); }
  const run = p.steps.filter(s => s.run);
  const lines = ['จะรันตามลำดับนี้:', '', ...run.map((s,i) => `  ${i+1}. ${s.label}`), ''];
  if (p.estimate && p.estimate.new)
    lines.push(`render ใหม่ ${p.estimate.new} ชิ้น (ใช้ของเดิมได้ ${p.estimate.reuse})`);
  else if (p.estimate) lines.push('ไม่ต้อง render ใหม่');
  if (p.seconds) lines.push(`ประมาณ ${hhmm(p.seconds)}`);
  if (p.unknown.length) lines.push(`ยังไม่รวมเวลาของ: ${p.unknown.join(' · ')}`);
  if (confirm(lines.join('\n'))) runStep('plan');
}

async function poll(){
  clearTimeout(polling);
  let j;
  try { j = await api('/api/job?since=' + logSince); } catch(e){ return; }
  if (j.lines.length){
    logSince = j.total;
    const e = $('#log'); e.textContent += j.lines.join('\n') + '\n';
    e.scrollTop = e.scrollHeight;
  }
  document.querySelectorAll('.runbtn, #run').forEach(b => b.disabled = j.running);
  $('#run').textContent = j.running ? `กำลัง ${j.step}…` : 'ทำทุกขั้น';
  if (j.running) polling = setTimeout(poll, 800);
  else if (j.code === 0){ toast('เสร็จแล้ว'); load(true); }
  else if (j.code != null) toast('งานล้มเหลว — ดูบันทึกการทำงาน', true);
}

function reviewCard(){
  const c = el('div', 'card');
  c.append(el('h3', null, 'ให้ AI ดูหนังที่ตัดแล้ว'));
  const ta = el('textarea'); ta.rows = 2; ta.id = 'rvctx';
  ta.placeholder = 'อยากให้ดูอะไรเป็นพิเศษ? เช่น "ช่วงกลางเรื่องยืดไป" · เว้นว่างก็ได้';
  if (RV && RV.context) ta.value = RV.context;
  c.appendChild(ta);
  const a = el('div', 'acts');
  const b = el('button', 'primary runbtn', 'วิเคราะห์');
  b.onclick = analyze; a.append(b);
  if (RV && RV.has) a.append(el('span', 'note', `${(RV.ops||[]).length} ข้อเสนอ`));
  c.appendChild(a);
  if (!RV || !RV.has) return c;

  if (RV.summary) c.appendChild(el('div', 'summary', RV.summary));
  if (RV.stale){
    c.appendChild(el('div', 'stale', 'ไทม์ไลน์เปลี่ยนไปหลังจาก AI ดู — '
      + 'ตำแหน่งที่มันอ้างเลื่อนแล้ว กดวิเคราะห์ใหม่ก่อนรับข้อเสนอ'));
    return c;
  }
  const ops = RV.ops || [];
  if (!ops.length){ c.appendChild(el('p','note','AI ไม่เสนอให้แก้อะไร')); return c; }
  const list = el('div', 'ops');
  ops.forEach(o => {
    const e = el('div', 'op' + (taken.has(o.id) ? ' taken' : ''));
    const cb = el('input'); cb.type = 'checkbox';
    cb.checked = !taken.has(o.id); cb.disabled = taken.has(o.id); cb.dataset.id = o.id;
    const mid = el('div');
    mid.append(el('span', 't ' + o.op, o.op === 'drop' ? 'เอาออก' : `ย้ายไปที่ ${o.to + 1}`));
    const j = el('button', 'jump', ` #${o.at + 1} ${o.name} · ${o.dur.toFixed(1)}ว`);
    j.onclick = () => { sel = o.at; render();
      document.querySelectorAll('li.row')[o.at]?.scrollIntoView({block:'center'}); };
    mid.append(j, el('div', 'w', o.why));
    e.append(cb, mid); list.appendChild(e);
  });
  c.appendChild(list);
  const acts = el('div', 'acts');
  const ap = el('button', null, 'ใส่ที่ติ๊กไว้');
  ap.onclick = () => applyOps(list); acts.append(ap);
  c.appendChild(acts);
  return c;
}

function applyOps(list){
  const ids = [...list.querySelectorAll('input:checked')].map(i => +i.dataset.id);
  const ops = (RV.ops || []).filter(o => ids.includes(o.id));
  if (!ops.length) return toast('ยังไม่ได้ติ๊กข้อไหนเลย', true);
  const bad = ops.filter(o => items[o.at]?.name !== o.name);
  if (bad.length) return toast(`ตำแหน่งไม่ตรงกับตอนที่ AI ดู ${bad.length} ข้อ`, true);

  // ทำงานกับ "ตัวช็อต" ไม่ใช่ตำแหน่ง เพราะพอย้ายข้อแรกแล้วเลขของข้อถัดไปเลื่อนหมด
  const drops = ops.filter(o => o.op === 'drop');
  const moves = ops.filter(o => o.op === 'move').map(o => ({item: items[o.at], to: o.to}));
  drops.forEach(o => { items[o.at].off = true; });
  moves.sort((a,b) => a.to - b.to).forEach(({item, to}) => {
    const from = items.indexOf(item); if (from < 0) return;
    items.splice(from, 1); items.splice(Math.min(to, items.length), 0, item);
  });
  ops.forEach(o => taken.add(o.id));
  sel = -1; render();
  toast(`ใส่แล้ว ${drops.length} เอาออก + ${moves.length} ย้าย — กดบันทึกไทม์ไลน์`);
}

async function analyze(){
  if (tlDirty() && !confirm('ยังไม่ได้บันทึกไทม์ไลน์ — AI จะดูจากฉบับที่บันทึกไว้ ไปต่อไหม?'))
    return;
  try {
    await post('/api/review', {context: ($('#rvctx') || {}).value || ''});
    taken.clear(); logSince = 0; $('#log').textContent = ''; poll();
  } catch(e){ toast(e.message, true); }
}

$('#save').onclick = saveConfig;
$('#run').onclick = () => runStep('plan');
window.addEventListener('beforeunload', e => {
  if (Object.keys(edits).length || tlDirty()){ e.preventDefault(); e.returnValue = ''; }
});

load().then(() => {
  // เปิดที่ขั้นแรกที่ยังทำไม่เสร็จ — ไม่ต้องให้คนเดาว่าต้องเริ่มตรงไหน
  for (let n = 1; n <= D.phases.length; n++){
    const {done, total} = stepState(n);
    if (done < total){ step = n; break; }
    step = D.phases.length;
  }
  renderSteps(); render();
}).catch(e => toast(e.message, true));
poll();
</script>
