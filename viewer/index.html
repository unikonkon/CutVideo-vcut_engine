<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vcut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d; --dim:#8a8378;
  --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a; --ok:#3d7d5a;
  --off:#f2efe9; --radius:7px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da; --dim:#8f877b;
         --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
         --ok:#6fbf92; --off:#252320; }
}
:root[data-theme=dark]{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da;
  --dim:#8f877b; --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
  --ok:#6fbf92; --off:#252320; }
:root[data-theme=light]{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d;
  --dim:#8a8378; --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a;
  --ok:#3d7d5a; --off:#f2efe9; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.42em .9em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.sm{padding:.25em .6em;font-size:12.5px}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:.2em .5em}
button.ghost:hover{color:var(--fg)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;
  padding:.38em .55em;background:var(--bg);border:1px solid var(--line);border-radius:5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical}

/* แถบหัว — แถวเดียว สูงราว 32px
   เดิมเป็นสองแถบซ้อนกัน (ชื่อโปรเจกต์+ปุ่ม แล้วต่อด้วยแถบขั้นตอนแบบแท็บสองบรรทัด)
   รวมเป็น 114px ที่ปักหมุดค้างอยู่ตลอดเวลา = เกือบ 1/8 ของจอค้างไว้ให้สิ่งที่แทบ
   ไม่ได้แตะระหว่างทำงาน  ตอนนี้ยุบเหลือแถวเดียว: สถานะของแต่ละขั้นย้ายไปอยู่ที่
   *สีของเลข* (เทา=ยังไม่ทำ · เขียว=ทำแล้ว · ส้ม=ค่าเปลี่ยนไปแล้ว) เหลือเป็น
   ตัวหนังสือเฉพาะตอนที่ต้องเตือนจริง ๆ */
header{position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;padding:.25rem .7rem}
h1{font-size:13px;margin:0;font-weight:700;white-space:nowrap}
.spacer{flex:1}
header button{padding:.2em .65em;font-size:12.5px}
.chip{border:1px solid var(--line);border-radius:100px;padding:.1em .6em;
  font-size:11.5px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip.warn{border-color:var(--warn);color:var(--warn)} .chip.warn b{color:var(--warn)}
#c-proj{max-width:15rem;overflow:hidden;text-overflow:ellipsis}

/* แถบขั้นตอน — อยู่ในแถวเดียวกับชื่อโปรเจกต์ */
.steps{display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{border:1px solid transparent;border-radius:100px;background:none;
  padding:.15em .55em;display:flex;gap:.35rem;align-items:center;
  color:var(--dim);white-space:nowrap;font-size:12.5px}
/* เดิมขั้นที่เลือกอยู่บอกด้วยขีดใต้ยาว ๆ ซึ่งพอย่อเป็นเม็ดเล็กแล้วแทบไม่เห็น
   — ใช้พื้นหลัง + ขอบสีเน้นแทน ไม่ขยับ layout เพราะขอบใสกว้างเท่ากันอยู่แล้ว */
.steps button[aria-selected=true]{background:var(--off);color:var(--fg);
  border-color:var(--accent)}
.steps .n{background:var(--off);color:var(--dim);border-radius:100px;width:1.45em;
  height:1.45em;display:grid;place-items:center;font-size:10.5px;font-weight:800}
.steps button[aria-selected=true] .n{background:var(--accent);color:#fff}
.steps .n.done{background:var(--ok);color:#fff}
.steps .n.hot{background:var(--warn);color:#fff}
.steps .lab{font-weight:600}
.steps .st{font-size:11.5px;color:var(--dim)}
.steps .st.hot{color:var(--warn)}

main{display:grid;grid-template-columns:minmax(0,1fr) var(--sidew,340px);gap:1rem;
  padding:1rem;align-items:start;max-width:1560px;margin:0 auto}
/* กางแถบข้างให้กว้างขึ้นตอนเปิดดูคลิป — 340px ดูวิดีโอเพื่อตัดสินว่าจะหมุนไหม
   หรือคลิปตั้งควรใช้โหมดไหน มันเล็กเกินกว่าจะเห็นอะไร */
body.wideside{--sidew:440px}
@media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr)} aside{position:static!important} }
/* ปักหมุดใต้แถบหัวพอดี — วัดความสูงจริงเอา (headHeight) ไม่ใช่ตัวเลขตายตัว
   เพราะแถบหัวขึ้นบรรทัดที่สองได้เองตอนจอแคบ */
aside{position:sticky;top:calc(var(--headh, 33px) + .5rem);
  display:flex;flex-direction:column;gap:.75rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.9rem;margin-bottom:.8rem}
.card h2{font-size:14px;margin:0 0 .2rem;font-weight:700}
.card h3{font-size:12px;margin:0 0 .55rem;color:var(--dim);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.card .lead{font-size:12.5px;color:var(--dim);margin:0 0 .8rem}
.acts{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.note{font-size:12px;color:var(--dim);margin:.45rem 0 0}
.note.warnnote{color:var(--warn)}
.probe{font-size:12px;margin-top:.3rem}
.probe.ok{color:var(--ok)} .probe.bad{color:var(--warn)}

/* ฟอร์ม */
.field{display:grid;grid-template-columns:1fr 220px;gap:.6rem;align-items:center;
  padding:.5rem 0;border-bottom:1px solid var(--off)}
.field:last-child{border-bottom:0}
.field .nm{font-size:13px;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.field .hlp{font-size:11.5px;color:var(--dim);margin-top:.1rem}
.field .key{font:11px ui-monospace,Menlo,monospace;color:var(--dim);opacity:.65}
.field.on input,.field.on select,.field.on textarea{border-color:var(--accent)}
.tier{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700;
  border:1px solid currentColor;opacity:.8}
.t-render,.t-scan,.t-listen{color:var(--warn)}
.t-ai,.t-silence{color:#a8571f} .t-edl,.t-thumbs{color:var(--ok)} .t-free{color:var(--dim)}
.rng{display:flex;gap:.5rem;align-items:center}
.rng input[type=range]{flex:1;min-width:0}
.rng output{font-size:12px;font-variant-numeric:tabular-nums;min-width:3.6em;
  text-align:right;color:var(--dim)}
.rng input.nudge{width:5.4em;flex:none;font:12px ui-monospace,Menlo,monospace;
  text-align:right;padding:.18rem .3rem}
.rng .unit{font-size:11px;color:var(--dim);flex:none;min-width:1.6em}
label.ck{display:flex;gap:.4rem;align-items:center;cursor:pointer;font-size:12.5px}
.multi{display:flex;flex-direction:column;gap:.2rem}
details.adv{border-top:1px solid var(--off);margin-top:.7rem}
details.adv>summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:.55rem 0;
  list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸ ";}
details.adv[open]>summary::before{content:"▾ ";}

/* คลัง / ไทม์ไลน์ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:820px){ .two{grid-template-columns:1fr} }
.colhead{display:flex;gap:.5rem;align-items:center;font-size:12.5px;font-weight:700;
  margin-bottom:.4rem}
.kind{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700}
.kind.TALK{background:color-mix(in srgb,var(--talk) 18%,transparent);color:var(--talk)}
.kind.BROLL{background:color-mix(in srgb,var(--broll) 18%,transparent);color:var(--broll)}
ul{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:26px 62px 1fr auto;gap:.55rem;align-items:center;
  padding:.35rem .5rem;border:1px solid transparent;border-radius:var(--radius)}
li.row:hover{background:var(--off);border-color:var(--line)}
li.row.sel{border-color:var(--accent)}
li.row.off{opacity:.4} li.row.off .name{text-decoration:line-through}
li.row.bad{opacity:.55}
li.row.drag{opacity:.35} li.row.over{border-top:2px solid var(--accent)}
.idx{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:62px;height:35px;object-fit:cover;border-radius:4px;background:var(--off);
  display:block;cursor:grab}
.mid{min-width:0}
.name{font-size:12.5px;font-weight:600;display:flex;gap:.4rem;align-items:center}
.sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rowacts{display:flex;gap:.15rem;align-items:center}
.dur{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:3.2em;text-align:right}
.scroll{max-height:30em;overflow:auto}
.empty{color:var(--dim);font-size:12.5px;padding:1.6rem 0;text-align:center}
.chapter{margin:1rem 0 .3rem;display:flex;align-items:center;gap:.6rem}
.chapter h4{font-size:12.5px;margin:0;font-weight:700}
.chapter hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

/* โหมดของขั้น 3 */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.4rem}
.grouphd{display:flex;align-items:baseline;gap:.45rem;margin:.9rem 0 .35rem;
  font-size:12px}
.grouphd:first-child{margin-top:0}
.grouphd b{font-size:12.5px}
.grouphd span{color:var(--dim)}
.grouphd.ai b{color:var(--warn)}
.seg.wrap{flex-wrap:wrap;border:0;gap:.3rem}
.seg.wrap button{border:1px solid var(--line);border-radius:var(--radius)}
.modes button{text-align:left;padding:.5rem .7rem;line-height:1.35}
.modes button[aria-pressed=true]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modes .mt{font-weight:600;font-size:13px;display:block}
.modes .md{font-size:11px;color:var(--dim)}

/* AI review */
.summary{font-size:12.5px;border-left:2px solid var(--accent);padding-left:.6rem;margin:.6rem 0}
.ops{display:flex;flex-direction:column;gap:.35rem;max-height:20em;overflow:auto;margin-top:.5rem}
.op{display:grid;grid-template-columns:auto 1fr;gap:.5rem;font-size:12px;
  border:1px solid var(--line);border-radius:5px;padding:.4rem .5rem}
.op.taken{opacity:.45;border-style:dashed}
.op .t{font-weight:700} .op .t.drop{color:var(--warn)} .op .t.move{color:var(--accent)}
.op .w{color:var(--dim);font-size:11.5px}
.op .jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;
  font-size:11.5px;text-align:left}
.stale{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:5px;
  padding:.4em .6em;margin-top:.5rem}
.big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big.hot{color:var(--warn)} .big.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.2rem .7rem;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
video{width:100%;border-radius:5px;background:#000;display:block}
.quote{font-size:12px;color:var(--dim);margin-top:.5rem;max-height:7em;overflow:auto;
  border-left:2px solid var(--line);padding-left:.6rem}
/* บทพูด — แต่ละบรรทัดกดได้ กดแล้วกระโดดไปวินาทีนั้นในวิดีโอ */
.trl{max-height:17em;overflow:auto;display:flex;flex-direction:column;gap:1px;
  border:1px solid var(--line);border-radius:6px;padding:.25rem}
.trl.tall{max-height:26em}
.trl button{display:flex;gap:.55rem;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-radius:4px;padding:.2rem .35rem;color:inherit;
  font-size:12.5px;line-height:1.5;cursor:pointer}
.trl button:hover{background:var(--line)}
/* ท่อนที่กำลังเล่นถึง — ขีดข้างซ้ายไว้ให้ตาจับได้โดยไม่ต้องอ่านเวลาเทียบเอง */
.trl button.on{background:var(--off);box-shadow:inset 2px 0 0 var(--accent)}
.trl button.on .t{color:var(--accent)}
.trl .t{font:11px ui-monospace,Menlo,monospace;color:var(--dim);flex:none;
  font-variant-numeric:tabular-nums}
.trl .x{flex:1;min-width:0}
.trl .cn{font-size:11px;color:var(--dim);flex:none}
.trl mark{background:#8a6d1a55;color:inherit;border-radius:2px}
.trl .hd{font-size:11px;color:var(--dim);padding:.35rem .35rem .1rem;
  position:sticky;top:0;background:var(--panel)}
.trs{display:flex;gap:.4rem;align-items:center;margin:.5rem 0 .45rem}
.trs input{flex:1;min-width:0}
/* ── ขั้น 5 · แต่งหนัง ── */
.fxplan{display:flex;flex-direction:column;gap:.45rem;margin:.6rem 0 .2rem}
.fxrow{display:flex;gap:.55rem;align-items:flex-start}
.fxtag{flex:none;width:1.35rem;height:1.35rem;border-radius:5px;display:grid;
  place-items:center;font-size:11px;font-weight:600;background:var(--off);
  color:var(--dim);margin-top:.05rem}
.fxtag.hot{background:var(--warn);color:#fff}
.fxwhat{font-size:12.5px}
.fxbox{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;
  margin:.4rem 0;background:var(--panel)}
.fxboxhd{display:flex;gap:.5rem;align-items:center;font-size:12.5px}
.fxboxhd b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* รูปทรงบนตัวเล่น — ลากได้เหมือนกล่องข้อความ */
.pvcap .cp.sh{pointer-events:auto;cursor:move;line-height:0}
.pvcap .cp.sh svg{display:block;overflow:visible}
/* ภาพซ้อนบนตัวเล่น */
.pvcap .cp.ovl{pointer-events:auto;cursor:move;line-height:0}
.pvcap .cp.jrn{pointer-events:auto;cursor:move;line-height:0}
.pvcap .cp.jrn svg{display:block}
.pvcap .cp.ovl img{display:block;width:100%;height:auto}
.fxvid{display:grid;place-items:center;width:100%;height:100%;font-size:11px;
  color:var(--dim);border:1px dashed var(--line);border-radius:6px;
  background:rgba(0,0,0,.35);padding:.4rem;text-align:center;word-break:break-all}
/* คลังไฟล์ภาพซ้อน */
.fxdrop{border:1.5px dashed var(--line);border-radius:10px;padding:.9rem;
  text-align:center;cursor:pointer;margin:.5rem 0}
.fxdrop:hover,.fxdrop.on{border-color:var(--accent);background:rgba(255,255,255,.03)}
.fxlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:.6rem;margin:.6rem 0}
.fxasset{border:1px solid var(--line);border-radius:8px;padding:.4rem;
  background:var(--panel);min-width:0}
.fxasset img{width:100%;height:78px;object-fit:contain;display:block;
  background:repeating-conic-gradient(#2a2a2a 0 25%,#1e1e1e 0 50%) 0/16px 16px;
  border-radius:5px}
.fxasset .fxvid{height:78px}
.fxaname{font-size:11px;margin-top:.25rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fxaacts{display:flex;gap:.3rem;margin-top:.3rem}
.fxaacts button:first-child{flex:1}

/* ── ขั้น 4 · ชั้นข้อความ ── */
/* ชั้นพรีวิวทับตัวเล่น — ไม่รับคลิก ยกเว้นตัวกล่องข้อความที่ลากได้ */
.pvcap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pvcap .cp{position:absolute;line-height:1.25;white-space:pre-wrap;
  -webkit-font-smoothing:antialiased}
.pvcap .cp.bx{pointer-events:auto;cursor:move;max-width:80%}
.pvcap .cp.sub{pointer-events:auto;cursor:move}
.pvcap .cp.on{outline:1px dashed var(--accent);outline-offset:3px}
/* ปุ่มเพิ่มข้อความบนตัวเล่น — อยู่นอก .pvcap เพราะชั้นนั้นไม่รับคลิกทั้งชั้น */
.pvadd{position:absolute;top:.5rem;right:.5rem;z-index:4;font-size:12px;
  padding:.25rem .55rem;border-radius:6px;border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.55);color:#fff;cursor:pointer;backdrop-filter:blur(2px)}
.pvadd:hover{background:var(--accent);border-color:var(--accent)}
.caph{font-size:12.5px;margin:.9rem 0 .1rem;padding-top:.6rem;
  border-top:1px solid var(--off)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:.5rem .9rem;margin:.2rem 0 .6rem}
.capf{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.capf > label{font-size:11.5px;color:var(--dim)}
.capc{display:flex;gap:.35rem;align-items:center}
.capc input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);
  border-radius:5px;background:none;flex:none;cursor:pointer}
.capc input[type=text]{font:11.5px ui-monospace,Menlo,monospace}
/* ตาราง 3×3 เลือกตำแหน่ง — จุดในช่องบอกมุมที่ข้อความจะไปเกาะ */
.capal{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:74px}
.capal button{height:20px;border:1px solid var(--line);border-radius:3px;
  background:var(--bg);cursor:pointer;padding:0}
.capal button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.caplines{display:flex;flex-direction:column;gap:2px;max-height:24em;overflow:auto;
  border:1px solid var(--line);border-radius:6px;padding:.3rem}
.caplw{display:flex;flex-direction:column;gap:.15rem}
.capline{display:flex;gap:.4rem;align-items:center}
.capline .sm.hot{color:var(--accent);border-color:var(--accent)}
.capline .sm[aria-pressed=true]{background:var(--accent);border-color:var(--accent);
  color:#fff}
.capsub{border:1px solid var(--accent);border-radius:6px;padding:.45rem .6rem;
  margin:.1rem 0 .35rem}
.capsub .capgrid{margin:.35rem 0 .2rem}
.capline input[type=text]{flex:1;min-width:0;font-size:12.5px}
.capline.off input{opacity:.4;text-decoration:line-through}
.capline.on input{border-color:var(--accent)}
.capt{font:11px ui-monospace,Menlo,monospace;color:var(--dim);background:none;
  border:0;padding:.1rem .3rem;cursor:pointer;flex:none;width:3.6em;text-align:right}
.capt:hover:not(:disabled){color:var(--accent)}
.capbox{border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;
  margin-bottom:.5rem}
.capbox.on{border-color:var(--accent)}
.capbh{display:flex;gap:.5rem;align-items:center;margin-bottom:.35rem}
.cmd{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;padding:.45rem .6rem;margin:.4rem 0;overflow-x:auto}
/* หัวการ์ดบทพูด — ทั้งแถวกดพับ/กางได้ ไม่ใช่แค่ลูกศรเล็ก ๆ */
.trhead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.trtog{display:flex;gap:.45rem;align-items:center;background:none;border:0;padding:0;
  cursor:pointer;color:inherit}
.trtog h3{margin:0}
.trtog .caret{color:var(--dim);font-size:11px;width:.8em}
.trtog:hover .caret{color:var(--fg)}
/* ปุ่มที่อ่านเหมือนลิงก์ — ใช้ในประโยค ไม่ใช่ปุ่มสั่งงานเต็มตัว */
.linky{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;
  font:inherit;text-decoration:underline;text-underline-offset:2px}
.trdl{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.trdl a{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
  border-radius:5px;padding:.15rem .5rem}
.trdl a:hover{color:var(--fg);border-color:var(--dim)}
#log{font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:15em;
  overflow:auto;color:var(--dim);word-break:break-word}
/* กำลังทำงานอยู่ไหม ทำถึงไหนแล้ว — อยู่เหนือบันทึก จะได้เห็นก่อนตัวหนังสือ */
#jobst{margin-bottom:.55rem}
#jobst:empty{display:none}
#jobst .hd{display:flex;align-items:center;gap:.4rem;font-size:12.5px;font-weight:600}
#jobst .hd .nth,#jobst .hd .sp{font-weight:400;color:var(--dim);
  font-variant-numeric:tabular-nums;font-size:11.5px}
#jobst .hd .sp{margin-left:auto}
#jobst .sub{font-size:11.5px;color:var(--dim);margin-top:.15rem;
  font-variant-numeric:tabular-nums}
#jobst .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  flex:0 0 auto;animation:pulse 1.1s ease-in-out infinite}
#jobst .dot.ok{background:var(--ok);animation:none}
#jobst .dot.bad{background:var(--warn);animation:none}
#jobst .dot.off{background:var(--line);animation:none}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
.pbar{height:6px;border-radius:3px;background:var(--off);overflow:hidden;margin-top:.4rem}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .25s linear}
.pbar.wait i{width:35%;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%} 100%{margin-left:100%}}
button.busy{position:relative}
button.busy::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
/* คลังคลิปในขั้น 1 */
.bar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:.3em .75em;
  font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:.45rem;
  max-height:44em;overflow:auto}
.cl{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--off);cursor:grab}
.cl:active{cursor:grabbing}
.cl.drag{opacity:.35}
/* เส้นบอกว่าปล่อยแล้วจะไปแทรกด้านไหนของคลิปที่ชี้อยู่ */
.cl.dl::after,.cl.dr::after{content:'';position:absolute;top:0;bottom:0;width:4px;
  background:var(--accent);z-index:3}
.cl.dl::after{left:0} .cl.dr::after{right:0}
.cl img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.cl.off img{opacity:.28;filter:grayscale(1)}
.cl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cl .tag{position:absolute;top:3px;left:3px;display:flex;gap:2px}
.cl .b{font-size:9.5px;font-weight:700;padding:.1em .4em;border-radius:3px;
  background:rgba(0,0,0,.68);color:#fff;line-height:1.5}
.cl .b.v{background:var(--broll)} .cl .b.r{background:var(--accent)}
.cl .pick{position:absolute;top:3px;right:3px;width:17px;height:17px;margin:0;
  accent-color:var(--accent);cursor:pointer}
.cl .cap{display:flex;justify-content:space-between;gap:.3rem;padding:.2rem .35rem;
  font-size:10.5px;color:var(--dim);background:var(--panel)}
.cl .cap b{color:var(--fg);font-weight:600;font-size:11px}

/* คลังชิ้นในขั้น 2 */
li.row.kept{border-color:var(--ok);
  background:color-mix(in srgb,var(--ok) 8%,transparent)}
li.row.bad .why{color:var(--warn)}
.why{font-size:11.5px}
.back{width:16px;height:16px;margin:0;accent-color:var(--ok);cursor:pointer}
.track{position:relative;height:5px;border-radius:3px;background:var(--off);
  margin:.5rem 0 .1rem;overflow:hidden}
.track .on{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px;
  min-width:2px}

/* กล่องดูคลิปทีละตัว */
.vwrap{background:#000;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.vwrap video{display:block;max-width:100%;max-height:46vh;width:auto}
.vwrap.r90 video,.vwrap.r270 video{max-height:none;max-width:46vh}
.r90 video{transform:rotate(90deg)} .r270 video{transform:rotate(-90deg)}
.r180 video{transform:rotate(180deg)}
/* ── การ์ดดูคลิปในแถบข้าง (เดิมเป็นกล่องโต้ตอบทับกลางจอ) ──
   สูงได้ไม่เกินความสูงจอที่เหลือ แล้วเลื่อนในตัวเอง — ไม่งั้นคลิปตั้งที่มีตัว
   เลือกโหมด 16:9 อีกสามใบจะยาวเลยจอจนกดปุ่มล่างไม่ถึง */
.clipcard{padding:0;overflow:hidden;display:flex;flex-direction:column;
  max-height:calc(100vh - var(--headh,33px) - 2rem)}
/* ต้องเขียนเอง — display ที่ตั้งไว้ในคลาสชนะ [hidden] ของเบราว์เซอร์ ไม่ใส่ไว้
   จะเหลือการ์ดเปล่ากินที่อยู่ในแถบข้างตลอดเวลาที่ไม่ได้เปิดดูคลิป */
.clipcard[hidden]{display:none}
.clipcard .ch{display:flex;gap:.5rem;align-items:flex-start;
  padding:.6rem .7rem .5rem;border-bottom:1px solid var(--line)}
.clipcard .ch h3{margin:0;font-size:13px;text-transform:none;letter-spacing:0;
  color:var(--fg)}
.clipcard .ch .m{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
.clipcard .cb{padding:.6rem .7rem;overflow:auto;flex:1}
.clipcard .cf{display:flex;gap:.4rem;align-items:center;
  padding:.5rem .7rem;border-top:1px solid var(--line)}
.clipcard .vwrap video{max-height:44vh}
.clipcard .vwrap.r90 video,.clipcard .vwrap.r270 video{max-width:34vh}

.vmodes{display:grid;gap:.4rem}
.vm{border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem}
.vm[aria-pressed=true]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.vm .t{font-weight:600;font-size:12.5px;display:flex;gap:.5rem;align-items:center}
.vm .d{font-size:11.5px;color:var(--dim);margin-top:.1rem}
.vm video{width:100%;border-radius:4px;margin-top:.45rem;background:#000}

/* กล่องรีเซ็ต */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  color:var(--fg);padding:0;width:min(660px,92vw);box-shadow:0 12px 50px rgba(0,0,0,.32)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{padding:.85rem 1rem .6rem;border-bottom:1px solid var(--line)}
dialog h2{font-size:15px;margin:0;font-weight:700}
dialog .dh .m{font:11.5px ui-monospace,Menlo,monospace;color:var(--dim)}
dialog .db{padding:.9rem 1rem;max-height:min(62vh,620px);overflow:auto}
dialog .df{padding:.7rem 1rem;border-top:1px solid var(--line);display:flex;gap:.45rem;
  align-items:center}
/* ไทม์ไลน์แบบแถบแนวนอน */
.tlwrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--off);border-radius:6px;
  background:var(--bg2);padding:0 0 .4rem}
.tlinner{position:relative;min-width:100%}
.tlruler{position:relative;height:20px;border-bottom:1px solid var(--off);cursor:pointer}
.tlruler i{position:absolute;top:0;bottom:0;width:1px;background:var(--off)}
.tlruler i span{position:absolute;left:3px;top:2px;font-size:10px;color:var(--dim);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.tltrack{position:relative;height:56px;margin-top:6px}
.tlblk{position:absolute;top:0;height:56px;border-radius:4px;box-sizing:border-box;
  border:1px solid rgba(0,0,0,.35);cursor:grab;overflow:hidden;touch-action:none;
  background:#2f6f4f}
.tlblk.BROLL{background:#3a5a7a}
.tlblk.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.tlblk.cut::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--warn)}
.tlname{position:absolute;left:6px;top:4px;font-size:10.5px;color:#fff;opacity:.9;
  pointer-events:none;white-space:nowrap}
.tlh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tlh:hover{background:rgba(255,255,255,.35)}
.tlh-l{left:0} .tlh-r{right:0}
.tlhead{position:absolute;top:-26px;bottom:0;width:2px;background:var(--warn);z-index:4;
  pointer-events:none}
/* ── ไทม์ไลน์หลายเลนของขั้น 5 ──
   แถวคลิปอยู่บนสุดเป็นเส้นอ้างอิง แล้วชั้นที่ลอยอยู่เหนือมัน (ข้อความ · รูปทรง ·
   ภาพซ้อน · เพลง) เรียงลงมาเป็นแถว ๆ ตามลำดับที่มันซ้อนกันจริงในหนัง — อ่านแถว
   จากบนลงล่างแล้วได้ลำดับชั้นเดียวกับที่ finish.py ต่อฟิลเตอร์ */
.fxtl{display:grid;grid-template-columns:86px 1fr;align-items:stretch}
.fxlane{display:contents}
.fxlname{display:flex;align-items:center;gap:.3rem;font-size:11px;color:var(--dim);
  padding:.15rem .4rem;border-top:1px solid var(--off);white-space:nowrap}
.fxlname b{color:var(--fg);font-size:11.5px;font-weight:600}
.fxlrow{position:relative;border-top:1px solid var(--off);overflow:hidden}
/* สูงขึ้น 30% จากเดิม (26→34 · คลิป 38→49) — บล็อกยึดด้วย top/bottom จึงยืดตามเอง */
.fxlrow.clips{height:49px} .fxlrow{height:34px}
.fxb{position:absolute;top:3px;bottom:3px;border-radius:3px;box-sizing:border-box;
  border:1px solid rgba(0,0,0,.4);cursor:grab;overflow:hidden;touch-action:none;
  font-size:10.5px;line-height:26px;color:#fff;padding:0 5px;white-space:nowrap;
  min-width:3px}
.fxb.text{background:#4a5aa8} .fxb.shape{background:#a8544a}
.fxb.overlay{background:#7a4aa8} .fxb.music{background:#2f7a63}
.fxb.clip{background:#2f6f4f;top:2px;bottom:2px} .fxb.clip.BROLL{background:#3a5a7a}
.fxb.auto{background:#3d4257;color:#c9cfe0;cursor:default;border-style:dashed}
.fxb.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.fxb.orphan{background:repeating-linear-gradient(45deg,#5a4a4a,#5a4a4a 4px,#734 4px,#734 8px);
  opacity:.75}
.fxb .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.fxb .h.l{left:0} .fxb .h.r{right:0}
.fxb .h:hover{background:rgba(255,255,255,.4)}
.fxempty{position:absolute;left:6px;top:0;line-height:34px;font-size:10.5px;
  color:var(--dim);pointer-events:none}
/* ป้ายชื่อของแถวย่อย — ชั้นที่เพิ่มเองแยกแถวละชิ้น ชื่อจึงต้องบอกว่าแถวไหนคือชิ้นไหน */
.fxlname.sub{font-size:10px;padding-left:.9rem;opacity:.85}
.fxlname.sub b{font-weight:500;font-size:10.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fxlname.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.fxlname .del{margin-left:auto;border:0;background:none;color:var(--dim);
  cursor:pointer;padding:0 .2rem;font-size:11px}
.fxlname .del:hover{color:var(--warn)}
/* ตัวเล่นวิดีโอขั้น 3
   กรอบมีขนาดเท่า "หนังที่จะได้" พอดี แล้วจัดกึ่งกลางการ์ด — ไม่มีขอบดำเหลือ
   --pvr = สัดส่วนกว้าง/สูงของหนัง ตั้งจาก video.width/height ใน pvSync

   สูงเท่าที่ยอมได้ (--pvh) แล้วถอยความกว้างกลับมาจากสัดส่วน · จอแคบกว่านั้นก็ให้
   max-width หนีบไว้ที่ความกว้างการ์ด แล้ว aspect-ratio ลดความสูงลงตาม

   ที่ต้องผูกขนาดไว้กับกรอบ ไม่ใช่ปล่อยให้ <video> เป็นคนกำหนด: ทุกครั้งที่กด
   C/D/F หรือคลิกชิ้นอื่น ตัวเล่นต้องถอด src แล้วใส่ใหม่ ระหว่างที่ยังไม่รู้ขนาด
   สื่อ ตัววิดีโอไม่มีขนาดของตัวเอง กรอบจะแฟบแล้วดันทั้งหน้าเด้ง — และคลิป
   แนวตั้งกับแนวนอนก็เคยทำให้กรอบสูงไม่เท่ากัน ทั้งที่หนังจริงสัดส่วนเดียวกันหมด */
.pv{--pvh:52vh;
  aspect-ratio:var(--pvr,1.7778);
  width:calc(var(--pvh) * var(--pvr,1.7778));max-width:100%;max-height:var(--pvh);
  margin-inline:auto;
  background:#000;border-radius:6px;overflow:hidden;position:relative;line-height:0}
/* เต็มจอก็ใช้กติกาเดียวกัน แค่เปลี่ยนเพดานความสูงเป็นทั้งจอ — ไม่งั้นเพดาน 52vh
   ตามไปด้วย กดเต็มจอแล้วได้หนังสูงครึ่งจอลอยอยู่กลางพื้นดำ */
.pv:fullscreen{--pvh:100vh;max-width:100vw;margin:auto}
.pv video{position:absolute;inset:0;display:block;width:100%;height:100%;
  background:#000;object-fit:contain}
.pv video.hide{display:none}
/* ── หมุนภาพให้ตรงกับที่ตั้งไว้ในขั้น 1 ──
   ใช้เฉพาะตอนเล่นจาก *ไฟล์ต้นฉบับ* (ชิ้นที่ยังไม่มีไฟล์ตัด) เพราะไฟล์ที่ตัดแล้ว
   ffmpeg หมุนมาให้ในภาพเลย  หมุน 90° แล้วกรอบกว้าง-สูงสลับกัน จึงต้องวัดกล่อง
   จากอีกด้าน ไม่งั้นภาพจะโดนกรอบ 16:9 บีบจนเหลือแถบผอม ๆ กลางจอ */
.pv video.rot90,.pv video.rot270{width:var(--pvh);height:calc(var(--pvh) * var(--pvr,1.7778));
  inset:auto;left:50%;top:50%}
.pv video.rot90{transform:translate(-50%,-50%) rotate(90deg)}
.pv video.rot270{transform:translate(-50%,-50%) rotate(-90deg)}
.pv video.rot180{transform:rotate(180deg)}
.pvbadge{position:absolute;left:.5rem;top:.5rem;background:rgba(0,0,0,.62);color:#fff;
  font-size:11.5px;line-height:1.5;padding:.1rem .45rem;border-radius:4px;pointer-events:none}
.pvbar{display:flex;align-items:center;gap:.45rem;margin-top:.55rem}
.pvscrub{flex:1;height:9px;background:var(--off);border-radius:5px;position:relative;
  cursor:pointer;overflow:hidden}
.pvfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.pvticks{position:absolute;inset:0}
.pvticks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
.pvtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
.sect{margin:0 0 1.1rem} .sect:last-child{margin-bottom:0}
.sect>h4{font-size:11.5px;margin:0 0 .45rem;color:var(--dim);font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.diff{display:grid;grid-template-columns:1fr auto auto;gap:.1rem .7rem;font-size:12px;
  margin-top:.5rem}
.diff>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15em}
.diff .k{font:11.5px ui-monospace,Menlo,monospace;color:var(--dim)}
.diff .a{text-align:right;text-decoration:line-through;opacity:.6}
.diff .z{text-align:right;color:var(--ok)}
.art{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:start;
  padding:.42rem .55rem;border:1px solid var(--line);border-radius:5px;
  margin-bottom:.3rem;font-size:12.5px}
.art.danger{border-color:var(--warn)}
.art .c{font-size:11.5px;color:var(--dim)} .art.danger .c{color:var(--warn)}
.art .sz{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.snap{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;
  padding:.4rem .1rem;border-bottom:1px solid var(--off);font-size:12.5px}
.snap:last-child{border-bottom:0}
.snap .m{font-size:11.5px;color:var(--dim)}
.hd{display:flex;align-items:center;gap:.6rem}

.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--fg);color:var(--bg);padding:.55em 1.1em;border-radius:100px;
  font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.25);max-width:80vw}
.toast.err{background:var(--warn);color:#fff}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">vcut</h1>
    <nav class="steps" id="steps"></nav>
    <span class="spacer"></span>
    <span class="chip" id="c-proj">—</span>
    <span class="chip" id="c-dirty" hidden></span>
    <button id="reset" title="ล้างค่าทั้งหมดกลับเป็นค่าตั้งต้น — ของเดิมเก็บไว้กู้ได้">รีเซ็ต</button>
    <button id="stop" hidden>หยุด</button>
    <button id="save" disabled>บันทึก</button>
    <button id="run" class="primary">ทำทุกขั้น</button>
  </div>
</header>

<dialog id="rst">
  <div class="dh">
    <h2 id="rst-title">รีเซ็ต</h2>
    <div class="m" id="rst-sub"></div>
  </div>
  <div class="db" id="rst-body"></div>
  <div class="df">
    <button id="rst-go" class="primary">ล้างค่า</button>
    <span class="spacer"></span>
    <button id="rst-close">ปิด</button>
  </div>

<script>
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let D = null, POOL = null, S = null, RV = null, RST = null, CL = null, TR = null;
let FX = null;                  // ชั้นเอฟเฟกต์ของขั้น 5
// คำที่พิมพ์ค้นในบทพูด · กางกล่องอยู่ไหม · คลิปที่เปิดฟังอยู่ในแถบข้าง —
// เก็บนอก render() เพราะการ์ดถูกวาดใหม่ทั้งใบทุกครั้งที่แตะอะไรก็ตาม ถ้าเก็บ
// ไว้ในนั้นคำค้นจะหายทุกคีย์ที่พิมพ์ และกล่องจะพับกลับเองทุกครั้งที่กดอะไร
let trQuery = '', trShow = true, tkOpen = null;
let clFilter = 'all', clOpen = -1, clDrag = null;
// ตำแหน่งที่เลื่อนตารางคลิปไว้ — render() ล้าง #body ทั้งก้อนทุกครั้ง .grid จึงเกิด
// ใหม่เสมอและกลับไปอยู่บนสุดถ้าไม่จำไว้เอง คนเลื่อนลงไปคลิกดูคลิปใบที่ 40 แล้ว
// ตารางเด้งกลับไปใบแรกทันที
let clScroll = 0;
let clEdits = {pick: {}, rot: {}, vmode: {}, order: null};

// ที่เลื่อนของกล่องที่เลื่อนอยู่ข้างใน — เหตุผลเดียวกับ clScroll ข้างบนเป๊ะ
//
// ตารางคลิปกับแถบไทม์ไลน์แก้เรื่องนี้ด้วยตัวแปรของตัวเองมาก่อนแล้ว ตัวนี้เป็น
// ตัวกลางให้กล่องที่เหลือใช้ได้ด้วยบรรทัดเดียว ไม่ต้องตั้งตัวแปรใหม่ทุกกล่อง
// (รายการซับมี 291 บรรทัด แก้บรรทัดที่ 120 ทีแล้วเด้งกลับบรรทัดแรก = หาที่เดิม
//  ใหม่ทุกครั้ง ซึ่งแพงกว่าการแก้เองหลายเท่า)
const SCROLLED = {};
function keepScroll(node, key, axis){
  const prop = axis === 'x' ? 'scrollLeft' : 'scrollTop';
  node.addEventListener('scroll', () => { SCROLLED[key] = node[prop]; });
  // ตั้งค่าได้หลังกล่องเข้าไปอยู่ในหน้าจริงแล้วเท่านั้น ก่อนหน้านั้นยังไม่มีความสูง
  // ให้เลื่อน — ตอนนี้ยังเป็นแค่ก้อน DOM ที่ยังไม่ได้แปะ
  requestAnimationFrame(() => { node[prop] = SCROLLED[key] || 0; });
  return node;
}
let poolFilter = 'all', poolKeep = null, pcOpen = null;
// "เล่นเฉพาะช่วงที่ตัด" — ต้องอยู่นอกการ์ด เพราะการ์ดถูกวาดใหม่ทั้งใบทุกครั้งที่
// แตะอะไรก็ตาม ถ้าอ่านจากช่องติ๊กในนั้น ค่าจะกลับไปเป็นค่าตั้งต้นเองเรื่อย ๆ
let pcOnly = true;
let step = 1, edits = {}, items = [], sel = -1, dragFrom = -1;
let logSince = 0, polling = null, estTimer = null, taken = new Set();

const mmss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const hhmm = s => s < 60 ? `${Math.round(s)} วิ`
  : s < 3600 ? `${Math.round(s/60)} นาที` : `${(s/3600).toFixed(1)} ชม.`;
const val = k => k in edits ? edits[k] : (D && D.values[k]);
// ชิ้นนี้ถูกขยับขอบหรือเพิ่งเกิดจากการซอยไหม — ถ้าใช่ ไฟล์ที่ตัดไว้เดิมใช้ไม่ได้
const tlCut = x => !x.o || x.start !== x.o.start || x.end !== x.o.end;
const tlDirty = () => items.some(x => x.off) || items.some((x, i) => x.i !== i)
  || items.some(tlCut) || items.length !== ((S && S.timeline) || []).length;
const size = b => b >= 1e9 ? (b/1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b/1e6).toFixed(1)
  + ' MB' : b >= 1e3 ? Math.round(b/1e3) + ' KB' : b + ' B';
// path ยาว ๆ ต้องตัดหัวไม่ใช่ตัดท้าย — ส่วนที่ต่างกันอยู่ท้ายเสมอ ตัดท้ายแล้ว
// สองฝั่งจะเหลือ "/Users/macbook3lf1/web work…" เหมือนกันเป๊ะ อ่านไม่ได้ความ
const shortv = v => {
  if (v == null) return '—';
  if (v === '') return '(ว่าง)';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '(ว่าง)';
  if (typeof v === 'boolean') return v ? 'เปิด' : 'ปิด';
  const s = String(v);
  return s.startsWith('/') && s.length > 28
    ? '…/' + s.split('/').filter(Boolean).slice(-2).join('/') : s;
};
const when = t => new Date(t * 1000).toLocaleString('th-TH',
  {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

function toast(msg, err){
  const t = el('div', 'toast' + (err ? ' err' : ''), msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 2600);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}
const post = (p, b) => api(p, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(b || {})});

// ── โหลดสถานะทั้งหมด ─────────────────────────────────────────────

async function load(keepEdits){
  const [d, pool, st, cl, tr, cap, fxd] = await Promise.all([
    api('/api/setup'), api('/api/pool').catch(() => ({has:false, pieces:[]})),
    api('/api/state').catch(() => null),
    api('/api/clips').catch(() => ({clips:[], summary:{total:0}})),
    api('/api/transcript').catch(() => ({exists:false, clips:{}, order:[], files:{},
                                         summary:{clips:0}})),
    api('/api/captions').catch(() => null),
    api('/api/fx').catch(() => null)]);
  D = d; POOL = pool; S = st; CL = cl; TR = tr;
  // ของที่แก้ค้างไว้ยังไม่บันทึก อย่าให้ของจากดิสก์มาทับหาย
  if (cap && !capDirty) CAP = cap;
  if (fxd && !fxDirty) FX = fxd;
  if (!keepEdits){
    edits = {}; poolKeep = null; clEdits = {pick: {}, rot: {}, vmode: {}, order: null};
  }
  // o = ขอบเดิมตอนโหลดมา ใช้เทียบว่าถูกแก้แล้วหรือยัง และวาดเส้นขอบเดิมในแถบ
  if (S && S.timeline){
    items = S.timeline.map(x => ({...x, off: false, o: {start: x.start, end: x.end}}));
    sel = -1;
    tlHist = []; tlFuture = [];   // ของใหม่มาจากดิสก์แล้ว ประวัติของร่างเก่าไม่ตรงกับอะไร
  }
  pvDropStaleFile();
  $('#title').textContent = D.values['project.name'] || 'vcut';
  $('#c-proj').textContent = D.project.path || 'ยังไม่มีไฟล์โปรเจกต์';
  $('#c-proj').title = D.project.path || '';   // ตัดท้ายด้วย … ตอนที่อยู่ยาว
  renderSteps(); render();
  // items[] เพิ่งถูกแทนด้วยของจากดิสก์ — ตัวเล่นที่ค้างชิ้นเก่าอยู่ต้องตามให้ทัน
  // เหมือนตอนแก้เอง (บันทึกไทม์ไลน์แล้ว seg ของชิ้นที่ขยับขอบจะเปลี่ยนไปด้วย)
  pvResync();
  loadReview();
}

function stepState(n){
  const ph = D.phases[n-1];
  if (!ph) return {done: 0, total: 0};
  return {done: ph.steps.filter(s => s.exists).length, total: ph.steps.length,
          stale: ph.steps.some(s => s.exists && s.changed.length)};
}

function renderSteps(){
  const box = $('#steps'); box.innerHTML = '';
  D.phases.forEach((ph, i) => {
    const n = i + 1;
    const {done, total, stale} = stepState(n);
    const b = el('button');
    b.setAttribute('aria-selected', step === n);
    const word = stale ? 'ค่าเปลี่ยนไปแล้ว' : done === total ? 'ทำแล้ว'
               : done ? `ทำไป ${done}/${total}` : 'ยังไม่ได้ทำ';
    b.title = `${ph.label} — ${word}`;
    // สถานะอยู่ที่สีของเลข: เทา=ยังไม่ทำ · เขียว=ทำแล้ว · ส้ม=ค่าเปลี่ยนไปแล้ว
    b.append(el('span', 'n' + (stale ? ' hot' : done === total ? ' done' : ''), String(n)),
             el('span', 'lab', ph.label));
    // เหลือตัวหนังสือไว้เฉพาะสองกรณีที่สีอย่างเดียวบอกไม่พอ — ต้องรู้ว่า "ทำไปกี่
    // ขั้นแล้ว" กับต้องเห็นคำเตือนว่าของที่ทำไว้ใช้ไม่ได้แล้ว ที่เหลือสีบอกครบ
    if (stale) b.append(el('span', 'st hot', 'ค่าเปลี่ยน'));
    else if (done && done < total) b.append(el('span', 'st', `${done}/${total}`));
    b.onclick = () => { step = n; renderSteps(); render(); };
    box.appendChild(b);
  });
  const n = Object.keys(edits).length;
  $('#save').disabled = !n;
  $('#save').textContent = n ? `บันทึก (${n})` : 'บันทึก';
  $('#c-dirty').hidden = !n;
  $('#c-dirty').className = 'chip warn';
  $('#c-dirty').innerHTML = `<b>${n}</b> ค่าที่ยังไม่บันทึก`;
  headHeight();
}

// ความสูงจริงของแถบหัว → ตัวแปร CSS ที่กล่องข้างใช้ปักหมุด
// (แถบหัวขึ้นบรรทัดที่สองเองได้ตอนจอแคบ ตัวเลขตายตัวจึงเชื่อไม่ได้)
function headHeight(){
  document.documentElement.style.setProperty(
    '--headh', $('header').offsetHeight + 'px');
}
window.addEventListener('resize', headHeight);

function render(){
  // จำที่เลื่อนหน้าไว้ก่อนรื้อ — ล้าง #body ทีเดียวทั้งก้อนทำให้หน้าสั้นลงชั่วขณะ
  // เบราว์เซอร์จึงหนีบตำแหน่งที่เลื่อนไว้กลับไปบนสุด คลิกอะไรสักอย่างในขั้น 1 ที
  // หน้าเด้งขึ้นหัวที เพราะทุกการกดวิ่งผ่าน render() หมด
  const y = window.scrollY;
  const b = $('#body'); b.innerHTML = '';
  $('#side-est').hidden = step !== 3;
  $('#side-prev').hidden = step !== 3;
  if (step === 1) stepSource(b);
  if (step === 2) stepPrepare(b);
  if (step === 3) stepCompose(b);
  if (step === 4) stepText(b);
  if (step === 5) stepFx(b);
  if (step === 3) scheduleEstimate();
  // การ์ดดูของอยู่ในแถบข้าง — ขั้น 1 ดูคลิป · ขั้น 2 ดูชิ้นในคลัง ต้องวาดหลัง
  // #body เสมอ เพราะทั้งคู่ต้องรู้ก่อนว่ารายการถูกกรอง/เรียงยังไง ถึงจะบอก
  // "ใบที่เท่าไรจากทั้งหมด" และเปิดใบก่อนหน้า/ถัดไปได้ถูกใบ
  //
  // ทั้งสองใบใช้ที่เดียวกัน เปิดพร้อมกันไม่ได้อยู่แล้วเพราะอยู่คนละขั้น — ใบที่
  // ไม่ได้ใช้ต้องถูกรื้อทิ้งจริง ๆ ไม่ใช่แค่ซ่อน ไม่งั้น <video> ที่ค้างอยู่ข้างใน
  // ยังเล่นเสียงต่อทั้งที่มองไม่เห็นแล้ว
  const clipOn = step === 1 && clOpen >= 0 && drawClip();
  const pieceOn = step === 2 && pcOpen != null && drawPiece();
  const talkOn = step === 2 && tkOpen != null && drawTalk();
  if (!clipOn) shutSide('#side-clip');
  if (!pieceOn) shutSide('#side-piece');
  if (!talkOn) shutSide('#side-talk');
  if (step !== 1) clOpen = -1;
  if (step !== 2){ pcOpen = null; tkOpen = null; }
  // ออกจากขั้น 3 = กล่องเพิ่มวิดีโอไม่ถูกวาดอีก ตัว <video> ข้างในต้องถูกสั่งหยุด
  // ด้วยมือ เหมือนการ์ดดูคลิป/ดูชิ้นข้างบน ไม่งั้นเสียงดังต่อทั้งที่ไปหน้าอื่นแล้ว
  if (step !== 3 && addOpen) addShut();
  // แก้ไทม์ไลน์ตอนหยุดนิ่ง ไม่มี timeupdate มาเรียกวาดข้อความใหม่ — เวลาของซับ
  // เพิ่งเปลี่ยนไปพร้อมกับชิ้นที่เพิ่งลาก ต้องวาดทับตัวเล่นใหม่ตรงนี้เอง
  // (เรียกในขั้น 3 ด้วย เพราะตัวเล่นเป็นตัวเดียวกัน — ต้องเก็บกวาดชั้นข้อความ
  //  กับปุ่ม + Text ให้หายไปตอนออกจากขั้น 4 ไม่ใช่ค้างอยู่จนกว่าจะกดเล่น)
  if (tlStep()) capPaint();
  document.body.classList.toggle('wideside', clipOn || pieceOn || talkOn);
  // วางกลับที่เดิม ทั้งรอบนี้และรอบหน้าจอวาด (รูปที่โหลดทีหลังดันความสูงได้อีก)
  if (window.scrollY !== y){
    window.scrollTo(0, y);
    requestAnimationFrame(() => { if (window.scrollY !== y) window.scrollTo(0, y); });
  }
}

// ── ขั้น 1 · เลือกฟุตเทจ ─────────────────────────────────────────

// ชื่อขั้นกับคำอธิบายมาจาก settings.PHASES ที่เดียว — ไม่ได้พิมพ์ซ้ำไว้ที่นี่
function head(n){
  const ph = D.phases[n-1] || {};
  const w = el('div');
  const r = el('div', 'hd');
  r.append(el('h2', null, `ขั้น ${ph.no} · ${ph.label}`), el('span', 'spacer'));
  const b = el('button', 'sm', 'รีเซ็ตขั้นนี้');
  b.title = 'ล้างค่าของขั้นนี้กลับเป็นค่าตั้งต้น — ของเดิมเก็บไว้ให้กู้กลับได้';
  b.onclick = () => openReset(ph.id);
  r.append(b);
  w.append(r, el('p', 'lead', ph.why || ''));

}

function stepSource(box){
  const c = el('div', 'card');
  c.appendChild(head(1));
  ['project.source', 'project.name', 'project.out'].forEach(k => {
    const f = D.fields.find(x => x.key === k);
    if (f) c.appendChild(field(f));
  });
  const a = el('div', 'acts');
  const btn = el('button', 'primary runbtn', 'อ่านคลิปทั้งโฟลเดอร์');
  btn.dataset.step = 'source';
  btn.onclick = () => runStep('source');
  a.append(btn);
  const sc = D.steps.find(s => s.id === 'scan');
  if (sc && sc.exists) a.append(el('span', 'note', sc.summary));
  c.appendChild(a);
  c.appendChild(advanced(['scan', 'thumbs']));

  box.appendChild(clipBrowser());
}

// ── คลังคลิปดิบ · เลือก / กรอง / หมุน ──────────────────────────
//
// ทั้งสามอย่างที่แก้ตรงนี้เก็บเป็น config ไม่ใช่ไฟล์ cache — ค่าที่ยังไม่กด
// บันทึกอยู่ใน clEdits เท่านั้น หน้าจอจึงกลับไปเป็นของเดิมได้ด้วยการ reload

const clPicked = x => x.name in clEdits.pick ? clEdits.pick[x.name] : x.picked;
const clRot    = x => x.name in clEdits.rot ? clEdits.rot[x.name] : x.rot;
const clVmode  = x => x.name in clEdits.vmode ? clEdits.vmode[x.name] : x.vmode;
const clDirty  = () => Object.keys(clEdits.pick).length + Object.keys(clEdits.rot).length
                     + Object.keys(clEdits.vmode).length + (clEdits.order ? 1 : 0);
// ลำดับปัจจุบัน: ที่ลากค้างไว้ยังไม่บันทึก ถ้าไม่มีก็ตามที่เซิร์ฟเวอร์ส่งมา
const clOrder   = () => clEdits.order || (CL.clips || []).map(x => x.name);
const clNatural = () => (CL.clips || []).slice()
  .sort((a, b) => a.num - b.num || (a.name < b.name ? -1 : 1)).map(x => x.name);
// transpose จำนวนคี่ครั้งเท่านั้นที่สลับกว้าง/สูง — 180° ขนาดเท่าเดิม
const swaps = o => ((o || '').split('transpose').length - 1) % 2 === 1;

function clOrient(x){
  return swaps(x.rot) === swaps(clRot(x)) ? x.orient : (x.orient === 'V' ? 'H' : 'V');
}
function clList(){
  const by = new Map((CL.clips || []).map(x => [x.name, x]));
  return clOrder().map(n => by.get(n))
    .filter(x => x && (clFilter === 'all' || clOrient(x) === clFilter));
}
function clSet(kind, name, v, orig){
  if (v === orig) delete clEdits[kind][name]; else clEdits[kind][name] = v;
}

// ── ลากสลับตำแหน่ง ────────────────────────────────────────────
//
// ลากในมุมมองที่กรองอยู่ก็ได้ — ย้ายในรายการเต็มโดยอิงคลิปที่ปล่อยทับ
// ผลจึงชัดเจนเสมอ ไม่ต้องเดาว่าคลิปที่ถูกซ่อนอยู่จะไปโผล่ตรงไหน

function clSetOrder(list){
  const base = (CL.clips || []).map(x => x.name).join('\n');
  // ลากแล้ววนกลับมาที่เดิม = ไม่มีอะไรค้าง ไม่ต้องกดบันทึก
  clEdits.order = list.join('\n') === base ? null : list;
  render();
}
function clMove(name, onto, after){
  const list = clOrder().filter(n => n !== name);
  const i = list.indexOf(onto);
  if (i < 0) return;
  list.splice(after ? i + 1 : i, 0, name);
  clSetOrder(list);
}
function clDropSide(cell, e){
  const r = cell.getBoundingClientRect();
  return e.clientX > r.left + r.width / 2;
}
function clDragOff(){
  document.querySelectorAll('.cl').forEach(c => c.classList.remove('dl', 'dr', 'drag'));
}
function btn(label, fn, cls){
  const b = el('button', 'sm' + (cls ? ' ' + cls : ''), label);
  b.onclick = fn; return b;
}

function clipBrowser(){
  const c = el('div', 'card');
  if (!CL || !(CL.clips || []).length){
    c.append(el('h3', null, 'คลิปที่อ่านได้'),
             el('p', 'empty', 'ยังไม่มีคลิป — กด "อ่านคลิปทั้งโฟลเดอร์" ก่อน'));
    return c;
  }
  const s = CL.summary;
  const on = CL.clips.filter(clPicked);
  const mins = on.reduce((a, x) => a + x.dur, 0) / 60;
  c.append(el('h3', null, `คลิปที่อ่านได้ — เอาไปทำต่อ ${on.length}/${s.total} คลิป · `
    + `${mins.toFixed(1)} นาที`));

  const bar = el('div', 'bar');
  const seg = el('div', 'seg');
  [['all', `ทั้งหมด ${s.total}`], ['H', `แนวนอน ${s.horizontal}`],
   ['V', `แนวตั้ง ${s.vertical}`]].forEach(([k, lab]) => {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', clFilter === k);
    b.onclick = () => { clFilter = k; render(); };
    seg.appendChild(b);
  });
  bar.append(seg);
  const shown = clList();
  bar.append(btn('เลือกทั้งหมด', () => bulk(shown, true)),
             btn('ไม่เอาทั้งหมด', () => bulk(shown, false)),
             btn('กลับด้าน', () => bulk(shown, null)));
  const custom = s.custom_order || !!clEdits.order;
  if (custom) bar.append(btn('เรียงตามเลขไฟล์', () => clSetOrder(clNatural())));
  bar.append(el('span', 'spacer'));
  const n = clDirty();
  const sv = el('button', 'primary', n ? `บันทึกการเลือก (${n})` : 'บันทึกการเลือก');
  sv.disabled = !n; sv.onclick = saveClips;
  bar.append(sv);
  if (n) bar.append(btn('ทิ้งที่แก้', () => {
    clEdits = {pick:{}, rot:{}, vmode:{}, order:null}; render(); }));
  c.appendChild(bar);

  const g = el('div', 'grid');
  const pos = new Map(clOrder().map((n, i) => [n, i + 1]));
  shown.forEach((x, i) => g.appendChild(clCell(x, i, custom ? pos.get(x.name) : 0)));
  g.addEventListener('scroll', () => { clScroll = g.scrollTop; });
  // ตั้งค่าได้หลังใบนี้เข้าไปอยู่ในหน้าจริงแล้วเท่านั้น (ก่อนหน้านั้นยังไม่มีความสูง
  // ให้เลื่อน) — clipBrowser() ยังแค่คืนกล่องให้คนเรียกเอาไปแปะ
  requestAnimationFrame(() => { g.scrollTop = clScroll; });
  c.appendChild(g);

  const notes = ['ลากคลิปไปวางตำแหน่งที่ต้องการได้ — เส้นสีน้ำเงินบอกว่าจะแทรกด้านไหน'];
  if (clFilter !== 'all')
    notes.push(`กรองอยู่ — แสดง ${shown.length} จาก ${s.total} คลิป`
      + ' (ลากตอนกรองก็ได้ ตำแหน่งอิงคลิปที่ปล่อยทับ)');
  if (custom && val('order.mode') !== 'filename')
    notes.push(`ลำดับที่จัดเองจะยังไม่มีผลกับหนัง เพราะขั้น 3 ตั้ง "เรียงลำดับตาม"`
      + ` เป็น "${orderLabel(val('order.mode'))}" อยู่`);
  else if (custom && val('order.reverse'))
    notes.push('ขั้น 3 เปิด "กลับลำดับ" อยู่ — หนังจะเรียงจากท้ายรายการนี้ขึ้นมา');
  else if (custom)
    notes.push('หนังจะเรียงตามลำดับนี้ — กด "รวมเป็นหนัง" ในขั้น 3 ใหม่หลังบันทึก');
  notes.forEach(t => c.appendChild(el('p', 'note', t)));
  return c;
}

// ชื่อโหมดการเรียงมาจาก settings.FIELDS ที่เดียว ไม่ได้พิมพ์ซ้ำไว้ที่นี่
function orderLabel(mode){
  const f = (D.fields || []).find(x => x.key === 'order.mode');
  return (f && f.labels && f.labels[mode]) || mode;
}

function bulk(list, want){
  list.forEach(x => clSet('pick', x.name,
    want === null ? !clPicked(x) : want, x.picked));
  render();
}

function clCell(x, i, pos){
  const on = clPicked(x), or = clOrient(x);
  const d = el('div', 'cl' + (on ? '' : ' off') + (i === clOpen ? ' sel' : ''));
  const img = el('img'); img.loading = 'lazy'; img.src = `/thumb/${x.name}.jpg`;
  img.alt = x.name;
  img.draggable = false;        // ไม่งั้นเบราว์เซอร์ลากรูปแทนที่จะลากทั้งใบ
  d.append(img);

  d.draggable = true;
  d.title = 'ลากไปวางตำแหน่งที่ต้องการได้';
  d.ondragstart = e => {
    clDrag = x.name;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', x.name);
    setTimeout(() => d.classList.add('drag'), 0);
  };
  d.ondragend = () => { clDrag = null; clDragOff(); };
  d.ondragover = e => {
    if (!clDrag || clDrag === x.name) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = clDropSide(d, e);
    d.classList.toggle('dl', !after);
    d.classList.toggle('dr', after);
  };
  d.ondragleave = () => d.classList.remove('dl', 'dr');
  d.ondrop = e => {
    e.preventDefault();
    const name = clDrag || e.dataTransfer.getData('text/plain');
    const after = clDropSide(d, e);
    clDrag = null; clDragOff();
    if (name && name !== x.name) clMove(name, x.name, after);
  };
  const tag = el('div', 'tag');
  // เลขตำแหน่งโผล่เฉพาะตอนมีลำดับที่จัดเอง — ตอนเรียงตามเลขไฟล์มันคือข้อมูลซ้ำ
  if (pos) tag.append(el('span', 'b', '#' + pos));
  if (or === 'V') tag.append(el('span', 'b v', 'ตั้ง'));
  if (clRot(x)) tag.append(el('span', 'b r', '↻'));
  if (clVmode(x)) tag.append(el('span', 'b', vmShort(clVmode(x))));
  if (tag.children.length) d.append(tag);
  const cb = el('input'); cb.type = 'checkbox'; cb.className = 'pick'; cb.checked = on;
  cb.title = 'เอาคลิปนี้ไปทำต่อในขั้น 2';
  cb.onclick = e => { e.stopPropagation(); clSet('pick', x.name, cb.checked, x.picked);
                      render(); };
  d.append(cb);
  const cap = el('div', 'cap');
  cap.append(el('b', null, x.name.replace(/^IMG_/, '')),
             el('span', null, x.dur.toFixed(1) + 'ว'));
  d.append(cap);
  d.onclick = () => openClip(i);
  return d;
}

const vmShort = m => m === 'blur_pad' ? 'เบลอ' : m === 'pillarbox' ? 'ย่อ'
  : m === 'crop' ? 'ครอป' : m;

// ── ดูคลิปทีละตัว · เล่น · หมุน · เลือกโหมดแนวตั้ง ────────────────

// เปิดดูคลิปที่ "แถบข้าง" ไม่ใช่กล่องโต้ตอบทับกลางจอ
//
// ของเดิมเป็น <dialog> แบบ modal ซึ่งบังตารางคลิปทั้งหมดไว้ข้างหลัง ทั้งที่งาน
// จริงตรงนี้คือ *ไล่ดูทีละใบแล้วติ๊กเลือก* — ต้องเห็นทั้งใบที่กำลังดูและใบอื่น
// พร้อมกัน ถึงจะเทียบได้ว่าเอาอันไหนไม่เอาอันไหน  พอย้ายมาอยู่ข้าง ๆ ก็คลิกใบ
// ถัดไปในตารางได้เลยโดยไม่ต้องปิดก่อน และแถบข้างปักหมุดอยู่แล้วจึงเลื่อนตาม
function openClip(i){ clOpen = i; render(); }

function closeClip(){
  const p = $('#side-clip');
  p.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); });
  clOpen = -1;
  render();
}

// รื้อการ์ดข้างที่ไม่ได้ใช้ — หยุดวิดีโอก่อนเสมอ เอา <video> ออกจากหน้าเฉย ๆ
// ไม่ได้ทำให้มันหยุดเล่น มันเล่นเสียงต่อจากที่ที่มองไม่เห็นแล้ว
function shutSide(sel){
  const p = $(sel);
  if (p.hidden && !p.firstChild) return;
  p.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); });
  p.innerHTML = ''; p.hidden = true;
  delete p.dataset.clip; delete p.dataset.piece;
  delete p.dataset.talk; delete p.dataset.at;
}

function drawClip(){
  const list = clList(), x = list[clOpen];
  if (!x) return false;
  const p = $('#side-clip');
  p.hidden = false;
  const or = clOrient(x), rot = clRot(x);

  // ยังเป็นคลิปใบเดิม = ย้ายตัว <video> เดิมไปใช้ต่อ ไม่สร้างใหม่
  //
  // การ์ดนี้ถูกวาดใหม่ทุกครั้งที่ render() (ติ๊กเลือกใบไหนก็ตาม ลากสลับลำดับ
  // กดหมุน) ถ้าสร้าง <video> ใหม่ทุกรอบ วิดีโอจะเด้งกลับไปวินาทีที่ 0 แล้วหยุด
  // เล่นทุกครั้งที่คนแตะอะไรสักอย่าง — ย้ายตัวเดิมข้ามที่ในหน้าเดียวกันไม่ทำให้
  // มันโหลดใหม่
  const keep = p.dataset.clip === x.name ? p.querySelector('.vwrap video') : null;
  p.innerHTML = '';
  p.dataset.clip = x.name;
  const head = el('div', 'ch');
  const ttl = el('div');
  ttl.append(el('h3', null, x.name),
             el('div', 'm', `${x.w}×${x.h} · ${x.dur.toFixed(1)} วิ · ${x.codec}`
               + ` · ${(x.size / 1e6).toFixed(0)} MB`
               + ` · ${or === 'V' ? 'แนวตั้ง' : 'แนวนอน'}`));
  const cls = el('button', 'ghost', '✕');
  cls.title = 'ปิด (Esc)';
  cls.onclick = closeClip;
  head.append(ttl, el('span', 'spacer'), cls);
  p.append(head);

  const b = el('div', 'cb');
  p.append(b);

  const spin = rot === 'transpose=1' ? ' r90' : rot === 'transpose=2' ? ' r270'
             : rot === 'transpose=1,transpose=1' ? ' r180' : '';
  const w = el('div', 'vwrap' + spin);
  let v = keep;
  if (!v){
    v = el('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    v.src = `/clip/${x.name}`;
  }
  v.onerror = () => { w.innerHTML = '';
    w.append(el('p', 'note', 'เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ (codec ' + x.codec
      + ') — ลองเปิดด้วย Safari หรือดูจากตัวอย่างที่ ffmpeg ทำให้ข้างล่าง')); };
  w.append(v); b.append(w);

  // ── บทพูดของคลิปนี้ ──
  // อยู่บนสุดถัดจากภาพ เพราะเป็นของที่ตอบว่า "คลิปนี้คืออะไร" ได้เร็วที่สุด
  // เร็วกว่านั่งดูวิดีโอทั้งใบ ส่วนหมุน/แนวตั้งเป็นการตั้งค่า ไม่ใช่การดู
  const lines = trLines(x.name);
  if (lines.length){
    const st = el('div', 'sect');
    st.append(el('h4', null, `บทพูดในคลิปนี้ · ${lines.length} ท่อน`));
    st.append(trList(lines.map(([a, bb, t]) => ({name: x.name, a, b: bb, text: t})),
                     r => { try { v.currentTime = r.a; } catch(e){}
                            v.play().catch(() => {}); }));
    const got = (TR && TR.files && TR.files[x.name]) || [];
    if (got.length){
      const dl = el('div', 'trdl');
      got.forEach(kind => {
        const a = el('a', null, `โหลด .${kind}`);
        a.href = `/text/${x.name}.${kind}`;
        a.download = `${x.name}.${kind}`;
        dl.append(a);
      });
      st.append(dl);
    }
    st.append(el('p', 'note', 'กดที่บรรทัดไหน วิดีโอข้างบนกระโดดไปวินาทีนั้นแล้วเล่นต่อ'));
    b.append(st);
  } else if (trHas()){
    b.append(el('p', 'note', 'ถอดเสียงแล้วแต่คลิปนี้ไม่มีคำพูด — ถูกจัดเป็นช่วงวิว'));
  }

  const s1 = el('div', 'sect');
  s1.append(el('h4', null, 'หมุนคลิป'));
  const seg = el('div', 'seg');
  CL.rotations.forEach(r => {
    const bt = el('button', null, r.label);
    bt.setAttribute('aria-pressed', rot === r.value);
    bt.onclick = () => { clSet('rot', x.name, r.value, x.rot); render(); };
    seg.append(bt);
  });
  s1.append(seg);
  s1.append(el('p', 'note', or === x.orient
    ? 'ภาพข้างบนหมุนด้วยเบราว์เซอร์ให้ดูมุมคร่าว ๆ — ตอนตัดจริง ffmpeg หมุนให้เหมือนกัน'
    : `หมุนแล้วกลายเป็น${or === 'V' ? 'แนวตั้ง' : 'แนวนอน'} — ชิ้นจากคลิปนี้ต้อง render ใหม่`
      + ' แต่ไม่ต้องอ่านคลิปใหม่ทั้งโฟลเดอร์'));
  b.append(s1);

  if (or === 'V'){
    const cur = clVmode(x) || CL.vertical_default;
    const s2 = el('div', 'sect');
    s2.append(el('h4', null, 'คลิปแนวตั้ง → จอ 16:9 เอาแบบไหน'));
    const wrap = el('div', 'vmodes');
    CL.vmodes.forEach(m => {
      const card = el('div', 'vm');
      card.setAttribute('aria-pressed', cur === m.value);
      const t = el('div', 't');
      const rb = el('input'); rb.type = 'radio'; rb.name = 'vm'; rb.checked = cur === m.value;
      rb.onchange = () => {
        // ตรงกับค่ากลางอยู่แล้ว = ไม่ต้องเขียนลงไฟล์ ปล่อยให้ตามค่ากลางไป
        clSet('vmode', x.name, m.value === CL.vertical_default ? '' : m.value, x.vmode);
        render();
      };
      t.append(rb, document.createTextNode(m.label));
      if (m.value === CL.vertical_default) t.append(el('span', 'sub', '· ค่ากลาง'));
      card.append(t, el('div', 'd', m.help));
      const go = el('button', 'sm', 'ดูของจริง');
      go.onclick = () => go.replaceWith(realPreview(x.name, m.value));
      card.append(go);
      wrap.append(card);
    });
    s2.append(wrap);
    s2.append(el('p', 'note', '"ดูของจริง" ตัด 3 วินาทีกลางคลิปด้วยฟิลเตอร์ชุดเดียวกับ'
      + 'ตอน render จริง ครั้งแรกรอ ~1 วินาที หลังจากนั้นเก็บ cache ไว้'));
    b.append(s2);
  }

  // แถวล่างติดขอบการ์ดไว้เสมอ — เลื่อนดูตัวเลือกอยู่ก็ยังกดเลือก/ข้ามใบได้
  const f = el('div', 'cf');
  const lab = el('label', 'ck');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = clPicked(x);
  cb.onchange = () => { clSet('pick', x.name, cb.checked, x.picked); render(); };
  lab.append(cb, document.createTextNode('เอาคลิปนี้'));
  const prev = el('button', 'sm', '←'), next = el('button', 'sm', '→');
  prev.title = 'ใบก่อนหน้า (←)'; next.title = 'ใบถัดไป (→)';
  prev.disabled = clOpen <= 0;
  next.disabled = clOpen >= list.length - 1;
  prev.onclick = () => { clOpen--; render(); };
  next.onclick = () => { clOpen++; render(); };
  f.append(lab, el('span', 'spacer'),
           el('span', 'note', `${clOpen + 1}/${list.length}`), prev, next);
  p.append(f);
  return true;
}

// ปิดด้วย Esc · เลื่อนดูใบก่อนหน้า/ถัดไปด้วยลูกศรซ้าย-ขวา
// (ตอนเป็นกล่องโต้ตอบ Esc ทำงานให้ฟรีจาก <dialog> ย้ายมาเป็นการ์ดแล้วต้องทำเอง)
document.addEventListener('keydown', e => {
  if (step !== 1 || clOpen < 0 || !keyFree(e)) return;
  const list = clList();
  if (e.key === 'Escape'){ e.preventDefault(); return closeClip(); }
  if (e.key === 'ArrowLeft' && clOpen > 0){ e.preventDefault(); clOpen--; render(); }
  if (e.key === 'ArrowRight' && clOpen < list.length - 1){ e.preventDefault(); clOpen++; render(); }
});

function realPreview(name, mode){
  const box = el('div');
  const msg = el('div', 'd', 'กำลังทำตัวอย่าง…');
  const v = el('video');
  v.controls = true; v.loop = true; v.muted = true; v.playsInline = true;
  v.src = `/preview/${name}/${mode}`;
  v.oncanplay = () => { msg.remove(); v.play().catch(() => {}); };
  v.onerror = () => { msg.textContent = 'ทำตัวอย่างไม่สำเร็จ — ดู log ในเทอร์มินัล'; };
  box.append(msg, v);
  return box;
}

async function saveClips(){
  const exclude = CL.clips.filter(x => !clPicked(x)).map(x => x.name);
  if (exclude.length >= CL.clips.length)
    return toast('ต้องเหลืออย่างน้อย 1 คลิป', true);
  try {
    const r = await post('/api/clips', {exclude,
      rotations: {...clEdits.rot}, vmodes: {...clEdits.vmode},
      order: clEdits.order});      // null = ไม่ได้แตะลำดับ ของเดิมอยู่ต่อ
    clEdits = {pick:{}, rot:{}, vmode:{}, order:null};
    const s = r.clips.summary;
    let msg = `บันทึกแล้ว · เอาไปทำต่อ ${s.picked}/${s.total} คลิป`;
    if (r.reordered) msg += ' · ลำดับที่จัดเอง';
    if (r.retagged.length)
      msg += ` · หมุนใหม่ ${r.retagged.length} คลิป (ไม่ต้องอ่านคลิปใหม่)`;
    toast(msg);
    await load(true);
  } catch(e){ toast(e.message, true); }
}

// ── ขั้น 2 · เตรียมวิดีโอ ────────────────────────────────────────

// ขั้น 2 แบ่งเป็นสองกล่องตามราคาที่ต้องจ่าย: กล่องแรกทำในเครื่องล้วน กล่องสอง
// เรียกโมเดลจริง แต่ละกล่องมีสวิตช์ของตัวเองคุมปุ่มในกล่องนั้น — สวิตช์ปิดแล้ว
// ปุ่มยังอยู่ให้เห็นแต่กดไม่ได้ พร้อมบอกเหตุผล ดีกว่าซ่อนจนไม่มีใครรู้ว่ามี

const stepOf = id => (D.steps || []).find(x => x.id === id) || {};
const fieldOf = k => (D.fields || []).find(x => x.key === k);
const putField = (parent, k) => { const f = fieldOf(k); if (f) parent.appendChild(field(f)); };

// ── ยาวเท่าไรถึงเรียกว่าใช้ได้ ──────────────────────────────────
//
// พร้อมบอกทันทีว่าเกณฑ์ที่ตั้งอยู่จะคัดของออกกี่ชิ้น โดยนับจากคลังรอบล่าสุดที่
// มีอยู่แล้ว — ตั้งตัวเลขแบบเดาแล้วรอตัดใหม่ทั้งกองถึงจะรู้ผล เป็นวิธีที่แพงมาก
function minLen(){
  const s = el('div', 'sect'); s.style.marginTop = '.9rem';
  s.appendChild(el('h4', null, 'ยาวเท่าไรถึงเรียกว่าใช้ได้'));
  putField(s, 'prepare.min_piece');
  putField(s, 'prepare.min_clip');

  const mp = +val('prepare.min_piece') || 0, mc = +val('prepare.min_clip') || 0;
  const all = (POOL && POOL.pieces) || [];
  if (all.length && (mp || mc)){
    // นับแบบเดียวกับที่ prepare.drop_short ทำ: คัดต่อท่อนก่อน แล้วค่อยรวมต่อคลิป
    const short = mp ? all.filter(p => p.dur < mp) : [];
    const left = {};
    all.forEach(p => { if (!mp || p.dur >= mp)
      left[p.name] = (left[p.name] || 0) + p.dur; });
    const thin = mc ? [...new Set(all.map(p => p.name))]
      .filter(n => (left[n] || 0) < mc) : [];
    const gone = all.filter(p => (mp && p.dur < mp) || (mc && thin.includes(p.name)));
    const secs = gone.reduce((a, p) => a + p.dur, 0);
    s.appendChild(el('p', 'note' + (gone.length ? ' warnnote' : ''),
      gone.length
        ? `เทียบกับคลังรอบล่าสุด (${all.length} ชิ้น): จะคัดออก ${gone.length} ชิ้น `
          + `รวม ${mmss(secs)}`
          + (short.length ? ` — ท่อนสั้น ${short.length} ชิ้น` : '')
          + (thin.length ? ` · ทั้งคลิปไม่พอ ${thin.length} คลิป` : '')
          + ' · กด ③ ตัดทีละคลิป ใหม่ถึงจะมีผลจริง'
        : `เทียบกับคลังรอบล่าสุด (${all.length} ชิ้น): เกณฑ์นี้ไม่คัดอะไรออกเลย`));
  }
  s.appendChild(el('p', 'note',
    'ของที่ไม่ผ่านยังอยู่ในคลัง ติดป้ายบอกเหตุผลไว้ ดึงกลับมาใส่เองได้ '
    + '— เหมือนตัวกรองภาพสั่น/ภาพมืด · ตั้ง 0 = ไม่ใช้เกณฑ์นั้น'));
  return s;
}

// ── บทพูดที่ถอดได้ ──────────────────────────────────────────────
//
// ขั้น ① ถอดเสียงให้อยู่แล้วตั้งแต่แรก แต่ผลของมันไม่เคยโผล่ที่ไหนในหน้าเว็บเลย
// — เห็นแค่เศษข้อความที่ติดมากับชิ้นในคลัง กดถอดเสียงไปแล้วจึงไม่มีทางรู้ว่ามัน
// ได้ยินว่าอะไร ตรงไหมไหม ตรงนี้คือที่อ่านของจริง
//
// สองที่ที่อ่านได้ตอบคนละคำถาม: ในการ์ดคลิป (ขั้น 1) = "คลิปนี้พูดอะไร" ดูคู่กับ
// ภาพได้เลย · การ์ดในขั้น 2 = "ใครพูดคำนี้บ้าง" ค้นทั้งกองแล้วเปิดดูได้ทันที
//
// การ์ดในขั้น 2 อยู่เหนือคลังชิ้นและพับเก็บได้ เพราะสองกล่องนี้ใช้ตอนเดียวกัน:
// อ่านว่าคลิปไหนพูดอะไร แล้วตัดสินว่าจะเอาชิ้นไหนเข้าคลัง — กางไว้ก็เห็นบทพูด
// พับไว้ก็เห็นคลังเต็มจอ ไม่ต้องเลือกอย่างใดอย่างหนึ่งไปตลอด

const trLines = name => (TR && TR.clips && TR.clips[name]) || [];
const trHas = () => !!(TR && TR.exists && TR.summary && TR.summary.segments);

// เน้นคำที่ค้นเจอโดยไม่แตะ innerHTML — ข้อความมาจาก whisper ซึ่งเป็นข้อความที่
// เราไม่ได้เขียนเอง ต่อเป็น HTML ตรง ๆ ไม่ได้
function trMark(text, q){
  const box = el('span', 'x');
  if (!q) { box.textContent = text; return box; }
  const low = text.toLowerCase(), needle = q.toLowerCase();
  let i = 0, at;
  while ((at = low.indexOf(needle, i)) >= 0){
    if (at > i) box.append(text.slice(i, at));
    box.append(el('mark', null, text.slice(at, at + needle.length)));
    i = at + needle.length;
  }
  box.append(text.slice(i));
  return box;
}

// กดบรรทัดแล้วเปิดคลิปนั้นในแถบข้าง — อยู่ที่ขั้น 2 ต่อ ไม่ต้องเด้งไปขั้น 1
//
// ตอนแรกทำเป็นกระโดดไปขั้น 1 ซึ่งพาออกจากงานที่กำลังทำอยู่ทุกครั้ง: คนกำลังไล่
// อ่านบทพูดเพื่อตัดสินว่าจะเอาชิ้นไหน พอกดฟังทีก็หลุดไปอีกหน้า ต้องกดกลับมาเอง
// แล้วหาที่เดิมให้เจอใหม่ · เปิดในแถบข้างแทน รายการยังอยู่ที่เดิมทุกบรรทัด
function trOpen(name, t){
  if (!trLines(name).length)
    return toast('คลิปนี้ไม่มีบทพูดแล้ว — อาจถอดเสียงใหม่ไปหลังจากนี้', true);
  pcOpen = null;                 // แถบข้างมีที่เดียว เปิดใบนี้ = ปิดใบดูชิ้น
  tkOpen = {name, t};
  render();
}

// รายการบรรทัดบทพูด — ใช้ทั้งในการ์ดคลิป การ์ดค้น และแถบข้าง ต่างกันแค่ตอนกด
function trList(rows, onPick, opt){
  const box = el('div', 'trl' + ((opt && opt.tall) ? ' tall' : ''));
  let last = null;
  rows.forEach((r, i) => {
    if (opt && opt.showClip && r.name !== last){
      last = r.name;
      box.append(el('div', 'hd', r.name));
    }
    const b = el('button');
    b.type = 'button';
    b.dataset.at = r.a;
    b.title = `ไปที่ ${mmss(r.a)} ของ ${r.name}`;
    b.append(el('span', 't', mmss(r.a)), trMark(r.text, opt && opt.mark));
    b.onclick = () => onPick(r, i);
    box.append(b);
  });
  return box;
}

// กล่องค้นบทพูดทั้งกอง — ใต้ ① ในขั้น 2
// บรรทัดสั้น ๆ ใต้ปุ่ม ① — บอกผลกับชี้ทางไปการ์ดเต็ม ไม่ยัดรายการทั้งกองไว้
// ตรงนี้ เพราะที่นี่คือที่ *ตั้งค่าแล้วกดถอด* ไม่ใช่ที่นั่งอ่าน
function trHint(){
  if (!trHas())
    return el('p', 'note', TR && TR.exists
      ? 'ถอดแล้วแต่ไม่พบคำพูดเลยสักคลิป — ถ้าคลิปมีคนพูดจริง ลองเช็คภาษาที่ตั้งไว้'
      : 'ยังไม่เคยถอดเสียง — กด ① ก่อน แล้วบทพูดของทุกคลิปจะมาอยู่ในการ์ดเหนือคลังชิ้น');
  const s = TR.summary;
  const p = el('p', 'note',
    `ถอดได้ ${s.segments} ท่อน จาก ${s.with_speech} คลิป · พูดจริงรวม ${mmss(s.speech)} — `);
  const go = el('button', 'linky', 'ดูบทพูดทั้งหมด');
  go.onclick = () => {
    trShow = true; render();
    requestAnimationFrame(() =>
      $('#trcard') && $('#trcard').scrollIntoView({block: 'start', behavior: 'smooth'}));
  };
  p.append(go);
  return p;
}

// การ์ดบทพูดเต็ม — อยู่เหนือคลังชิ้น พับเก็บได้
function trCard(){
  const c = el('div', 'card');
  c.id = 'trcard';

  const head = el('div', 'trhead');
  const tog = el('button', 'trtog');
  tog.type = 'button';
  tog.setAttribute('aria-expanded', String(trShow));
  tog.append(el('span', 'caret', trShow ? '▾' : '▸'),
             el('h3', null, 'บทพูดที่ถอดได้'));
  tog.onclick = () => { trShow = !trShow; render(); };
  head.append(tog, el('span', 'spacer'));

  const sum = TR.summary;
  head.append(el('span', 'note', trShow
    ? `${sum.with_speech} คลิป · ${sum.segments} ท่อน · พูดจริงรวม ${mmss(sum.speech)}`
    : `${sum.segments} ท่อน — กางเพื่ออ่านและค้นคำ`));
  c.append(head);
  if (!trShow) return c;

  const bar = el('div', 'trs');
  const q = el('input');
  q.type = 'search'; q.placeholder = 'ค้นคำในบทพูด…'; q.value = trQuery;
  const cnt = el('span', 'note'); cnt.style.margin = '0';
  const holder = el('div');

  const fill = () => {
    const query = trQuery.trim();
    const rows = [];
    (TR.order || Object.keys(TR.clips)).forEach(name => {
      trLines(name).forEach(([a, b, t]) => {
        if (!query || t.toLowerCase().includes(query.toLowerCase()))
          rows.push({name, a, b, text: t});
      });
    });
    holder.innerHTML = '';
    cnt.textContent = query
      ? `เจอ ${rows.length} ท่อน ใน ${new Set(rows.map(r => r.name)).size} คลิป`
      : `ทั้งหมด ${rows.length} ท่อน`;
    if (!rows.length){
      holder.appendChild(el('p', 'note warnnote', `ไม่เจอ "${query}" ในบทพูดของคลิปไหนเลย`));
      return;
    }
    // เพดานกันหน่วงตอนพิมพ์ทีละตัวในกองที่ใหญ่กว่านี้มาก ๆ — ตั้งไว้สูงพอที่
    // โปรเจกต์ปกติจะได้ครบทุกท่อน และถ้าตัดจริงก็บอกตรง ๆ ว่าตัดไว้เท่าไร
    const show = rows.slice(0, 2000);
    holder.appendChild(trList(show, r => trOpen(r.name, r.a),
                              {showClip: true, tall: true, mark: query}));
    if (rows.length > show.length)
      holder.appendChild(el('p', 'note',
        `แสดง ${show.length} ท่อนแรกจาก ${rows.length} — พิมพ์คำค้นให้แคบลงเพื่อดูที่เหลือ`));
  };

  q.oninput = () => { trQuery = q.value; fill(); };
  bar.append(q, cnt);
  c.append(bar, holder);
  fill();
  c.appendChild(el('p', 'note', 'กดที่บรรทัดไหนก็ได้ → คลิปนั้นเปิดในแถบข้างขวา '
    + 'เล่นจากวินาทีที่พูดประโยคนั้น พร้อมบทพูดทั้งคลิป · ยังอยู่ที่ขั้น 2 เหมือนเดิม'));
  return c;
}

// ── แถบข้าง · ดูคลิปจากบทพูด ────────────────────────────────────
//
// ใช้ที่เดียวกับการ์ดดูชิ้น เปิดพร้อมกันไม่ได้ — เป็นของสองอย่างที่ตอบคำถาม
// เดียวกัน ("ตรงนี้จริง ๆ แล้วมีอะไร") แค่มาจากคนละทาง จึงไม่ควรแย่งที่กันเอง
function drawTalk(){
  const {name, t} = tkOpen;
  const lines = trLines(name);
  if (!lines.length) return false;

  const box = $('#side-talk');
  const wasAt = box.dataset.at;
  const keep = box.dataset.talk === name ? box.querySelector('.vwrap video') : null;
  box.innerHTML = '';
  box.hidden = false;
  box.dataset.talk = name;
  box.dataset.at = String(t);

  const cl = (CL && CL.clips || []).find(x => x.name === name);
  const head = el('div', 'ch');
  const ttl = el('div');
  ttl.append(el('h3', null, name),
             el('div', 'm', `${lines.length} ท่อน`
               + (cl ? ` · ${cl.dur.toFixed(1)} วิ · ${cl.w}×${cl.h}` : '')));
  const cls = el('button', 'ghost', '✕');
  cls.title = 'ปิด (Esc)';
  cls.onclick = closeTalk;
  head.append(ttl, el('span', 'spacer'), cls);
  box.append(head);

  const b = el('div', 'cb');
  box.append(b);

  const rot = (cl && clRot(cl)) || '';
  const spin = rot === 'transpose=1' ? ' r90' : rot === 'transpose=2' ? ' r270'
             : rot === 'transpose=1,transpose=1' ? ' r180' : '';
  const w = el('div', 'vwrap' + spin);
  let v = keep;
  if (!v){
    v = el('video');
    v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    v.src = `/clip/${name}`;
    v.addEventListener('loadedmetadata', () => { v.currentTime = +box.dataset.at || 0; });
  } else if (wasAt !== String(t)){
    // คลิปเดิมแต่กดคนละบรรทัด — เลื่อนไปที่ใหม่ ไม่ต้องโหลดวิดีโอใหม่ทั้งไฟล์
    try { v.currentTime = t; } catch(e){}
    v.play().catch(() => {});
  }
  v.onerror = () => { w.innerHTML = '';
    w.append(el('p', 'note', 'เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ — ลองเปิดด้วย Safari')); };
  w.append(v); b.append(w);

  // บทพูดทั้งคลิป · ไฮไลต์ท่อนที่กำลังเล่นถึง แล้วเลื่อนตามให้เอง
  const list = trList(lines.map(([a, bb, tx]) => ({name, a, b: bb, text: tx})),
                      r => { try { v.currentTime = r.a; } catch(e){}
                             v.play().catch(() => {}); });
  b.append(list);

  const btns = [...list.querySelectorAll('button')];
  let cur = -1;
  const follow = () => {
    const now = v.currentTime;
    let i = -1;
    for (let k = 0; k < lines.length; k++)
      if (now >= lines[k][0] - 0.05 && now < lines[k][1]) { i = k; break; }
    if (i === cur) return;
    if (btns[cur]) btns[cur].classList.remove('on');
    cur = i;
    if (btns[cur]){
      btns[cur].classList.add('on');
      // เลื่อนเฉพาะตอนที่ท่อนนั้นหลุดออกนอกกล่องแล้วจริง ๆ — เลื่อนทุกท่อนทำให้
      // รายการกระตุกตลอดเวลาแม้ท่อนที่กำลังเล่นยังเห็นอยู่เต็มตา
      const r = btns[cur].getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.top < lr.top || r.bottom > lr.bottom)
        btns[cur].scrollIntoView({block: 'nearest'});
    }
  };
  v.addEventListener('timeupdate', follow);
  follow();

  const got = (TR && TR.files && TR.files[name]) || [];
  if (got.length){
    const dl = el('div', 'trdl');
    got.forEach(kind => {
      const a = el('a', null, `โหลด .${kind}`);
      a.href = `/text/${name}.${kind}`; a.download = `${name}.${kind}`;
      dl.append(a);
    });
    b.append(dl);
  }

  // ข้ามไปคลิปที่มีคำพูดใบก่อนหน้า/ถัดไป — ไล่ฟังทั้งกองได้โดยไม่ต้องกลับไปหา
  // ในรายการทีละครั้ง (รายการอาจถูกกรองด้วยคำค้นอยู่ ก็เดินตามที่กรองไว้นั่นแหละ)
  const talk = trClips();
  const i = talk.indexOf(name);
  const f = el('div', 'cf');
  const prev = el('button', 'sm', '←'), next = el('button', 'sm', '→');
  prev.title = 'คลิปก่อนหน้า (←)'; next.title = 'คลิปถัดไป (→)';
  prev.disabled = i <= 0;
  next.disabled = i < 0 || i >= talk.length - 1;
  prev.onclick = () => talkStep(-1);
  next.onclick = () => talkStep(1);
  f.append(el('span', 'note', 'กดบรรทัดเพื่อเลื่อนไปวินาทีนั้น'),
           el('span', 'spacer'),
           el('span', 'note', `${i + 1}/${talk.length}`), prev, next);
  box.append(f);
  return true;
}

// คลิปที่มีคำพูด เรียงตามลำดับหนัง — ใช้เดินหน้า/ถอยหลังในแถบข้าง
//
// จงใจไม่ผูกกับคำค้นที่พิมพ์อยู่: ปุ่ม ← → จะเปลี่ยนความหมายเงียบ ๆ ทุกครั้งที่
// พิมพ์เพิ่มอีกตัว ("ถัดไป" ของเมื่อกี้กับของตอนนี้คนละใบ) และตัวเลข n/m ในแถบ
// ข้างก็จะค้างไม่ตรงจนกว่าจะมีอะไรสั่งวาดใหม่ — ค้นคือค้น เดินคือเดิน คนละงาน
function trClips(){
  return (TR.order || Object.keys(TR.clips || {})).filter(n => trLines(n).length);
}

function closeTalk(){ tkOpen = null; render(); }

function talkStep(d){
  const talk = trClips();
  const i = talk.indexOf(tkOpen.name) + d;
  if (!talk[i]) return;
  tkOpen = {name: talk[i], t: (trLines(talk[i])[0] || [0])[0]};
  render();
}

// Esc ปิด · ลูกศรข้ามคลิป — ชุดเดียวกับการ์ดคลิป (ขั้น 1) และการ์ดชิ้น
document.addEventListener('keydown', e => {
  if (step !== 2 || !tkOpen || !keyFree(e)) return;
  if (e.key === 'Escape'){ e.preventDefault(); return closeTalk(); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); talkStep(-1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); talkStep(1); }
});

// ── ระดับเสียง ──────────────────────────────────────────────────
//
// เครื่องปรับความดังให้อยู่แล้วโดยไม่ต้องตั้งอะไร สองสวิตช์นี้ไม่ได้เปิด/ปิดการปรับ
// แต่เปลี่ยน "เท่ากัน" ให้แปลว่าอะไร ซึ่งเป็นคนละคำถามกันสองข้อ:
//   ช่วงวิวควรเบากว่าช่วงพูดไหม   → เป้าคนละตัว หรือตัวเดียว
//   เทียบเสียงกันด้วยหน่วยไหน     → ทีละท่อน หรือทั้งคลิป
// เปิดแยกกันได้ เพราะเปิดตัวหนึ่งไม่ได้บังคับอีกตัว
function levelSect(){
  const s = el('div', 'sect'); s.style.marginTop = '.9rem';
  s.appendChild(el('h4', null, 'ระดับเสียง'));

  const talk = +val('audio.target_lufs_talk');
  const broll = +val('audio.target_lufs_broll');
  const same = !!val('audio.same_level');
  const match = !!val('audio.match_clips');

  putField(s, 'audio.same_level');
  s.appendChild(el('p', 'note', same
    ? `ทุกชิ้นดังเท่ากันที่ ${talk} LUFS — ช่วงวิวไม่ถูกหรี่ลงอีกแล้ว`
    : `ตอนนี้ช่วงพูด ${talk} · ช่วงวิว ${broll} LUFS `
      + `— ช่วงวิวเบากว่า ${Math.abs(talk - broll).toFixed(1)} dB`));

  putField(s, 'audio.match_clips');
  s.appendChild(el('p', 'note', match
    ? 'วัดทั้งคลิปครั้งเดียว ทุกท่อนในคลิปเดียวกันได้ค่าปรับเท่ากันเป๊ะ '
      + '— คลิปต่อคลิปดังเท่ากัน แต่ในคลิปยังมีเสียงดัง-เบาตามที่ถ่ายมา'
    : 'วัดทีละท่อน ทุกท่อนถูกดันขึ้นเป้าแยกกัน — เสียงสม่ำเสมอที่สุด '
      + 'แต่เสียงกระซิบกับเสียงตะโกนในคลิปเดียวกันจะออกมาดังพอ ๆ กัน'));

  if (match){
    const n = ((CL && CL.clips) || []).filter(clPicked).length;
    s.appendChild(el('p', 'note', n
      ? `ต้องวัดเสียง ${n} คลิปก่อนตัด — ราวไม่กี่วินาที และวัดครั้งเดียวต่อไฟล์ `
        + '(ไฟล์เดิมรอบหน้าไม่วัดซ้ำ)'
      : 'จะวัดเสียงทุกคลิปที่เลือกไว้ก่อนตัด — วัดครั้งเดียวต่อไฟล์'));
  }

  s.appendChild(el('p', 'note',
    'เพดานพีคกับ limiter ยังทำงานเหมือนเดิมทั้งสองโหมด — ชิ้นที่เร่งแล้วจะชนยอดคลื่น '
    + 'ถูกกันไว้ก่อนตั้งแต่ตอนคิดค่าปรับ · เป้าเป็นตัวเลข LUFS แก้ได้ที่ขั้น 3'));
  return s;
}

// ขั้นนี้ต้องทำใหม่ไหม — ยังไม่เคยทำ หรือทำไว้แล้วแต่ค่าที่ใช้ตอนนั้นเปลี่ยนไปแล้ว
// (ตรรกะเดียวกับที่ serve.py ใช้เลือกขั้นให้ปุ่มหลัก จะได้ไม่บอกคนละอย่างกัน)
const stepPending = id => {
  const s = stepOf(id);
  return s.run && (!s.exists || (s.changed || []).length > 0);
};

function stepRow(id, no, label, tip){
  const s = stepOf(id);
  const row = el('div', 'acts');
  const b = el('button', 'runbtn', `${no} ${label}`);
  b.title = tip;
  b.dataset.step = id;            // poll() เอาไปขีดเส้นกะพริบใต้ปุ่มที่กำลังรัน
  if (!s.run){ b.classList.add('locked'); b.disabled = true; }
  b.onclick = () => runStep(id);
  row.appendChild(b);
  row.appendChild(el('span', !s.run ? 'note warnnote' : 'note',
    !s.run ? s.skip
      : s.exists ? ((s.changed || []).length
                     ? `ทำไว้แล้วแต่ค่าเปลี่ยนไปแล้ว — ${s.summary}`
                     : `✓ ${s.summary}`)
      : 'ยังไม่เคยทำ'));
  return row;
}

function stepPrepare(box){
  const c = el('div', 'card');
  c.appendChild(head(2));

  // ── กล่อง 1 · ไม่ใช้ AI ──
  const basic = el('div', 'sect');
  basic.appendChild(el('h4', null, 'พื้นฐาน · ทำในเครื่อง ไม่เสียโควตา'));
  // ① มีสวิตช์ของตัวเองเหมือนที่ ② มี — เดิมสวิตช์นี้มีอยู่แล้วแต่ไปซ่อนอยู่ใน
  // "ตั้งค่าเพิ่มเติม" ที่พับไว้ มองจากหน้านี้จึงไม่รู้เลยว่าปิดได้ และไม่รู้ว่า
  // ขั้นนี้ถอดเสียงในเครื่อง ไม่ได้ส่งอะไรออกไปให้ AI

  if (val('jumpcut.enabled')){
    basic.appendChild(stepRow('silence', '②', 'หาช่วงเงียบ',
                              'ฟังคลื่นเสียงจริงหาช่วงที่ไม่มีคนพูด — ไม่กี่วินาที'));
    ['jumpcut.noise_db', 'jumpcut.min_silence', 'jumpcut.pad', 'jumpcut.min_piece']
      .forEach(k => putField(basic, k));
    basic.appendChild(el('p', 'note',
      'ป้ายข้างชื่อค่าบอกอยู่แล้วว่าแก้แล้วต้องทำอะไรใหม่'));
  }
  // เกณฑ์ความยาวโผล่เสมอ ไม่ผูกกับสวิตช์ cut ชน — มันทำงานกับคลิปวิวด้วย และ
  // ทำงานต่อแม้ปิด cut ชน ถ้าซ่อนตามสวิตช์จะกลายเป็นตัวกรองที่ยังคัดของอยู่
  // แต่หาที่แก้ไม่เจอ

  basic.appendChild(levelSect());

  // ── กล่อง 2 · ปุ่มหลัก ──

  const acts = el('div', 'acts');

  const bAll = el('button', 'runbtn primary', '③ ตัดทีละคลิป');
  bAll.title = 'เติมขั้นที่ยังขาดให้ก่อนอัตโนมัติ แล้วตัดทีละคลิป';
  bAll.dataset.step = 'prepare_all';
  bAll.onclick = () => runStep('prepare_all');

  // ปุ่มที่สองโผล่เฉพาะตอนที่รอบนี้จะมีการเรียกโมเดลจริงเท่านั้น
  if (pend.includes('ai')){
    const bFree = el('button', 'runbtn', 'ตัดโดยไม่เรียก AI');

    bFree.dataset.step = 'prepare_free';
    bFree.onclick = () => runStep('prepare_free');

  }
  run.appendChild(acts);

  run.appendChild(el('p', 'note', pend.length
    ? `รอบนี้จะรัน: ${pend.map(i => stepOf(i).label).concat('ตัดทีละคลิป').join(' → ')}`
    : 'ของที่ต้องใช้ครบแล้ว — กดแล้วตัดทีละคลิปอย่างเดียว'));
  const uses = ['บทพูด'];
  if (val('jumpcut.enabled')) uses.push('ช่วงเงียบ (cut ชน)');
  if (val('ai.apply.enabled')) uses.push('ความเห็นจาก AI');

  // ── กล่อง 3 · ใช้ AI — วางไว้หลังปุ่มหลักเพราะเป็นของ "เพิ่มเข้าไป" ไม่ใช่

  const ai = el('div', 'sect');

  putField(ai, 'ai.apply.enabled');
  if (val('ai.apply.enabled')){
    ai.appendChild(stepRow('ai', '④', 'ดึงความหมาย',
                           'ให้ AI อ่านว่าคลิปไหนเล่าอะไร แล้วเก็บไว้ใน ai.json'));
    ['ai.tasks', 'ai.goal', 'ai.model'].forEach(k => putField(ai, k));
    ai.appendChild(el('h4', null, 'เอาคำตอบของ AI ไปใช้ยังไง'));
    ['ai.apply.trim', 'ai.apply.drop'].forEach(k => putField(ai, k));
    if (!stepOf('ai').exists)
      ai.appendChild(el('p', 'note warnnote',
        'เปิดสวิตช์ไว้แต่ยังไม่เคยดึงความหมาย — กด ④ ก่อน ไม่งั้นรอบนี้ยังตัดด้วยกฎล้วน'));
    const again = el('div', 'acts');
    const bp = el('button', 'runbtn', 'ตัดทีละคลิปใหม่ ให้ความเห็น AI มีผล');
    bp.dataset.step = 'prepare';
    bp.title = 'เหมือนกด ③ แต่ไม่ต้องเลื่อนขึ้นไป — ตัดใหม่จาก ai.json ที่มีอยู่';
    bp.onclick = () => runStep('prepare');
    again.appendChild(bp);
    again.appendChild(el('span', 'note',
      'ความเห็นของ AI ถูกใช้ตอน "ตัดทีละคลิป" — แก้ค่าตรงนี้แล้วต้องตัดใหม่ทุกครั้ง'));
    ai.appendChild(again);
  } else {
    ai.appendChild(el('p', 'note',
      'ปิดอยู่ — ขั้นนี้ตัดด้วยกฎล้วน (บทพูด + ช่วงเงียบ) · '
      + 'สวิตช์ AI ของขั้น 3 เป็นคนละตัว ปิดตรงนี้ไม่กระทบขั้นนั้น'));
  }
  c.appendChild(ai);

  c.appendChild(advanced(['listen', 'prepare', 'ai']));
  box.appendChild(c);

  // บทพูดอยู่เหนือคลังชิ้น เพราะมันคือ "ของที่ใช้ตัดสิน" ส่วนคลังคือ "ผลของการ
  // ตัดสิน" — อ่านก่อนแล้วค่อยเลือก ไม่ใช่เลือกไปแล้วค่อยเลื่อนลงไปหาว่าพูดอะไร
  if (trHas()) box.appendChild(trCard());
  if (POOL.has) box.appendChild(poolView());
