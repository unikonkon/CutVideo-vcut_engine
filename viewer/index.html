<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vcut viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d; --dim:#8a8378;
  --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a;
  --off:#f2efe9; --radius:7px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da; --dim:#8f877b;
         --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c; --off:#252320; }
}
:root[data-theme=dark]{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da;
  --dim:#8f877b; --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c; --off:#252320; }
:root[data-theme=light]{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d;
  --dim:#8a8378; --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a; --off:#f2efe9; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:.4em .85em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:.2em .5em}
button.ghost:hover{color:var(--fg)}

header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:.7rem 1rem}
.hrow{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{border:1px solid var(--line);border-radius:100px;padding:.15em .7em;
  font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip.changed{border-color:var(--warn);color:var(--warn)}
.chip.changed b{color:var(--warn)}
.spacer{flex:1}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1rem;
  padding:1rem;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:960px){ main{grid-template-columns:minmax(0,1fr)} aside{position:static!important} }

.bar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;padding:.35em .8em;font-size:13px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}

.chapter{margin:1.1rem 0 .4rem;display:flex;align-items:center;gap:.6rem}
.chapter h2{font-size:13px;margin:0;font-weight:700}
.chapter .meta{font-size:12px;color:var(--dim)}
.chapter hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

ul{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:26px 66px 1fr auto;gap:.6rem;align-items:center;
  padding:.4rem .55rem;border:1px solid transparent;border-radius:var(--radius)}
li.row:hover{background:var(--panel);border-color:var(--line)}
li.row.sel{border-color:var(--accent)}
li.row.off{opacity:.42}
li.row.off .name{text-decoration:line-through}
li.row.drag{opacity:.35}
li.row.over{border-top:2px solid var(--accent)}
.idx{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:66px;height:37px;object-fit:cover;border-radius:4px;background:var(--off);
  cursor:grab;display:block}
.mid{min-width:0}
.name{font-size:12.5px;font-weight:600;display:flex;gap:.4rem;align-items:center}
.kind{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700;letter-spacing:.03em}
.kind.TALK{background:color-mix(in srgb,var(--talk) 18%,transparent);color:var(--talk)}
.kind.BROLL{background:color-mix(in srgb,var(--broll) 18%,transparent);color:var(--broll)}
.sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.acts{display:flex;gap:.15rem;align-items:center}
.dur{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:3.4em;text-align:right}

aside{position:sticky;top:64px;display:flex;flex-direction:column;gap:.75rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.8rem}
.card h3{font-size:12px;margin:0 0 .5rem;color:var(--dim);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
video{width:100%;border-radius:5px;background:#000;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.quote{font-size:12px;color:var(--dim);margin-top:.5rem;max-height:8em;overflow:auto;
  border-left:2px solid var(--line);padding-left:.6rem}
#log{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  max-height:15em;overflow:auto;color:var(--dim);word-break:break-word}
.empty{color:var(--dim);font-size:12.5px;padding:2rem 0;text-align:center}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:50;
  background:var(--fg);color:var(--bg);padding:.55em 1.1em;border-radius:100px;
  font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--warn);color:#fff}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">vcut</h1>
    <span class="chip" id="c-seg">—</span>
    <span class="chip" id="c-dur">—</span>
    <span class="chip" id="c-mix">—</span>
    <span class="chip" id="c-render">—</span>
    <span class="spacer"></span>
    <button id="undo" title="ย้อนกลับไปฉบับก่อนบันทึกล่าสุด">ย้อนกลับ</button>
    <button id="reload">โหลดใหม่</button>
    <button id="save" disabled>บันทึก EDL</button>
    <button id="build" class="primary">สร้างไฟล์</button>
  </div>
</header>

<main>
  <section>
    <div class="bar">
      <div class="seg" id="filter">
        <button data-f="all" aria-pressed="true">ทั้งหมด</button>
        <button data-f="TALK" aria-pressed="false">พูด</button>
        <button data-f="BROLL" aria-pressed="false">วิว</button>
        <button data-f="off" aria-pressed="false">ที่เอาออก</button>
      </div>
      <span class="spacer"></span>
      <span class="chip" id="hint">ลากรูปเพื่อสลับลำดับ · คลิกแถวเพื่อดูตัวอย่าง</span>
    </div>
    <div id="list"></div>
  </section>

  <aside>
    <div class="card">
      <h3>ตัวอย่าง</h3>
      <div id="preview"><p class="empty">คลิกช็อตทางซ้าย</p></div>
    </div>
    <div class="card">
      <h3>บันทึกการทำงาน</h3>
      <div id="log">ยังไม่มีงานที่สั่ง</div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
let S = null, items = [], sel = -1, filter = 'all', dragFrom = -1, logSince = 0, polling = null;

const mmss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const dirty = () => items.some(x => x.off) || items.some((x,i) => x.i !== i);

function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 2600);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}

async function load(){
  S = await api('/api/state');
  items = S.timeline.map(x => ({...x, off:false}));
  sel = -1;
  $('#title').textContent = S.project + (S.ai.goal ? ' · ' + S.ai.goal : '');
  $('#c-render').textContent = '';
  render();
}

function stats(){
  const on = items.filter(x => !x.off);
  return {
    n: on.length,
    dur: on.reduce((a,b) => a + b.dur, 0),
    talk: on.filter(x => x.kind === 'TALK').length,
    broll: on.filter(x => x.kind === 'BROLL').length,
    ready: on.filter(x => x.seg).length,
  };
}

function head(){
  const s = stats(), d = dirty();
  $('#c-seg').innerHTML = `<b>${s.n}</b> ชิ้น`;
  $('#c-dur').innerHTML = `<b>${mmss(s.dur)}</b> นาที`;
  $('#c-mix').innerHTML = `<b>${s.talk}</b> พูด + <b>${s.broll}</b> วิว`;
  $('#c-seg').classList.toggle('changed', d);
  $('#c-dur').classList.toggle('changed', d);
  $('#c-render').innerHTML = s.ready === s.n
    ? `render ครบ · ต่อไฟล์ได้เลย`
    : `<b>${s.n - s.ready}</b> ชิ้นยังไม่ได้ render`;
  $('#c-render').classList.toggle('changed', s.ready !== s.n);
  $('#save').disabled = !d;
  $('#save').textContent = d ? 'บันทึก EDL ●' : 'บันทึก EDL';
}

function visible(x){
  if (filter === 'all')  return true;
  if (filter === 'off')  return x.off;
  return x.kind === filter && !x.off;
}

function render(){
  head();
  const list = $('#list');
  list.innerHTML = '';
  let chap = '␀', ul = null, shown = 0;

  items.forEach((x, i) => {
    if (!visible(x)) return;
    shown++;
    if (filter === 'all' && x.chapter !== chap){
      chap = x.chapter;
      if (chap){
        const on = items.filter(y => y.chapter === chap && !y.off);
        const h = document.createElement('div');
        h.className = 'chapter';
        h.innerHTML = `<h2></h2><span class="meta"></span><hr>`;
        h.querySelector('h2').textContent = x.chapter_title || chap;
        h.querySelector('.meta').textContent =
          `${on.length} ชิ้น · ${mmss(on.reduce((a,b)=>a+b.dur,0))}`;
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.textContent = on.length ? 'เอาบทนี้ออก' : 'เอาบทนี้กลับ';
        btn.onclick = () => {
          const off = on.length > 0;
          items.forEach(y => { if (y.chapter === chap) y.off = off; });
          render();
        };
        h.appendChild(btn);
        list.appendChild(h);
      }
      ul = document.createElement('ul');
      list.appendChild(ul);
    }
    if (!ul){ ul = document.createElement('ul'); list.appendChild(ul); }
    ul.appendChild(row(x, i));
  });

  if (!shown) list.innerHTML = '<p class="empty">ไม่มีช็อตที่ตรงกับตัวกรองนี้</p>';
  if (sel >= 0) preview(items[sel]);
}

function row(x, i){
  const li = document.createElement('li');
  li.className = 'row' + (x.off ? ' off' : '') + (i === sel ? ' sel' : '');
  li.dataset.i = i;

  const idx = document.createElement('div');
  idx.className = 'idx'; idx.textContent = i + 1;

  const img = document.createElement('img');
  img.className = 'thumb'; img.loading = 'lazy'; img.draggable = true;
  img.src = `/thumb/${x.name}.jpg`; img.alt = '';

  const mid = document.createElement('div');
  mid.className = 'mid';
  const nm = document.createElement('div');
  nm.className = 'name';
  const kd = document.createElement('span');
  kd.className = 'kind ' + x.kind; kd.textContent = x.kind === 'TALK' ? 'พูด' : 'วิว';
  nm.append(kd, x.name);
  if (x.ai_score != null){
    const sc = document.createElement('span');
    sc.className = 'sub'; sc.textContent = `AI ${x.ai_score.toFixed(2)}`;
    nm.appendChild(sc);
  }
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = x.kind === 'TALK'
    ? (x.text || '—')
    : `motion ${x.motion ?? '—'} · สว่าง ${x.bright ?? '—'}${x.orient === 'V' ? ' · แนวตั้ง' : ''}`;
  mid.append(nm, sub);

  const acts = document.createElement('div');
  acts.className = 'acts';
  const dur = document.createElement('span');
  dur.className = 'dur'; dur.textContent = x.dur.toFixed(1) + 'ว';
  const up = mk('↑', () => move(i, -1)), dn = mk('↓', () => move(i, 1));
  const tg = mk(x.off ? '↺' : '✕', () => { x.off = !x.off; render(); },
                x.off ? 'เอากลับเข้าไทม์ไลน์' : 'เอาออกจากไทม์ไลน์');
  acts.append(dur, up, dn, tg);

  li.append(idx, img, mid, acts);
  li.onclick = e => { if (e.target.tagName !== 'BUTTON'){ sel = i; render(); } };

  img.addEventListener('dragstart', e => {
    dragFrom = i; li.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(i));
  });
  img.addEventListener('dragend', () => { li.classList.remove('drag'); dragFrom = -1; });
  li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
  li.addEventListener('dragleave', () => li.classList.remove('over'));
  li.addEventListener('drop', e => {
    e.preventDefault(); li.classList.remove('over');
    const from = dragFrom >= 0 ? dragFrom : parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (Number.isInteger(from) && from !== i){
      const [m] = items.splice(from, 1);
      items.splice(i, 0, m);
      sel = i; render();
    }
  });
  return li;
}

function mk(label, fn, title){
  const b = document.createElement('button');
  b.className = 'ghost'; b.textContent = label; b.title = title || '';
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}

function move(i, d){
  const j = i + d;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  if (sel === i) sel = j; else if (sel === j) sel = i;
  render();
}

function preview(x){
  const box = $('#preview');
  const kv = [
    ['คลิป', x.name],
    ['ช่วง', `${x.start.toFixed(2)} – ${x.end.toFixed(2)} วิ (${x.dur.toFixed(2)})`],
    ['ประเภท', x.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว'],
  ];
  if (x.chapter_title) kv.push(['บท', x.chapter_title]);
  if (x.ai_score != null) kv.push(['คะแนน AI', x.ai_score.toFixed(2)]);
  if (x.motion != null) kv.push(['motion', x.motion]);
  if (x.gain != null) kv.push(['ปรับเสียง', `${x.gain > 0 ? '+' : ''}${x.gain} dB`
                                + (x.limiter ? ' · limiter ทำงาน' : '')]);

  box.innerHTML = '';
  if (x.seg){
    const v = document.createElement('video');
    v.controls = true; v.preload = 'metadata'; v.src = `/seg/${x.seg}`;
    box.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = `/thumb/${x.name}.jpg`; img.style.width = '100%';
    img.style.borderRadius = '5px';
    box.appendChild(img);
    const p = document.createElement('p');
    p.className = 'sub'; p.style.marginTop = '.5rem';
    p.textContent = 'ชิ้นนี้ยังไม่ได้ render — กด "สร้างไฟล์" เพื่อดูของจริง';
    box.appendChild(p);
  }
  const dl = document.createElement('dl');
  dl.className = 'kv'; dl.style.marginTop = '.6rem';
  kv.forEach(([k, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v;
    dl.append(dt, dd);
  });
  box.appendChild(dl);
  if (x.text){
    const q = document.createElement('div');
    q.className = 'quote'; q.textContent = x.text;
    box.appendChild(q);
  }
}

// ── บันทึก / สั่งงาน ──────────────────────────────────────────────

async function save(){
  const keep = items.filter(x => !x.off)
                    .map(({name, start, dur}) => ({name, start, dur}));
  if (!keep.length) return toast('ต้องเหลืออย่างน้อย 1 ชิ้น', true);
  $('#save').disabled = true;
  try {
    const r = await api('/api/edl', {method:'POST', headers:{'Content-Type':'application/json'},
                                     body: JSON.stringify({keep})});
    toast(`บันทึกแล้ว · ${r.summary.segments} ชิ้น · ${mmss(r.summary.duration_total)}`);
    await load();
  } catch(e){ toast(e.message, true); $('#save').disabled = false; }
}

async function job(step){
  try {
    await api('/api/job', {method:'POST', headers:{'Content-Type':'application/json'},
                           body: JSON.stringify({step})});
    logSince = 0; $('#log').textContent = '';
    poll();
  } catch(e){ toast(e.message, true); }
}

async function poll(){
  clearTimeout(polling);
  let j;
  try { j = await api('/api/job?since=' + logSince); } catch(e){ return; }
  if (j.lines.length){
    logSince = j.total;
    const el = $('#log');
    el.textContent += j.lines.join('\n') + '\n';
    el.scrollTop = el.scrollHeight;
  }
  $('#build').disabled = j.running;
  $('#build').textContent = j.running ? 'กำลังทำงาน…' : 'สร้างไฟล์';
  if (j.running) polling = setTimeout(poll, 700);
  else if (j.code === 0){ toast('เสร็จแล้ว'); load(); }
  else if (j.code != null) toast('งานล้มเหลว — ดูบันทึกการทำงาน', true);
}

$('#save').onclick = save;
$('#build').onclick = () => job('build');
$('#reload').onclick = () => load().then(() => toast('โหลดใหม่แล้ว'));
$('#undo').onclick = async () => {
  try { await api('/api/undo', {method:'POST'}); await load(); toast('ย้อนกลับแล้ว'); }
  catch(e){ toast(e.message, true); }
};
$('#filter').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('#filter').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || sel < 0) return;
  if (e.key === 'j' || e.key === 'ArrowDown'){ sel = Math.min(items.length-1, sel+1); render(); }
  if (e.key === 'k' || e.key === 'ArrowUp'){ sel = Math.max(0, sel-1); render(); }
  if (e.key === 'x'){ items[sel].off = !items[sel].off; render(); }
  if (e.key === 'J'){ move(sel, 1); }
  if (e.key === 'K'){ move(sel, -1); }
});
window.addEventListener('beforeunload', e => { if (dirty()){ e.preventDefault(); e.returnValue = ''; } });

load().catch(e => toast(e.message, true));
poll();
</script>
</body>
</html>
