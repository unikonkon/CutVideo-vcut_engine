        CAP.auto.styles[c.id] || {})
    : CAP.style;
  capSel = c.id;
  if (!capPinned(t)){
    // ยังวางด้วยระยะขอบอยู่ — ตรึงจากจุดที่มันอยู่ตอนนี้ก่อน ไม่งั้นพอเริ่มลาก
    // ตัวหนังสือจะกระโดดไปมุมซ้ายบนแล้วค่อยตามเมาส์ ซึ่งอ่านว่าลากพลาด
    const p = capPinNow(t, CAP.style);
    t.pos_x = p[0]; t.pos_y = p[1];
    capPaint();
  }
  capDragTo(e, c.id, (x, y) => { t.pos_x = x; t.pos_y = y; });
}

function pvSeek(t){
  if (PV.mode === 'file'){ PV.el.vf.currentTime = t; return; }
  const cs = pvChunks(), base = pvBase(cs);
  let i = 0;
  while (i + 1 < cs.length && base[i + 1] <= t) i++;
  // สายสตรีมกระโดดข้ามในสายเดิมไม่ได้ — สั่งต่อสายใหม่จากชิ้นนั้นแทน
  if (pvStreaming()) return pvStreamStart(i, PV.playing);
  pvLoadChunk(i, t - base[i], PV.playing);
}

function pvJump(d){
  if (PV.mode === 'file'){
    const cs = pvChunks(), base = pvBase(cs), t = PV.el.vf.currentTime;
    let i = 0; while (i + 1 < cs.length && base[i + 1] <= t) i++;
    PV.el.vf.currentTime = base[Math.max(0, Math.min(cs.length - 1, i + d))];
    return;
  }
  if (pvStreaming()) return pvStreamStart(PV.ci + d, PV.playing);
  pvLoadChunk(PV.ci + (PV.mode === 'joins' ? 2 * d : d), 0, PV.playing);
}

function pvToggle(){ PV.playing ? pvPause() : pvPlay(); }

function pvPlay(){
  if (PV.mode === 'file'){
    const why = pvFileWhy();
    if (why){ PV.playing = false; pvSync(); return toast(`เล่นไม่ได้ — ${why}`, true); }
  }
  PV.playing = true;
  if (pvStreaming()){
    const v = PV.el.vs;
    if (!v.src) pvStreamStart(PV.ci, true);
    else { v.playbackRate = PV.rate; v.play().catch(() => {}); }
    pvSync();
    return;
  }
  if (PV.mode === 'file'){
    if (!PV.el.vf.src) PV.el.vf.src = '/out';
    PV.el.vf.playbackRate = PV.rate;
    PV.el.vf.play().catch(() => {});
  } else {
    const v = pvActive();
    if (!v.src) pvLoadChunk(PV.ci, 0, true);
    else { v.playbackRate = PV.rate; v.play().catch(() => {}); }
  }
  pvSync();
}

function pvPause(){
  PV.playing = false;
  [PV.el.va, PV.el.vb, PV.el.vf, PV.el.vs]
    .forEach(v => { try { v.pause(); } catch (_){} });
  pvSync();
}

// ── ไฟล์ที่ต่อแล้วยังใช้ดูได้อยู่ไหม ─────────────────────────────
//
// โหมดนี้เล่น final.mp4 ซึ่งเป็นผลของ "สร้างไฟล์" ไม่ใช่ผลของ "จัดใหม่" — พอกด
// จัดใหม่ ไทม์ไลน์เปลี่ยนทันทีแต่ไฟล์ยังเป็นของรอบก่อน เดิมยังปล่อยให้เล่นต่อโดย
// ขึ้นแค่คำเตือนตัวเล็ก ๆ ผลคือคนนั่งดูหนังคนละเรื่องกับที่กำลังจะได้ แล้วสรุปว่า
// "กดจัดใหม่แล้วไม่เห็นเปลี่ยน"  ตอนนี้ไม่ให้เล่นเลยจนกว่าไฟล์จะตรงกับไทม์ไลน์
//
// เทียบด้วยเวลาแก้ไฟล์ (out_stale = final.mp4 เก่ากว่า edl.json) ซึ่งครอบคลุมทั้ง
// การกดจัดใหม่ การให้ AI จัด และการกดบันทึกไทม์ไลน์เอง
// out_stale เทียบไฟล์บนดิสก์เท่านั้น จึงไม่รู้จัก *ร่างในเบราว์เซอร์* ที่ยังไม่ได้
// บันทึก — ตัด/ลบ/ลากขอบแล้ว edl.json ยังไม่ขยับสักนิด ไฟล์เลยดู "ตรง" อยู่ทั้งที่
// ชิ้นที่เพิ่งกดลบยังอยู่ในหนังครบทั้งภาพและเสียง  นับร่างเป็นของไม่ตรงด้วย
function pvFileWhy(){
  if (!S || !S.out_exists) return 'ยังไม่มีไฟล์หนัง — ยังไม่เคยกด "สร้างไฟล์"';
  if (S.out_stale) return 'ไฟล์ที่ต่อไว้เก่ากว่าไทม์ไลน์ตอนนี้';
  if (tlDirty()) return 'แก้ไทม์ไลน์ไว้แล้วยังไม่ได้ต่อไฟล์ใหม่';
  return '';
}

// เรียกทุกครั้งที่วาดหน้าใหม่ — DOM เดิม แต่ข้อมูลรอบตัวเปลี่ยนได้ตลอด
function pvSync(){
  const E = PV.el, cs = pvChunks(), ps = pvPieces();
  // สัดส่วนของกรอบตามขนาดหนังที่ตั้งไว้ (ไม่ใช่ขนาดของคลิปที่กำลังเล่น) — คลิป
  // แนวตั้งจะถูกใส่กรอบให้เหมือนตอน render จริง แทนที่จะดันกรอบให้สูงขึ้นเอง
  const vw = +val('video.width') || 16, vh = +val('video.height') || 9;
  E.stage.style.setProperty('--pvr', (vw / vh).toFixed(4));
  const why0 = pvFileWhy();
  [...E.tabs.children].forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.mode === PV.mode);
    // ติดธงบนแท็บเลยว่าโหมดนี้ใช้ไม่ได้ตอนนี้ ไม่ต้องกดเข้าไปก่อนถึงจะรู้
    if (b.dataset.mode === 'file'){
      b.textContent = 'ไฟล์ที่ต่อแล้ว' + (why0 ? ' ⚠' : '');
      b.title = why0 || 'เล่นไฟล์ที่ต่อเสร็จแล้ว — ตรงกับไทม์ไลน์ตอนนี้';
    }
  });
  E.play.textContent = PV.playing ? '⏸' : '▶';

  const fileMode = PV.mode === 'file';
  const fileWhy = fileMode ? pvFileWhy() : '';
  const stream = pvStreaming();
  // ไฟล์ใช้ไม่ได้ก็ไม่ต้องโผล่ตัววิดีโอมาเลย — ไม่งั้นแถบควบคุมของเบราว์เซอร์
  // ยังกดเล่นได้อยู่ดี ทั้งที่เราตั้งใจห้าม
  E.vf.classList.toggle('hide', !fileMode || !!fileWhy);
  E.vs.classList.toggle('hide', !stream);
  // ต้องแปลงเป็น boolean ให้ชัด — classList.toggle(name, undefined) ไม่ได้แปลว่า
  // "เอาออก" แต่แปลว่า "ไม่ได้ส่งค่ามา" ซึ่งคือ *สลับ* ค่าเดิม  PV.flip ยังไม่ถูก
  // ตั้งจนกว่าจะสลับชิ้นครั้งแรก ตอนเปิดหน้ามาใหม่ va จึงติด/หลุด hide สลับกันไป
  // ทุกครั้งที่ pvSync ทำงาน = จอดำสลับกับมีภาพโดยไม่มีใครสั่ง
  E.va.classList.toggle('hide', !!(fileMode || stream || PV.flip));
  E.vb.classList.toggle('hide', !!(fileMode || stream || !PV.flip));
  if (fileMode && !fileWhy && !E.vf.src) E.vf.src = '/out';
  if (fileWhy && E.vf.src){ E.vf.pause(); E.vf.removeAttribute('src'); E.vf.load(); }
  // สายสตรีมที่ใช้ไม่ได้แล้วต้อง **สั่งหยุด** ไม่ใช่แค่ปิดปุ่มกับซ่อนตัววิดีโอ —
  // display:none ไม่ได้ทำให้เสียงเงียบ  ลากขอบชิ้นทีนึง pvStreamMissing เป็นจริง
  // ทันที ปุ่ม ▶ ดับไปแล้วแต่สายเก่ายังส่งเสียงของขอบเดิมต่อโดยกดหยุดไม่ได้
  if ((!stream || pvStreamMissing()) && E.vs.src){
    E.vs.pause(); E.vs.removeAttribute('src'); E.vs.load();
    PV.stok = null;
    if (stream) PV.playing = false;
  }

  // ขีดบอกขอบเขตของแต่ละชิ้นบนแถบเลื่อน
  E.ticks.innerHTML = '';
  const tot = fileMode ? 0 : pvTotal(cs);
  if (!fileMode && tot > 0 && cs.length < 600)
    pvBase(cs).forEach(b => { const i = el('i');
                              i.style.left = (b / tot * 100).toFixed(3) + '%';
                              E.ticks.appendChild(i); });

  const ch = cs[PV.ci];
  E.badge.textContent = fileMode
    ? (fileWhy || 'ไฟล์ที่ต่อแล้ว')
    : ch ? `ชิ้นที่ ${ps.indexOf(ch.p) + 1}/${ps.length} · ${ch.p.name} · `
           + (ch.p.kind === 'TALK' ? 'พูด' : 'วิว')
         : 'ยังไม่มีชิ้นที่ตัดไว้';

  E.foot.innerHTML = '';
  E.foot.appendChild(pvFoot(cs, ps));
  const dead = fileMode ? !!fileWhy
             : stream ? (!cs.length || !!pvStreamMissing())
             : !cs.length;
  [E.play, E.prev, E.next].forEach(b => b.disabled = dead);

  // โหมดต่อชิ้นไม่ได้ฉายอยู่ = ตัวที่ต่อชิ้นทั้งสองต้องเงียบ ไม่ใช่แค่ถูกซ่อน
  // (สลับไปโหมด "ไฟล์ที่ต่อแล้ว" หรือ "ต่อเนื่องจริง" ตอนกำลังเล่นค้างอยู่)
  if (fileMode || stream){ pvHold(E.va); pvHold(E.vb); }
  pvEdgeWatch();       // เริ่มเฝ้าขอบชิ้นถ้ากำลังเล่นอยู่ (ตัวมันเองกันเรียกซ้ำ)
}

function pvFoot(cs, ps){
  const w = el('div');
  const notRendered = ps.filter(pvRaw).length;

  if (PV.mode === 'file'){
    const why = pvFileWhy();
    if (why){
      w.appendChild(el('p', 'note warnnote', `เล่นไม่ได้ — ${why}`));
      w.appendChild(el('p', 'note',
        'โหมดนี้เล่นไฟล์ที่ "สร้างไฟล์" ผลิตไว้ ซึ่งยังไม่ใช่ไทม์ไลน์ที่จัดล่าสุด '
        + '— ดูของจริงตอนนี้ได้ที่โหมด "ไทม์ไลน์สด" (ต่อชิ้นให้ดูในเบราว์เซอร์เลย) '
        + 'หรือกด "สร้างไฟล์" เพื่อผลิตไฟล์ใหม่ให้ตรงกับไทม์ไลน์'));
      if (S && S.out_exists)
        w.appendChild(el('p', 'note',
          `ไฟล์เดิม: ${S.out} · ${S.out_size} GB · ต่อเมื่อ ${clockOf(S.out_mtime)}`));
      const a = el('div', 'acts');
      const live = el('button', 'sm primary', 'ดูจากไทม์ไลน์สดแทน');
      live.onclick = () => pvSetMode('live');
      const mk2 = el('button', 'sm runbtn', 'สร้างไฟล์');
      mk2.dataset.step = 'build';
      mk2.onclick = buildFile;
      a.append(live, mk2);
      w.appendChild(a);
      return w;
    }
    w.appendChild(el('p', 'note',
      `${S.out} · ${S.out_size} GB · ต่อเมื่อ ${clockOf(S.out_mtime)} — ตรงกับไทม์ไลน์ตอนนี้`));
    return w;
  }

  if (PV.mode === 'joins'){
    const n = cs.length / 2 | 0;
    const whole = ps.reduce((a, b) => a + b.dur, 0);

    const pick = el('div', 'seg'); pick.style.marginBottom = '.45rem';
    Object.entries(PV_JOIN_FILTERS).forEach(([k, [lab, fn]]) => {
      let cnt = 0;
      for (let i = 0; i + 1 < ps.length; i++)
        if (ps[i].seg && ps[i + 1].seg && fn(ps[i], ps[i + 1])) cnt++;
      const b = el('button', null, `${lab} ${cnt}`);
      b.setAttribute('aria-pressed', PV.joinFilter === k);
      b.onclick = () => { PV.joinFilter = k; PV.ci = 0; PV.marks.clear();
                          pvPause(); render(); };
      pick.appendChild(b);
    });
    w.appendChild(pick);

    const row = el('div', 'acts');
    const ok = el('button', 'sm', 'ผ่าน');
    ok.onclick = () => { PV.marks.delete(PV.ci / 2 | 0); pvLoadChunk((PV.ci / 2 | 0) * 2 + 2, 0, true); };
    const bad = el('button', 'sm', 'ทำเครื่องหมายไว้');
    bad.onclick = () => { PV.marks.add(PV.ci / 2 | 0); pvLoadChunk((PV.ci / 2 | 0) * 2 + 2, 0, true); };
    const again = el('button', 'sm', 'เล่นซ้ำ');
    again.onclick = () => pvLoadChunk((PV.ci / 2 | 0) * 2, 0, true);
    row.append(ok, bad, again);
    const cur = cs[PV.ci];
    w.append(el('p', 'note', n
      ? `รอยต่อที่ ${(PV.ci / 2 | 0) + 1}/${n}`
        + (cur ? ` · ${cur.p.name}` : '')
        + ` · เล่นแค่ ${PV_PRE} วิก่อน + ${PV_POST} วิหลังจุดตัด`
        + ` — ดูครบใน ~${mmss(n * (PV_PRE + PV_POST))} แทนที่จะเป็น ${mmss(whole)}`
      : 'ไม่มีรอยต่อที่เข้าเกณฑ์ที่เลือกไว้'), row);
    if (PV.marks.size){
      const m = el('div', 'acts');
      m.append(el('span', 'note', `ทำเครื่องหมายไว้ ${PV.marks.size} จุด:`));
      [...PV.marks].sort((a, b) => a - b).forEach(j => {
        const b = el('button', 'ghost', String(j + 1));
        b.title = `ไปที่รอยต่อที่ ${j + 1}`;
        b.onclick = () => pvLoadChunk(j * 2, 0, true);
        m.appendChild(b);
      });
      w.appendChild(m);
    }
    return w;
  }

  // ── เลือกวิธีเล่นของโหมดไทม์ไลน์สด ──
  const pick = el('div', 'seg'); pick.style.marginBottom = '.45rem';
  [['chunks', 'ต่อชิ้นในเบราว์เซอร์', 'เริ่มเล่นทันที แต่รอยต่อสะดุดจาง ๆ (~70 ms)'],
   ['stream', 'ต่อเนื่องจริง', 'ให้เซิร์ฟเวอร์ต่อเป็นสายเดียว รอยต่อเนียนสนิท']]
    .forEach(([v, lab, tip]) => {
      const b = el('button', null, lab);
      b.setAttribute('aria-pressed', PV.live === v);
      b.title = tip;
      b.onclick = () => pvSetLive(v);
      pick.appendChild(b);
    });
  w.appendChild(pick);

  if (pvStreaming()){
    // สองบรรทัดเสมอ ไม่ว่าจะเล่นได้หรือไม่ได้ — เดิมสลับระหว่าง "เตือน 1 บรรทัด"
    // กับ "อธิบาย 2 บรรทัด" ซอยชิ้นทีนึงการ์ดจึงหดแล้วดันไทม์ไลน์ขยับ
    w.appendChild(el('p', 'note',
      'เซิร์ฟเวอร์ต่อชิ้นด้วย ffmpeg แล้วส่งมาเป็นสายเดียว — ไม่มีการสลับไฟล์ '
      + 'รอยต่อจึงเนียนสนิทเท่าไฟล์จริง และไม่เขียนไฟล์ลงดิสก์เลย'));
    w.appendChild(notRendered
      ? el('p', 'note warnnote',
          `เล่นไม่ได้ตอนนี้ — โหมดนี้ต่อจากไฟล์ที่ตัดไว้เท่านั้น แต่มี ${notRendered} `
          + 'ชิ้นที่ยังไม่มีไฟล์ (เพิ่งแก้ขอบหรือเพิ่งซอย) · กด "สร้างไฟล์" ให้ตัดครบก่อน '
          + 'หรือกลับไปโหมด "ต่อชิ้นในเบราว์เซอร์" ที่เล่นจากไฟล์ต้นฉบับแทนได้')
      : el('p', 'note',
          'แลกกับการเลื่อนดู: สายสตรีมกระโดดกลางชิ้นไม่ได้ '
          + 'เลื่อนไปตรงไหนจะไปเริ่มที่ต้นชิ้นที่ใกล้ที่สุด (ต่อสายใหม่ ~0.4 วิ) · '
          + 'เปลี่ยนลำดับแล้วกดเล่นใหม่ได้เลย ไม่ต้องบันทึกก่อน'));
    return w;
  }

  w.appendChild(el('p', 'note',
    'เบราว์เซอร์ต่อชิ้นเอง — เห็นทันทีโดยไม่ต้องรออะไร แลกกับรอยต่อที่สะดุดจาง ๆ '
    + 'เพราะสลับไฟล์ทีนึงมีช่องว่างเสมอ (วัดจริงราว 70 ms) '
    + 'อยากได้รอยต่อเนียนสนิทให้กด "ต่อเนื่องจริง"'));
  // ไม่มีกล่องเตือน "N ชิ้นยังไม่มีไฟล์ที่ตัดไว้" ตรงนี้แล้ว — มันโผล่มาทันทีที่ซอย
  // หรือลากขอบชิ้นแรก แล้วดันไทม์ไลน์ที่กำลังเล็งอยู่ให้เลื่อนลงทั้งแถบ  เรื่องเดียว
  // กันนี้บอกไว้แล้วสองที่ที่ไม่ดันหน้า: บล็อกที่ขอบถูกแก้ติดสี .cut ในราง และ
  // บรรทัด "▌ แก้ขอบไปแล้ว N ชิ้น" ที่ท้ายการ์ดไทม์ไลน์ ซึ่งอยู่ *ใต้* รางอยู่แล้ว
  w.appendChild(el('p', 'note', 'ชิ้นที่กด ✕ ปิดไว้จะถูกข้ามอัตโนมัติ · '
    + 'คลิกชิ้นในไทม์ไลน์ข้างล่างเพื่อกระโดดไปเล่นตรงนั้น · '
    + 'ชิ้นที่เพิ่งซอยหรือเพิ่งลากขอบจะเล่นจากไฟล์ต้นฉบับให้ก่อน '
    + '(ตำแหน่งถูกต้อง แต่ภาพยังไม่ผ่านฟิลเตอร์และเสียงยังไม่ปรับระดับ)'));
  return w;
}

// คลิกชิ้นในไทม์ไลน์ → กระโดดไปเล่นตรงนั้น (เฉพาะโหมดที่ต่อชิ้นเอง)
// ให้ตัวเล่นกระโดดไปที่ชิ้นนี้ · play=true คือให้เริ่มเล่นเลยไม่ว่าก่อนหน้าจะหยุดอยู่
//
// โหมด "ไฟล์ที่ต่อแล้ว" ไม่มีแนวคิดเรื่องชิ้น จึงแปลงเป็นเวลาบนไทม์ไลน์รวมแทน —
// ตำแหน่งจะเพี้ยนถ้าไทม์ไลน์ถูกแก้หลังต่อไฟล์ ซึ่งการ์ดตัวเล่นเตือนไว้อยู่แล้ว
function pvGotoPiece(x, play){
  if (!PV || !PV.node) return false;
  if (PV.mode === 'file'){
    if (pvFileWhy()) return false;      // ไฟล์ไม่ตรงกับไทม์ไลน์ ตำแหน่งที่คำนวณได้ก็ผิด
    const on = tlOn(), base = tlBase(), j = on.indexOf(x);
    if (j < 0) return false;
    if (!PV.el.vf.src) PV.el.vf.src = '/out';
    const go = () => { PV.el.vf.currentTime = base[j];
                       if (play) pvPlay(); };
    if (PV.el.vf.readyState >= 1) go();
    else PV.el.vf.addEventListener('loadedmetadata', go, {once: true});
    return true;
  }
  const cs = pvChunks();
  const i = cs.findIndex(ch => ch.p === x);
  if (i < 0) return false;
  if (play) PV.playing = true;
  if (pvStreaming()){
    if (pvStreamMissing()) return false;
    pvStreamStart(i, play || PV.playing);
    return true;
  }
  pvLoadChunk(i, 0, play || PV.playing);
  return true;
}

// ── ดึงตัวเล่นให้ตรงกับไทม์ไลน์ที่เพิ่งถูกแก้ ──────────────────────
//
// ทุกท่าแก้ (C ซอย · D ลบ · F ย้อน · ลากขอบ · ย้ายตำแหน่ง) แก้ items[] แล้วเรียก
// render() ซึ่งวาดใหม่แค่ป้ายกับปุ่ม — ตัว <video> ยังถือไฟล์เดิมค้างอยู่ที่ตำแหน่ง
// เดิม อาการที่ได้จริงคือ:
//
//   ลบชิ้นที่กำลังเล่น  → ชิ้นนั้นเล่นต่อจนจบครบทั้งภาพและเสียง เหมือนไม่ได้ลบ
//   ลากขอบชิ้นที่ตัดไว้ → ต้องสลับไปเล่นจากไฟล์ต้นฉบับ (pvRaw) แต่ไม่มีใครสั่งโหลด
//                        ใหม่ จึงยังได้ยินขอบเดิม แถม ch.from เปลี่ยนจาก 0 เป็น
//                        p.start ทำให้ pvProgress คำนวณเวลาติดลบ หัวอ่านดีดกลับต้นเรื่อง
//   PV.ci เป็นเลขดัชนี  → ลบชิ้นทีนึงรายการเลื่อนทั้งแถว เลขเดิมชี้คนละชิ้นกับที่ดัง
//                        อยู่ pvTick เลยเทียบขอบผิดตัวแล้วข้ามท่อนมั่ว
//
// ยึด **เวลาบนไทม์ไลน์** (PV.gt) เป็นหลัก ไม่ใช่เลขชิ้น — ลบชิ้นตรงหัวอ่านแล้ว
// ชิ้นถัดไปเลื่อนมาแทนที่เวลาเดิมพอดี เคาะ D รัว ๆ ไล่ตัดของที่ไม่เอาได้โดยเสียง
// ไม่กระโดดและไม่ต้องเล็งใหม่ทุกครั้ง
function pvResync(){
  // isConnected เพราะตอนไทม์ไลน์ถูกล็อก (composeLock) ตัวเล่นถูกถอดออกจากหน้าไป
  // แล้ว PV.node ยังลอยอยู่ข้างนอก — ไปสั่งโหลดชิ้นใส่มันตอนนั้นไม่มีประโยชน์
  if (!PV || !PV.node || !PV.node.isConnected || !tlStep()) return;
  // แก้ไทม์ไลน์ทีเดียวไฟล์ที่ต่อไว้ก็เป็นของเก่าทันที — เด้งออกจากโหมดนั้นไปเลย
  // แทนที่จะค้างอยู่แล้วให้การ์ดงอกกล่องเตือนสามบรรทัดพร้อมปุ่มขึ้นมาดันไทม์ไลน์
  pvDropStaleFile();
  if (PV.mode === 'file'){ pvSync(); return; }   // ไฟล์ยังตรงอยู่ ไม่มีอะไรต้องตาม

  const cs = pvChunks();
  if (!cs.length){ pvPause(); pvClearAll(); PV.ci = 0; PV.stok = null; pvSync(); return; }
  const base = pvBase(cs), tot = pvTotal(cs);

  if (pvStreaming()){
    if (pvStreamMissing()){ pvSync(); return; }         // pvSync ถอดสายทิ้งให้แล้ว
    if (PV.stok && PV.stok.key === pvSegKey()){ pvSync(); return; }   // สายเดิมยังตรง
    PV.stok = null;
    return pvStreamReflow();
  }

  const v = pvActive();
  // ชิ้นที่ *ดังอยู่ในลำโพงตอนนี้* คือ PV.cp ไม่ใช่ cs[PV.ci] — ลบชิ้นทีนึงรายการ
  // เลื่อนทั้งแถว เลขดัชนีเดิมชี้ไปคนละใบทันทีทั้งที่ยังไม่มีอะไรถูกโหลดใหม่
  let k = PV.cp ? cs.findIndex(c => c.p === PV.cp) : -1;
  let off;
  if (k >= 0){
    // ชิ้นเดิมยังอยู่ (แค่ถูกย้ายที่ หรือถูกลากขอบ) — เล่นต่อจากตรงที่ค้างไว้ในใบเดิม
    off = Math.max(0, (v.currentTime || 0) - (PV.cfrom || 0));
  } else {
    // ชิ้นเดิมหายไปแล้ว (กด D หรือ ✕) — ไปเริ่ม *ต้น* ใบที่เลื่อนมาแทนที่เวลาเดิม
    // ไม่ใช่กระโดดเข้ากลางใบใหม่ตามวินาทีที่ค้างไว้ ซึ่งจะกินหัวประโยคของใบใหม่หายไป
    const t = Math.max(0, Math.min(tot - 0.05, PV.gt || 0));
    k = 0; while (k + 1 < cs.length && base[k + 1] <= t) k++;
    off = 0;
  }
  const ch = cs[k];
  off = Math.min(off, Math.max(0, ch.to - ch.from - 0.05));
  // หัวอ่านกับแถบเลื่อนต้องตรงเดี๋ยวนั้น ไม่ใช่รอ timeupdate ครั้งหน้า (ตอนหยุดอยู่
  // ไม่มี timeupdate มาให้รอด้วยซ้ำ)
  pvProgress(tot ? (base[k] + off) / tot : 0, base[k] + off, tot);

  // ยังไม่เคยเริ่มเล่นเลย = ไม่ต้องโหลดอะไรมารอ แค่ให้เลขชิ้นตรงก็พอ
  if (!v.src && !PV.playing){ PV.ci = k; PV.cp = ch.p; PV.cfrom = ch.from; pvSync(); return; }
  // ถือไฟล์เดิมอยู่ที่ตำแหน่งเดิมพอดี = ไม่ต้องรื้อ เสียงไม่สะดุดเลย — เข้าเคสนี้ทั้ง
  // การย้ายชิ้นอื่น การลบชิ้นอื่น และการลากขอบ *ท้าย* ใบที่กำลังเล่นอยู่ (ขอบใหม่
  // มีผลทันทีผ่าน pvTick เพราะมันอ่าน ch.to สด ๆ ทุกครั้ง)
  if (PV.ci === k && v.src.endsWith(pvSrc(ch.p))
      && Math.abs(v.currentTime - (ch.from + off)) < 0.05){
    PV.cp = ch.p; PV.cfrom = ch.from;
    pvPreloadNext(); pvSync(); return;
  }
  pvLoadChunk(k, off, PV.playing);
}

// ต่อสายสตรีมใหม่หลังไทม์ไลน์เปลี่ยน — หยุดเสียงทันที แล้วค่อยต่อสายทีหลัง
//
// การต่อสายใหม่ต้องปลุก ffmpeg ตัวใหม่ทุกครั้ง ถ้าสั่งทุกครั้งที่กด D ระหว่างไล่
// ตัดรัว ๆ จะได้ ffmpeg โผล่มาแล้วถูกฆ่าทิ้งเป็นสิบตัวติด ๆ กัน  แต่เสียงของชิ้นที่
// เพิ่งลบต้องเงียบ *เดี๋ยวนั้น* ไม่ใช่รอ — จึงแยกเป็นสองจังหวะ: หยุดทันที
// แล้วรอให้มือนิ่งก่อนค่อยต่อสายเดียวจากชิ้นที่หัวอ่านชี้อยู่
const PV_RESTREAM_MS = 400;
let pvReTimer = 0;
function pvStreamReflow(){
  // ถอดสายเก่าทิ้งเลย ไม่ใช่แค่ pause — ระหว่างรอ 400 ms ถ้าคนเคาะ Space พอดี
  // pvPlay จะเห็นว่า vs.src ยังอยู่แล้วสั่งเล่นสายเก่าต่อ ได้ยินชิ้นที่เพิ่งลบอีกรอบ
  try { PV.el.vs.pause(); } catch (_){}
  PV.el.vs.removeAttribute('src'); PV.el.vs.load();
  clearTimeout(pvReTimer);
  pvReTimer = setTimeout(() => {
    pvReTimer = 0;
    if (!PV || !PV.node || !PV.node.isConnected || !tlStep() || !pvStreaming()) return;
    const cs = pvChunks();
    if (!cs.length || pvStreamMissing()) return;
    const base = pvBase(cs);
    const t = Math.max(0, Math.min(pvTotal(cs) - 0.05, PV.gt || 0));
    let i = 0; while (i + 1 < cs.length && base[i + 1] <= t) i++;
    pvStreamStart(i, PV.playing);
  }, PV_RESTREAM_MS);
  pvSync();
}

// เรียกแทน render() ทุกครั้งที่ "แก้ไทม์ไลน์" — วาดหน้าใหม่แล้วดึงตัวเล่นตามไปด้วย
function tlChanged(){ render(); pvResync(); }

// แถบเลื่อนตามหัวอ่านตอนกำลังเล่น — เลื่อนก็ต่อเมื่อหัวอ่านจะหลุดขอบจอแล้ว
// จะได้ไม่แย่งการเลื่อนมือของคนดูตลอดเวลา
function tlFollow(){
  const w = document.querySelector('.tlwrap');
  if (!w || !PV || !PV.playing) return;
  const x = (PV.gt || 0) * tlZoom;
  if (x < w.scrollLeft + 40 || x > w.scrollLeft + w.clientWidth - 40){
    w.scrollLeft = Math.max(0, x - w.clientWidth / 2);
    tlScroll = w.scrollLeft;
  }
}

// เคาะ Space = เล่น/หยุด — แป้นเดียวที่โปรแกรมตัดต่อทุกตัวใช้ตรงกัน
//
// ดักที่ document เพราะหลังคลิกบล็อกในไทม์ไลน์ โฟกัสยังอยู่ที่ body (บล็อกเป็น
// <div> ไม่ใช่ปุ่ม) ถ้าผูกไว้กับตัวเล่นอย่างเดียวจะไม่ได้ยินอะไรเลย
//
// เว้นไว้ให้ของเดิมทำงานเมื่ออยู่ในช่องกรอก — <input> รวมถึง checkbox ที่ Space
// คือวิธีติ๊กทางเดียว · <textarea> · <select> · ช่องแก้ข้อความ — และเมื่อมีกล่อง
// โต้ตอบเปิดอยู่  ส่วนตอนโฟกัสค้างอยู่บนปุ่มเราแย่งมาเลย เพราะคนเคาะ Space หลัง
// กดปุ่มไปหมาด ๆ ต้องการให้หนังหยุด ไม่ใช่ให้ปุ่มนั้นทำงานซ้ำ — Enter ยังกดปุ่ม
// ได้ตามปกติ คนที่ใช้แป้นพิมพ์อย่างเดียวจึงไม่เสียทางเข้าถึง
//
// preventDefault จำเป็น: ค่าเริ่มต้นของ Space คือเลื่อนหน้าลงหนึ่งจอ และในโหมด
// "ไฟล์ที่ต่อแล้ว" ที่ <video> มี controls จริง เบราว์เซอร์จะสั่งเล่น/หยุดเองอีกที
// กลายเป็นสองครั้งซ้อนแล้วกลับมาเหมือนไม่ได้กด
// แป้นลัดใช้ได้ไหมตอนนี้ — ใช้ร่วมกันทุกแป้น (Space · C · D · F)
function keyFree(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return false;
  return !document.querySelector('dialog[open]');
}

function pvKey(e){
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (!keyFree(e)) return;
  if (!PV || !PV.node || !PV.node.isConnected) return;   // ไม่ได้อยู่หน้าที่มีตัวเล่น
  if (PV.el.play.disabled) return;                       // ยังไม่มีอะไรให้เล่น
  e.preventDefault();
  pvToggle();
}
document.addEventListener('keydown', pvKey);

function playerCard(){
  pvInit();
  if (!PV.node) pvBuild();
  pvSync();
  return PV.node;
}

// เวลานาฬิกาจาก unix time — คนละเรื่องกับ hhmm() ข้างบนที่แปลง "จำนวนวินาที"
const clockOf = ts => { if (!ts) return '—';
  const d = new Date(ts * 1000);
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

// ── ไทม์ไลน์แบบแถบแนวนอน — แก้ไขได้จริง ────────────────────────────
//
// สิ่งที่ทำได้: ย้ายตำแหน่ง · ลากขอบย่อ/ขยาย · ซอยเป็นสองท่อน (cut ชนเพิ่ม)
//
// ราคาไม่เท่ากัน และหน้าจอต้องบอกให้รู้: **ย้ายที่ไม่ต้องตัดใหม่เลย** เพราะ
// seg_key ไม่มีคำว่าลำดับอยู่ในนั้น · ส่วนขยับขอบกับซอยชิ้นทำให้แฮชเปลี่ยน
// ต้องตัดชิ้นนั้นใหม่ (~1.1 วิ/ชิ้น) แถบจึงติดธง ▌ ให้ชิ้นที่ยังไม่มีไฟล์รองรับ
//
// ทุกอย่างเป็น "ร่าง" จนกว่าจะกดบันทึก — items[] ในเบราว์เซอร์เท่านั้นที่เปลี่ยน
// edl.json ยังเป็นของเดิมจนกด "บันทึกไทม์ไลน์"

let tlView = 'list';
let tlZoom = 14;                      // พิกเซลต่อวินาที
const TL_MIN = 0.30;                  // ชิ้นสั้นสุด — ตรงกับ MIN_PIECE ฝั่งเซิร์ฟเวอร์
// ⌘+ล้อ เลื่อนเร็วกว่าที่ล้อส่งมา 2.5 เท่า — ที่ซูมปกติหนัง 24 นาทีกว้างสองหมื่น
// พิกเซล เลื่อน 1:1 ต้องหมุนล้อเป็นร้อยครั้งกว่าจะถึงท้ายเรื่อง
const TL_WHEEL = 2.5;
let tlDrag = null;
// ตำแหน่งที่เลื่อนแถบไว้ — render() ล้าง #body ทั้งก้อนทุกครั้ง .tlwrap จึงเกิดใหม่
// เสมอและกลับไปอยู่ที่ 0 ถ้าไม่จำไว้เอง คนเลื่อนไปดูนาทีที่ 12 แล้วคลิกชิ้นเดียว
// แถบจะเด้งกลับไปต้นเรื่องทันที
let tlScroll = 0;

// ── ไทม์ไลน์ที่เห็นอยู่ ยังตรงกับค่าที่ตั้งไว้ข้างบนไหม ──────────────
//
// ตัวเล่นกับการแก้ไทม์ไลน์ทำงานกับ "ผลของการจัดครั้งล่าสุด" เสมอ ถ้าเพิ่งไปแก้
// วิธีเลือกชิ้นหรือวิธีเรียงไว้แล้วยังไม่ได้กด "จัดใหม่" สิ่งที่เห็นอยู่คือของ
// รอบก่อน — เล่นดูก็ไม่ใช่หนังที่จะได้ และแก้ขอบชิ้นไปก็จะถูกทับทิ้งทั้งหมด
// ตอนกดจัดใหม่อยู่ดี เพราะ decide เขียน edl.json ใหม่หมดทั้งไฟล์
//
// ดูจาก tier ของค่าที่แก้ ไม่ใช่ชื่อคีย์ — tier 'edl' แปลว่า "แก้แล้วต้อง decide
// ใหม่" ซึ่งครอบคลุมทั้ง compose.* order.* และ ai.enabled ที่ชื่อไม่ได้ขึ้นต้น
// เหมือนกันเลย  ส่วนค่าพวก encode.* (tier 'render') แก้แล้วไทม์ไลน์ไม่ขยับ
// เปลี่ยนแค่หน้าตาไฟล์ที่ได้ จึงไม่ล็อก
function composeLock(){
  if (!items.length) return 'ยังไม่เคยจัดไทม์ไลน์';
  if (!D || !D.fields) return '';
  const n = Object.keys(edits).filter(k => {
    const f = D.fields.find(x => x.key === k);
    return f && f.tier === 'edl';
  }).length;
  return n ? `แก้ค่าที่ใช้จัดไทม์ไลน์ไว้ ${n} อย่าง แต่ยังไม่ได้จัดใหม่` : '';
}

// ด่านเดียวที่ทุกการแก้ไทม์ไลน์ต้องผ่าน — ปุ่มถูกปิดไว้อยู่แล้วแต่แป้นลัดกับ
// การลากเมาส์เข้ามาทางอื่น จึงต้องกันตรงนี้ด้วย ไม่ใช่กันแค่ที่หน้าตา
function tlEditable(){
  const why = composeLock();
  if (why) toast(`แก้ไทม์ไลน์ไม่ได้ตอนนี้ — ${why}`, true);
  return !why;
}

// ปุ่มที่ต้องไปกดชื่อว่าอะไร — โหมดที่ใช้ AI ปุ่มเขียนคนละคำ
const composeLabel = () => {
  const f = ((D && D.fields) || []).find(x => x.key === 'compose.mode') || {};
  return (f.ai_options || []).includes(val('compose.mode') || 'all')
    ? 'ให้ AI จัดให้' : 'จัดใหม่';
};

const tlOn = () => items.filter(x => !x.off);
function tlBase(){ let t = 0; return tlOn().map(x => { const b = t; t += x.dur; return b; }); }

// ── ประวัติการแก้ (ย้อนได้) ──────────────────────────────────────
//
// เก็บเป็นภาพนิ่งของ items[] ทั้งชุด ไม่ใช่ "รายการสิ่งที่ทำ" ที่ต้องเขียนวิธี
// ทำย้อนกลับให้ทุกท่า — ชิ้นละไม่กี่ตัวเลข 397 ชิ้นก็ยังเบากว่าความซับซ้อนของ
// การ undo แบบสมมาตร (ซอยแล้วลากขอบต่อ แล้วย้าย แล้วค่อยย้อน — ท่าผสมพวกนี้
// พังง่ายมาก)  จำกัดไว้ TL_HIST_MAX ครั้งกันกินหน่วยความจำไม่รู้จบ
//
// ทุกอย่างยังเป็นร่างในเบราว์เซอร์เหมือนเดิม — ย้อนกี่ครั้งก็ไม่แตะ edl.json
const TL_HIST_MAX = 60;
let tlHist = [];
// กองที่ย้อนไปแล้ว — รอให้กด G เอากลับคืน (ล้างทิ้งทันทีที่แก้อะไรใหม่ เพราะ
// พอแตกเส้นทางแล้ว "อนาคต" ที่เก็บไว้ไม่ใช่อนาคตของเส้นนี้อีกต่อไป)
let tlFuture = [];

// เรียก *ก่อน* ลงมือแก้เสมอ และเรียกก็ต่อเมื่อจะแก้จริงแล้วเท่านั้น
// (ถ้า snap ไว้ก่อนตรวจเงื่อนไข กด C บนชิ้นสั้น ๆ ที่ซอยไม่ได้จะได้ประวัติเปล่า
//  ค้างไว้ พอกด F ทีนึงก็เหมือนไม่มีอะไรเกิดขึ้น)
const tlShot = what => ({what, sel,
                         items: items.map(x => ({...x, o: x.o ? {...x.o} : null}))});

function tlSnap(what){
  tlHist.push(tlShot(what));
  if (tlHist.length > TL_HIST_MAX) tlHist.shift();
  tlFuture = [];        // แก้ของใหม่ = แตกเส้นทาง ของที่ย้อนไว้ทำซ้ำไม่ได้แล้ว
}

// ภาพนิ่งที่เก็บไว้คือ "สภาพก่อนทำ what" เสมอ ย้อนกับทำซ้ำจึงเป็นการสลับภาพนิ่ง
// ข้ามกองกันไปมา โดยยกป้ายชื่อของท่านั้นติดไปด้วย — ปุ่มถึงบอกได้ว่าครั้งถัดไป
// จะย้อน/ทำซ้ำ "อะไร" ไม่ใช่บอกแค่ว่ามีอะไรให้กด
function tlUndo(){
  if (!tlEditable()) return;
  const s = tlHist.pop();
  if (!s) return toast('ไม่มีอะไรให้ย้อนแล้ว', true);
  tlFuture.push(tlShot(s.what));
  items = s.items; sel = s.sel;
  // ไม่เด้งข้อความบอกว่าย้อนอะไรไป — ไทม์ไลน์เปลี่ยนให้เห็นอยู่แล้ว และปุ่ม ↶ บอก
  // ไว้ในคำบรรยายว่าครั้งถัดไปจะย้อนอะไร  ท่านี้กดรัว ๆ ข้อความจึงบังจอตลอดเวลา
  tlChanged();
}

// G — เอาที่เพิ่งย้อนไปกลับคืนมา
function tlRedo(){
  if (!tlEditable()) return;
  const s = tlFuture.pop();
  if (!s) return toast('ไม่มีอะไรให้ทำซ้ำ — กด F ย้อนอะไรไปก่อน', true);
  tlHist.push(tlShot(s.what));
  if (tlHist.length > TL_HIST_MAX) tlHist.shift();
  items = s.items; sel = s.sel;
  tlChanged();
}

// ชิ้นที่หัวอ่านทาบอยู่ตอนนี้ — เป้าหมายของทั้งปุ่มตัดและปุ่มลบ
//
// ใช้หัวอ่านไม่ใช่ "ชิ้นที่คลิกเลือกไว้" เพราะสองอย่างนี้ตรงกันอยู่แล้ว (คลิก
// บล็อกทีนึงตัวเล่นก็กระโดดไปชิ้นนั้น หัวอ่านจึงตามไปด้วย) แต่ตอนกำลังเล่นอยู่
// มีแค่หัวอ่านที่ยังเดินต่อ — เห็นตรงไหนไม่เอาก็เคาะ D ได้เลยโดยไม่ต้องหยุดก่อน
function tlAt(){
  const on = tlOn();
  if (!on.length) return null;
  const base = tlBase(), gt = (PV && PV.gt) || 0;
  let j = 0; while (j + 1 < on.length && base[j + 1] <= gt) j++;
  return on[j];
}

// C — ซอยชิ้นตรงหัวอ่านเป็นสองท่อน
function tlCutHere(){
  const x = tlAt();
  if (!x) return toast('ไม่มีชิ้นให้ตัด', true);
  tlSplit(x);
}

// D — เอาชิ้นตรงหัวอ่านออก (ยังไม่ลบทิ้งจริง แค่ปิดไว้ กด F คืนได้ทันที)
function tlDropHere(){
  if (!tlEditable()) return;
  const x = tlAt();
  if (!x) return toast('ไม่มีชิ้นให้ลบ', true);
  if (tlOn().length <= 1) return toast('ต้องเหลืออย่างน้อย 1 ชิ้น', true);
  tlSnap('ลบชิ้น');
  x.off = true;
  sel = items.indexOf(x);
  // ไม่ขยับหัวอ่าน — ชิ้นถัดไปเลื่อนมาแทนที่ตรงเวลาเดิมพอดี เคาะ D รัว ๆ เพื่อ
  // ไล่ตัดของที่ไม่เอาออกทีละชิ้นได้เลยโดยไม่ต้องเล็งใหม่ทุกครั้ง
  // (ไม่เด้งข้อความยืนยัน — บล็อกหายไปจากรางให้เห็นอยู่แล้ว ส่วนวิธีย้อนเขียนไว้
  //  ที่ปุ่ม ↶ กับบรรทัดแป้นลัดแล้ว ไม่ต้องบอกซ้ำทุกครั้งที่กด)
  tlChanged();
}

function tlSplit(x){
  if (!tlEditable()) return;
  const i = items.indexOf(x);
  if (i < 0 || x.dur < TL_MIN * 2) return toast(`ชิ้นสั้นเกินกว่าจะซอย (ต้องยาวกว่า ${TL_MIN * 2} วิ)`, true);
  tlSnap('ซอยชิ้น');
  // ซอยตรงหัวอ่านถ้าหัวอ่านอยู่ในชิ้นนี้ ไม่งั้นซอยกลางชิ้น
  let at = x.start + x.dur / 2;
  const b = tlBase(), j = tlOn().indexOf(x);
  if (j >= 0 && PV && PV.gt != null && PV.gt > b[j] && PV.gt < b[j] + x.dur)
    at = x.start + (PV.gt - b[j]);
  at = Math.min(x.end - TL_MIN, Math.max(x.start + TL_MIN, +at.toFixed(3)));
  const right = {...x, o: {...x.o}, start: at, dur: +(x.end - at).toFixed(3)};
  x.end = at; x.dur = +(at - x.start).toFixed(3);
  items.splice(i + 1, 0, right);
  sel = i;
  tlChanged();
}

function tlTrim(x, side, dt){
  if (side === 'l'){
    const lo = 0, hi = x.end - TL_MIN;
    x.start = Math.min(hi, Math.max(lo, +(x.start + dt).toFixed(3)));
  } else {
    const lo = x.start + TL_MIN, hi = x.clip_dur != null ? x.clip_dur : x.end;
    x.end = Math.min(hi, Math.max(lo, +(x.end + dt).toFixed(3)));
  }
  x.dur = +(x.end - x.start).toFixed(3);
}

// ── ซูมไทม์ไลน์ ──────────────────────────────────────────────────
//
// ซูมโดย **ตรึงหัวอ่าน (เส้นสีส้ม) ไว้กับที่** — ตัวชี้เมาส์อยู่ตรงไหนไม่เกี่ยว
// เพราะสิ่งที่กำลังทำงานด้วยจริง ๆ คือจุดที่หนังเล่นถึง: ปุ่ม C ซอยตรงนั้น ปุ่ม D
// ลบชิ้นตรงนั้น พอซูมเข้าไปดูละเอียดแล้วเส้นส้มต้องยังอยู่ที่เดิมบนจอ ไม่งั้น
// ซูมเข้าทีนึงก็ต้องไล่หาเส้นใหม่ทุกครั้ง — ปุ่ม − + ก็ใช้จุดตรึงเดียวกัน
//
// ถ้าเส้นส้มไม่ได้อยู่ในจอตอนนั้น (เลื่อนไปดูที่อื่นอยู่) ให้ดึงมาไว้กลางจอเลย
// ตรึงไว้ที่เดิมทั้งที่มองไม่เห็นก็ไม่ได้ช่วยอะไร
const TL_ZOOM_MIN = 1.5, TL_ZOOM_MAX = 240;

function tlZoomAt(factor){
  const w = document.querySelector('.tlwrap');
  const z0 = tlZoom;
  const z1 = Math.max(TL_ZOOM_MIN, Math.min(TL_ZOOM_MAX, z0 * factor));
  if (Math.abs(z1 - z0) < 1e-6) return;
  tlZoom = z1;
  if (w){
    const t = (PV && PV.gt) || 0;                 // วินาทีที่หัวอ่านชี้อยู่
    const px0 = t * z0 - w.scrollLeft;            // เส้นส้มห่างขอบซ้ายของกรอบเท่าไร
    const px = (px0 >= 0 && px0 <= w.clientWidth) ? px0 : w.clientWidth / 2;
    tlScroll = Math.max(0, t * z1 - px);
  }
  render();
}

// แทร็กแพดยิง wheel มาถี่ 60–120 ครั้งต่อวินาที ถ้าวาดใหม่ทุกครั้ง (397 บล็อก +
// ไม้บรรทัดอีกเป็นร้อยขีด) จะหน่วงจนซูมไม่ติดมือ — สะสมสัดส่วนไว้ก่อนแล้ววาด
// ครั้งเดียวต่อเฟรม ผลลัพธ์เท่ากันเป๊ะเพราะการซูมเป็นการคูณต่อกันไปเรื่อย ๆ
let tlZoomPend = 1, tlZoomRaf = 0;
function tlZoomWheel(factor){
  tlZoomPend *= factor;
  if (tlZoomRaf) return;
  tlZoomRaf = requestAnimationFrame(() => {
    tlZoomRaf = 0;
    const f = tlZoomPend; tlZoomPend = 1;
    tlZoomAt(f);
  });
}

// ⌘ + S ค้างไว้แล้วหมุนล้อ = ซูม  ต้องรู้ว่า S ถูกกดค้างอยู่ไหมตอนล้อหมุน
//
// ปล่อย ⌘ เมื่อไรก็ล้างธงทิ้งด้วย เพราะบน macOS ตอนกด ⌘ ค้าง เบราว์เซอร์มัก
// *ไม่ส่ง keyup ของปุ่มตัวอักษร* มาให้เลย ถ้าเชื่อ keyup ของ S อย่างเดียว ธงจะ
// ค้างเป็นจริงตลอดไป แล้ว ⌘+ล้อ ที่ควรเลื่อนซ้ายขวาจะกลายเป็นซูมไปทั้งหมด
let tlKeyS = false;
window.addEventListener('keydown', e => {
  if (e.code !== 'KeyS' && (e.key || '').toLowerCase() !== 's') return;
  tlKeyS = true;
  // ⌘+S ปกติคือ "บันทึกหน้าเว็บ" ของเบราว์เซอร์ — กล่องเซฟจะเด้งตั้งแต่ยังไม่ได้
  // หมุนล้อ ห้ามไว้เฉพาะตอนอยู่หน้าไทม์ไลน์แบบแถบ ที่อื่นยังเซฟหน้าได้ตามปกติ
  if (e.metaKey && tlStep() && tlView === 'strip') e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.code === 'KeyS' || e.key === 'Meta' || (e.key || '').toLowerCase() === 's')
    tlKeyS = false;
});
window.addEventListener('blur', () => { tlKeyS = false; });

function tlReset(x){ if (!x.o || !tlEditable()) return; tlSnap('คืนขอบเดิม');
                     x.start = x.o.start; x.end = x.o.end;
                     x.dur = +(x.end - x.start).toFixed(3); tlChanged(); }

// R — คืนขอบของชิ้นตรงหัวอ่าน (เป้าหมายเดียวกับ C กับ D)
function tlResetHere(){
  const x = tlAt();
  if (!x || !x.o || !tlCut(x)) return;
  tlReset(x);
}

// เปิด/ปิดชิ้น (ปุ่ม ✕ กับ ↺ ในรายการและในกล่องรายละเอียด) — ผ่านประวัติเหมือนกัน
function tlToggle(x){ if (!tlEditable()) return;
                      tlSnap(x.off ? 'ใส่ชิ้นกลับ' : 'ลบชิ้น'); x.off = !x.off; tlChanged(); }

function stripView(){
  const c = el('div', 'card');
  const on = tlOn(), base = tlBase();
  const total = on.reduce((a, b) => a + b.dur, 0);
  const cut = items.filter(x => !x.off && tlCut(x)).length;

  c.append(tlHead(on, total));

  // ── ไม้บรรทัด + ราง ──
  const scroll = el('div', 'tlwrap');
  const inner = el('div', 'tlinner');
  inner.style.width = Math.max(320, total * tlZoom) + 'px';

  const ruler = el('div', 'tlruler');
  const stepSec = tlZoom >= 60 ? 1 : tlZoom >= 25 ? 5 : tlZoom >= 10 ? 15
                : tlZoom >= 4 ? 60 : 300;
  for (let t = 0; t <= total; t += stepSec){
    const m = el('i'); m.style.left = (t * tlZoom) + 'px';
    m.append(el('span', null, mmss(t)));
    ruler.appendChild(m);
  }
  ruler.onclick = e => {
    const r = ruler.getBoundingClientRect();
    tlSeek(Math.max(0, (e.clientX - r.left) / tlZoom));
  };
  inner.appendChild(ruler);

  const track = el('div', 'tltrack');
  on.forEach((x, j) => track.appendChild(tlBlock(x, j, base[j])));
  const head = el('div', 'tlhead'); head.id = 'tl-head';
  head.style.left = ((PV && PV.gt ? PV.gt : 0) * tlZoom) + 'px';
  track.appendChild(head);
  // คลิกที่ว่างในราง (หรือโดนตัวหัวอ่านเอง) = ย้ายหัวอ่านมาตรงนั้น เหมือนไม้บรรทัด
  track.addEventListener('pointerdown', e => {
    if (e.target === track || e.target === head) tlSeekAt(e);
  });
  inner.appendChild(track);
  scroll.appendChild(inner);
  scroll.addEventListener('scroll', () => { tlScroll = scroll.scrollLeft; });
  // คืนตำแหน่งที่เลื่อนไว้หลังก้อนนี้ถูกใส่ลง DOM แล้ว (ตั้งตอนยังลอยอยู่ไม่ติด)
  requestAnimationFrame(() => { scroll.scrollLeft = tlScroll; });
  c.appendChild(scroll);

  // ⌘ + ล้อเมาส์ = เลื่อนไทม์ไลน์ซ้าย-ขวา
  //
  // ผูกไว้ที่ทั้งการ์ด ไม่ใช่แค่ตัวแถบ — ชี้อยู่ตรงปุ่มหรือคำอธิบายก็เลื่อนได้
  // ไม่ต้องเล็งให้โดนรางสูง 44px ก่อน
  //
  // passive:false เพราะต้อง preventDefault จริง ๆ: ค่าเริ่มต้นของ ⌘+ล้อ บน Chrome
  // คือย่อ-ขยายทั้งหน้า ถ้าไม่ห้ามไว้ ตัวหนังสือทั้งหน้าจะเล็กลงทุกครั้งที่เลื่อน
  // (ไม่แตะ Ctrl+ล้อ — บน macOS นั่นคือท่าซูมของระบบที่คนสายตาไม่ดีใช้จริง)
  c.addEventListener('wheel', e => {
    if (!e.metaKey) return;              // ไม่กด ⌘ ก็ปล่อยให้หน้าเลื่อนตามปกติ
    const w = c.querySelector('.tlwrap');
    if (!w) return;
    e.preventDefault();
    // ล้อบางตัวส่งมาเป็น "จำนวนบรรทัด" หรือ "จำนวนหน้า" ไม่ใช่พิกเซล
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? w.clientWidth : 1;
    // เอาแกนที่ขยับแรงกว่า — เมาส์ล้อเดียวมีแต่ deltaY ส่วนแทร็กแพดมีทั้งสองแกน
    const d = (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * unit;
    if (tlKeyS){
      // ⌘ + S + ล้อ = ซูม · หมุนขึ้น = เข้า หมุนลง = ออก (ทางเดียวกับซูมหน้าเว็บ)
      // คิดเป็นสัดส่วนต่อระยะที่หมุน ล้อหนึ่งคลิก (~100) จึงได้ราว 16%
      // ส่วนแทร็กแพดที่ส่งมาทีละนิดก็ได้ทีละนิด ไล่ระดับได้ละเอียด
      tlZoomWheel(Math.pow(1.0015, -d));
      return;
    }
    w.scrollLeft += d * TL_WHEEL;
    tlScroll = w.scrollLeft;
  }, {passive: false});

  c.append(el('p', 'note', 'คลิกบล็อก = เล่นชิ้นนั้นใน "ดูผลงาน" ทันที · '
    + 'ลากตัวบล็อก = ย้ายตำแหน่ง · ลากขอบซ้าย/ขวา = ย่อ-ขยาย · '
    + 'คลิกไม้บรรทัด = ย้ายหัวอ่าน'));
  c.append(el('p', 'note', '⌘ + ล้อเมาส์ = เลื่อนไทม์ไลน์ซ้าย-ขวา · '
    + '⌘ + S + ล้อเมาส์ = ซูมเข้า-ออก โดยตรึงหัวอ่าน (เส้นสีส้ม) ไว้กับที่ · '
    + '⌘ + คลิกตรงไหน = ย้ายหัวอ่านไปตรงนั้นทันที (คลิกทับตัวบล็อกได้เลย '
    + 'ไม่ต้องเล็งไม้บรรทัด)'));
  c.append(el('p', 'note', 'แป้นลัด — Space เล่น/หยุด · C ตัดตรงหัวอ่าน · '
    + 'D ลบชิ้นตรงหัวอ่าน · R คืนขอบเดิมของชิ้นตรงหัวอ่าน · '
    + 'F ย้อนการแก้ครั้งล่าสุด · G เอาที่เพิ่งย้อนกลับคืน '
    + '(ย้อน/ทำซ้ำได้ทั้งตัด ลบ ย้าย และย่อ-ขยาย ทีละครั้ง)'));
  // ชิ้นที่เพิ่งเพิ่มจากโฟลเดอร์ฟุตเทจติดธง ▌ ด้วยเหตุผลเดียวกับชิ้นที่ลากขอบ
  // (ยังไม่มีไฟล์ตัดรองรับ) แต่ไม่ได้ "แก้ขอบ" มา — แยกให้เห็นว่าอันไหนเป็นอันไหน
  const fresh = items.filter(x => !x.off && !x.o).length;
  if (cut)
    c.append(el('p', 'note warnnote',
      (fresh ? `▌ ยังไม่มีไฟล์ตัดรองรับ ${cut} ชิ้น (แก้ขอบ ${cut - fresh} · เพิ่มใหม่ ${fresh}) — `
             : `▌ แก้ขอบไปแล้ว ${cut} ชิ้น — `)
      + `กด "สร้างไฟล์" จะตัดใหม่ ${cut} ชิ้น (~${mmss(Math.round(cut * 2.3))})`));

  // ไม่มีกล่อง "เลือกอยู่ · …" ท้ายการ์ดแล้ว — มันโผล่มา หายไป และเปลี่ยนความสูงทุก
  // ครั้งที่ sel เปลี่ยน ซึ่งเกิดกับทุกท่าที่ใช้บ่อยที่สุด (คลิกบล็อก · C · D · F)
  // ทั้งหน้าเลยกระตุกตลอดเวลาที่กำลังไล่ตัด  ของที่เคยอยู่ในกล่องนั้นย้ายไปหมดแล้ว:
  // ปุ่มซอย/เอาออกคือ C กับ D อยู่แล้ว · คืนขอบเดิมย้ายไปแถบปุ่มบนสุด (R) ·
  // ช่วงที่ใช้กับข้อความถอดเสียงอ่านได้จาก tooltip ของบล็อกโดยไม่ต้องดันหน้า
  return c;
}

function tlHead(on, total){
  const w = el('div');
  const r1 = el('div', 'hd');
  r1.append(el('h3', null, `ไทม์ไลน์ — ${on.length} ชิ้น · ${mmss(total)}`),
            el('span', 'spacer'));
  const seg = el('div', 'seg');
  [['list', 'รายการ'], ['strip', 'แถบ']].forEach(([v, lab]) => {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', tlView === v);
    b.onclick = () => { tlView = v; render(); };
    seg.appendChild(b);
  });
  r1.append(seg);
  w.appendChild(r1);

  // ── สามปุ่มที่ทำงานกับชิ้นตรงหัวอ่าน — มีแป้นลัด C · D · F ตรงกัน ──
  const lock = composeLock();
  const bar = el('div', 'acts'); bar.style.marginTop = '.4rem';
  const cutb = el('button', 'sm', '✂ ตัด (C)');
  cutb.title = 'ซอยชิ้นที่หัวอ่านทาบอยู่เป็นสองท่อน (cut ชนเพิ่ม) — แป้น C';
  cutb.onclick = tlCutHere;
  const delb = el('button', 'sm', '✕ ลบ (D)');
  delb.title = 'เอาชิ้นที่หัวอ่านทาบอยู่ออกจากหนัง — แป้น D';
  delb.onclick = tlDropHere;
  const unb = el('button', 'sm', '↶ ย้อน (F)');
  unb.title = tlHist.length ? `ย้อน "${tlHist[tlHist.length - 1].what}" · ย้อนได้ ${tlHist.length} ครั้ง — แป้น F`
                            : 'ยังไม่มีอะไรให้ย้อน — แป้น F';
  unb.disabled = !tlHist.length;
  unb.onclick = tlUndo;
  const reb = el('button', 'sm', '↷ ทำซ้ำ (G)');
  reb.title = tlFuture.length
    ? `เอา "${tlFuture[tlFuture.length - 1].what}" กลับคืน · ทำซ้ำได้ ${tlFuture.length} ครั้ง — แป้น G`
    : 'ยังไม่มีอะไรให้ทำซ้ำ — ต้องกด F ย้อนอะไรไปก่อน';
  reb.disabled = !tlFuture.length;
  reb.onclick = tlRedo;
  // ย้ายมาจากกล่อง "เลือกอยู่ · …" ที่ถอดออกไปแล้ว — อยู่ตรงนี้ตลอดเวลาเหมือน C/D/F
  // จึงไม่ดันหน้าเวลาโผล่/หาย และทำกับชิ้นตรงหัวอ่านเหมือนกันทั้งสามปุ่ม
  const at = tlAt();
  const rsb = el('button', 'sm', '↺ คืนขอบเดิม (R)');
  // tlCut เป็นจริงตอน x.o หายไปด้วย จึงต้องเช็ค at.o ก่อนอ่านค่าในนั้นเสมอ
  const canReset = !!(at && at.o && tlCut(at));
  rsb.title = canReset
    ? `คืนขอบของ ${at.name} กลับเป็น ${at.o.start.toFixed(2)}–${at.o.end.toFixed(2)} วิ — แป้น R`
    : 'ชิ้นตรงหัวอ่านยังไม่ได้ถูกลากขอบ — แป้น R';
  rsb.disabled = !canReset;
  rsb.onclick = tlResetHere;
  bar.append(cutb, delb, unb, reb, rsb);
  // ปุ่มเพิ่มวิดีโออยู่เฉพาะขั้น 3 — ขั้น 4 กับ 5 ใช้ไทม์ไลน์ชุดเดียวกันก็จริง แต่
  // สองขั้นนั้น "ไม่ตัดอะไรใหม่" ตามนิยามของมัน เพิ่มชิ้นตรงนั้นจึงผิดที่
  let addb = null;
  if (step === 3){
    addb = el('button', 'sm', addOpen ? '＋ ปิดกล่องเพิ่มวิดีโอ' : '＋ เพิ่มวิดีโอ');
    addb.title = 'หยิบคลิปจากโฟลเดอร์ฟุตเทจมาแทรกในไทม์ไลน์นี้ '
      + 'โดยไม่ต้องกด "จัดใหม่" (ซึ่งจะล้างสิ่งที่แก้ไว้ทั้งหมด)';
    addb.setAttribute('aria-pressed', addOpen);
    addb.onclick = () => { if (addOpen) addShut(); else addOpen = true; render(); };
    bar.append(addb);
  }
  bar.append(el('span', 'spacer'));
  if (lock) [cutb, delb, unb, reb, rsb, addb].filter(Boolean).forEach(b => {
    b.disabled = true;
    b.title = `แก้ไม่ได้ตอนนี้ — ${lock}`;
  });

  const sv = el('button', 'sm', 'บันทึกไทม์ไลน์');
  sv.disabled = !tlDirty() || !!lock; sv.onclick = saveTimeline;
  // คนละเรื่องกับปุ่ม "ย้อน (F)" — อันนั้นย้อนร่างในเบราว์เซอร์ทีละครั้ง
  // อันนี้ทิ้งร่างทั้งหมดแล้วดึงไฟล์ฉบับที่บันทึกไว้ก่อนหน้าจากดิสก์กลับมา
  const ud = el('button', 'sm', '↺ คืนฉบับที่บันทึกไว้');
  ud.disabled = !!lock;
  ud.title = 'ทิ้งร่างที่แก้อยู่ แล้วกลับไปใช้ edl.json ฉบับก่อนการบันทึกครั้งล่าสุด';
  ud.onclick = async () => {
    if (tlDirty() && !confirm('ร่างที่แก้ไว้ยังไม่ได้บันทึก — ทิ้งแล้วดึงฉบับก่อนหน้ากลับมาไหม?'))
      return;
    try { await post('/api/undo'); tlHist = []; tlFuture = []; await load(true);
      toast('คืนฉบับที่บันทึกไว้แล้ว'); } catch(e){ toast(e.message, true); } };
  bar.append(sv, ud);

  if (tlView === 'strip'){
    const zo = el('button', 'ghost', '−'), zi = el('button', 'ghost', '+');
    zo.title = 'ซูมออก (หรือ ⌘ + S + ล้อเมาส์ลง)';
    zi.title = 'ซูมเข้า (หรือ ⌘ + S + ล้อเมาส์ขึ้น)';
    // ตรึงหัวอ่านไว้ ไม่ใช่ขอบซ้าย — กดซูมแล้วเส้นส้มต้องไม่หายไปจากจอ
    zo.onclick = () => tlZoomAt(1 / 1.6);
    zi.onclick = () => tlZoomAt(1.6);
    bar.append(el('span', 'note', 'ซูม'), zo, zi);
  }
  w.appendChild(bar);
  if (lock)
    w.appendChild(el('p', 'note warnnote',
      `🔒 ดูได้อย่างเดียว — ${lock} · กด "${composeLabel()}" ข้างบนก่อน `
      + 'แล้วจะกลับมาแก้ได้'));
  return w;
}

function tlBlock(x, j, at){
  const b = el('div', 'tlblk ' + x.kind + (items.indexOf(x) === sel ? ' sel' : '')
                     + (tlCut(x) ? ' cut' : ''));
  b.style.left = (at * tlZoom) + 'px';
  b.style.width = Math.max(2, x.dur * tlZoom) + 'px';
  b.title = `${x.name} · ${x.dur.toFixed(2)} วิ (${x.start.toFixed(2)}–${x.end.toFixed(2)} ของคลิป)`;
  if (x.dur * tlZoom > 34)
    b.append(el('span', 'tlname', x.name.replace(/^IMG_/, '')));
  ['l', 'r'].forEach(side => {
    const h = el('div', 'tlh tlh-' + side);
    h.onpointerdown = e => tlStart(e, x, 'trim', side);
    b.appendChild(h);
  });
  b.onpointerdown = e => { if (!e.target.classList.contains('tlh')) tlStart(e, x, 'move'); };
  return b;
}

function tlStart(e, x, kind, side){
  e.preventDefault();
  // ⌘ ค้างไว้ = กำลังหาตำแหน่ง ไม่ได้จะแก้ชิ้น — คลิกทับบล็อกได้เลยโดยไม่ต้อง
  // เล็งไม้บรรทัดบาง ๆ ข้างบน และไม่เผลอลากชิ้นเคลื่อนไปด้วย
  if (e.metaKey){ tlSeekAt(e); return; }
  // ล็อกอยู่ = ดูได้ เลือกดูรายละเอียดได้ แต่ลากขยับไม่ได้
  if (composeLock()){ sel = items.indexOf(x); render(); return; }
  sel = items.indexOf(x);
  const blk = e.target.closest ? e.target.closest('.tlblk') : null;
  tlDrag = {x, kind, side, x0: e.clientX, s0: x.start, e0: x.end, moved: false, blk};
  // setPointerCapture โยน NotFoundError ได้ถ้า pointer ถูกปล่อยไปแล้ว — ไม่ใช่
  // เรื่องคอขาดบาดตาย ตัวจับเหตุการณ์อยู่ที่ window อยู่แล้วจึงทำงานได้โดยไม่ต้องมี
  try { e.target.setPointerCapture(e.pointerId); } catch (_){}
  const move = ev => {
    const dpx = ev.clientX - tlDrag.x0;
    // เก็บภาพนิ่งตอนที่ *เริ่มขยับจริง* ไม่ใช่ตอนกดลง — คลิกเฉย ๆ เพื่อสั่งเล่น
    // ไม่ใช่การแก้ไทม์ไลน์ ถ้าเก็บทุกครั้งที่กด ประวัติจะเต็มไปด้วยของว่างเปล่า
    if (Math.abs(dpx) > 2 && !tlDrag.moved){
      tlDrag.moved = true;
      tlSnap(kind === 'trim' ? 'ย่อ-ขยาย' : 'ย้ายตำแหน่ง');
    }
    if (kind === 'trim'){
      tlDrag.x.start = tlDrag.s0; tlDrag.x.end = tlDrag.e0;
      tlTrim(tlDrag.x, side, dpx / tlZoom);
      // ระหว่างลากขยับแค่บล็อกที่ลากอยู่ — วาดใหม่ทั้งราง 397 บล็อกทุกครั้งที่
      // เมาส์ขยับจะหน่วงจนลากไม่ติดมือ ค่อยวาดเต็มทีเดียวตอนปล่อย
      if (tlDrag.blk){
        const on = tlOn(), base = tlBase(), j = on.indexOf(tlDrag.x);
        if (j >= 0){
          tlDrag.blk.style.left = (base[j] * tlZoom) + 'px';
          tlDrag.blk.style.width = Math.max(2, tlDrag.x.dur * tlZoom) + 'px';
        }
      } else render();
    } else {
      // ย้าย: หาว่าตอนนี้ตัวชี้อยู่เหนือช่องที่เท่าไร แล้วสลับไปตรงนั้น
      const on = tlOn(), base = tlBase();
      const me = on.indexOf(tlDrag.x);
      if (me < 0) return;
      const t = base[me] + dpx / tlZoom + tlDrag.x.dur / 2;
      let j = 0; while (j + 1 < on.length && base[j + 1] <= t) j++;
      if (j !== me){
        const from = items.indexOf(on[me]), to = items.indexOf(on[j]);
        const [m] = items.splice(from, 1);
        items.splice(to, 0, m);
        sel = items.indexOf(m);
        tlDrag.x0 = ev.clientX;
        render();
      }
    }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    const tapped = !tlDrag.moved;
    const piece = tlDrag.x;
    tlDrag = null;
    // วาดเต็มทีเดียวตอนปล่อย — และดึงตัวเล่นตามขอบใหม่ตอนนี้ที่เดียว ไม่ใช่ทุก
    // pointermove (ลากขอบทีนึงยิงเป็นร้อยครั้ง โหลดวิดีโอใหม่ทุกครั้งไม่ไหว)
    if (tapped) render(); else tlChanged();
    // คลิกเฉย ๆ (ไม่ได้ลาก) = สั่งให้ "ดูผลงาน" ไปเล่นชิ้นนั้นทันที
    if (tapped) pvGotoPiece(piece, true);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

// ── แป้นลัดของไทม์ไลน์: C ตัด · D ลบ · R คืนขอบ · F ย้อน ─────────
//
// อ่านจาก e.code ไม่ใช่ e.key — e.key คือ *ตัวอักษรที่พิมพ์ออกมา* ซึ่งเปลี่ยน
// ตามผังแป้นพิมพ์ ถ้าสลับเป็นภาษาไทยอยู่ ปุ่ม C จะให้ค่า "แ" ไม่ใช่ "c" แล้ว
// แป้นลัดจะเงียบสนิททั้งชุด ส่วน e.code ผูกกับตำแหน่งปุ่มจริงบนแป้น จึงตรงเสมอ
// (ยังเทียบ e.key ไว้เป็นทางสำรองสำหรับแป้นพิมพ์ที่ไม่ส่ง code มา)
const TL_KEYS = {
  KeyC: ['c', tlCutHere],
  KeyD: ['d', tlDropHere],
  KeyF: ['f', tlUndo],
  KeyG: ['g', tlRedo],
  KeyR: ['r', tlResetHere],
};

function tlKey(e){
  if (!tlStep() || e.repeat) return;           // ไทม์ไลน์อยู่ในขั้น 3 กับขั้น 4
  if (!keyFree(e)) return;
  const hit = TL_KEYS[e.code]
    || Object.values(TL_KEYS).find(([ch]) => (e.key || '').toLowerCase() === ch);
  if (!hit) return;
  if (!items.length) return;
  e.preventDefault();
  hit[1]();
}
document.addEventListener('keydown', tlKey);

// ย้ายหัวอ่านไปที่ "ตำแหน่งที่คลิก" — แปลงพิกัดจอเป็นวินาทีบนไทม์ไลน์
//
// วัดจาก .tlinner ไม่ใช่จากตัวที่ถูกคลิก เพราะทั้งไม้บรรทัด ราง และบล็อกทุกอัน
// อยู่บนระบบพิกัดเดียวกันที่เริ่มนับจากขอบซ้ายของ .tlinner — คลิกโดนอะไรก็ได้
// เวลาที่คำนวณได้ก็ยังตรงกัน
function tlSeekAt(e){
  const inner = e.target.closest && e.target.closest('.tlinner');
  if (!inner) return false;
  const r = inner.getBoundingClientRect();
  tlSeek(Math.max(0, (e.clientX - r.left) / tlZoom));
  return true;
}

// ย้ายหัวอ่านไปที่วินาทีที่ระบุ แล้วสั่งตัวเล่นตามไปด้วย
function tlSeek(t){
  if (PV) PV.gt = t;
  const h = document.getElementById('tl-head');
  if (h) h.style.left = (t * tlZoom) + 'px';
  if (PV && PV.node && PV.mode !== 'joins') pvSeek(t);
}

// ── เพิ่มวิดีโอจากโฟลเดอร์ฟุตเทจเข้าไทม์ไลน์ ────────────────────────
//
// เดิมทางเดียวที่จะเอาคลิปเข้าหนังได้คือกด "จัดใหม่" ซึ่ง compose เขียน edl.json
// ใหม่ทั้งไฟล์ — ลำดับที่ลากไว้ ขอบที่ลากไว้ ชิ้นที่ลบไว้ หายเรียบทั้งหมด แค่
// อยากได้คลิปเพิ่มหนึ่งตัวก็ต้องยอมทิ้งงานที่นั่งแก้มาทั้งวัน
//
// ตรงนี้เป็นทางที่สอง: หยิบคลิปจากโฟลเดอร์ฟุตเทจมาแทรกลง items[] ตรง ๆ แล้ว
// บันทึกผ่าน /api/edl เส้นเดียวกับการลากขอบ ซึ่ง apply_edit *อ่าน edl.json เดิม
// เข้ามาแล้วเขียนทับเฉพาะ timeline กับ summary* — config · params · compose · ai
// ที่อยู่ในไฟล์เดียวกันไม่ถูกแตะเลยสักคีย์ ค่าที่ตั้งไว้จึงไม่ถูกรีเซ็ต
//
// ชิ้นที่เพิ่งเพิ่มยังไม่มีไฟล์ segment รองรับ (o ว่าง → tlCut เป็นจริง) จึงติดธง ▌
// และถูกนับรวมในบรรทัด "กดสร้างไฟล์จะตัดใหม่กี่ชิ้น" ให้เองโดยไม่ต้องทำอะไรเพิ่ม
let addOpen = false;      // กล่องกางอยู่ไหม
let addName = '';         // คลิปที่เลือกอยู่ในกล่อง
let addQuery = '';        // คำค้นในรายการคลิป
let addRange = null;      // ช่วงที่จะตัดเอา {start, end} — วินาทีของคลิปต้นฉบับ
let addKind = 'BROLL';    // พูด/วิว ของชิ้นใหม่ — ตัวกำหนดเป้าความดังเสียง
let addWhere = 'head';    // แทรกตรงหัวอ่าน หรือต่อท้ายไทม์ไลน์
let addOnly = true;       // ตัวเล่นในกล่องหยุดที่ปลายช่วงที่เลือกไหม
let addVid = null;        // <video> ของกล่อง — เก็บไว้ใช้ซ้ำข้ามการวาดใหม่

// ปิดกล่อง — ต้องสั่งหยุดตัวเล่นด้วยมือ เพราะ render() แค่ถอดก้อน DOM ออกจากหน้า
// ตัว <video> ที่หลุดออกไปยังเล่นเสียงต่อทั้งที่ไม่มีอะไรให้เห็นแล้ว
function addShut(){
  if (addVid){ try { addVid.pause(); } catch (_){} }
  addVid = null; addOpen = false; addName = ''; addRange = null;
}

const addClip = () => ((CL && CL.clips) || []).find(c => c.name === addName) || null;

// เลือกคลิปในกล่อง — ตั้งช่วงตั้งต้นเป็นทั้งคลิป แล้วค่อยหุบเอาทีหลัง
// (คลิปคนละตัว = ตัวเล่นเดิมใช้ต่อไม่ได้ ต้องทิ้งแล้วสร้างใหม่)
function addPick(cl){
  if (addName !== cl.name && addVid){ try { addVid.pause(); } catch (_){} addVid = null; }
  addName = cl.name;
  addRange = {start: 0, end: +(+cl.dur).toFixed(3)};
}

// แทรกชิ้นใหม่ลงร่างไทม์ไลน์ — ผ่านประวัติเหมือนทุกท่า กด F ย้อนคืนได้ทันที
function tlAddPiece(cl, kind, where){
  if (!tlEditable()) return;
  const a = Math.max(0, +addRange.start.toFixed(3));
  const b = Math.min(+(+cl.dur).toFixed(3), +addRange.end.toFixed(3));
  const dur = +(b - a).toFixed(3);
  if (dur < TL_MIN)
    return toast(`ช่วงที่เลือกสั้นเกินไป ${dur.toFixed(2)} วิ (อย่างน้อย ${TL_MIN} วิ)`, true);
  tlSnap('เพิ่มวิดีโอ');
  // แทรก *ต่อจาก* ชิ้นตรงหัวอ่าน ไม่ใช่แทนที่ — เป้าหมายเดียวกับปุ่ม C กับ D
  const at = where === 'head' ? tlAt() : null;
  const j = at ? items.indexOf(at) + 1 : items.length;
  const prev = items[j - 1];
  items.splice(j, 0, {
    i: -1,                        // ยังไม่มีที่ในไฟล์ → tlDirty เห็นทันทีว่าร่างเปลี่ยน
    name: cl.name, kind,
    start: a, end: b, dur,
    clip_dur: +cl.dur,            // เพดานของการลากขอบขวาในแถบ
    orient: cl.orient, rot: cl.rot || '',
    text: '', motion: cl.motion, bright: cl.bright,
    // ตกอยู่ในบทเดียวกับชิ้นที่มันไปต่อท้าย ไม่งั้นรายการจะตัดหัวบทใหม่คั่นกลาง
    chapter: prev ? prev.chapter : '', chapter_title: prev ? prev.chapter_title : '',
    ai_score: null, gain: null, limiter: null,
    seg: null,                    // ยังไม่มีไฟล์ตัด — ตัวเล่นจะเปิดไฟล์ต้นฉบับให้แทน
    off: false,
    o: null,                      // ไม่มีขอบเดิม = ชิ้นใหม่ ต้องตัดไฟล์ให้ตอน "สร้างไฟล์"
  });
  sel = j;
  tlChanged();
  toast(`แทรก ${cl.name} ${dur.toFixed(2)} วิ แล้ว — กด "บันทึกไทม์ไลน์" เพื่อเขียนลง edl.json`);
}

function addCard(){
  const c = el('div', 'card');
  const hd = el('div', 'hd');
  hd.append(el('h3', null, 'เพิ่มวิดีโอจากโฟลเดอร์ฟุตเทจ'), el('span', 'spacer'));
  const cls = el('button', 'ghost', '✕');
  cls.title = 'ปิดกล่องนี้';
  cls.onclick = () => { addShut(); render(); };
  hd.append(cls);
  c.append(hd);
  c.append(el('p', 'note', 'แทรกคลิปเข้าไทม์ไลน์ที่แก้ค้างอยู่โดยไม่ต้องกด "จัดใหม่" '
    + '— ค่าที่ตั้งไว้ใน edl.json ไม่ถูกแตะสักคีย์ · ชิ้นที่เพิ่มยังเป็นร่างจนกว่า'
    + 'จะกด "บันทึกไทม์ไลน์"'));

  const all = (CL && CL.clips) || [];
  if (!all.length){
    c.append(el('p', 'note warnnote',
      'ยังไม่มีรายการคลิป — กด "อ่านคลิปทั้งโฟลเดอร์" ที่ขั้น 1 ก่อน'));
    return c;
  }

  // ── ช่องค้น + ตารางคลิป ──
  //
  // ไม่เรียก render() ตอนพิมพ์ — วาดใหม่ทั้งหน้าทุกตัวอักษรจะแย่งโฟกัสออกจากช่อง
  // และดึงตัวเล่นข้างล่างมาโหลดใหม่ทุกครั้ง วาดใหม่แค่ตารางกับกล่องรายละเอียดพอ
  const bar = el('div', 'acts');
  const q = el('input');
  q.type = 'search'; q.value = addQuery; q.placeholder = 'ค้นชื่อคลิป เช่น 7070';
  q.style.cssText = 'flex:1;min-width:11rem';
  const cnt = el('span', 'note');
  bar.append(q, cnt);
  c.append(bar);

  const grid = el('div', 'grid');
  grid.style.maxHeight = '17em';
  const detail = el('div');
  c.append(grid, detail);

  const shown = () => {
    const s = addQuery.trim().toLowerCase();
    return s ? all.filter(x => x.name.toLowerCase().includes(s)) : all;
  };

  function drawGrid(){
    const list = shown();
    grid.innerHTML = '';
    cnt.textContent = list.length === all.length
      ? `${all.length} คลิปในโฟลเดอร์`
      : `เจอ ${list.length} จาก ${all.length} คลิป`;
    if (!list.length){
      grid.append(el('p', 'note', 'ไม่มีคลิปที่ชื่อตรงกับคำค้น'));
      return;
    }
    list.forEach(x => {
      const used = items.filter(p => !p.off && p.name === x.name).length;
      const d = el('div', 'cl' + (x.name === addName ? ' sel' : ''));
      const img = el('img'); img.loading = 'lazy'; img.src = `/thumb/${x.name}.jpg`;
      img.alt = x.name; img.draggable = false;
      d.append(img);
      const tag = el('div', 'tag');
      if (x.orient === 'V') tag.append(el('span', 'b v', 'ตั้ง'));
      // คลิปที่ขั้น 1 ติ๊กออก ยังหยิบมาใส่ตรงนี้ได้ — ด่านตรวจของ /api/edl ถามแค่ว่า
      // "มีอยู่ใน manifest ไหม" ไม่ได้ถามว่าถูกเลือกไว้ไหม แต่ต้องบอกให้รู้ตัว
      if (!x.picked) tag.append(el('span', 'b', 'ไม่ได้เลือกไว้'));
      if (used) tag.append(el('span', 'b r', `ใช้ ${used}`));
      if (tag.children.length) d.append(tag);
      const cap = el('div', 'cap');
      cap.append(el('b', null, x.name.replace(/^IMG_/, '')),
                 el('span', null, (+x.dur).toFixed(1) + 'ว'));
      d.append(cap);
      d.style.cursor = 'pointer';
      d.title = `${x.name} · ยาว ${(+x.dur).toFixed(1)} วิ`
        + (used ? ` · อยู่ในหนังแล้ว ${used} ชิ้น` : '');
      d.onclick = () => { addPick(x); drawGrid(); drawDetail(); };
      grid.append(d);
    });
  }

  // ── กล่องรายละเอียด: ดูคลิป · เลือกช่วง · เลือกประเภท · เลือกจุดแทรก ──
  function drawDetail(){
    detail.innerHTML = '';
    const cl = addClip();
    if (!cl || !addRange){
      detail.append(el('p', 'note', 'กดเลือกคลิปข้างบนก่อน แล้วค่อยเลือกช่วงที่จะเอา'));
      return;
    }
    const total = +cl.dur;
    const s = el('div', 'sect'); s.style.marginTop = '.9rem';
    s.append(el('h4', null, `${cl.name} · ยาวทั้งคลิป ${total.toFixed(1)} วิ`));

    // หมุนตามที่ตั้งไว้ในขั้น 1 — ไฟล์ต้นฉบับยังไม่ผ่านฟิลเตอร์หมุน ถ้าไม่พลิกเอง
    // ตรงนี้ ภาพในกล่องจะตะแคงคนละทางกับที่จะได้จริงในหนัง
    const spin = cl.rot === 'transpose=1' ? ' r90' : cl.rot === 'transpose=2' ? ' r270'
               : cl.rot === 'transpose=1,transpose=1' ? ' r180' : '';
    const w = el('div', 'vwrap' + spin);
    if (!addVid){
      const v = el('video');
      v.controls = true; v.preload = 'metadata'; v.playsInline = true;
      v.src = `/clip/${cl.name}`;
      v.addEventListener('timeupdate', () => {
        // หยุดที่ปลายช่วงแล้วถอยกลับไปต้นช่วง — กดเล่นซ้ำเพื่อตรวจช่วงเดิมได้เลย
        // อ่านจาก addRange สด ๆ ไม่ใช่ค่าที่ปิดไว้ในคลอเชอร์ตอนสร้าง ไม่งั้นแก้
        // ตัวเลขแล้วตัวเล่นยังหยุดที่จุดเก่า
        if (addOnly && addRange && v.currentTime >= addRange.end){
          v.pause(); v.currentTime = addRange.start;
        }
      });
      v.onerror = () => { w.innerHTML = '';
        w.append(el('p', 'note', `เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ (codec ${cl.codec})`
          + ' — เลือกช่วงด้วยตัวเลขข้างล่างได้ตามปกติ')); };
      addVid = v;
    }
    w.append(addVid);
    s.append(w);

    // แถบบอกว่าช่วงที่เลือกอยู่ตรงไหนของคลิป — อ่านง่ายกว่าตัวเลขสองตัว
    const tr = el('div', 'track');
    const on = el('div', 'on');
    on.style.left = (addRange.start / Math.max(total, 0.01) * 100) + '%';
    on.style.width = ((addRange.end - addRange.start) / Math.max(total, 0.01) * 100) + '%';
    tr.append(on); s.append(tr);

    // ── ตัวเลขจุดเริ่ม/จุดจบ ──
    const num = (v0, on0) => {
      const i = el('input');
      i.type = 'number'; i.step = '0.1'; i.min = '0'; i.max = String(total.toFixed(2));
      i.value = v0.toFixed(2); i.style.width = '6.5rem';
      i.onchange = () => on0(parseFloat(i.value));
      return i;
    };
    const setStart = t => {
      if (!isFinite(t)) return drawDetail();
      addRange.start = Math.max(0, Math.min(addRange.end - TL_MIN, +t.toFixed(3)));
      drawDetail();
    };
    const setEnd = t => {
      if (!isFinite(t)) return drawDetail();
      addRange.end = Math.min(total, Math.max(addRange.start + TL_MIN, +t.toFixed(3)));
      drawDetail();
    };
    const rowA = el('div', 'acts');
    rowA.append(el('span', 'note', 'เริ่มที่'), num(addRange.start, setStart),
                el('span', 'note', 'วิ · จบที่'), num(addRange.end, setEnd),
                el('span', 'note', 'วิ'));
    s.append(rowA);

    const rowB = el('div', 'acts');
    const here = () => (addVid && isFinite(addVid.currentTime)) ? addVid.currentTime : null;
    const b1 = el('button', 'sm', '⇤ ตั้งจุดเริ่มจากตัวเล่น');
    b1.title = 'เอาเวลาที่ตัวเล่นค้างอยู่ตอนนี้เป็นจุดเริ่มของช่วง';
    b1.onclick = () => { const t = here(); if (t != null) setStart(t); };
    const b2 = el('button', 'sm', 'ตั้งจุดจบจากตัวเล่น ⇥');
    b2.title = 'เอาเวลาที่ตัวเล่นค้างอยู่ตอนนี้เป็นจุดจบของช่วง';
    b2.onclick = () => { const t = here(); if (t != null) setEnd(t); };
    const b3 = el('button', 'sm', '⟲ ทั้งคลิป');
    b3.onclick = () => { addRange = {start: 0, end: +total.toFixed(3)}; drawDetail(); };
    const b4 = el('button', 'sm', '▶ เล่นช่วงที่เลือก');
    b4.onclick = () => { if (!addVid) return;
      try { addVid.currentTime = addRange.start; addVid.play(); } catch (_){} };
    const lab = el('label', 'ck');
    const ck = el('input'); ck.type = 'checkbox'; ck.checked = addOnly;
    ck.onchange = () => { addOnly = ck.checked; };
    lab.append(ck, document.createTextNode('หยุดที่ปลายช่วง'));
    rowB.append(b1, b2, b3, b4, lab);
    s.append(rowB);
    s.append(el('p', 'note', `จะได้ชิ้นยาว ${(addRange.end - addRange.start).toFixed(2)} วิ`
      + ` จากคลิปยาว ${total.toFixed(1)} วิ`));

    // ── ประเภท · จุดแทรก ──
    const opts = el('div', 'acts'); opts.style.marginTop = '.7rem';
    const kseg = el('div', 'seg');
    [['TALK', 'พูด'], ['BROLL', 'วิว']].forEach(([v, t]) => {
      const b = el('button', null, t);
      b.setAttribute('aria-pressed', addKind === v);
      b.onclick = () => { addKind = v; drawDetail(); };
      kseg.append(b);
    });
    const wseg = el('div', 'seg');
    [['head', 'ต่อจากชิ้นตรงหัวอ่าน'], ['end', 'ต่อท้ายไทม์ไลน์']].forEach(([v, t]) => {
      const b = el('button', null, t);
      b.setAttribute('aria-pressed', addWhere === v);
      b.onclick = () => { addWhere = v; drawDetail(); };
      wseg.append(b);
    });
    opts.append(el('span', 'note', 'ประเภท'), kseg,
                el('span', 'note', 'แทรกที่'), wseg);
    s.append(opts);
    // เป้าความดังคนละตัวกันจริง ๆ — เลือกผิดแล้วชิ้นจะถูกดันไปคนละระดับกับรอบข้าง
    s.append(el('p', 'note', addKind === 'TALK'
      ? `ชิ้น "พูด" จะถูกปรับไปที่ ${val('audio.target_lufs_talk')} LUFS`
        + ' และถูกนับเป็นช่วงพูดตอนตรวจรอยต่อ'
      : `ชิ้น "วิว" จะถูกปรับไปที่ ${val('audio.target_lufs_broll')} LUFS`));

    const at = addWhere === 'head' ? tlAt() : null;
    s.append(el('p', 'note', addWhere === 'head'
      ? (at ? `แทรกต่อจาก "${at.name}" (ชิ้นที่หัวอ่านทาบอยู่ตอนนี้)`
            : 'ยังไม่มีชิ้นตรงหัวอ่าน — จะไปต่อท้ายไทม์ไลน์ให้')
      : `ไปต่อท้ายเป็นชิ้นที่ ${tlOn().length + 1}`));

    const go = el('div', 'acts');
    const add = el('button', 'primary',
      `＋ แทรกเข้าไทม์ไลน์ (${(addRange.end - addRange.start).toFixed(2)} วิ)`);
    add.onclick = () => { tlAddPiece(cl, addKind, addWhere); };
    go.append(add);
    go.append(el('span', 'note', 'ชิ้นที่เพิ่มยังไม่มีไฟล์ตัดรองรับ — '
      + 'ติดธง ▌ ไว้ และจะถูกตัดให้ตอนกด "สร้างไฟล์"'));
    s.append(go);
    detail.append(s);
  }

  q.oninput = () => { addQuery = q.value; drawGrid(); };
  drawGrid(); drawDetail();
  return c;
}

function timeline(){
  if (tlView === 'strip') return stripView();
  const c = el('div', 'card');
  const st = items.filter(x => !x.off);
  c.append(tlHead(st, st.reduce((a,b) => a + b.dur, 0)));

  const wrap = el('div', 'scroll'); wrap.style.maxHeight = '40em';
  let chap = ' ', ul = null;
  items.forEach((x, i) => {
    if (x.chapter !== chap){
      chap = x.chapter;
      if (chap){
        const h = el('div', 'chapter');
        h.append(el('h4', null, x.chapter_title || chap), el('hr'));
        wrap.appendChild(h);
      }
      ul = el('ul'); wrap.appendChild(ul);
    }
    if (!ul){ ul = el('ul'); wrap.appendChild(ul); }
    ul.appendChild(tlRow(x, i));
  });
  c.appendChild(wrap);
  return c;
}

function tlRow(x, i){
  const li = el('li', 'row' + (x.off ? ' off' : '') + (i === sel ? ' sel' : ''));
  li.append(el('div', 'idx', String(i + 1)));
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.draggable = true;
  img.src = `/thumb/${x.name}.jpg`;
  li.append(img);
  const mid = el('div', 'mid');
  const nm = el('div', 'name');
  nm.append(el('span', 'kind ' + x.kind, x.kind === 'TALK' ? 'พูด' : 'วิว'), x.name);
  mid.append(nm, el('div', 'sub', x.text || x.meaning
    || `motion ${x.motion ?? '—'} · สว่าง ${x.bright ?? '—'}`));
  li.append(mid);
  const acts = el('div', 'rowacts');
  acts.append(el('div', 'dur', x.dur.toFixed(1) + 'ว'),
              mk('↑', () => move(i, -1)), mk('↓', () => move(i, 1)),
              mk(x.off ? '↺' : '✕', () => tlToggle(x)));
  li.append(acts);
  if (composeLock()){
    [...acts.querySelectorAll('button')].forEach(b => { b.disabled = true; });
    img.draggable = false;
  }
  // คลิกชิ้น → ให้ตัวเล่นกระโดดไปตรงนั้นก่อน ถ้าโหมดปัจจุบันทำไม่ได้
  // (กำลังดูไฟล์ที่ต่อแล้ว หรือชิ้นนี้ยังไม่ได้ตัด) ค่อยตกไปเป็นภาพตัวอย่างชิ้นเดียว
  li.onclick = e => {
    if (e.target.tagName === 'BUTTON') return;
    sel = i; render();
    if (!pvGotoPiece(x, true)) previewPiece(x);
  };
  img.addEventListener('dragstart', e => { dragFrom = i; li.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move'; });
  img.addEventListener('dragend', () => { li.classList.remove('drag'); dragFrom = -1; });
  li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
  li.addEventListener('dragleave', () => li.classList.remove('over'));
  li.addEventListener('drop', e => {
    e.preventDefault(); li.classList.remove('over');
    if (dragFrom >= 0 && dragFrom !== i){
      if (!tlEditable()) return;
      tlSnap('ย้ายตำแหน่ง');
      const [m] = items.splice(dragFrom, 1); items.splice(i, 0, m); sel = i; tlChanged();
    }
  });
  return li;
}

function mk(label, fn){
  const b = el('button', 'ghost', label);
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}
function move(i, d){
  const j = i + d; if (j < 0 || j >= items.length) return;
  if (!tlEditable()) return;
  tlSnap('ย้ายตำแหน่ง');
  [items[i], items[j]] = [items[j], items[i]];
  if (sel === i) sel = j; else if (sel === j) sel = i;
  tlChanged();
}

function previewPiece(x){
  const box = $('#preview'); box.innerHTML = '';
  $('#side-prev').hidden = false;
  if (x.seg){
    const v = el('video'); v.controls = true; v.preload = 'metadata';
    v.src = `/seg/${x.seg}`; box.appendChild(v);
  } else {
    const i = el('img'); i.src = `/thumb/${x.name}.jpg`;
    i.style.cssText = 'width:100%;border-radius:5px'; box.appendChild(i);
  }
  const kv = [['คลิป', x.name],
              ['ช่วง', `${x.start.toFixed(2)} – ${(x.end ?? x.start + x.dur).toFixed(2)} วิ`],
              ['ยาว', x.dur.toFixed(2) + ' วิ'],
              ['ประเภท', x.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว']];
  if (x.meaning) kv.push(['ความหมาย', x.meaning]);
  if (x.chapter_title) kv.push(['บท', x.chapter_title]);
  if (x.ai_score != null) kv.push(['คะแนน AI', (+x.ai_score).toFixed(2)]);
  const dl = el('dl', 'kv'); dl.style.marginTop = '.6rem';
  kv.forEach(([k, v]) => { dl.append(el('dt', null, k), el('dd', null, v)); });
  box.appendChild(dl);
  if (x.text) box.appendChild(el('div', 'quote', x.text));
}

// ── ฟอร์ม ────────────────────────────────────────────────────────

function advanced(stages){
  const d = el('details', 'adv');
  d.appendChild(el('summary', null, 'ตั้งค่าเพิ่มเติม'));
  const fs = D.fields.filter(f => stages.includes(f.stage)
    // type "clips" = เลือกด้วยการกดที่ตัวคลิปในขั้น 1 ไม่ใช่ช่องกรอก
    && f.type !== 'clips'
    && !['project.source','project.name','project.out','ai.enabled','ai.goal',
         'ai.tasks','ai.model','ai.apply.order',
         'ai.apply.enabled','ai.apply.trim','ai.apply.drop',
         'listen.enabled', 'listen.language', 'listen.model', 'listen.threads',
         'listen.export', 'listen.import_dir',
         'compose.mode', 'jumpcut.enabled', 'jumpcut.noise_db',
         'jumpcut.min_silence', 'jumpcut.pad', 'jumpcut.min_piece',
         'prepare.min_piece', 'prepare.min_clip',
         'audio.same_level', 'audio.match_clips',
         'order.mode', 'order.reverse']
        .includes(f.key)
    && !Object.values(MODE_FIELDS).flat().includes(f.key));
  if (!fs.length) d.appendChild(el('p', 'note', 'ไม่มีค่าเพิ่มเติมในขั้นนี้'));
  fs.forEach(f => d.appendChild(field(f)));
  return d;
}

// สวิตช์ที่เปลี่ยน "หน้าตาของการ์ด" ไม่ใช่แค่ค่าในช่องตัวเอง — ต้องวาดการ์ดใหม่
// ทั้งใบ ไม่งั้นสวิตช์ติดแล้วแต่ของรอบข้างยังเป็นของเดิม: ปิด cut ชน แล้วปุ่ม
// ② หาช่วงเงียบ ยังอยู่ · เปิดโหมดเสียงแล้วคำอธิบายใต้สวิตช์ยังบอกของโหมดเก่า
const RERENDER = new Set(['ai.enabled', 'jumpcut.enabled', 'listen.enabled',
                          'audio.same_level', 'audio.match_clips']);

function setKey(key, orig, v){
  if (JSON.stringify(v) === JSON.stringify(orig)) delete edits[key];
  else edits[key] = v;
  renderSteps();
  if (step === 3) scheduleEstimate();
}

function field(f){
  const row = el('div', 'field' + (f.key in edits ? ' on' : ''));
  const lab = el('div');
  const nm = el('div', 'nm'); nm.append(f.label);
  nm.append(el('span', 'tier t-' + f.tier, D.tiers[f.tier].label),
            el('span', 'key', f.key));
  lab.appendChild(nm);
  if (f.help) lab.appendChild(el('div', 'hlp', f.help));
  const ctl = el('div');
  ctl.appendChild(widget(f, row));
  if (f.type === 'path' && f.key === 'project.source'){
    const p = el('div', 'probe'); p.id = 'probe-src'; ctl.appendChild(p);
    setTimeout(probe, 0);
  }
  row.append(lab, ctl);
  return row;
}

function widget(f, row){
  const v = val(f.key), set = x => { setKey(f.key, D.values[f.key], x);
    row.classList.toggle('on', f.key in edits); };
  if (f.type === 'bool'){
    const l = el('label', 'ck');
    const i = el('input'); i.type = 'checkbox'; i.checked = !!v;
    i.onchange = () => { set(i.checked); if (RERENDER.has(f.key)) render(); };
    l.append(i); return l;
  }
  if (f.type === 'select'){
    const s = el('select');
    (f.options || []).forEach(o => {
      const op = el('option', null, (f.labels && f.labels[o]) || o); op.value = o;
      s.appendChild(op);
    });
    s.value = v == null ? '' : String(v);
    s.onchange = () => set(s.value); return s;
  }
  if (f.type === 'multi' || f.type === 'multi_order'){
    const d = el('div', 'multi');
    const cur = Array.isArray(v) ? v.slice() : [];
    if (f.type === 'multi_order'){
      const i = el('input'); i.type = 'text'; i.value = cur.join(', ');
      i.placeholder = 'TALK, BROLL, BROLL';
      i.onchange = () => set(i.value.split(',').map(x => x.trim().toUpperCase())
                              .filter(x => x === 'TALK' || x === 'BROLL'));
      d.appendChild(i);
      d.appendChild(el('div', 'hlp', 'พิมพ์ TALK / BROLL คั่นด้วยจุลภาค'));
      return d;
    }
    (f.options || []).forEach(o => {
      const l = el('label', 'ck');
      const i = el('input'); i.type = 'checkbox'; i.checked = cur.includes(o);
      i.dataset.o = o;
      i.onchange = () => set((f.options || []).filter(x =>
        d.querySelector(`input[data-o="${x}"]`).checked));
      l.append(i, document.createTextNode((f.labels && f.labels[o]) || o));
      d.appendChild(l);
    });
    return d;
  }
  if ((f.type === 'int' || f.type === 'float') && f.min != null){
    const d = el('div', 'rng');
    const i = el('input'); i.type = 'range'; i.min = f.min; i.max = f.max;
    i.step = f.step || 1; i.value = v ?? f.min;
    const o = el('output');
    const show = x => o.textContent = x + (f.unit ? ' ' + f.unit : '');
    show(i.value);
    i.oninput = () => show(i.value);
    i.onchange = () => set(f.type === 'int' ? parseInt(i.value,10) : parseFloat(i.value));
    d.append(i, o); return d;
  }
  if (f.type === 'list_float'){
    const i = el('input'); i.type = 'text'; i.value = (v || []).join(', ');
    i.onchange = () => set(i.value.split(',').map(x => parseFloat(x.trim()))
                            .filter(x => !isNaN(x)));
    return i;
  }
  if (f.type === 'text'){
    const i = el('textarea'); i.rows = 2; i.value = v || '';
    i.placeholder = f.placeholder || ''; i.onchange = () => set(i.value); return i;
  }
  const i = el('input');
  i.type = (f.type === 'int' || f.type === 'float') ? 'number' : 'text';
  if (f.step) i.step = f.step;
  i.value = v == null ? '' : v; i.placeholder = f.placeholder || '';
  i.onchange = () => set(f.type === 'int' ? parseInt(i.value,10)
                    : f.type === 'float' ? parseFloat(i.value) : i.value);
  return i;
}

// ── กำลังทำงานอยู่ไหม · ทำถึงไหนแล้ว ────────────────────────────
//
// แถบความคืบหน้าของเอนจินขยับวินาทีละหลายครั้ง เซิร์ฟเวอร์จึงไม่ยัดมันลง log
// แต่แปลงเป็นตัวเลขส่งมาใน j.progress แล้วให้ที่นี่วาดเป็นแถบจริง

function renderJob(j){
  const box = $('#jobst'); box.innerHTML = '';
  if (!j.running && !j.at) return;              // ยังไม่เคยสั่งอะไรเลย

  const hd = el('div', 'hd');
  const cls = j.running ? '' : j.stopped ? ' off' : j.code === 0 ? ' ok' : ' bad';
  hd.append(el('span', 'dot' + cls));
  const what = j.cmd_label || j.step || '';
  hd.append(el('span', null,
    j.running ? `กำลัง${what}…` : j.stopped ? `หยุดแล้ว — ค้างที่${what}`
    : j.code === 0 ? 'เสร็จแล้ว' : `ล้มเหลวที่${what}`));
  if (j.of > 1) hd.append(el('span', 'nth', `คำสั่งที่ ${j.at}/${j.of}`));
  hd.append(el('span', 'sp', hhmmss(j.elapsed || 0)));
  box.append(hd);

  const p = j.progress;
  if (j.running){
    const bar = el('div', 'pbar' + (p ? '' : ' wait'));
    const fill = el('i');
    if (p) fill.style.width = (p.total ? Math.min(100, p.n / p.total * 100) : 0) + '%';
    bar.append(fill); box.append(bar);
    box.append(el('div', 'sub', p
      ? `${p.label} ${p.n}/${p.total} (${Math.round(p.n / p.total * 100)}%)`
        + (p.eta ? ` · เหลือ ~${p.eta}` : '') + (p.note ? ' · ' + p.note : '')
      // prepare/compose เร็วจนไม่มีแถบ — บอกตรง ๆ ดีกว่าปล่อยให้เดาว่าค้างไหม
      : 'ยังไม่รายงานความคืบหน้า — ดูบรรทัดล่าสุดข้างล่าง'));
  } else if (j.of > 1){
    box.append(el('div', 'sub', `ทำไป ${j.at}/${j.of} คำสั่ง`));
  }
}

const hhmmss = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? `${h}:${String(m).padStart(2,'0')}` : `${m}`) + ':' + String(x).padStart(2,'0');
};

async function poll(){
  clearTimeout(polling);
  let j;
  try { j = await api('/api/job?since=' + logSince); } catch(e){ return; }
  if (j.lines.length){
    logSince = j.total;
    const e = $('#log'); e.textContent += j.lines.join('\n') + '\n';
    e.scrollTop = e.scrollHeight;
  }
  renderJob(j);
  document.querySelectorAll('.runbtn, #run, #reset').forEach(b => {
    // locked = ปุ่มที่สวิตช์ของมันปิดอยู่ — งานจบแล้วก็ยังต้องกดไม่ได้เหมือนเดิม
    b.disabled = j.running || b.classList.contains('locked');
    // ปุ่มที่กำลังทำงานอยู่ขีดเส้นกะพริบไว้ จะได้รู้ว่ากดอันไหนไป
    b.classList.toggle('busy', !!(j.running && b.dataset.step
                                  && (b.dataset.step === j.cmd
                                      || b.dataset.step === j.step)));
  });
  $('#run').textContent = j.running ? `กำลัง ${j.cmd_label || j.step}…` : 'ทำทุกขั้น';
  $('#stop').hidden = !j.running;
  $('#stop').disabled = false;
  if (j.running) polling = setTimeout(poll, 800);
  else if (j.stopped){ ytBefore = null;
    toast('หยุดแล้ว — ของที่ทำไปก่อนหน้ายังอยู่ครบ'); load(true); }
  // งานโหลดเสียงบอกผลด้วยตัวเอง (ได้ไฟล์ไหนมา · เลือกให้หรือยัง) จึงไม่เด้ง
  // "เสร็จแล้ว" ซ้ำ — ต้องรอ load() ก่อนเสมอ เพราะรายชื่อเพลงใหม่มากับรอบนั้น
  else if (j.code === 0 && j.step === 'music') load(true).then(fxMusicArrived);
  else if (j.code === 0){ toast('เสร็จแล้ว'); load(true); }
  else if (j.code != null){ ytBefore = null;
    toast('งานล้มเหลว — ดูบันทึกการทำงาน', true); }
}

function reviewCard(){
  const c = el('div', 'card');
  c.append(el('h3', null, 'ให้ AI ดูหนังที่ตัดแล้ว'));
  const ta = el('textarea'); ta.rows = 2; ta.id = 'rvctx';
  ta.placeholder = 'อยากให้ดูอะไรเป็นพิเศษ? เช่น "ช่วงกลางเรื่องยืดไป" · เว้นว่างก็ได้';
  if (RV && RV.context) ta.value = RV.context;
  c.appendChild(ta);
  const a = el('div', 'acts');
  const b = el('button', 'primary runbtn', 'วิเคราะห์');
  b.onclick = analyze; a.append(b);
  if (RV && RV.has) a.append(el('span', 'note', `${(RV.ops||[]).length} ข้อเสนอ`));
  c.appendChild(a);
  if (!RV || !RV.has) return c;

  if (RV.summary) c.appendChild(el('div', 'summary', RV.summary));
  if (RV.stale){
    c.appendChild(el('div', 'stale', 'ไทม์ไลน์เปลี่ยนไปหลังจาก AI ดู — '
      + 'ตำแหน่งที่มันอ้างเลื่อนแล้ว กดวิเคราะห์ใหม่ก่อนรับข้อเสนอ'));
    return c;
  }
  const ops = RV.ops || [];
  if (!ops.length){ c.appendChild(el('p','note','AI ไม่เสนอให้แก้อะไร')); return c; }
  const list = el('div', 'ops');
  ops.forEach(o => {
    const e = el('div', 'op' + (taken.has(o.id) ? ' taken' : ''));
    const cb = el('input'); cb.type = 'checkbox';
    cb.checked = !taken.has(o.id); cb.disabled = taken.has(o.id); cb.dataset.id = o.id;
    const mid = el('div');
    mid.append(el('span', 't ' + o.op, o.op === 'drop' ? 'เอาออก' : `ย้ายไปที่ ${o.to + 1}`));
    const j = el('button', 'jump', ` #${o.at + 1} ${o.name} · ${o.dur.toFixed(1)}ว`);
    j.onclick = () => { sel = o.at; render();
      document.querySelectorAll('li.row')[o.at]?.scrollIntoView({block:'center'}); };
    mid.append(j, el('div', 'w', o.why));
    e.append(cb, mid); list.appendChild(e);
  });
  c.appendChild(list);
  const acts = el('div', 'acts');
  const ap = el('button', null, 'ใส่ที่ติ๊กไว้');
  ap.onclick = () => applyOps(list); acts.append(ap);
  c.appendChild(acts);
  return c;
}

function applyOps(list){
  if (!tlEditable()) return;          // ข้อเสนอของ AI ก็แก้ไทม์ไลน์ ต้องผ่านด่านเดียวกัน
  const ids = [...list.querySelectorAll('input:checked')].map(i => +i.dataset.id);
  const ops = (RV.ops || []).filter(o => ids.includes(o.id));
  if (!ops.length) return toast('ยังไม่ได้ติ๊กข้อไหนเลย', true);
  const bad = ops.filter(o => items[o.at]?.name !== o.name);
  if (bad.length) return toast(`ตำแหน่งไม่ตรงกับตอนที่ AI ดู ${bad.length} ข้อ`, true);

  // ทำงานกับ "ตัวช็อต" ไม่ใช่ตำแหน่ง เพราะพอย้ายข้อแรกแล้วเลขของข้อถัดไปเลื่อนหมด
  const drops = ops.filter(o => o.op === 'drop');
  const moves = ops.filter(o => o.op === 'move').map(o => ({item: items[o.at], to: o.to}));
  tlSnap('ใส่ข้อเสนอ AI');            // เก็บภาพก่อนแก้ กด F ถอยคืนได้ทั้งชุด
  drops.forEach(o => { items[o.at].off = true; });
  moves.sort((a,b) => a.to - b.to).forEach(({item, to}) => {
    const from = items.indexOf(item); if (from < 0) return;
    items.splice(from, 1); items.splice(Math.min(to, items.length), 0, item);
  });
  ops.forEach(o => taken.add(o.id));
  sel = -1; render();
  toast(`ใส่แล้ว ${drops.length} เอาออก + ${moves.length} ย้าย — กดบันทึกไทม์ไลน์`);
}

async function openReset(scope){

  catch(e){ return toast(e.message, true); }

function drawReset(){
  const p = RST, b = $('#rst-body');
  b.innerHTML = '';
  $('#rst-title').textContent = 'รีเซ็ต — ' + p.scope_label;
  $('#rst-sub').textContent = p.project || 'ยังไม่มีไฟล์โปรเจกต์';
  if (p.blocked) b.appendChild(el('div', 'stale', p.blocked));

  const hit = p.keys.filter(k => k.in_file);
  const s1 = el('div', 'sect');
  s1.appendChild(el('h4', null, 'ค่าที่ตั้งไว้'));
  if (hit.length){
    const l = el('label', 'ck');
    const i = el('input'); i.type = 'checkbox'; i.id = 'rst-keys';
    i.checked = !p.blocked; i.disabled = !!p.blocked; i.onchange = syncGo;
    l.append(i, document.createTextNode(`ลบค่าที่ทับไว้ ${hit.length} ตัว `
      + `แล้วปล่อยให้ค่าตกมาจาก ${p.extends || 'default.toml'} ตามเดิม`));
    s1.appendChild(l);
    const g = el('div', 'diff');
    hit.forEach(k => g.append(el('div', 'k', k.key), el('div', 'a', shortv(k.now)),
                              el('div', 'z', '→ ' + shortv(k.back))));
    s1.appendChild(g);
  } else {
    s1.appendChild(el('p', 'note',
      'ขั้นนี้ไม่มีค่าที่ไฟล์โปรเจกต์ทับไว้ — เป็นค่าตั้งต้นอยู่แล้ว'));
  }
  b.appendChild(s1);

  const live = p.artifacts.filter(a => a.exists);
  const s2 = el('div', 'sect');
  s2.appendChild(el('h4', null, 'ผลงานที่ทำไว้แล้ว'));
  if (!live.length) s2.appendChild(el('p', 'note', 'ยังไม่มีผลงานของขั้นนี้'));
  live.forEach(a => {
    const r = el('div', 'art' + (a.danger ? ' danger' : ''));
    const i = el('input'); i.type = 'checkbox'; i.dataset.art = a.id; i.onchange = syncGo;
    const mid = el('div');
    mid.append(el('div', null, a.label), el('div', 'c', 'ลบแล้ว ' + a.cost));
    r.append(i, mid, el('div', 'sz', size(a.bytes)));
    s2.appendChild(r);
  });
  if (live.length)
    s2.appendChild(el('p', 'note', 'ไม่ติ๊ก = ไม่แตะ · ไฟล์ที่ลบแล้วกู้กลับไม่ได้ ต้องทำใหม่'));
  b.appendChild(s2);

  const s3 = el('div', 'sect');
  s3.appendChild(el('h4', null, `ค่าเก่าที่เก็บไว้ (${p.history.length})`));
  if (!p.history.length)
    s3.appendChild(el('p', 'note',
      'ยังไม่มี — ทุกครั้งที่กดรีเซ็ตจะถ่ายสำเนาไฟล์เดิมมาเก็บไว้ที่นี่เอง (ไม่เข้า git)'));
  p.history.forEach(s => {
    const r = el('div', 'snap');
    const mid = el('div');
    mid.append(el('div', null, s.label));
    mid.append(el('div', 'm', when(s.at) + ' · ' + s.id
      + (s.deleted && s.deleted.length
         ? ` · ลบไฟล์ไปด้วย ${s.deleted.length} รายการ (กู้ไม่ได้)` : '')));
    const btn = el('button', 'sm', p.scope === 'all' ? 'กู้ทั้งไฟล์' : 'กู้เฉพาะขั้นนี้');
    btn.onclick = () => doRestore(s.id);
    r.append(mid, btn);
    s3.appendChild(r);
  });
  b.appendChild(s3);
  syncGo();
}

function rstPicked(){
  return [...$('#rst-body').querySelectorAll('input[data-art]:checked')]
    .map(i => i.dataset.art);
}

function syncGo(){
  const k = $('#rst-keys'), keys = !!(k && k.checked), n = rstPicked().length;
  const go = $('#rst-go');
  go.disabled = (!keys && !n) || !!(RST && RST.blocked);
  go.textContent = n ? `ล้างค่า + ลบผลงาน ${n} รายการ` : 'ล้างค่า';
}

async function doReset(){
  const k = $('#rst-keys'), keys = !!(k && k.checked), ids = rstPicked();
  const lines = [`รีเซ็ต ${RST.scope_label}`, ''];
  if (keys) lines.push(`· ลบค่าที่ทับไว้ ${RST.keys.filter(x => x.in_file).length} ตัว`);
  RST.artifacts.filter(a => ids.includes(a.id))
    .forEach(a => lines.push(`· ลบ ${a.label} — ${a.cost}`));
  lines.push('', 'ค่าเดิมจะถูกเก็บไว้ให้กู้กลับได้ แต่ไฟล์ที่ลบแล้วต้องทำใหม่');
  if (!confirm(lines.join('\n'))) return;
  try {
    const r = await post('/api/reset', {scope: RST.scope, keys, artifacts: ids});
    $('#rst').close();
    toast(`รีเซ็ตแล้ว · ลบค่า ${r.dropped.length} ตัว · ลบผลงาน ${r.removed.length} รายการ`);
    await load();
  } catch(e){ toast(e.message, true); }
}

async function doRestore(id){
  if (!confirm(`เอาค่าเก่า ${id} กลับมาใช้กับ ${RST.scope_label}?\n\n`
             + 'ค่าปัจจุบันจะถูกเก็บไว้ให้กู้กลับได้อีกชั้น')) return;
  try {
    await post('/api/history', {id, scope: RST.scope});
    $('#rst').close();
    toast('กู้คืนแล้ว');
    await load();
  } catch(e){ toast(e.message, true); }
}

$('#stop').onclick = async () => {
  $('#stop').disabled = true;
  try { await post('/api/job/stop'); } catch(e){ toast(e.message, true); }
  poll();
};
$('#reset').onclick = () => openReset('all');
$('#rst-go').onclick = doReset;
$('#rst-close').onclick = () => $('#rst').close();
// คลิกนอกกล่องแล้วปิด — ESC ใช้ได้อยู่แล้วเพราะเป็น <dialog> จริง
$('#rst').addEventListener('click', e => { if (e.target === $('#rst')) $('#rst').close(); });
$('#save').onclick = saveConfig;
$('#run').onclick = () => runStep('plan');
window.addEventListener('beforeunload', e => {
  if (Object.keys(edits).length || tlDirty() || clDirty() || poolDirty()
      || capDirty || fxDirty){
    e.preventDefault(); e.returnValue = ''; }
});

load().then(() => {
  // เปิดที่ขั้นแรกที่ยังทำไม่เสร็จ — ไม่ต้องให้คนเดาว่าต้องเริ่มตรงไหน
  for (let n = 1; n <= D.phases.length; n++){
    const {done, total} = stepState(n);
    if (done < total){ step = n; break; }
    step = D.phases.length;
  }
  renderSteps(); render();
}).catch(e => toast(e.message, true));
poll();
</script>
</body>
