<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vcut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d; --dim:#8a8378;
  --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a; --ok:#3d7d5a;
  --off:#f2efe9; --radius:7px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da; --dim:#8f877b;
         --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
         --ok:#6fbf92; --off:#252320; }
}
:root[data-theme=dark]{ --bg:#171614; --panel:#1e1d1a; --line:#332f2a; --fg:#e8e3da;
  --dim:#8f877b; --talk:#6fbf92; --broll:#c9a262; --accent:#77a9f0; --warn:#e07a5c;
  --ok:#6fbf92; --off:#252320; }
:root[data-theme=light]{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --fg:#24211d;
  --dim:#8a8378; --talk:#3d7d5a; --broll:#8a6a3d; --accent:#2f6fd0; --warn:#b4462a;
  --ok:#3d7d5a; --off:#f2efe9; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.42em .9em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.sm{padding:.25em .6em;font-size:12.5px}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:.2em .5em}
button.ghost:hover{color:var(--fg)}
input[type=text],input[type=number],select,textarea{width:100%;padding:.38em .55em;
  background:var(--bg);border:1px solid var(--line);border-radius:5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical}

/* แถบหัว — แถวเดียว สูงราว 32px
   เดิมเป็นสองแถบซ้อนกัน (ชื่อโปรเจกต์+ปุ่ม แล้วต่อด้วยแถบขั้นตอนแบบแท็บสองบรรทัด)
   รวมเป็น 114px ที่ปักหมุดค้างอยู่ตลอดเวลา = เกือบ 1/8 ของจอค้างไว้ให้สิ่งที่แทบ
   ไม่ได้แตะระหว่างทำงาน  ตอนนี้ยุบเหลือแถวเดียว: สถานะของแต่ละขั้นย้ายไปอยู่ที่
   *สีของเลข* (เทา=ยังไม่ทำ · เขียว=ทำแล้ว · ส้ม=ค่าเปลี่ยนไปแล้ว) เหลือเป็น
   ตัวหนังสือเฉพาะตอนที่ต้องเตือนจริง ๆ */
header{position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;padding:.25rem .7rem}
h1{font-size:13px;margin:0;font-weight:700;white-space:nowrap}
.spacer{flex:1}
header button{padding:.2em .65em;font-size:12.5px}
.chip{border:1px solid var(--line);border-radius:100px;padding:.1em .6em;
  font-size:11.5px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip.warn{border-color:var(--warn);color:var(--warn)} .chip.warn b{color:var(--warn)}
#c-proj{max-width:15rem;overflow:hidden;text-overflow:ellipsis}

/* แถบขั้นตอน — อยู่ในแถวเดียวกับชื่อโปรเจกต์ */
.steps{display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{border:1px solid transparent;border-radius:100px;background:none;
  padding:.15em .55em;display:flex;gap:.35rem;align-items:center;
  color:var(--dim);white-space:nowrap;font-size:12.5px}
/* เดิมขั้นที่เลือกอยู่บอกด้วยขีดใต้ยาว ๆ ซึ่งพอย่อเป็นเม็ดเล็กแล้วแทบไม่เห็น
   — ใช้พื้นหลัง + ขอบสีเน้นแทน ไม่ขยับ layout เพราะขอบใสกว้างเท่ากันอยู่แล้ว */
.steps button[aria-selected=true]{background:var(--off);color:var(--fg);
  border-color:var(--accent)}
.steps .n{background:var(--off);color:var(--dim);border-radius:100px;width:1.45em;
  height:1.45em;display:grid;place-items:center;font-size:10.5px;font-weight:800}
.steps button[aria-selected=true] .n{background:var(--accent);color:#fff}
.steps .n.done{background:var(--ok);color:#fff}
.steps .n.hot{background:var(--warn);color:#fff}
.steps .lab{font-weight:600}
.steps .st{font-size:11.5px;color:var(--dim)}
.steps .st.hot{color:var(--warn)}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1rem;
  padding:1rem;align-items:start;max-width:1560px;margin:0 auto}
@media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr)} aside{position:static!important} }
/* ปักหมุดใต้แถบหัวพอดี — วัดความสูงจริงเอา (headHeight) ไม่ใช่ตัวเลขตายตัว
   เพราะแถบหัวขึ้นบรรทัดที่สองได้เองตอนจอแคบ */
aside{position:sticky;top:calc(var(--headh, 33px) + .5rem);
  display:flex;flex-direction:column;gap:.75rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:.9rem;margin-bottom:.8rem}
.card h2{font-size:14px;margin:0 0 .2rem;font-weight:700}
.card h3{font-size:12px;margin:0 0 .55rem;color:var(--dim);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.card .lead{font-size:12.5px;color:var(--dim);margin:0 0 .8rem}
.acts{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.note{font-size:12px;color:var(--dim);margin:.45rem 0 0}
.note.warnnote{color:var(--warn)}
.probe{font-size:12px;margin-top:.3rem}
.probe.ok{color:var(--ok)} .probe.bad{color:var(--warn)}

/* ฟอร์ม */
.field{display:grid;grid-template-columns:1fr 220px;gap:.6rem;align-items:center;
  padding:.5rem 0;border-bottom:1px solid var(--off)}
.field:last-child{border-bottom:0}
.field .nm{font-size:13px;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.field .hlp{font-size:11.5px;color:var(--dim);margin-top:.1rem}
.field .key{font:11px ui-monospace,Menlo,monospace;color:var(--dim);opacity:.65}
.field.on input,.field.on select,.field.on textarea{border-color:var(--accent)}
.tier{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700;
  border:1px solid currentColor;opacity:.8}
.t-render,.t-scan,.t-listen{color:var(--warn)}
.t-ai,.t-silence{color:#a8571f} .t-edl,.t-thumbs{color:var(--ok)} .t-free{color:var(--dim)}
.rng{display:flex;gap:.5rem;align-items:center}
.rng input[type=range]{flex:1;min-width:0}
.rng output{font-size:12px;font-variant-numeric:tabular-nums;min-width:3.6em;
  text-align:right;color:var(--dim)}
label.ck{display:flex;gap:.4rem;align-items:center;cursor:pointer;font-size:12.5px}
.multi{display:flex;flex-direction:column;gap:.2rem}
details.adv{border-top:1px solid var(--off);margin-top:.7rem}
details.adv>summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:.55rem 0;
  list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸ ";}
details.adv[open]>summary::before{content:"▾ ";}

/* คลัง / ไทม์ไลน์ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:820px){ .two{grid-template-columns:1fr} }
.colhead{display:flex;gap:.5rem;align-items:center;font-size:12.5px;font-weight:700;
  margin-bottom:.4rem}
.kind{font-size:10px;padding:.05em .45em;border-radius:3px;font-weight:700}
.kind.TALK{background:color-mix(in srgb,var(--talk) 18%,transparent);color:var(--talk)}
.kind.BROLL{background:color-mix(in srgb,var(--broll) 18%,transparent);color:var(--broll)}
ul{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:26px 62px 1fr auto;gap:.55rem;align-items:center;
  padding:.35rem .5rem;border:1px solid transparent;border-radius:var(--radius)}
li.row:hover{background:var(--off);border-color:var(--line)}
li.row.sel{border-color:var(--accent)}
li.row.off{opacity:.4} li.row.off .name{text-decoration:line-through}
li.row.bad{opacity:.55}
li.row.drag{opacity:.35} li.row.over{border-top:2px solid var(--accent)}
.idx{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:62px;height:35px;object-fit:cover;border-radius:4px;background:var(--off);
  display:block;cursor:grab}
.mid{min-width:0}
.name{font-size:12.5px;font-weight:600;display:flex;gap:.4rem;align-items:center}
.sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rowacts{display:flex;gap:.15rem;align-items:center}
.dur{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:3.2em;text-align:right}
.scroll{max-height:30em;overflow:auto}
.empty{color:var(--dim);font-size:12.5px;padding:1.6rem 0;text-align:center}
.chapter{margin:1rem 0 .3rem;display:flex;align-items:center;gap:.6rem}
.chapter h4{font-size:12.5px;margin:0;font-weight:700}
.chapter hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

/* โหมดของขั้น 3 */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.4rem}
.grouphd{display:flex;align-items:baseline;gap:.45rem;margin:.9rem 0 .35rem;
  font-size:12px}
.grouphd:first-child{margin-top:0}
.grouphd b{font-size:12.5px}
.grouphd span{color:var(--dim)}
.grouphd.ai b{color:var(--warn)}
.seg.wrap{flex-wrap:wrap;border:0;gap:.3rem}
.seg.wrap button{border:1px solid var(--line);border-radius:var(--radius)}
.modes button{text-align:left;padding:.5rem .7rem;line-height:1.35}
.modes button[aria-pressed=true]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modes .mt{font-weight:600;font-size:13px;display:block}
.modes .md{font-size:11px;color:var(--dim)}

/* AI review */
.summary{font-size:12.5px;border-left:2px solid var(--accent);padding-left:.6rem;margin:.6rem 0}
.ops{display:flex;flex-direction:column;gap:.35rem;max-height:20em;overflow:auto;margin-top:.5rem}
.op{display:grid;grid-template-columns:auto 1fr;gap:.5rem;font-size:12px;
  border:1px solid var(--line);border-radius:5px;padding:.4rem .5rem}
.op.taken{opacity:.45;border-style:dashed}
.op .t{font-weight:700} .op .t.drop{color:var(--warn)} .op .t.move{color:var(--accent)}
.op .w{color:var(--dim);font-size:11.5px}
.op .jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;
  font-size:11.5px;text-align:left}
.stale{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:5px;
  padding:.4em .6em;margin-top:.5rem}
.big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big.hot{color:var(--warn)} .big.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.2rem .7rem;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
video{width:100%;border-radius:5px;background:#000;display:block}
.quote{font-size:12px;color:var(--dim);margin-top:.5rem;max-height:7em;overflow:auto;
  border-left:2px solid var(--line);padding-left:.6rem}
#log{font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:15em;
  overflow:auto;color:var(--dim);word-break:break-word}
/* กำลังทำงานอยู่ไหม ทำถึงไหนแล้ว — อยู่เหนือบันทึก จะได้เห็นก่อนตัวหนังสือ */
#jobst{margin-bottom:.55rem}
#jobst:empty{display:none}
#jobst .hd{display:flex;align-items:center;gap:.4rem;font-size:12.5px;font-weight:600}
#jobst .hd .nth,#jobst .hd .sp{font-weight:400;color:var(--dim);
  font-variant-numeric:tabular-nums;font-size:11.5px}
#jobst .hd .sp{margin-left:auto}
#jobst .sub{font-size:11.5px;color:var(--dim);margin-top:.15rem;
  font-variant-numeric:tabular-nums}
#jobst .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  flex:0 0 auto;animation:pulse 1.1s ease-in-out infinite}
#jobst .dot.ok{background:var(--ok);animation:none}
#jobst .dot.bad{background:var(--warn);animation:none}
#jobst .dot.off{background:var(--line);animation:none}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
.pbar{height:6px;border-radius:3px;background:var(--off);overflow:hidden;margin-top:.4rem}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .25s linear}
.pbar.wait i{width:35%;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%} 100%{margin-left:100%}}
button.busy{position:relative}
button.busy::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
/* คลังคลิปในขั้น 1 */
.bar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:.3em .75em;
  font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:.45rem;
  max-height:44em;overflow:auto}
.cl{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--off);cursor:grab}
.cl:active{cursor:grabbing}
.cl.drag{opacity:.35}
/* เส้นบอกว่าปล่อยแล้วจะไปแทรกด้านไหนของคลิปที่ชี้อยู่ */
.cl.dl::after,.cl.dr::after{content:'';position:absolute;top:0;bottom:0;width:4px;
  background:var(--accent);z-index:3}
.cl.dl::after{left:0} .cl.dr::after{right:0}
.cl img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.cl.off img{opacity:.28;filter:grayscale(1)}
.cl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cl .tag{position:absolute;top:3px;left:3px;display:flex;gap:2px}
.cl .b{font-size:9.5px;font-weight:700;padding:.1em .4em;border-radius:3px;
  background:rgba(0,0,0,.68);color:#fff;line-height:1.5}
.cl .b.v{background:var(--broll)} .cl .b.r{background:var(--accent)}
.cl .pick{position:absolute;top:3px;right:3px;width:17px;height:17px;margin:0;
  accent-color:var(--accent);cursor:pointer}
.cl .cap{display:flex;justify-content:space-between;gap:.3rem;padding:.2rem .35rem;
  font-size:10.5px;color:var(--dim);background:var(--panel)}
.cl .cap b{color:var(--fg);font-weight:600;font-size:11px}

/* คลังชิ้นในขั้น 2 */
li.row.kept{border-color:var(--ok);
  background:color-mix(in srgb,var(--ok) 8%,transparent)}
li.row.bad .why{color:var(--warn)}
.why{font-size:11.5px}
.back{width:16px;height:16px;margin:0;accent-color:var(--ok);cursor:pointer}
.track{position:relative;height:5px;border-radius:3px;background:var(--off);
  margin:.5rem 0 .1rem;overflow:hidden}
.track .on{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px;
  min-width:2px}

/* กล่องดูคลิปทีละตัว */
.vwrap{background:#000;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.vwrap video{display:block;max-width:100%;max-height:46vh;width:auto}
.vwrap.r90 video,.vwrap.r270 video{max-height:none;max-width:46vh}
.r90 video{transform:rotate(90deg)} .r270 video{transform:rotate(-90deg)}
.r180 video{transform:rotate(180deg)}
.vmodes{display:grid;gap:.4rem}
.vm{border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem}
.vm[aria-pressed=true]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.vm .t{font-weight:600;font-size:12.5px;display:flex;gap:.5rem;align-items:center}
.vm .d{font-size:11.5px;color:var(--dim);margin-top:.1rem}
.vm video{width:100%;border-radius:4px;margin-top:.45rem;background:#000}

/* กล่องรีเซ็ต */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  color:var(--fg);padding:0;width:min(660px,92vw);box-shadow:0 12px 50px rgba(0,0,0,.32)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{padding:.85rem 1rem .6rem;border-bottom:1px solid var(--line)}
dialog h2{font-size:15px;margin:0;font-weight:700}
dialog .dh .m{font:11.5px ui-monospace,Menlo,monospace;color:var(--dim)}
dialog .db{padding:.9rem 1rem;max-height:min(62vh,620px);overflow:auto}
dialog .df{padding:.7rem 1rem;border-top:1px solid var(--line);display:flex;gap:.45rem;
  align-items:center}
/* ไทม์ไลน์แบบแถบแนวนอน */
.tlwrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--off);border-radius:6px;
  background:var(--bg2);padding:0 0 .4rem}
.tlinner{position:relative;min-width:100%}
.tlruler{position:relative;height:20px;border-bottom:1px solid var(--off);cursor:pointer}
.tlruler i{position:absolute;top:0;bottom:0;width:1px;background:var(--off)}
.tlruler i span{position:absolute;left:3px;top:2px;font-size:10px;color:var(--dim);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.tltrack{position:relative;height:56px;margin-top:6px}
.tlblk{position:absolute;top:0;height:56px;border-radius:4px;box-sizing:border-box;
  border:1px solid rgba(0,0,0,.35);cursor:grab;overflow:hidden;touch-action:none;
  background:#2f6f4f}
.tlblk.BROLL{background:#3a5a7a}
.tlblk.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.tlblk.cut::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--warn)}
.tlname{position:absolute;left:6px;top:4px;font-size:10.5px;color:#fff;opacity:.9;
  pointer-events:none;white-space:nowrap}
.tlh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tlh:hover{background:rgba(255,255,255,.35)}
.tlh-l{left:0} .tlh-r{right:0}
.tlhead{position:absolute;top:-26px;bottom:0;width:2px;background:var(--warn);z-index:4;
  pointer-events:none}
.tlclip{position:relative;height:14px;border-radius:3px;background:var(--off);
  overflow:hidden;margin:.2rem 0 .35rem}
.tlclip-use{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.75}
.tlclip-o{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
/* ตัวเล่นวิดีโอขั้น 3 */
.pv{background:#000;border-radius:6px;overflow:hidden;position:relative;line-height:0}
.pv video{display:block;width:100%;max-height:52vh;background:#000;object-fit:contain}
.pv video.hide{display:none}
.pvbadge{position:absolute;left:.5rem;top:.5rem;background:rgba(0,0,0,.62);color:#fff;
  font-size:11.5px;line-height:1.5;padding:.1rem .45rem;border-radius:4px;pointer-events:none}
.pvbar{display:flex;align-items:center;gap:.45rem;margin-top:.55rem}
.pvscrub{flex:1;height:9px;background:var(--off);border-radius:5px;position:relative;
  cursor:pointer;overflow:hidden}
.pvfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.pvticks{position:absolute;inset:0}
.pvticks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
.pvtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
.sect{margin:0 0 1.1rem} .sect:last-child{margin-bottom:0}
.sect>h4{font-size:11.5px;margin:0 0 .45rem;color:var(--dim);font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.diff{display:grid;grid-template-columns:1fr auto auto;gap:.1rem .7rem;font-size:12px;
  margin-top:.5rem}
.diff>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15em}
.diff .k{font:11.5px ui-monospace,Menlo,monospace;color:var(--dim)}
.diff .a{text-align:right;text-decoration:line-through;opacity:.6}
.diff .z{text-align:right;color:var(--ok)}
.art{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:start;
  padding:.42rem .55rem;border:1px solid var(--line);border-radius:5px;
  margin-bottom:.3rem;font-size:12.5px}
.art.danger{border-color:var(--warn)}
.art .c{font-size:11.5px;color:var(--dim)} .art.danger .c{color:var(--warn)}
.art .sz{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.snap{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;
  padding:.4rem .1rem;border-bottom:1px solid var(--off);font-size:12.5px}
.snap:last-child{border-bottom:0}
.snap .m{font-size:11.5px;color:var(--dim)}
.hd{display:flex;align-items:center;gap:.6rem}

.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--fg);color:var(--bg);padding:.55em 1.1em;border-radius:100px;
  font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.25);max-width:80vw}
.toast.err{background:var(--warn);color:#fff}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">vcut</h1>
    <nav class="steps" id="steps"></nav>
    <span class="spacer"></span>
    <span class="chip" id="c-proj">—</span>
    <span class="chip" id="c-dirty" hidden></span>
    <button id="reset" title="ล้างค่าทั้งหมดกลับเป็นค่าตั้งต้น — ของเดิมเก็บไว้กู้ได้">รีเซ็ต</button>
    <button id="stop" hidden>หยุด</button>
    <button id="save" disabled>บันทึก</button>
    <button id="run" class="primary">ทำทุกขั้น</button>
  </div>
</header>

<dialog id="piece">
  <div class="dh">
    <h2 id="pc-title">ชิ้น</h2>
    <div class="m" id="pc-sub"></div>
  </div>
  <div class="db" id="pc-body"></div>
  <div class="df">
    <label class="ck"><input type="checkbox" id="pc-only" checked> เล่นเฉพาะช่วงที่ตัด</label>
    <span class="spacer"></span>
    <button id="pc-prev">← ก่อนหน้า</button>
    <button id="pc-next">ถัดไป →</button>
    <button id="pc-close">ปิด</button>
  </div>
</dialog>

<dialog id="clip">
  <div class="dh">
    <h2 id="cl-title">คลิป</h2>
    <div class="m" id="cl-sub"></div>
  </div>
  <div class="db" id="cl-body"></div>
  <div class="df">
    <label class="ck"><input type="checkbox" id="cl-pick"> เอาคลิปนี้</label>
    <span class="spacer"></span>
    <button id="cl-prev">← ก่อนหน้า</button>
    <button id="cl-next">ถัดไป →</button>
    <button id="cl-close">ปิด</button>
  </div>
</dialog>

<dialog id="rst">
  <div class="dh">
    <h2 id="rst-title">รีเซ็ต</h2>
    <div class="m" id="rst-sub"></div>
  </div>
  <div class="db" id="rst-body"></div>
  <div class="df">
    <button id="rst-go" class="primary">ล้างค่า</button>
    <span class="spacer"></span>
    <button id="rst-close">ปิด</button>
  </div>
</dialog>

<main>
  <section id="body"></section>
  <aside>
    <div class="card" id="side-est" hidden>
      <h3>ถ้าสร้างไฟล์ตอนนี้</h3>
      <div id="est"></div>
    </div>
    <div class="card" id="side-prev" hidden>
      <h3>ตัวอย่าง</h3>
      <div id="preview"></div>
    </div>
    <div class="card">
      <h3>บันทึกการทำงาน</h3>
      <div id="jobst"></div>
      <div id="log">ยังไม่มีงานที่สั่ง</div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let D = null, POOL = null, S = null, RV = null, RST = null, CL = null;
let clFilter = 'all', clOpen = -1, clDrag = null;
let clEdits = {pick: {}, rot: {}, vmode: {}, order: null};
let poolFilter = 'all', poolKeep = null, pcOpen = null;
let step = 1, edits = {}, items = [], sel = -1, dragFrom = -1;
let logSince = 0, polling = null, estTimer = null, taken = new Set();

const mmss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const hhmm = s => s < 60 ? `${Math.round(s)} วิ`
  : s < 3600 ? `${Math.round(s/60)} นาที` : `${(s/3600).toFixed(1)} ชม.`;
const val = k => k in edits ? edits[k] : (D && D.values[k]);
// ชิ้นนี้ถูกขยับขอบหรือเพิ่งเกิดจากการซอยไหม — ถ้าใช่ ไฟล์ที่ตัดไว้เดิมใช้ไม่ได้
const tlCut = x => !x.o || x.start !== x.o.start || x.end !== x.o.end;
const tlDirty = () => items.some(x => x.off) || items.some((x, i) => x.i !== i)
  || items.some(tlCut) || items.length !== ((S && S.timeline) || []).length;
const size = b => b >= 1e9 ? (b/1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b/1e6).toFixed(1)
  + ' MB' : b >= 1e3 ? Math.round(b/1e3) + ' KB' : b + ' B';
// path ยาว ๆ ต้องตัดหัวไม่ใช่ตัดท้าย — ส่วนที่ต่างกันอยู่ท้ายเสมอ ตัดท้ายแล้ว
// สองฝั่งจะเหลือ "/Users/macbook3lf1/web work…" เหมือนกันเป๊ะ อ่านไม่ได้ความ
const shortv = v => {
  if (v == null) return '—';
  if (v === '') return '(ว่าง)';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '(ว่าง)';
  if (typeof v === 'boolean') return v ? 'เปิด' : 'ปิด';
  const s = String(v);
  return s.startsWith('/') && s.length > 28
    ? '…/' + s.split('/').filter(Boolean).slice(-2).join('/') : s;
};
const when = t => new Date(t * 1000).toLocaleString('th-TH',
  {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

function toast(msg, err){
  const t = el('div', 'toast' + (err ? ' err' : ''), msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 2600);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}
const post = (p, b) => api(p, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(b || {})});

// ── โหลดสถานะทั้งหมด ─────────────────────────────────────────────

async function load(keepEdits){
  const [d, pool, st, cl] = await Promise.all([
    api('/api/setup'), api('/api/pool').catch(() => ({has:false, pieces:[]})),
    api('/api/state').catch(() => null),
    api('/api/clips').catch(() => ({clips:[], summary:{total:0}}))]);
  D = d; POOL = pool; S = st; CL = cl;
  if (!keepEdits){
    edits = {}; poolKeep = null; clEdits = {pick: {}, rot: {}, vmode: {}, order: null};
  }
  // o = ขอบเดิมตอนโหลดมา ใช้เทียบว่าถูกแก้แล้วหรือยัง และวาดเส้นขอบเดิมในแถบ
  if (S && S.timeline){
    items = S.timeline.map(x => ({...x, off: false, o: {start: x.start, end: x.end}}));
    sel = -1;
  }
  $('#title').textContent = D.values['project.name'] || 'vcut';
  $('#c-proj').textContent = D.project.path || 'ยังไม่มีไฟล์โปรเจกต์';
  $('#c-proj').title = D.project.path || '';   // ตัดท้ายด้วย … ตอนที่อยู่ยาว
  renderSteps(); render();
  loadReview();
}

function stepState(n){
  const ph = D.phases[n-1];
  if (!ph) return {done: 0, total: 0};
  return {done: ph.steps.filter(s => s.exists).length, total: ph.steps.length,
          stale: ph.steps.some(s => s.exists && s.changed.length)};
}

function renderSteps(){
  const box = $('#steps'); box.innerHTML = '';
  D.phases.forEach((ph, i) => {
    const n = i + 1;
    const {done, total, stale} = stepState(n);
    const b = el('button');
    b.setAttribute('aria-selected', step === n);
    const word = stale ? 'ค่าเปลี่ยนไปแล้ว' : done === total ? 'ทำแล้ว'
               : done ? `ทำไป ${done}/${total}` : 'ยังไม่ได้ทำ';
    b.title = `${ph.label} — ${word}`;
    // สถานะอยู่ที่สีของเลข: เทา=ยังไม่ทำ · เขียว=ทำแล้ว · ส้ม=ค่าเปลี่ยนไปแล้ว
    b.append(el('span', 'n' + (stale ? ' hot' : done === total ? ' done' : ''), String(n)),
             el('span', 'lab', ph.label));
    // เหลือตัวหนังสือไว้เฉพาะสองกรณีที่สีอย่างเดียวบอกไม่พอ — ต้องรู้ว่า "ทำไปกี่
    // ขั้นแล้ว" กับต้องเห็นคำเตือนว่าของที่ทำไว้ใช้ไม่ได้แล้ว ที่เหลือสีบอกครบ
    if (stale) b.append(el('span', 'st hot', 'ค่าเปลี่ยน'));
    else if (done && done < total) b.append(el('span', 'st', `${done}/${total}`));
    b.onclick = () => { step = n; renderSteps(); render(); };
    box.appendChild(b);
  });
  const n = Object.keys(edits).length;
  $('#save').disabled = !n;
  $('#save').textContent = n ? `บันทึก (${n})` : 'บันทึก';
  $('#c-dirty').hidden = !n;
  $('#c-dirty').className = 'chip warn';
  $('#c-dirty').innerHTML = `<b>${n}</b> ค่าที่ยังไม่บันทึก`;
  headHeight();
}

// ความสูงจริงของแถบหัว → ตัวแปร CSS ที่กล่องข้างใช้ปักหมุด
// (แถบหัวขึ้นบรรทัดที่สองเองได้ตอนจอแคบ ตัวเลขตายตัวจึงเชื่อไม่ได้)
function headHeight(){
  document.documentElement.style.setProperty(
    '--headh', $('header').offsetHeight + 'px');
}
window.addEventListener('resize', headHeight);

function render(){
  const b = $('#body'); b.innerHTML = '';
  $('#side-est').hidden = step !== 3;
  $('#side-prev').hidden = step !== 3;
  if (step === 1) stepSource(b);
  if (step === 2) stepPrepare(b);
  if (step === 3) stepCompose(b);
  if (step === 3) scheduleEstimate();
}

// ── ขั้น 1 · เลือกฟุตเทจ ─────────────────────────────────────────

// ชื่อขั้นกับคำอธิบายมาจาก settings.PHASES ที่เดียว — ไม่ได้พิมพ์ซ้ำไว้ที่นี่
function head(n){
  const ph = D.phases[n-1] || {};
  const w = el('div');
  const r = el('div', 'hd');
  r.append(el('h2', null, `ขั้น ${ph.no} · ${ph.label}`), el('span', 'spacer'));
  const b = el('button', 'sm', 'รีเซ็ตขั้นนี้');
  b.title = 'ล้างค่าของขั้นนี้กลับเป็นค่าตั้งต้น — ของเดิมเก็บไว้ให้กู้กลับได้';
  b.onclick = () => openReset(ph.id);
  r.append(b);
  w.append(r, el('p', 'lead', ph.why || ''));
  return w;
}

function stepSource(box){
  const c = el('div', 'card');
  c.appendChild(head(1));
  ['project.source', 'project.name', 'project.out'].forEach(k => {
    const f = D.fields.find(x => x.key === k);
    if (f) c.appendChild(field(f));
  });
  const a = el('div', 'acts');
  const btn = el('button', 'primary runbtn', 'อ่านคลิปทั้งโฟลเดอร์');
  btn.dataset.step = 'source';
  btn.onclick = () => runStep('source');
  a.append(btn);
  const sc = D.steps.find(s => s.id === 'scan');
  if (sc && sc.exists) a.append(el('span', 'note', sc.summary));
  c.appendChild(a);
  c.appendChild(advanced(['scan', 'thumbs']));
  box.appendChild(c);
  box.appendChild(clipBrowser());
}

// ── คลังคลิปดิบ · เลือก / กรอง / หมุน ──────────────────────────
//
// ทั้งสามอย่างที่แก้ตรงนี้เก็บเป็น config ไม่ใช่ไฟล์ cache — ค่าที่ยังไม่กด
// บันทึกอยู่ใน clEdits เท่านั้น หน้าจอจึงกลับไปเป็นของเดิมได้ด้วยการ reload

const clPicked = x => x.name in clEdits.pick ? clEdits.pick[x.name] : x.picked;
const clRot    = x => x.name in clEdits.rot ? clEdits.rot[x.name] : x.rot;
const clVmode  = x => x.name in clEdits.vmode ? clEdits.vmode[x.name] : x.vmode;
const clDirty  = () => Object.keys(clEdits.pick).length + Object.keys(clEdits.rot).length
                     + Object.keys(clEdits.vmode).length + (clEdits.order ? 1 : 0);
// ลำดับปัจจุบัน: ที่ลากค้างไว้ยังไม่บันทึก ถ้าไม่มีก็ตามที่เซิร์ฟเวอร์ส่งมา
const clOrder   = () => clEdits.order || (CL.clips || []).map(x => x.name);
const clNatural = () => (CL.clips || []).slice()
  .sort((a, b) => a.num - b.num || (a.name < b.name ? -1 : 1)).map(x => x.name);
// transpose จำนวนคี่ครั้งเท่านั้นที่สลับกว้าง/สูง — 180° ขนาดเท่าเดิม
const swaps = o => ((o || '').split('transpose').length - 1) % 2 === 1;

function clOrient(x){
  return swaps(x.rot) === swaps(clRot(x)) ? x.orient : (x.orient === 'V' ? 'H' : 'V');
}
function clList(){
  const by = new Map((CL.clips || []).map(x => [x.name, x]));
  return clOrder().map(n => by.get(n))
    .filter(x => x && (clFilter === 'all' || clOrient(x) === clFilter));
}
function clSet(kind, name, v, orig){
  if (v === orig) delete clEdits[kind][name]; else clEdits[kind][name] = v;
}

// ── ลากสลับตำแหน่ง ────────────────────────────────────────────
//
// ลากในมุมมองที่กรองอยู่ก็ได้ — ย้ายในรายการเต็มโดยอิงคลิปที่ปล่อยทับ
// ผลจึงชัดเจนเสมอ ไม่ต้องเดาว่าคลิปที่ถูกซ่อนอยู่จะไปโผล่ตรงไหน

function clSetOrder(list){
  const base = (CL.clips || []).map(x => x.name).join('\n');
  // ลากแล้ววนกลับมาที่เดิม = ไม่มีอะไรค้าง ไม่ต้องกดบันทึก
  clEdits.order = list.join('\n') === base ? null : list;
  render();
}
function clMove(name, onto, after){
  const list = clOrder().filter(n => n !== name);
  const i = list.indexOf(onto);
  if (i < 0) return;
  list.splice(after ? i + 1 : i, 0, name);
  clSetOrder(list);
}
function clDropSide(cell, e){
  const r = cell.getBoundingClientRect();
  return e.clientX > r.left + r.width / 2;
}
function clDragOff(){
  document.querySelectorAll('.cl').forEach(c => c.classList.remove('dl', 'dr', 'drag'));
}
function btn(label, fn, cls){
  const b = el('button', 'sm' + (cls ? ' ' + cls : ''), label);
  b.onclick = fn; return b;
}

function clipBrowser(){
  const c = el('div', 'card');
  if (!CL || !(CL.clips || []).length){
    c.append(el('h3', null, 'คลิปที่อ่านได้'),
             el('p', 'empty', 'ยังไม่มีคลิป — กด "อ่านคลิปทั้งโฟลเดอร์" ก่อน'));
    return c;
  }
  const s = CL.summary;
  const on = CL.clips.filter(clPicked);
  const mins = on.reduce((a, x) => a + x.dur, 0) / 60;
  c.append(el('h3', null, `คลิปที่อ่านได้ — เอาไปทำต่อ ${on.length}/${s.total} คลิป · `
    + `${mins.toFixed(1)} นาที`));

  const bar = el('div', 'bar');
  const seg = el('div', 'seg');
  [['all', `ทั้งหมด ${s.total}`], ['H', `แนวนอน ${s.horizontal}`],
   ['V', `แนวตั้ง ${s.vertical}`]].forEach(([k, lab]) => {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', clFilter === k);
    b.onclick = () => { clFilter = k; render(); };
    seg.appendChild(b);
  });
  bar.append(seg);
  const shown = clList();
  bar.append(btn('เลือกทั้งหมด', () => bulk(shown, true)),
             btn('ไม่เอาทั้งหมด', () => bulk(shown, false)),
             btn('กลับด้าน', () => bulk(shown, null)));
  const custom = s.custom_order || !!clEdits.order;
  if (custom) bar.append(btn('เรียงตามเลขไฟล์', () => clSetOrder(clNatural())));
  bar.append(el('span', 'spacer'));
  const n = clDirty();
  const sv = el('button', 'primary', n ? `บันทึกการเลือก (${n})` : 'บันทึกการเลือก');
  sv.disabled = !n; sv.onclick = saveClips;
  bar.append(sv);
  if (n) bar.append(btn('ทิ้งที่แก้', () => {
    clEdits = {pick:{}, rot:{}, vmode:{}, order:null}; render(); }));
  c.appendChild(bar);

  const g = el('div', 'grid');
  const pos = new Map(clOrder().map((n, i) => [n, i + 1]));
  shown.forEach((x, i) => g.appendChild(clCell(x, i, custom ? pos.get(x.name) : 0)));
  c.appendChild(g);

  const notes = ['ลากคลิปไปวางตำแหน่งที่ต้องการได้ — เส้นสีน้ำเงินบอกว่าจะแทรกด้านไหน'];
  if (clFilter !== 'all')
    notes.push(`กรองอยู่ — แสดง ${shown.length} จาก ${s.total} คลิป`
      + ' (ลากตอนกรองก็ได้ ตำแหน่งอิงคลิปที่ปล่อยทับ)');
  if (custom && val('order.mode') !== 'filename')
    notes.push(`ลำดับที่จัดเองจะยังไม่มีผลกับหนัง เพราะขั้น 3 ตั้ง "เรียงลำดับตาม"`
      + ` เป็น "${orderLabel(val('order.mode'))}" อยู่`);
  else if (custom && val('order.reverse'))
    notes.push('ขั้น 3 เปิด "กลับลำดับ" อยู่ — หนังจะเรียงจากท้ายรายการนี้ขึ้นมา');
  else if (custom)
    notes.push('หนังจะเรียงตามลำดับนี้ — กด "รวมเป็นหนัง" ในขั้น 3 ใหม่หลังบันทึก');
  notes.forEach(t => c.appendChild(el('p', 'note', t)));
  return c;
}

// ชื่อโหมดการเรียงมาจาก settings.FIELDS ที่เดียว ไม่ได้พิมพ์ซ้ำไว้ที่นี่
function orderLabel(mode){
  const f = (D.fields || []).find(x => x.key === 'order.mode');
  return (f && f.labels && f.labels[mode]) || mode;
}

function bulk(list, want){
  list.forEach(x => clSet('pick', x.name,
    want === null ? !clPicked(x) : want, x.picked));
  render();
}

function clCell(x, i, pos){
  const on = clPicked(x), or = clOrient(x);
  const d = el('div', 'cl' + (on ? '' : ' off') + (i === clOpen ? ' sel' : ''));
  const img = el('img'); img.loading = 'lazy'; img.src = `/thumb/${x.name}.jpg`;
  img.alt = x.name;
  img.draggable = false;        // ไม่งั้นเบราว์เซอร์ลากรูปแทนที่จะลากทั้งใบ
  d.append(img);

  d.draggable = true;
  d.title = 'ลากไปวางตำแหน่งที่ต้องการได้';
  d.ondragstart = e => {
    clDrag = x.name;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', x.name);
    setTimeout(() => d.classList.add('drag'), 0);
  };
  d.ondragend = () => { clDrag = null; clDragOff(); };
  d.ondragover = e => {
    if (!clDrag || clDrag === x.name) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = clDropSide(d, e);
    d.classList.toggle('dl', !after);
    d.classList.toggle('dr', after);
  };
  d.ondragleave = () => d.classList.remove('dl', 'dr');
  d.ondrop = e => {
    e.preventDefault();
    const name = clDrag || e.dataTransfer.getData('text/plain');
    const after = clDropSide(d, e);
    clDrag = null; clDragOff();
    if (name && name !== x.name) clMove(name, x.name, after);
  };
  const tag = el('div', 'tag');
  // เลขตำแหน่งโผล่เฉพาะตอนมีลำดับที่จัดเอง — ตอนเรียงตามเลขไฟล์มันคือข้อมูลซ้ำ
  if (pos) tag.append(el('span', 'b', '#' + pos));
  if (or === 'V') tag.append(el('span', 'b v', 'ตั้ง'));
  if (clRot(x)) tag.append(el('span', 'b r', '↻'));
  if (clVmode(x)) tag.append(el('span', 'b', vmShort(clVmode(x))));
  if (tag.children.length) d.append(tag);
  const cb = el('input'); cb.type = 'checkbox'; cb.className = 'pick'; cb.checked = on;
  cb.title = 'เอาคลิปนี้ไปทำต่อในขั้น 2';
  cb.onclick = e => { e.stopPropagation(); clSet('pick', x.name, cb.checked, x.picked);
                      render(); };
  d.append(cb);
  const cap = el('div', 'cap');
  cap.append(el('b', null, x.name.replace(/^IMG_/, '')),
             el('span', null, x.dur.toFixed(1) + 'ว'));
  d.append(cap);
  d.onclick = () => openClip(i);
  return d;
}

const vmShort = m => m === 'blur_pad' ? 'เบลอ' : m === 'pillarbox' ? 'ย่อ'
  : m === 'crop' ? 'ครอป' : m;

// ── ดูคลิปทีละตัว · เล่น · หมุน · เลือกโหมดแนวตั้ง ────────────────

function openClip(i){ clOpen = i; drawClip(); $('#clip').showModal(); }

function drawClip(){
  const list = clList(), x = list[clOpen];
  if (!x) return $('#clip').close();
  const or = clOrient(x), rot = clRot(x);
  $('#cl-title').textContent = x.name;
  $('#cl-sub').textContent = `${x.w}×${x.h} · ${x.dur.toFixed(1)} วิ · ${x.codec}`
    + ` · ${(x.size / 1e6).toFixed(0)} MB · ${or === 'V' ? 'แนวตั้ง' : 'แนวนอน'}`;
  const b = $('#cl-body'); b.innerHTML = '';

  const spin = rot === 'transpose=1' ? ' r90' : rot === 'transpose=2' ? ' r270'
             : rot === 'transpose=1,transpose=1' ? ' r180' : '';
  const w = el('div', 'vwrap' + spin);
  const v = el('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true;
  v.src = `/clip/${x.name}`;
  v.onerror = () => { w.innerHTML = '';
    w.append(el('p', 'note', 'เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ (codec ' + x.codec
      + ') — ลองเปิดด้วย Safari หรือดูจากตัวอย่างที่ ffmpeg ทำให้ข้างล่าง')); };
  w.append(v); b.append(w);

  const s1 = el('div', 'sect');
  s1.append(el('h4', null, 'หมุนคลิป'));
  const seg = el('div', 'seg');
  CL.rotations.forEach(r => {
    const bt = el('button', null, r.label);
    bt.setAttribute('aria-pressed', rot === r.value);
    bt.onclick = () => { clSet('rot', x.name, r.value, x.rot); drawClip(); render(); };
    seg.append(bt);
  });
  s1.append(seg);
  s1.append(el('p', 'note', or === x.orient
    ? 'ภาพข้างบนหมุนด้วยเบราว์เซอร์ให้ดูมุมคร่าว ๆ — ตอนตัดจริง ffmpeg หมุนให้เหมือนกัน'
    : `หมุนแล้วกลายเป็น${or === 'V' ? 'แนวตั้ง' : 'แนวนอน'} — ชิ้นจากคลิปนี้ต้อง render ใหม่`
      + ' แต่ไม่ต้องอ่านคลิปใหม่ทั้งโฟลเดอร์'));
  b.append(s1);

  if (or === 'V'){
    const cur = clVmode(x) || CL.vertical_default;
    const s2 = el('div', 'sect');
    s2.append(el('h4', null, 'คลิปแนวตั้ง → จอ 16:9 เอาแบบไหน'));
    const wrap = el('div', 'vmodes');
    CL.vmodes.forEach(m => {
      const card = el('div', 'vm');
      card.setAttribute('aria-pressed', cur === m.value);
      const t = el('div', 't');
      const rb = el('input'); rb.type = 'radio'; rb.name = 'vm'; rb.checked = cur === m.value;
      rb.onchange = () => {
        // ตรงกับค่ากลางอยู่แล้ว = ไม่ต้องเขียนลงไฟล์ ปล่อยให้ตามค่ากลางไป
        clSet('vmode', x.name, m.value === CL.vertical_default ? '' : m.value, x.vmode);
        drawClip(); render();
      };
      t.append(rb, document.createTextNode(m.label));
      if (m.value === CL.vertical_default) t.append(el('span', 'sub', '· ค่ากลาง'));
      card.append(t, el('div', 'd', m.help));
      const go = el('button', 'sm', 'ดูของจริง');
      go.onclick = () => go.replaceWith(realPreview(x.name, m.value));
      card.append(go);
      wrap.append(card);
    });
    s2.append(wrap);
    s2.append(el('p', 'note', '"ดูของจริง" ตัด 3 วินาทีกลางคลิปด้วยฟิลเตอร์ชุดเดียวกับ'
      + 'ตอน render จริง ครั้งแรกรอ ~1 วินาที หลังจากนั้นเก็บ cache ไว้'));
    b.append(s2);
  }
  $('#cl-pick').checked = clPicked(x);
  $('#cl-prev').disabled = clOpen <= 0;
  $('#cl-next').disabled = clOpen >= list.length - 1;
}

function realPreview(name, mode){
  const box = el('div');
  const msg = el('div', 'd', 'กำลังทำตัวอย่าง…');
  const v = el('video');
  v.controls = true; v.loop = true; v.muted = true; v.playsInline = true;
  v.src = `/preview/${name}/${mode}`;
  v.oncanplay = () => { msg.remove(); v.play().catch(() => {}); };
  v.onerror = () => { msg.textContent = 'ทำตัวอย่างไม่สำเร็จ — ดู log ในเทอร์มินัล'; };
  box.append(msg, v);
  return box;
}

async function saveClips(){
  const exclude = CL.clips.filter(x => !clPicked(x)).map(x => x.name);
  if (exclude.length >= CL.clips.length)
    return toast('ต้องเหลืออย่างน้อย 1 คลิป', true);
  try {
    const r = await post('/api/clips', {exclude,
      rotations: {...clEdits.rot}, vmodes: {...clEdits.vmode},
      order: clEdits.order});      // null = ไม่ได้แตะลำดับ ของเดิมอยู่ต่อ
    clEdits = {pick:{}, rot:{}, vmode:{}, order:null};
    const s = r.clips.summary;
    let msg = `บันทึกแล้ว · เอาไปทำต่อ ${s.picked}/${s.total} คลิป`;
    if (r.reordered) msg += ' · ลำดับที่จัดเอง';
    if (r.retagged.length)
      msg += ` · หมุนใหม่ ${r.retagged.length} คลิป (ไม่ต้องอ่านคลิปใหม่)`;
    toast(msg);
    await load(true);
  } catch(e){ toast(e.message, true); }
}

// ── ขั้น 2 · เตรียมวิดีโอ ────────────────────────────────────────

// ขั้น 2 แบ่งเป็นสองกล่องตามราคาที่ต้องจ่าย: กล่องแรกทำในเครื่องล้วน กล่องสอง
// เรียกโมเดลจริง แต่ละกล่องมีสวิตช์ของตัวเองคุมปุ่มในกล่องนั้น — สวิตช์ปิดแล้ว
// ปุ่มยังอยู่ให้เห็นแต่กดไม่ได้ พร้อมบอกเหตุผล ดีกว่าซ่อนจนไม่มีใครรู้ว่ามี

const stepOf = id => (D.steps || []).find(x => x.id === id) || {};
const fieldOf = k => (D.fields || []).find(x => x.key === k);
const putField = (parent, k) => { const f = fieldOf(k); if (f) parent.appendChild(field(f)); };

// ขั้นนี้ต้องทำใหม่ไหม — ยังไม่เคยทำ หรือทำไว้แล้วแต่ค่าที่ใช้ตอนนั้นเปลี่ยนไปแล้ว
// (ตรรกะเดียวกับที่ serve.py ใช้เลือกขั้นให้ปุ่มหลัก จะได้ไม่บอกคนละอย่างกัน)
const stepPending = id => {
  const s = stepOf(id);
  return s.run && (!s.exists || (s.changed || []).length > 0);
};

function stepRow(id, no, label, tip){
  const s = stepOf(id);
  const row = el('div', 'acts');
  const b = el('button', 'runbtn', `${no} ${label}`);
  b.title = tip;
  b.dataset.step = id;            // poll() เอาไปขีดเส้นกะพริบใต้ปุ่มที่กำลังรัน
  if (!s.run){ b.classList.add('locked'); b.disabled = true; }
  b.onclick = () => runStep(id);
  row.appendChild(b);
  row.appendChild(el('span', !s.run ? 'note warnnote' : 'note',
    !s.run ? s.skip
      : s.exists ? ((s.changed || []).length
                     ? `ทำไว้แล้วแต่ค่าเปลี่ยนไปแล้ว — ${s.summary}`
                     : `✓ ${s.summary}`)
      : 'ยังไม่เคยทำ'));
  return row;
}

    : 'ของที่ต้องใช้ครบแล้ว — กดแล้วตัดทีละคลิปอย่างเดียว'));

      + 'สวิตช์ AI ของขั้น 3 เป็นคนละตัว ปิดตรงนี้ไม่กระทบขั้นนั้น'));

  box.appendChild(c);

// ── คลังชิ้น · ดูชิ้นที่ถูกกรองออก แล้วดึงกลับมาได้ ────────────────
//
// ตัวกรองใน [broll]/[ai.apply] ตัดสินจากตัวเลข (motion · ความสว่าง · คะแนน AI)
// ซึ่งพลาดได้เสมอ — ชิ้นที่มันคัดออกจึงยังอยู่ในคลังพร้อมเหตุผล กดดึงกลับได้
// ทีละชิ้นโดยไม่ต้องไปคลายค่าตัวกรองจนชิ้นอื่นที่ไม่อยากได้หลุดเข้ามาด้วย

const poolPieces = () => (POOL && POOL.pieces) || [];
const poolTouched = p => !p.ok || p.forced;   // ตัวกรองแตะชิ้นนี้ไหม
const poolInit = () => new Set(poolPieces().filter(p => p.forced).map(p => p.name));

function poolDirty(){
  if (!poolKeep) return 0;
  const was = poolInit();
  return [...new Set([...was, ...poolKeep])]
    .filter(n => was.has(n) !== poolKeep.has(n)).length;
}
function poolVisible(){
  return poolPieces().filter(p =>
    poolFilter === 'all' || (poolFilter === 'ok' ? p.ok : !p.ok));
}

function poolView(){
  if (!poolKeep) poolKeep = poolInit();
  const c = el('div', 'card');
  const s = POOL.summary || {};
  c.append(el('h3', null, `คลังชิ้น — ใช้ได้ ${s.usable} ชิ้น · ${mmss(s.duration_total || 0)}`
    + (s.excluded ? ` · ตัวกรองคัดออก ${s.excluded}` : '')
    + (s.forced ? ` · ดึงกลับเอง ${s.forced}` : '')));

  const bar = el('div', 'bar');
  const seg = el('div', 'seg');
  [['all', `ทั้งหมด ${s.pieces || 0}`], ['ok', `ใช้ได้ ${s.usable || 0}`],
   ['bad', `ถูกกรองออก ${s.excluded || 0}`]].forEach(([k, lab]) => {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', poolFilter === k);
    b.onclick = () => { poolFilter = k; render(); };
    seg.appendChild(b);
  });
  bar.append(seg);
  const bad = poolPieces().filter(p => !p.ok);
  if (bad.length)
    bar.append(btn('ดึงกลับทั้งหมดที่เห็น',
      () => { poolVisible().filter(p => !p.ok).forEach(p => poolKeep.add(p.name));
              render(); }));
  bar.append(el('span', 'spacer'));
  const n = poolDirty();
  const sv = el('button', 'primary', n ? `บันทึก + เตรียมคลังใหม่ (${n})` : 'ไม่มีอะไรให้บันทึก');
  sv.disabled = !n; sv.onclick = savePool;
  bar.append(sv);
  if (n) bar.append(btn('ทิ้งที่แก้', () => { poolKeep = poolInit(); render(); }));
  c.appendChild(bar);

  const shown = poolVisible();
  const two = el('div', 'two');
  [['TALK', 'วิดีโอพูด'], ['BROLL', 'วิดีโอวิว']].forEach(([k, lab]) => {
    const mine = shown.filter(p => p.kind === k);
    const col = el('div');
    const h = el('div', 'colhead');
    h.append(el('span', 'kind ' + k, lab), el('span', 'sub',
      `${mine.length} ชิ้น · ${mmss(mine.reduce((a, p) => a + p.dur, 0))}`));
    col.appendChild(h);
    const wrap = el('div', 'scroll'), ul = el('ul');
    mine.slice(0, 500).forEach(p => ul.appendChild(poolRow(p)));
    if (!mine.length) ul.appendChild(el('li', 'empty', 'ไม่มีชิ้นในหมวดนี้'));
    wrap.appendChild(ul); col.appendChild(wrap);
    two.appendChild(col);
  });
  c.appendChild(two);
  c.appendChild(el('p', 'note',
    'กดที่ชิ้นเพื่อดูช่วงที่จะตัดจริง · ติ๊กช่องเขียวเพื่อดึงชิ้นที่ตัวกรองคัดออกกลับเข้าคลัง'));
  return c;
}

function poolRow(p){
  const back = poolKeep.has(p.name);
  const li = el('li', 'row' + (p.ok ? '' : ' bad') + (back && poolTouched(p) ? ' kept' : ''));
  if (poolTouched(p)){
    const cb = el('input'); cb.type = 'checkbox'; cb.className = 'back'; cb.checked = back;
    cb.title = 'ดึงกลับเข้าคลัง — ข้ามตัวกรองให้ชิ้นนี้';
    cb.onclick = e => { e.stopPropagation();
      cb.checked ? poolKeep.add(p.name) : poolKeep.delete(p.name); render(); };
    li.append(cb);
  } else {
    li.append(el('div', 'idx', ''));
  }
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.src = `/thumb/${p.name}.jpg`;
  li.append(img);
  const mid = el('div', 'mid');
  const nm = el('div', 'name'); nm.append(p.id || p.name);
  if (p.used) nm.append(el('span', 'sub', '· อยู่ในหนังแล้ว'));
  if (p.forced) nm.append(el('span', 'sub', '· ดึงกลับเอง'));
  mid.append(nm);
  mid.append(el('div', !p.ok ? 'sub why' : 'sub',
    !p.ok ? '✕ ' + (p.why || 'ถูกกรองออก')
      : (p.meaning || p.text || `motion ${p.motion ?? '—'} · สว่าง ${p.bright ?? '—'}`)));
  li.append(mid, el('div', 'dur', p.dur.toFixed(1) + 'ว'));
  li.onclick = () => openPiece(p.id);
  return li;
}

async function savePool(){
  try {
    const r = await post('/api/pool', {keep: [...poolKeep]});
    poolKeep = null;
    const s = r.pool.summary;
    toast(`เตรียมคลังใหม่แล้ว · ใช้ได้ ${s.usable} ชิ้น · ${mmss(s.duration_total)}`
      + (s.forced ? ` (ดึงกลับเอง ${s.forced})` : ''));
    await load(true);
  } catch(e){ toast(e.message, true); }
}

// ── ดูชิ้นทีละชิ้น · เล่นเฉพาะช่วงที่จะตัดจริง ────────────────────

function openPiece(id){ pcOpen = id; drawPiece(); $('#piece').showModal(); }

function drawPiece(){
  const list = poolVisible();
  const i = list.findIndex(x => x.id === pcOpen), p = list[i];
  if (!p) return $('#piece').close();
  $('#pc-title').textContent = p.id || p.name;
  $('#pc-sub').textContent = `${p.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว'} · `
    + `${p.start.toFixed(2)}–${p.end.toFixed(2)} วิ ของคลิปยาว ${p.clip_duration.toFixed(1)} วิ`;
  const b = $('#pc-body'); b.innerHTML = '';

  const w = el('div', 'vwrap');
  const v = el('video');
  v.controls = true; v.preload = 'metadata'; v.playsInline = true;
  v.src = `/clip/${p.name}`;
  v.addEventListener('loadedmetadata', () => { v.currentTime = p.start; });
  v.addEventListener('timeupdate', () => {
    // หยุดที่ปลายช่วง แล้วถอยกลับไปต้นช่วง — กดเล่นซ้ำได้เลยโดยไม่ต้องลากเอง
    if ($('#pc-only').checked && v.currentTime >= p.end){
      v.pause(); v.currentTime = p.start;
    }
  });
  v.onerror = () => { w.innerHTML = '';
    w.append(el('p', 'note', 'เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ — ลองเปิดด้วย Safari')); };
  w.append(v); b.append(w);

  // ช่วงที่ตัดอยู่ตรงไหนของคลิป
  const tr = el('div', 'track');
  const on = el('div', 'on');
  on.style.left = (p.start / Math.max(p.clip_duration, 0.01) * 100) + '%';
  on.style.width = (p.dur / Math.max(p.clip_duration, 0.01) * 100) + '%';
  tr.append(on); b.append(tr);
  b.append(el('p', 'note', `ตัดเอา ${p.dur.toFixed(2)} วิ จากทั้งคลิป `
    + `${p.clip_duration.toFixed(1)} วิ`));

  if (poolTouched(p)){
    const s = el('div', 'sect');
    s.append(el('h4', null, p.ok ? 'ชิ้นนี้ถูกดึงกลับมาเอง' : 'ตัวกรองคัดชิ้นนี้ออก'));
    if (p.why) s.append(el('div', 'stale', p.why));
    const l = el('label', 'ck');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = poolKeep.has(p.name);
    cb.onchange = () => { cb.checked ? poolKeep.add(p.name) : poolKeep.delete(p.name);
                          drawPiece(); render(); };
    l.append(cb, document.createTextNode('ดึงกลับเข้าคลัง — ข้ามตัวกรองให้คลิปนี้'));
    s.append(l);
    s.append(el('p', 'note', 'ติ๊กแล้วกด "บันทึก + เตรียมคลังใหม่" ที่หัวคลัง '
      + 'ระบบจะเตรียมคลังใหม่ให้ทันที (ไม่ถึงวินาที)'));
    b.append(s);
  }

  const kv = [['ประเภท', p.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว'],
              ['ช่วง', `${p.start.toFixed(2)} – ${p.end.toFixed(2)} วิ`],
              ['ยาว', p.dur.toFixed(2) + ' วิ']];
  if (p.motion != null) kv.push(['ความสั่น', p.motion]);
  if (p.bright != null) kv.push(['ความสว่าง', p.bright]);
  if (p.meaning) kv.push(['ความหมาย', p.meaning]);
  if (p.chapter_title) kv.push(['บท', p.chapter_title]);
  if (p.ai_score != null) kv.push(['คะแนน AI', (+p.ai_score).toFixed(2)]);
  if (p.used) kv.push(['สถานะ', 'อยู่ในหนังปัจจุบันแล้ว']);
  const dl = el('dl', 'kv'); dl.style.marginTop = '.7rem';
  kv.forEach(([k, val]) => dl.append(el('dt', null, k), el('dd', null, String(val))));
  b.append(dl);
  if (p.text) b.append(el('div', 'quote', p.text));

  $('#pc-prev').disabled = i <= 0;
  $('#pc-next').disabled = i >= list.length - 1;
}

function pieceStep(d){
  const list = poolVisible();
  const i = list.findIndex(x => x.id === pcOpen) + d;
  if (list[i]){ pcOpen = list[i].id; drawPiece(); }
}

// ── ขั้น 3 · รวมเป็นหนัง ─────────────────────────────────────────

const MODE_HELP = {
  all: ['เอาทั้งหมด', 'ทุกชิ้นในคลัง เรียงตามลำดับจากขั้น 1'],
  pattern: ['สลับตามรูปแบบ', 'พูด → วิว → วิว วนไป'],
  budget: ['กำหนดเวลารวม', 'พูดกี่นาที วิวกี่นาที'],
  numbers: ['ตามเลขคลิป', 'เช่น 7068-7200, 7305'],
  timerange: ['ตามช่วงเวลาถ่าย', 'เอาเฉพาะวันที่ระบุ'],
  manual: ['เลือกทีละชิ้น', 'ติ๊กเองจากคลัง'],
  ai: ['ให้ AI เลือก', 'อิงจากความหมาย + โจทย์ที่สั่ง'],
};
const MODE_FIELDS = {
  all: [], pattern: ['compose.pattern', 'compose.target_minutes'],
  budget: ['compose.talk_minutes', 'compose.broll_minutes', 'compose.avoid_adjacent'],
  numbers: ['compose.numbers'], timerange: ['compose.from', 'compose.to'],
  manual: [], ai: ['compose.context', 'compose.ask_max'],
};
// ── แกนที่ 2 · เรียงยังไง ─────────────────────────────────────────
//
// ตัวเลือกกับคำอธิบายมาจาก settings.FIELDS ที่เดียว ที่นี่มีแค่คำเตือนเฉพาะคู่
// ที่วิธีเลือกชิ้นกับวิธีเรียงมันตีกันเอง

function orderNote(omode, cmode, f){
  if (cmode === 'pattern')
    return omode === 'pick'
      ? 'โหมดสลับตามรูปแบบจัดลำดับด้วยการสลับประเภทอยู่แล้ว — "pick" กับแบบอื่นให้ผลเท่ากัน'
      : `สลับ พูด/วิว ตามรูปแบบข้างบน โดยข้างในคิวของแต่ละประเภทเดินตาม`
        + ` "${f.labels[omode]}" — การสลับไม่หาย`;
  if ((f.own_order_modes || []).includes(cmode) && omode !== 'pick')
    return `⚠ โหมดนี้จัดลำดับมาให้เองแล้ว แต่ตั้งไว้ "${f.labels[omode]}"`
      + ' จะเรียงทับลำดับนั้น — อยากเก็บไว้ให้เลือก "ตามที่วิธีเลือกจัดให้"';
  return (f.helps || {})[omode] || '';
}

// บทที่ AI แบ่งเป็น "วิธีเรียง" อีกแบบที่ซ่อนอยู่ใต้ pick — ไม่ทับตัวเลือกของคน
// อีกแล้ว (ดู compose.order_pieces) ตรงนี้แค่บอกว่าตอนนี้มันได้จัดหรือไม่ได้จัด
function aiOrderNote(omode, cmode, f){
  const aiModes = (D.fields.find(x => x.key === 'compose.mode') || {}).ai_options || [];
  if (aiModes.includes(cmode))
    return omode === 'pick'
      ? 'เก็บลำดับที่ AI เลือกมาไว้ตามเดิม'
      : `AI เลือกช่วงให้ แล้วเรียงใหม่ตาม "${f.labels[omode]}" `
        + '— อยากเก็บลำดับที่ AI จัดมา เลือก "ตามที่วิธีเลือกจัดให้"';
  const ch = (S && S.ai && S.ai.chapters) || 0;
  if (!ch || !val('ai.enabled') || !val('ai.apply.order')) return '';
  if (cmode === 'pattern' || (f.own_order_modes || []).includes(cmode))
    return `มี ${ch} บทจาก AI แต่โหมด "${(MODE_HELP[cmode] || ['นี้'])[0]}" จัดลำดับมาเองแล้ว`
      + ' — บทไม่ได้ถูกใช้จัดลำดับ';
  return omode === 'pick'
    ? `บทที่ AI แบ่งไว้ ${ch} บท เป็นตัวจัดลำดับให้ตอนนี้`
      + ' — ปิดได้ที่ "ให้บทที่ AI แบ่งเป็นตัวจัดลำดับ" ข้างบน'
    : `มี ${ch} บทจาก AI ที่จัดลำดับได้ แต่เลือก "${f.labels[omode]}" ไว้ `
      + 'ซึ่งชนะเสมอ — อยากให้ AI จัดให้ เลือก "ตามที่วิธีเลือกจัดให้"';
}

function orderPicker(cmode){
  const f = D.fields.find(x => x.key === 'order.mode');
  if (!f) return el('div');
  f.own_order_modes = (D.fields.find(x => x.key === 'compose.mode') || {}).own_order || [];
  const cur = val('order.mode');
  const box = el('div', 'sect');
  box.append(el('h4', null, 'แล้วเรียงยังไง'));
  const seg = el('div', 'seg wrap');
  f.options.forEach(o => {
    const b = el('button', null, f.labels[o]);
    b.title = (f.helps || {})[o] || '';
    b.setAttribute('aria-pressed', cur === o);
    b.onclick = () => { setKey('order.mode', D.values['order.mode'], o); render(); };
    seg.append(b);
  });
  box.append(seg, el('p', 'note', orderNote(cur, cmode, f)));
  const ai = aiOrderNote(cur, cmode, f);
  if (ai) box.append(el('p', 'note', ai));
  const rv = D.fields.find(x => x.key === 'order.reverse');
  if (rv) box.append(field(rv));
  return box;
}

// บอกก่อนกดว่าจะส่งไปกี่ชิ้น — คลังใหญ่เกินแล้วโมเดลใช้โควตาตอบหมดไปกับการคิด
// จนไม่ได้คำตอบ (เคยเจอจริง: 398 ชิ้น รอ 11 นาทีแล้วได้ศูนย์)
function askSize(){
  const ok = ((POOL && POOL.pieces) || []).filter(p => p.ok).length;
  const cap = Number(val('compose.ask_max') || 0);
  const send = cap > 0 ? Math.min(ok, cap) : ok;
  const p = el('p', 'note');
  if (!ok) p.textContent = 'ยังไม่มีคลัง — ทำขั้น 2 ก่อน';
  else if (cap > 0 && ok > cap)
    p.textContent = `คลัง ${ok} ชิ้น → ส่งให้ AI ${send} ชิ้น`
      + ` (คัดตัวคะแนนดีที่สุด คงสัดส่วนพูด:วิว ที่เหลือไม่ได้หายไปจากคลัง)`;
  else if (cap > 0) p.textContent = `คลัง ${ok} ชิ้น — ไม่ถึงเพดาน ส่งไปทั้งหมด`;
  else {
    p.className = 'note warnnote';
    p.textContent = `ส่งทั้งคลัง ${ok} ชิ้น — เกิน ~150 ชิ้นเมื่อไร โมเดลมีสิทธิ์`
      + ` ใช้โควตาตอบหมดไปกับการคิดจนไม่ตอบอะไรกลับมา ตั้งเพดานไว้ดีกว่า`;
  }
  return p;
}

// ── ความเห็นที่ AI เคยให้ไว้ ────────────────────────────────────────
//
// คนละเรื่องกับปุ่ม "ให้ AI จัดให้" — ปุ่มนั้นคือ *เรียกโมเดลใหม่* อันนี้คือ *อ่าน
// ai.json ที่ขั้น 2 ทำไว้แล้ว* (บท · คะแนนช็อต) ซึ่งไม่เสียโควตาสักนิด แต่ก็ยัง
// ตัดสินผลลัพธ์อยู่ดี กดโหมดกฎล้วนแล้วสวิตช์นี้ถูกปิดให้เอง — เปิดกลับได้ที่นี่
function aiOpinion(usesAI){
  const en = D.fields.find(f => f.key === 'ai.enabled');
  if (!en) return null;
  const on = val('ai.enabled'), ch = (S && S.ai && S.ai.chapters) || 0;
  const box = el('div', 'sect');
  box.append(el('h4', null, 'ความเห็นที่ AI เคยให้ไว้'), field(en));
  box.append(el('p', 'note', on
    ? 'อ่านจาก ai.json ที่ทำไว้แล้ว — ไม่เรียกโมเดลใหม่ ไม่เสียโควตา'
      + (ch ? ` · มี ${ch} บท` : ' · ยังไม่มีบท')
    : 'กฎล้วน — ตอนรวมเป็นหนังไม่อ่าน ai.json เลย ทั้งบทและคะแนน'
      + (usesAI ? ' (ตัว "ให้ AI เลือก" ยังทำงาน มันอ่าน compose.json คนละไฟล์)' : '')));
  if (on && ch){
    const o = D.fields.find(f => f.key === 'ai.apply.order');
    if (o) box.append(field(o));
  }
  // เปิดค้างไว้จากรอบก่อนแล้วมากดโหมดกฎล้วน — auto-off ทำงานตอนคลิกเท่านั้น
  // ค่าที่บันทึกไว้แล้วจึงต้องมีคนบอกว่ามันยังมีผลอยู่ ไม่ใช่ปล่อยให้เข้าใจผิด
  if (on && !usesAI)
    box.append(el('p', 'note warnnote', 'โหมดที่เลือกอยู่ในกลุ่ม "ไม่ใช้ AI" '
      + 'แต่สวิตช์นี้ยังเปิดค้างอยู่ — บทกับคะแนนของ AI ยังมีผลตอนรวมเป็นหนัง '
      + 'ปิดเพื่อให้เป็นกฎล้วนจริง'));
  // สวิตช์นี้เป็นของขั้น 3 ล้วน ๆ ปิดแล้วคลังจากขั้น 2 ไม่เปลี่ยนตาม — ถ้าขั้น 2
  // ยังเปิด AI อยู่ ก็ต้องบอกว่า "กฎล้วน" นี้ครอบแค่ครึ่งเส้น
  if (!on && val('ai.apply.enabled'))
    box.append(el('p', 'note warnnote', 'กฎล้วนเฉพาะตอนรวมเป็นหนัง — '
      + 'คลังจากขั้น 2 ยังถูก AI ตัด/คัดมาแล้ว อยากได้กฎล้วนทั้งเส้นต้องปิดสวิตช์ '
      + 'AI ที่ขั้น 2 แล้วกด "ตัดทีละคลิป" ใหม่'));
  return box;
}

function stepCompose(box){
  const mode = val('compose.mode') || 'all';
  const c = el('div', 'card');
  c.appendChild(head(3));

  // แยกให้เห็นชัดว่าอันไหนเสียโควตา AI อันไหนเป็นกฎล้วน — กดผิดทีเสียเงินจริง
  const f = D.fields.find(x => x.key === 'compose.mode') || {};
  const aiModes = f.ai_options || [];
  const own = f.own_order || [];
  [[false, 'ไม่ใช้ AI', 'ตัดสินด้วยกฎล้วน กดกี่รอบก็ได้ ไม่เสียโควตา'],
   [true, 'ใช้ AI', 'เรียกโมเดลจริงทุกครั้งที่กด — เสียโควตา']].forEach(([isAI, ttl, sub]) => {
    const list = Object.keys(MODE_HELP).filter(m => aiModes.includes(m) === isAI);
    if (!list.length) return;
    const h = el('div', 'grouphd' + (isAI ? ' ai' : ''));
    h.append(el('b', null, ttl), el('span', null, sub));
    c.appendChild(h);
    const modes = el('div', 'modes');
    list.forEach(m => {
      const [t, d] = MODE_HELP[m];
      const b = el('button');
      b.setAttribute('aria-pressed', m === mode);
      b.append(el('span', 'mt', t), el('span', 'md', d));
      b.onclick = () => {
        setKey('compose.mode', D.values['compose.mode'], m);
        // โหมดที่ให้ลำดับมาเป็นรายการตรง ๆ — ตั้งลำดับเป็น pick ให้เลย
        // ไม่งั้นค่าตั้งต้น (ลำดับจากขั้น 1) จะไปเรียงทับสิ่งที่มันเพิ่งจัดมา
        if (own.includes(m) && val('order.mode') !== 'pick')
          setKey('order.mode', D.values['order.mode'], 'pick');
        // "ไม่ใช้ AI · ตัดสินด้วยกฎล้วน" ต้องแปลว่ากฎล้วนจริง — ปิดสวิตช์อ่าน
        // ai.json ให้เลย ไม่งั้นบทกับคะแนนของ AI ยังตัดสินอยู่เงียบ ๆ
        if (!isAI && val('ai.enabled')) setKey('ai.enabled', D.values['ai.enabled'], false);
        render();
      };
      modes.appendChild(b);
    });
    c.appendChild(modes);
  });

  (MODE_FIELDS[mode] || []).forEach(k => {
    const f = D.fields.find(x => x.key === k); if (f) c.appendChild(field(f));
  });
  if (mode === 'manual')
    c.appendChild(el('p', 'note', 'ติ๊กชิ้นที่ต้องการในคลังข้างล่าง แล้วกด "จัดใหม่"'));
  if (mode === 'ai') c.appendChild(askSize());

  const usesAI = aiModes.includes(mode);
  const ao = aiOpinion(usesAI);
  if (ao) c.appendChild(ao);
  c.appendChild(orderPicker(mode));

  const a = el('div', 'acts');
  const go = el('button', 'primary runbtn', usesAI ? 'ให้ AI จัดให้' : 'จัดใหม่');
  go.dataset.step = 'compose';
  go.onclick = () => doCompose(mode);
  a.append(go);
