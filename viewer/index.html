// ── คลังชิ้น · ดูชิ้นที่ถูกกรองออก แล้วดึงกลับมาได้ ────────────────
//
// ตัวกรองใน [broll]/[ai.apply] ตัดสินจากตัวเลข (motion · ความสว่าง · คะแนน AI)
// ซึ่งพลาดได้เสมอ — ชิ้นที่มันคัดออกจึงยังอยู่ในคลังพร้อมเหตุผล กดดึงกลับได้
// ทีละชิ้นโดยไม่ต้องไปคลายค่าตัวกรองจนชิ้นอื่นที่ไม่อยากได้หลุดเข้ามาด้วย

const poolPieces = () => (POOL && POOL.pieces) || [];
const poolTouched = p => !p.ok || p.forced;   // ตัวกรองแตะชิ้นนี้ไหม
const poolInit = () => new Set(poolPieces().filter(p => p.forced).map(p => p.name));

function poolDirty(){
  if (!poolKeep) return 0;
  const was = poolInit();
  return [...new Set([...was, ...poolKeep])]
    .filter(n => was.has(n) !== poolKeep.has(n)).length;
}
function poolVisible(){
  return poolPieces().filter(p =>
    poolFilter === 'all' || (poolFilter === 'ok' ? p.ok : !p.ok));
}

function poolView(){
  if (!poolKeep) poolKeep = poolInit();
  const c = el('div', 'card');
  const s = POOL.summary || {};
  c.append(el('h3', null, `คลังชิ้น — ใช้ได้ ${s.usable} ชิ้น · ${mmss(s.duration_total || 0)}`
    + (s.excluded ? ` · ตัวกรองคัดออก ${s.excluded}` : '')
    + (s.forced ? ` · ดึงกลับเอง ${s.forced}` : '')));

  const bar = el('div', 'bar');
  const seg = el('div', 'seg');
  [['all', `ทั้งหมด ${s.pieces || 0}`], ['ok', `ใช้ได้ ${s.usable || 0}`],
   ['bad', `ถูกกรองออก ${s.excluded || 0}`]].forEach(([k, lab]) => {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', poolFilter === k);
    b.onclick = () => { poolFilter = k; render(); };
    seg.appendChild(b);
  });
  bar.append(seg);
  const bad = poolPieces().filter(p => !p.ok);
  if (bad.length)
    bar.append(btn('ดึงกลับทั้งหมดที่เห็น',
      () => { poolVisible().filter(p => !p.ok).forEach(p => poolKeep.add(p.name));
              render(); }));
  bar.append(el('span', 'spacer'));
  const n = poolDirty();
  const sv = el('button', 'primary', n ? `บันทึก + เตรียมคลังใหม่ (${n})` : 'ไม่มีอะไรให้บันทึก');
  sv.disabled = !n; sv.onclick = savePool;
  bar.append(sv);
  if (n) bar.append(btn('ทิ้งที่แก้', () => { poolKeep = poolInit(); render(); }));
  c.appendChild(bar);

  const shown = poolVisible();
  const two = el('div', 'two');
  [['TALK', 'วิดีโอพูด'], ['BROLL', 'วิดีโอวิว']].forEach(([k, lab]) => {
    const mine = shown.filter(p => p.kind === k);
    const col = el('div');
    const h = el('div', 'colhead');
    h.append(el('span', 'kind ' + k, lab), el('span', 'sub',
      `${mine.length} ชิ้น · ${mmss(mine.reduce((a, p) => a + p.dur, 0))}`));
    col.appendChild(h);
    const wrap = el('div', 'scroll'), ul = el('ul');
    mine.slice(0, 500).forEach(p => ul.appendChild(poolRow(p)));
    if (!mine.length) ul.appendChild(el('li', 'empty', 'ไม่มีชิ้นในหมวดนี้'));
    wrap.appendChild(ul); col.appendChild(wrap);
    two.appendChild(col);
  });
  c.appendChild(two);
  c.appendChild(el('p', 'note',
    'กดที่ชิ้นเพื่อดูช่วงที่จะตัดจริงในแถบข้าง (Esc ปิด · ← → ข้ามชิ้น) · '
    + 'ติ๊กช่องเขียวเพื่อดึงชิ้นที่ตัวกรองคัดออกกลับเข้าคลัง'));
  return c;
}

function poolRow(p){
  const back = poolKeep.has(p.name);
  // ขีดกรอบใบที่เปิดค้างอยู่ — การ์ดไม่ได้บังรายการแล้ว ต้องบอกได้ว่ากำลังดูใบไหน
  const li = el('li', 'row' + (p.ok ? '' : ' bad') + (back && poolTouched(p) ? ' kept' : '')
                     + (p.id === pcOpen ? ' sel' : ''));
  if (poolTouched(p)){
    const cb = el('input'); cb.type = 'checkbox'; cb.className = 'back'; cb.checked = back;
    cb.title = 'ดึงกลับเข้าคลัง — ข้ามตัวกรองให้ชิ้นนี้';
    cb.onclick = e => { e.stopPropagation();
      cb.checked ? poolKeep.add(p.name) : poolKeep.delete(p.name); render(); };
    li.append(cb);
  } else {
    li.append(el('div', 'idx', ''));
  }
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.src = `/thumb/${p.name}.jpg`;
  li.append(img);
  const mid = el('div', 'mid');
  const nm = el('div', 'name'); nm.append(p.id || p.name);
  if (p.used) nm.append(el('span', 'sub', '· อยู่ในหนังแล้ว'));
  if (p.forced) nm.append(el('span', 'sub', '· ดึงกลับเอง'));
  mid.append(nm);
  mid.append(el('div', !p.ok ? 'sub why' : 'sub',
    !p.ok ? '✕ ' + (p.why || 'ถูกกรองออก')
      : (p.meaning || p.text || `motion ${p.motion ?? '—'} · สว่าง ${p.bright ?? '—'}`)));
  li.append(mid, el('div', 'dur', p.dur.toFixed(1) + 'ว'));
  li.onclick = () => openPiece(p.id);
  return li;
}

async function savePool(){
  try {
    const r = await post('/api/pool', {keep: [...poolKeep]});
    poolKeep = null;
    const s = r.pool.summary;
    toast(`เตรียมคลังใหม่แล้ว · ใช้ได้ ${s.usable} ชิ้น · ${mmss(s.duration_total)}`
      + (s.forced ? ` (ดึงกลับเอง ${s.forced})` : ''));
    await load(true);
  } catch(e){ toast(e.message, true); }
}

// ── ดูชิ้นทีละชิ้น · เล่นเฉพาะช่วงที่จะตัดจริง ────────────────────

// เคยเป็น <dialog> แบบ modal เหมือนที่การ์ดคลิปในขั้น 1 เคยเป็น แล้วเจอปัญหา
// เดียวกันเป๊ะ: งานจริงตรงนี้คือ *ไล่ดูทีละชิ้นแล้วตัดสินว่าจะดึงกลับไหม* ซึ่ง
// ต้องเห็นชิ้นที่กำลังดูพร้อมกับรายการที่เหลือ กล่อง modal บังรายการทั้งกองไว้
// ข้างหลัง เทียบกับชิ้นอื่นไม่ได้เลย และต้องปิดก่อนถึงจะกดชิ้นถัดไปได้
//
// ย้ายมาอยู่แถบข้างที่เดียวกับขั้น 1 แล้วกดชิ้นอื่นในรายการได้เลยโดยไม่ต้องปิดก่อน
// แถบข้างปักหมุดอยู่แล้วจึงเลื่อนตามไปด้วย

// แถบข้างมีที่เดียว เปิดใบนี้ = ปิดใบดูคลิปจากบทพูด (และในทางกลับกันที่ trOpen)
function openPiece(id){ pcOpen = id; tkOpen = null; render(); }
function closePiece(){ pcOpen = null; render(); }

function drawPiece(){
  const list = poolVisible();
  const i = list.findIndex(x => x.id === pcOpen), p = list[i];
  if (!p) return false;              // เปลี่ยนตัวกรองจนชิ้นที่เปิดค้างไว้หายไป

  const box = $('#side-piece');
  // ยังเป็นชิ้นเดิม = ย้ายตัว <video> เดิมมาใช้ต่อ ไม่สร้างใหม่ — เหตุผลเดียวกับ
  // การ์ดคลิป: ติ๊กดึงกลับหรือสลับตัวกรองที การ์ดถูกวาดใหม่ทั้งใบ ถ้าสร้าง
  // <video> ใหม่ทุกรอบ วิดีโอจะเด้งกลับต้นช่วงแล้วหยุด ทุกครั้งที่แตะอะไรก็ตาม
  const keep = box.dataset.piece === p.id ? box.querySelector('.vwrap video') : null;
  box.innerHTML = '';
  box.hidden = false;
  box.dataset.piece = p.id;

  const head = el('div', 'ch');
  const ttl = el('div');
  ttl.append(el('h3', null, p.id || p.name),
             el('div', 'm', `${p.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว'} · `
               + `${p.start.toFixed(2)}–${p.end.toFixed(2)} วิ `
               + `ของคลิปยาว ${p.clip_duration.toFixed(1)} วิ`));
  const cls = el('button', 'ghost', '✕');
  cls.title = 'ปิด (Esc)';
  cls.onclick = closePiece;
  head.append(ttl, el('span', 'spacer'), cls);
  box.append(head);

  const b = el('div', 'cb');
  box.append(b);

  // หมุนตามที่ตั้งไว้ในขั้น 1 — ชิ้นพกค่าหมุนของคลิปตัวเองมาด้วยอยู่แล้ว สอง
  // การ์ดนี้อยู่ที่เดียวกันแล้ว ใบหนึ่งหมุนอีกใบไม่หมุนจะอ่านว่าเป็นคนละคลิป
  const rot = p.rot_override || '';
  const spin = rot === 'transpose=1' ? ' r90' : rot === 'transpose=2' ? ' r270'
             : rot === 'transpose=1,transpose=1' ? ' r180' : '';
  const w = el('div', 'vwrap' + spin);
  let v = keep;
  if (!v){
    v = el('video');
    v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    v.src = `/clip/${p.name}`;
    v.addEventListener('loadedmetadata', () => { v.currentTime = p.start; });
    v.addEventListener('timeupdate', () => {
      // หยุดที่ปลายช่วง แล้วถอยกลับไปต้นช่วง — กดเล่นซ้ำได้เลยโดยไม่ต้องลากเอง
      if (pcOnly && v.currentTime >= p.end){ v.pause(); v.currentTime = p.start; }
    });
  }
  v.onerror = () => { w.innerHTML = '';
    w.append(el('p', 'note', 'เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ — ลองเปิดด้วย Safari')); };
  w.append(v); b.append(w);

  // ช่วงที่ตัดอยู่ตรงไหนของคลิป
  const tr = el('div', 'track');
  const on = el('div', 'on');
  on.style.left = (p.start / Math.max(p.clip_duration, 0.01) * 100) + '%';
  on.style.width = (p.dur / Math.max(p.clip_duration, 0.01) * 100) + '%';
  tr.append(on); b.append(tr);
  b.append(el('p', 'note', `ตัดเอา ${p.dur.toFixed(2)} วิ จากทั้งคลิป `
    + `${p.clip_duration.toFixed(1)} วิ`));

  if (poolTouched(p)){
    const s = el('div', 'sect');
    s.append(el('h4', null, p.ok ? 'ชิ้นนี้ถูกดึงกลับมาเอง' : 'ตัวกรองคัดชิ้นนี้ออก'));
    if (p.why) s.append(el('div', 'stale', p.why));
    const l = el('label', 'ck');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = poolKeep.has(p.name);
    cb.onchange = () => { cb.checked ? poolKeep.add(p.name) : poolKeep.delete(p.name);
                          render(); };
    l.append(cb, document.createTextNode('ดึงกลับเข้าคลัง — ข้ามตัวกรองให้คลิปนี้'));
    s.append(l);
    s.append(el('p', 'note', 'ติ๊กแล้วกด "บันทึก + เตรียมคลังใหม่" ที่หัวคลัง '
      + 'ระบบจะเตรียมคลังใหม่ให้ทันที (ไม่ถึงวินาที)'));
    b.append(s);
  }

  const kv = [['ประเภท', p.kind === 'TALK' ? 'ช่วงพูด' : 'ช่วงวิว'],
              ['ช่วง', `${p.start.toFixed(2)} – ${p.end.toFixed(2)} วิ`],
              ['ยาว', p.dur.toFixed(2) + ' วิ']];
  if (p.motion != null) kv.push(['ความสั่น', p.motion]);
  if (p.bright != null) kv.push(['ความสว่าง', p.bright]);
  if (p.meaning) kv.push(['ความหมาย', p.meaning]);
  if (p.chapter_title) kv.push(['บท', p.chapter_title]);
  if (p.ai_score != null) kv.push(['คะแนน AI', (+p.ai_score).toFixed(2)]);
  if (p.used) kv.push(['สถานะ', 'อยู่ในหนังปัจจุบันแล้ว']);
  const dl = el('dl', 'kv'); dl.style.marginTop = '.7rem';
  kv.forEach(([k, val]) => dl.append(el('dt', null, k), el('dd', null, String(val))));
  b.append(dl);
  if (p.text) b.append(el('div', 'quote', p.text));

  // แถวล่างติดขอบการ์ดไว้เสมอ — เลื่อนอ่านรายละเอียดอยู่ก็ยังข้ามชิ้นได้
  const f = el('div', 'cf');
  const lab = el('label', 'ck');
  const only = el('input'); only.type = 'checkbox'; only.checked = pcOnly;
  only.onchange = () => { pcOnly = only.checked; };
  lab.append(only, document.createTextNode('เล่นเฉพาะช่วงที่ตัด'));
  const prev = el('button', 'sm', '←'), next = el('button', 'sm', '→');
  prev.title = 'ชิ้นก่อนหน้า (←)'; next.title = 'ชิ้นถัดไป (→)';
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => pieceStep(-1);
  next.onclick = () => pieceStep(1);
  f.append(lab, el('span', 'spacer'),
           el('span', 'note', `${i + 1}/${list.length}`), prev, next);
  box.append(f);
  return true;
}

function pieceStep(d){
  const list = poolVisible();
  const i = list.findIndex(x => x.id === pcOpen) + d;
  if (list[i]){ pcOpen = list[i].id; render(); }
}

// ปิดด้วย Esc · ข้ามชิ้นด้วยลูกศรซ้าย-ขวา — คู่กับที่การ์ดคลิปในขั้น 1 ทำ
// (ตอนเป็น <dialog> Esc ทำงานให้ฟรี ย้ายมาเป็นการ์ดแล้วต้องทำเอง)
document.addEventListener('keydown', e => {
  if (step !== 2 || pcOpen == null || !keyFree(e)) return;
  const list = poolVisible();
  const i = list.findIndex(x => x.id === pcOpen);
  if (e.key === 'Escape'){ e.preventDefault(); return closePiece(); }
  if (e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); pieceStep(-1); }
  if (e.key === 'ArrowRight' && i >= 0 && i < list.length - 1){
    e.preventDefault(); pieceStep(1); }
});

// ── ขั้น 3 · รวมเป็นหนัง ─────────────────────────────────────────

const MODE_HELP = {
  all: ['เอาทั้งหมด', 'ทุกชิ้นในคลัง เรียงตามลำดับจากขั้น 1'],
  pattern: ['สลับตามรูปแบบ', 'พูด → วิว → วิว วนไป'],
  budget: ['กำหนดเวลารวม', 'พูดกี่นาที วิวกี่นาที'],
  numbers: ['ตามเลขคลิป', 'เช่น 7068-7200, 7305'],
  timerange: ['ตามช่วงเวลาถ่าย', 'เอาเฉพาะวันที่ระบุ'],
  manual: ['เลือกทีละชิ้น', 'ติ๊กเองจากคลัง'],
  ai: ['ให้ AI เลือก', 'อิงจากความหมาย + โจทย์ที่สั่ง'],
};
const MODE_FIELDS = {
  all: [], pattern: ['compose.pattern', 'compose.target_minutes'],
  budget: ['compose.talk_minutes', 'compose.broll_minutes', 'compose.avoid_adjacent'],
  numbers: ['compose.numbers'], timerange: ['compose.from', 'compose.to'],
  manual: [], ai: ['compose.context', 'compose.ask_max'],
};
// ── แกนที่ 2 · เรียงยังไง ─────────────────────────────────────────
//
// ตัวเลือกกับคำอธิบายมาจาก settings.FIELDS ที่เดียว ที่นี่มีแค่คำเตือนเฉพาะคู่
// ที่วิธีเลือกชิ้นกับวิธีเรียงมันตีกันเอง

function orderNote(omode, cmode, f){
  if (cmode === 'pattern')
    return omode === 'pick'
      ? 'โหมดสลับตามรูปแบบจัดลำดับด้วยการสลับประเภทอยู่แล้ว — "pick" กับแบบอื่นให้ผลเท่ากัน'
      : `สลับ พูด/วิว ตามรูปแบบข้างบน โดยข้างในคิวของแต่ละประเภทเดินตาม`
        + ` "${f.labels[omode]}" — การสลับไม่หาย`;
  if ((f.own_order_modes || []).includes(cmode) && omode !== 'pick')
    return `⚠ โหมดนี้จัดลำดับมาให้เองแล้ว แต่ตั้งไว้ "${f.labels[omode]}"`
      + ' จะเรียงทับลำดับนั้น — อยากเก็บไว้ให้เลือก "ตามที่วิธีเลือกจัดให้"';
  return (f.helps || {})[omode] || '';
}

// บทที่ AI แบ่งเป็น "วิธีเรียง" อีกแบบที่ซ่อนอยู่ใต้ pick — ไม่ทับตัวเลือกของคน
// อีกแล้ว (ดู compose.order_pieces) ตรงนี้แค่บอกว่าตอนนี้มันได้จัดหรือไม่ได้จัด
function aiOrderNote(omode, cmode, f){
  const aiModes = (D.fields.find(x => x.key === 'compose.mode') || {}).ai_options || [];
  if (aiModes.includes(cmode))
    return omode === 'pick'
      ? 'เก็บลำดับที่ AI เลือกมาไว้ตามเดิม'
      : `AI เลือกช่วงให้ แล้วเรียงใหม่ตาม "${f.labels[omode]}" `
        + '— อยากเก็บลำดับที่ AI จัดมา เลือก "ตามที่วิธีเลือกจัดให้"';
  const ch = (S && S.ai && S.ai.chapters) || 0;
  if (!ch || !val('ai.enabled') || !val('ai.apply.order')) return '';
  if (cmode === 'pattern' || (f.own_order_modes || []).includes(cmode))
    return `มี ${ch} บทจาก AI แต่โหมด "${(MODE_HELP[cmode] || ['นี้'])[0]}" จัดลำดับมาเองแล้ว`
      + ' — บทไม่ได้ถูกใช้จัดลำดับ';
  return omode === 'pick'
    ? `บทที่ AI แบ่งไว้ ${ch} บท เป็นตัวจัดลำดับให้ตอนนี้`
      + ' — ปิดได้ที่ "ให้บทที่ AI แบ่งเป็นตัวจัดลำดับ" ข้างบน'
    : `มี ${ch} บทจาก AI ที่จัดลำดับได้ แต่เลือก "${f.labels[omode]}" ไว้ `
      + 'ซึ่งชนะเสมอ — อยากให้ AI จัดให้ เลือก "ตามที่วิธีเลือกจัดให้"';
}

function orderPicker(cmode){
  const f = D.fields.find(x => x.key === 'order.mode');
  if (!f) return el('div');
  f.own_order_modes = (D.fields.find(x => x.key === 'compose.mode') || {}).own_order || [];
  const cur = val('order.mode');
  const box = el('div', 'sect');
  box.append(el('h4', null, 'แล้วเรียงยังไง'));
  const seg = el('div', 'seg wrap');
  f.options.forEach(o => {
    const b = el('button', null, f.labels[o]);
    b.title = (f.helps || {})[o] || '';
    b.setAttribute('aria-pressed', cur === o);
    b.onclick = () => { setKey('order.mode', D.values['order.mode'], o); render(); };
    seg.append(b);
  });
  box.append(seg, el('p', 'note', orderNote(cur, cmode, f)));
  const ai = aiOrderNote(cur, cmode, f);
  if (ai) box.append(el('p', 'note', ai));
  const rv = D.fields.find(x => x.key === 'order.reverse');
  if (rv) box.append(field(rv));
  return box;
}

// บอกก่อนกดว่าจะส่งไปกี่ชิ้น — คลังใหญ่เกินแล้วโมเดลใช้โควตาตอบหมดไปกับการคิด
// จนไม่ได้คำตอบ (เคยเจอจริง: 398 ชิ้น รอ 11 นาทีแล้วได้ศูนย์)
function askSize(){
  const ok = ((POOL && POOL.pieces) || []).filter(p => p.ok).length;
  const cap = Number(val('compose.ask_max') || 0);
  const send = cap > 0 ? Math.min(ok, cap) : ok;
  const p = el('p', 'note');
  if (!ok) p.textContent = 'ยังไม่มีคลัง — ทำขั้น 2 ก่อน';
  else if (cap > 0 && ok > cap)
    p.textContent = `คลัง ${ok} ชิ้น → ส่งให้ AI ${send} ชิ้น`
      + ` (คัดตัวคะแนนดีที่สุด คงสัดส่วนพูด:วิว ที่เหลือไม่ได้หายไปจากคลัง)`;
  else if (cap > 0) p.textContent = `คลัง ${ok} ชิ้น — ไม่ถึงเพดาน ส่งไปทั้งหมด`;
  else {
    p.className = 'note warnnote';
    p.textContent = `ส่งทั้งคลัง ${ok} ชิ้น — เกิน ~150 ชิ้นเมื่อไร โมเดลมีสิทธิ์`
      + ` ใช้โควตาตอบหมดไปกับการคิดจนไม่ตอบอะไรกลับมา ตั้งเพดานไว้ดีกว่า`;
  }
  return p;
}

// ── ความเห็นที่ AI เคยให้ไว้ ────────────────────────────────────────
//
// คนละเรื่องกับปุ่ม "ให้ AI จัดให้" — ปุ่มนั้นคือ *เรียกโมเดลใหม่* อันนี้คือ *อ่าน
// ai.json ที่ขั้น 2 ทำไว้แล้ว* (บท · คะแนนช็อต) ซึ่งไม่เสียโควตาสักนิด แต่ก็ยัง
// ตัดสินผลลัพธ์อยู่ดี กดโหมดกฎล้วนแล้วสวิตช์นี้ถูกปิดให้เอง — เปิดกลับได้ที่นี่
function aiOpinion(usesAI){
  const en = D.fields.find(f => f.key === 'ai.enabled');
  if (!en) return null;
  const on = val('ai.enabled'), ch = (S && S.ai && S.ai.chapters) || 0;
  const box = el('div', 'sect');
  box.append(el('h4', null, 'ความเห็นที่ AI เคยให้ไว้'), field(en));
  box.append(el('p', 'note', on
    ? 'อ่านจาก ai.json ที่ทำไว้แล้ว — ไม่เรียกโมเดลใหม่ ไม่เสียโควตา'
      + (ch ? ` · มี ${ch} บท` : ' · ยังไม่มีบท')
    : 'กฎล้วน — ตอนรวมเป็นหนังไม่อ่าน ai.json เลย ทั้งบทและคะแนน'
      + (usesAI ? ' (ตัว "ให้ AI เลือก" ยังทำงาน มันอ่าน compose.json คนละไฟล์)' : '')));
  if (on && ch){
    const o = D.fields.find(f => f.key === 'ai.apply.order');
    if (o) box.append(field(o));
  }
  // เปิดค้างไว้จากรอบก่อนแล้วมากดโหมดกฎล้วน — auto-off ทำงานตอนคลิกเท่านั้น
  // ค่าที่บันทึกไว้แล้วจึงต้องมีคนบอกว่ามันยังมีผลอยู่ ไม่ใช่ปล่อยให้เข้าใจผิด
  if (on && !usesAI)
    box.append(el('p', 'note warnnote', 'โหมดที่เลือกอยู่ในกลุ่ม "ไม่ใช้ AI" '
      + 'แต่สวิตช์นี้ยังเปิดค้างอยู่ — บทกับคะแนนของ AI ยังมีผลตอนรวมเป็นหนัง '
      + 'ปิดเพื่อให้เป็นกฎล้วนจริง'));
  // สวิตช์นี้เป็นของขั้น 3 ล้วน ๆ ปิดแล้วคลังจากขั้น 2 ไม่เปลี่ยนตาม — ถ้าขั้น 2
  // ยังเปิด AI อยู่ ก็ต้องบอกว่า "กฎล้วน" นี้ครอบแค่ครึ่งเส้น
  if (!on && val('ai.apply.enabled'))
    box.append(el('p', 'note warnnote', 'กฎล้วนเฉพาะตอนรวมเป็นหนัง — '
      + 'คลังจากขั้น 2 ยังถูก AI ตัด/คัดมาแล้ว อยากได้กฎล้วนทั้งเส้นต้องปิดสวิตช์ '
      + 'AI ที่ขั้น 2 แล้วกด "ตัดทีละคลิป" ใหม่'));
  return box;
}

function stepCompose(box){
  const mode = val('compose.mode') || 'all';
  const c = el('div', 'card');
  c.appendChild(head(3));

  // แยกให้เห็นชัดว่าอันไหนเสียโควตา AI อันไหนเป็นกฎล้วน — กดผิดทีเสียเงินจริง
  const f = D.fields.find(x => x.key === 'compose.mode') || {};
  const aiModes = f.ai_options || [];
  const own = f.own_order || [];
  [[false, 'ไม่ใช้ AI', 'ตัดสินด้วยกฎล้วน กดกี่รอบก็ได้ ไม่เสียโควตา'],
   [true, 'ใช้ AI', 'เรียกโมเดลจริงทุกครั้งที่กด — เสียโควตา']].forEach(([isAI, ttl, sub]) => {
    const list = Object.keys(MODE_HELP).filter(m => aiModes.includes(m) === isAI);
    if (!list.length) return;
    const h = el('div', 'grouphd' + (isAI ? ' ai' : ''));
    h.append(el('b', null, ttl), el('span', null, sub));
    c.appendChild(h);
    const modes = el('div', 'modes');
    list.forEach(m => {
      const [t, d] = MODE_HELP[m];
      const b = el('button');
      b.setAttribute('aria-pressed', m === mode);
      b.append(el('span', 'mt', t), el('span', 'md', d));
      b.onclick = () => {
        setKey('compose.mode', D.values['compose.mode'], m);
        // โหมดที่ให้ลำดับมาเป็นรายการตรง ๆ — ตั้งลำดับเป็น pick ให้เลย
        // ไม่งั้นค่าตั้งต้น (ลำดับจากขั้น 1) จะไปเรียงทับสิ่งที่มันเพิ่งจัดมา
        if (own.includes(m) && val('order.mode') !== 'pick')
          setKey('order.mode', D.values['order.mode'], 'pick');
        // "ไม่ใช้ AI · ตัดสินด้วยกฎล้วน" ต้องแปลว่ากฎล้วนจริง — ปิดสวิตช์อ่าน
        // ai.json ให้เลย ไม่งั้นบทกับคะแนนของ AI ยังตัดสินอยู่เงียบ ๆ
        if (!isAI && val('ai.enabled')) setKey('ai.enabled', D.values['ai.enabled'], false);
        render();
      };
      modes.appendChild(b);
    });
    c.appendChild(modes);
  });

  (MODE_FIELDS[mode] || []).forEach(k => {
    const f = D.fields.find(x => x.key === k); if (f) c.appendChild(field(f));
  });
  if (mode === 'manual')

// ตัวเลือกฟอนต์ของขั้น 5 — อ่านจาก FX.fonts ซึ่งเป็น {thai, other} ไม่ใช่รายการแบน
//
// เดิมตรงนี้เรียก fxSelect(..., FX.fonts.length ? FX.fonts : [ค่าปัจจุบัน]) ซึ่ง
// ก้อน dict ไม่มี .length เงื่อนไขจึงเป็นเท็จเสมอ แล้วเมนูมีตัวเลือกเดียวคือฟอนต์
// ที่ตั้งไว้อยู่แล้ว — กดเปลี่ยนฟอนต์ไม่ได้เลยโดยไม่มีอะไรฟ้อง
function fxFontPick(get, set){
  const s = el('select');
  const add = (list, group) => {
    if (!list || !list.length) return;
    const g = el('optgroup'); g.label = group;
    list.forEach(f => { const o = el('option', null, f); o.value = f; g.append(o); });
    s.append(g);
  };
  add(((FX || {}).fonts || {}).thai, 'รองรับภาษาไทย');
  add(((FX || {}).fonts || {}).other, 'อื่น ๆ');
  const cur = get() || '';
  s.value = cur;
  if (s.value !== cur){          // ฟอนต์ที่ตั้งไว้ไม่มีในเครื่องนี้แล้ว
    const o = el('option', null, `${cur} (ไม่พบในเครื่อง)`); o.value = cur;
    s.insertBefore(o, s.firstChild); s.value = cur;
  }
  s.onchange = () => { set(s.value); fxTouch(); };
  return s;
}

function fxSelect(get, set, options, labels){
  const s = el('select');
  options.forEach(o => {
    const n = el('option', null, (labels && labels[o]) || o); n.value = o; s.append(n);
  });
  s.value = get();
  s.onchange = () => { set(s.value); fxTouch(); };
  return s;
}

function fxAddShape(){
  // ถามจากไทม์ไลน์ของขั้น 5 เอง (fxWhere) ไม่ใช่ของขั้น 4 — ผลเท่ากันเมื่อไม่มี
  // สโลว์โม แต่ขั้นนี้ไม่ควรพึ่งข้อมูลของขั้นนั้นอยู่แล้ว
  const w = fxWhere(fxT5((PV && PV.gt) || 0));
  if (!w) return toast('ยังไม่มีไทม์ไลน์ให้วางรูปทรง', true);
  const d = fxDefs().shape || {};
  const id = 's' + Date.now().toString(36)
           + Math.floor(Math.random() * 1679616).toString(36);
  fxData().shapes = [...fxShapes(),
                     {...d, id, name: w.name, at: w.at, dur: 2}];
  fxSel = id;
  fxTab = 'shapes';
  fxTouch();
  toast('เพิ่มรูปทรงแล้ว — ลากบนตัวเล่นเพื่อจัดตำแหน่ง');
}

function fxShapeCue(id){
  return ((FX.view || {}).shapes || []).find(s => s.id === id);
}

function fxShapeList(){
  const w = el('div');
  const list = fxShapes();
  if (!list.length){
    w.append(el('p', 'note',
      'ยังไม่มีรูปทรง — กด "+ รูปทรง" เพื่อวางลูกศร/แถบ/จุดตรงวินาทีที่ค้างอยู่ '
      + '· วาดด้วย libass ตัวเดียวกับที่เขียนตัวหนังสือ ไม่ต้องมีไฟล์ภาพจากข้างนอก'));
    return w;
  }
  list.forEach(sh => w.append(fxShapeRow(sh)));
  return w;
}

function fxShapeRow(sh){
  const cue = fxShapeCue(sh.id);
  const wrap = el('div', 'capbox' + (fxSel === sh.id ? ' on' : ''));
  const hd = el('div', 'capbh');
  hd.append(el('span', 'capt', cue && cue.a != null ? mmss(cue.a) : '—'));
  hd.append(el('span', 'note',
    `${(fxDefs().shape_kind || {})[sh.kind] || sh.kind} · ${sh.name} @ ${(+sh.at).toFixed(2)} วิ`));
  hd.append(el('span', 'spacer'));
  const del = el('button', 'sm', '✕');
  del.type = 'button'; del.title = 'ลบรูปทรงนี้';
  del.onclick = () => {
    fxData().shapes = fxShapes().filter(x => x !== sh);
    if (fxSel === sh.id) fxSel = null;
    fxTouch();
  };
  hd.append(del);
  wrap.append(hd);

  if (cue && cue.orphan)
    wrap.append(el('p', 'note warnnote',
      'ช่วงที่รูปทรงนี้เกาะอยู่ถูกตัดออกจากหนังไปแล้ว — จะไม่โผล่ในไฟล์'));

  const put = (k, v) => { sh[k] = v; };
  const g = el('div', 'capgrid');
  g.append(capField('รูป', fxSelect(() => sh.kind, v => put('kind', v),
                                   Object.keys(fxDefs().shape_kind || {}),
                                   fxDefs().shape_kind)));
  g.append(capField('สี', capColour(() => sh.color, v => put('color', v), fxTouch)));
  g.append(capField('ขนาด', capNum(() => sh.size, v => put('size', v),
                                  8, 900, 2, 'px', fxTouch)));
  g.append(capField('ความหนา', capNum(() => sh.thick, v => put('thick', v),
                                     0.03, 0.9, 0.01, '', fxTouch)));
  g.append(capField('หมุน', capNum(() => sh.angle, v => put('angle', v),
                                  -180, 180, 1, '°', fxTouch)));
  g.append(capField('ขอบ', capNum(() => sh.border, v => put('border', v),
                                 0, 20, 0.5, 'px', fxTouch)));
  if (+sh.border > 0)
    g.append(capField('สีขอบ', capColour(() => sh.outline,
                                        v => put('outline', v), fxTouch)));
  g.append(capField('เริ่มที่ (วินาทีในคลิป)',
    capNum(() => sh.at, v => put('at', v), 0, 600, 0.05, 'วิ', fxTouch)));
  g.append(capField('ยาว', capNum(() => sh.dur, v => put('dur', v),
                                 0.2, 30, 0.1, 'วิ', fxTouch)));
  wrap.append(g);
  // แถบมุมมนมักถูกใช้เป็น *พื้น* ของชิปตัวเลข ไม่ใช่ของที่ชี้อะไร — สวิตช์นี้จึง
  // อยู่ตรงนี้ ไม่ใช่ในเมนูขั้นสูงที่ไหน  ไม่มีมันแล้วแถบจะบังตัวเลขที่มันรองอยู่
  wrap.append(capBool(() => !!sh.behind, v => put('behind', v),
                      'วางไว้ข้างหลังข้อความ', fxTouch));
  wrap.append(fxAnimForm(sh, put, {}));
  wrap.append(el('p', 'note', 'ลากรูปบนตัวเล่นเพื่อจัดตำแหน่ง'));
  return wrap;
}

// ── เอฟเฟกต์รายชิ้น ─────────────────────────────────────────────
//
// ผูกกับ (คลิป, ช่วงที่ตัด) ไม่ใช่ลำดับในไทม์ไลน์ — กุญแจมาจากเอนจิน
// (view.segments[].key) ไม่ให้หน้าเว็บประกอบเอง

const fxClips = () => fxData().clips || (fxData().clips = {});
const fxClipCfg = k => ({...(fxDefs().clip || {}), ...(fxClips()[k] || {})});

function fxClipPut(k, key, v){
  const cur = fxClipCfg(k);
  const next = {...cur, [key]: v};
  const base = fxDefs().clip || {};
  // กลับไปเป็นค่าตั้งต้นทุกช่อง = ลบทิ้ง ไม่ใช่เก็บ {} ไว้ให้รก — และไฟล์ที่ไม่มี
  // กุญแจนี้แปลว่า "ไม่ได้แต่ง" ตรงตัว ตอนไปอ่านเองก็ยังอ่านออก
  if (Object.keys(base).every(x => next[x] === base[x])) delete fxClips()[k];
  else fxClips()[k] = next;
  fxTouch();
}

const fxClipHow = f => {
  const b = fxDefs().clip || {}, out = [];
  if (f.speed !== b.speed) out.push(`${(+f.speed).toFixed(2)}x`);
  if (f.zoom !== b.zoom) out.push(`ซูม ${(+f.zoom).toFixed(2)}`);
  if (f.grade) out.push((fxDefs().grade || {})[f.grade] || f.grade);
  if (f.mute) out.push('ปิดเสียง');
  else if (Math.abs(+f.vol_db) > 0.01) out.push(`${+f.vol_db > 0 ? '+' : ''}${+f.vol_db} dB`);
  return out.join(' · ');
};

function fxClipList(){
  const w = el('div');
  const segs = (FX.view || {}).segments || [];
  const n = segs.filter(s => s.fx).length;
  w.append(el('p', 'note',
    `${segs.length} ชิ้นในไทม์ไลน์ · แต่งไว้ ${n} ชิ้น` + (n ? '' : ' — ยังไม่ได้แตะสักชิ้น')));
  w.append(el('p', 'note',
    'ชิ้นที่แต่งจะถูกตัดใหม่จาก segment ของขั้น 3 (เข้ารหัสภาพเพิ่มหนึ่งรอบ '
    + 'เฉพาะชิ้นนั้น) และมี cache ของตัวเอง — แก้ค่าเดิมซ้ำไม่ต้องรอทำใหม่ · '
    + 'สโลว์โมชันเปลี่ยนความยาวหนัง ข้อความกับรูปทรงจะเลื่อนตามให้เอง'));
  segs.forEach(s => w.append(fxClipRow(s)));
  return w;
}

function fxClipRow(s){
  const f = fxClipCfg(s.key);
  const open = fxSel === s.key;
  const row = el('div', 'fxbox' + (s.fx ? ' on' : ''));
  const hd = el('div', 'fxboxhd');
  hd.append(el('span', 'capt', mmss(s.at)));
  hd.append(el('b', null, s.name));
  hd.append(el('span', 'note', s.kind === 'TALK' ? 'พูด' : 'วิว'));
  hd.append(el('span', 'spacer'));
  const how = fxClipHow(f);
  if (how) hd.append(el('span', 'note ok', how));
  if (s.fx && Math.abs(s.len - s.dur) > 0.01)
    hd.append(el('span', 'note', `${s.dur.toFixed(1)}→${s.len.toFixed(1)} วิ`));
  const tog = el('button', 'sm', open ? 'ปิด' : 'แต่ง');
  tog.onclick = () => { fxSel = open ? null : s.key; render(); };
  hd.append(tog);
  row.append(hd);
  if (!open) return row;

  const g = el('div', 'capgrid');
  g.append(capField('ความเร็ว', capNum(() => f.speed, v => fxClipPut(s.key, 'speed', v),
                                      0.1, 4, 0.05, 'x', fxTouch)));
  g.append(capField('ซูมเข้า', capNum(() => f.zoom, v => fxClipPut(s.key, 'zoom', v),
                                     1, 3, 0.05, 'x', fxTouch)));
  g.append(capField('โทนสี', fxSelect(() => f.grade || '',
                                     v => fxClipPut(s.key, 'grade', v),
                                     Object.keys(fxDefs().grade || {}),
                                     fxDefs().grade)));
  g.append(capField('เสียง', capBool(() => f.mute, v => fxClipPut(s.key, 'mute', v),
                                    'ปิดเสียงชิ้นนี้', fxTouch)));
  // ดัง/เบาของชิ้นนี้ — ปิดไว้ตอน mute เพราะสองอย่างนี้ทับกัน (mute ชนะเสมอ)
  // ปล่อยให้ปรับได้ทั้งที่ไม่มีผลคือปุ่มที่หมุนแล้วไม่มีอะไรเกิดขึ้น
  if (!f.mute)
    g.append(capField('ความดังชิ้นนี้',
      capNum(() => f.vol_db, v => fxClipPut(s.key, 'vol_db', v),
             -30, 12, 0.5, 'dB', fxTouch)));
  row.append(g);
  if (!f.mute && Math.abs(+f.vol_db) > 0.01)
    row.append(el('p', 'note', `${+f.vol_db > 0 ? 'ดังขึ้น' : 'เบาลง'} `
      + `${Math.abs(+f.vol_db).toFixed(1)} dB จากที่ขั้น 3 ปรับมาแล้ว `
      + '— ชิ้นนี้จะถูกตัดใหม่หนึ่งรอบ'));
  if (+f.speed < 1)
    row.append(el('p', 'note',
      `ช้าลง ${(1 / +f.speed).toFixed(1)} เท่า — ชิ้นนี้จะยาวขึ้นเป็น `
      + `${(s.dur / +f.speed).toFixed(1)} วินาที · เสียงยืดตามโดยระดับเสียงไม่เพี้ยน`));
  if (+f.zoom > 1)
    row.append(el('p', 'note',
      'ซูมทำจากภาพที่ย่อเป็น 1080p แล้ว ไม่ใช่จากไฟล์ต้นฉบับ — ซูมแรง ๆ จะเห็นภาพนุ่มลง'));
  return row;
}

// ── ภาพซ้อน ─────────────────────────────────────────────────────
//
// ไฟล์ทั้งหมดอยู่ในโฟลเดอร์ assets ของโปรเจกต์ · fx.json เก็บแค่ชื่อไฟล์ โปรเจกต์
// จึงยกไปเครื่องอื่นได้ทั้งก้อน (ดู overlay.py)

const fxOverlays = () => fxData().overlays || (fxData().overlays = []);
const fxAssets = () => ((FX.overlay || {}).assets) || [];
const fxOvCue = id => ((FX.overlay || {}).cues || []).find(c => c.id === id);

// รับสถานะชุดใหม่จากเซิร์ฟเวอร์ *โดยไม่ทับร่างที่ยังไม่บันทึก*
//
// เส้น /api/asset คืน FX ทั้งก้อนกลับมา (คลังไฟล์เปลี่ยน หน้าเว็บต้องรู้) แต่ก้อน
// นั้นมี fx.json ฉบับ *ที่อยู่บนดิสก์* ติดมาด้วย — เอามาทับตรง ๆ แล้วของที่เพิ่งวาง
// ลงไทม์ไลน์แต่ยังไม่ได้กดบันทึกจะหายเงียบ ๆ ทั้งชุด (แทร็กเพลงที่เพิ่งวาง ข้อความ
// รูปทรง ภาพซ้อน) โดยที่ธง fxDirty ยังค้างอยู่ พอกดบันทึกทีหลังจึงเขียนของว่าง
// ทับไฟล์ — อาการที่เห็นคือ "ใส่เพลงแล้วไม่มีเสียงเพลง"
//
// กฎเดียวกับ load(): ของบนดิสก์ชนะได้ก็ต่อเมื่อไม่มีร่างค้าง
function fxAdopt(fresh){
  const draft = fxDirty ? fxData() : null;
  FX = fresh;
  if (draft) FX.fx = draft;
}

// want = ช่องที่ลากไฟล์เข้ามา ('media' = ภาพซ้อน · 'audio' = เพลง) — ไฟล์สองกลุ่ม
// อยู่โฟลเดอร์ assets เดียวกัน แต่คลังที่แสดงเป็นคนละรายการ ลากผิดช่องแล้วผ่าน
// จะได้ "เพิ่มแล้ว" ตามด้วยคลังที่ไม่มีไฟล์นั้น ซึ่งอ่านว่าพังมากกว่าอ่านว่าลากผิด
async function fxUpload(files, want){
  for (const f of files){
    try {
      const b64 = await new Promise((ok, no) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result).split(',')[1]);
        r.onerror = () => no(new Error('อ่านไฟล์ไม่ได้'));
        r.readAsDataURL(f);
      });
      const r = await post('/api/asset', {name: f.name, data: b64, want});
      fxAdopt(r.fx);
      toast(`เพิ่ม ${r.file} แล้ว`);
    } catch(e){ toast(`${f.name}: ${e.message}`, true); }
  }
  render();
}

async function fxDeleteAsset(name){
  const used = fxOverlays().filter(o => o.file === name).length
             + fxMusics().filter(m => m.file === name).length;
  if (used && !confirm(`${name} ถูกใช้อยู่ ${used} ที่ในหนัง — ลบไฟล์ทิ้งเลยไหม`)) return;
  try { fxAdopt(await post('/api/asset', {delete: name}).then(r => r.fx)); render(); }
  catch(e){ toast(e.message, true); }
}

function fxAddOverlay(file){
  const w = fxWhere(fxT5((PV && PV.gt) || 0));
  if (!w) return toast('ยังไม่มีไทม์ไลน์ให้วางภาพ', true);
  const d = fxDefs().overlay || {};
  const id = 'o' + Date.now().toString(36)
           + Math.floor(Math.random() * 1679616).toString(36);
  fxData().overlays = [...fxOverlays(), {...d, id, file, name: w.name, at: w.at, dur: 3}];
  fxSel = id;
  fxTouch();
  toast('วางภาพแล้ว — ลากบนตัวเล่นเพื่อจัดตำแหน่ง');
}

function fxOverlayPanel(){
  const w = el('div');

  // ── คลังไฟล์ ──
  const drop = el('div', 'fxdrop');
  drop.append(el('div', 'fxwhat', 'ลากไฟล์มาวางที่นี่ หรือกดเพื่อเลือก'));
  drop.append(el('div', 'note',
    'PNG/JPG/WEBP หรือวิดีโอโปร่งใส (MOV/WEBM) — คัตเอาต์คนที่ตัดพื้นหลังมาจาก'
    + 'เครื่องมืออื่นก็หย่อนเข้ามาทางนี้ได้'));
  const pick = el('input'); pick.type = 'file'; pick.multiple = true; pick.hidden = true;
  pick.accept = '.png,.jpg,.jpeg,.webp,.mov,.webm,.mp4';
  pick.onchange = () => { if (pick.files.length) fxUpload([...pick.files], 'media'); };
  drop.onclick = () => pick.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => {
    e.preventDefault(); drop.classList.remove('on');
    if (e.dataTransfer.files.length) fxUpload([...e.dataTransfer.files], 'media');
  };
  w.append(drop, pick);

  const lib = fxAssets();
  if (lib.length){
    const g = el('div', 'fxlib');
    lib.forEach(a => {
      const card = el('div', 'fxasset');
      if (a.kind === 'image'){
        const im = el('img'); im.src = '/asset/' + encodeURIComponent(a.file);
        im.alt = a.file; card.append(im);
      } else {
        card.append(el('div', 'fxvid', 'วิดีโอ'));
      }
      card.append(el('div', 'fxaname', a.file));
      card.append(el('div', 'note', `${a.w}×${a.h}`));
      const acts = el('div', 'fxaacts');
      const add = el('button', 'sm', '+ วางลงหนัง');
      add.onclick = () => fxAddOverlay(a.file);
      const del = el('button', 'sm', '✕');
      del.title = 'ลบไฟล์นี้ออกจากคลัง';
      del.onclick = () => fxDeleteAsset(a.file);
      acts.append(add, del);
      card.append(acts);
      g.append(card);
    });
    w.append(g);
  }

  // ── ที่วางไว้ในหนังแล้ว ──
  const list = fxOverlays();
  w.append(el('h4', 'caph', `วางไว้ในหนังแล้ว — ${list.length} ชิ้น`));
  const miss = ((FX.overlay || {}).missing) || [];
  if (miss.length)
    w.append(el('p', 'note warnnote',
      `ไม่พบไฟล์ ${miss.join(', ')} ในคลัง — ชิ้นที่ใช้ไฟล์นี้จะถูกข้ามตอนสร้างไฟล์`));
  if (!list.length)
    w.append(el('p', 'note', 'ยังไม่ได้วางอะไร — กด "+ วางลงหนัง" ที่ไฟล์ในคลังข้างบน'));
  list.forEach(o => w.append(fxOverlayRow(o)));
  return w;
}

function fxOverlayRow(o){
  const cue = fxOvCue(o.id);
  const open = fxSel === o.id;
  const wrap = el('div', 'capbox' + (open ? ' on' : ''));
  const hd = el('div', 'capbh');
  hd.append(el('span', 'capt', cue && cue.a != null ? mmss(cue.a) : '—'));
  hd.append(el('span', 'note', `${o.file} · ${o.name} @ ${(+o.at).toFixed(2)} วิ`));
  hd.append(el('span', 'spacer'));
  const tog = el('button', 'sm', open ? 'ปิด' : 'แก้');
  tog.onclick = () => { fxSel = open ? null : o.id; render(); };
  const del = el('button', 'sm', '✕');
  del.title = 'เอาออกจากหนัง (ไฟล์ในคลังยังอยู่)';
  del.onclick = () => {
    fxData().overlays = fxOverlays().filter(x => x !== o);
    if (fxSel === o.id) fxSel = null;
    fxTouch();
  };
  hd.append(tog, del);
  wrap.append(hd);

  if (cue && cue.orphan)
    wrap.append(el('p', 'note warnnote',
      'ช่วงที่ภาพนี้เกาะอยู่ถูกตัดออกจากหนังไปแล้ว — จะไม่โผล่ในไฟล์'));
  if (cue && cue.missing)
    wrap.append(el('p', 'note warnnote', 'ไม่พบไฟล์นี้ในคลังแล้ว'));
  if (!open) return wrap;

  const put = (k, v) => { o[k] = v; };
  const g = el('div', 'capgrid');
  g.append(capField('กว้าง (สัดส่วนของจอ)',
    capNum(() => o.width, v => put('width', v), 0.02, 1.5, 0.01, '', fxTouch)));
  g.append(capField('ความทึบ',
    capNum(() => o.opacity, v => put('opacity', v), 0, 1, 0.05, '', fxTouch)));
  g.append(capField('หมุน', capNum(() => o.angle, v => put('angle', v),
                                  -180, 180, 1, '°', fxTouch)));
  g.append(capField('เริ่มที่ (วินาทีในคลิป)',
    capNum(() => o.at, v => put('at', v), 0, 600, 0.05, 'วิ', fxTouch)));
  g.append(capField('ยาว', capNum(() => o.dur, v => put('dur', v),
                                 0.2, 60, 0.1, 'วิ', fxTouch)));
  wrap.append(g);
  wrap.append(fxAnimForm(o, put, {anim: fxDefs().overlay_anim}));
  wrap.append(el('p', 'note', 'ลากภาพบนตัวเล่นเพื่อจัดตำแหน่ง'));
  return wrap;
}

// ── เพลงประกอบ ──────────────────────────────────────────────────

// เพลงเป็น *รายการแทร็ก* ตั้งแต่รุ่นนี้ — วางคนละช่วงกันได้หลายเพลง
// (ไฟล์รุ่นเก่าที่เก็บเป็นก้อนเดียวถูกแปลงให้ตั้งแต่ฝั่งเอนจินแล้ว ดู fx._music_list)
const fxMusics = () => Array.isArray(fxData().music) ? fxData().music
                                                     : (fxData().music = []);
const fxMusicOf = id => fxMusics().find(m => m.id === id);

const fxNewId = pre => pre + Date.now().toString(36)
                     + Math.floor(Math.random() * 1679616).toString(36);

// วางแทร็กเพลงใหม่ — at/dur เป็นวินาทีของหนัง (dur 0 = จนจบเรื่อง)
function fxAddMusic(file, at, dur){
  const d = (FX.music || {}).defaults || {};
  const id = fxNewId('m');
  fxData().music = [...fxMusics(), {...d, id, file,
    at: Math.max(0, +(at || 0).toFixed(3)), dur: Math.max(0, +(dur || 0).toFixed(3))}];
  fxSel = id; fxSelKind = 'music'; fxTab = 'music';
  fxTouch();
  return id;
}

// ลบชิ้นจากชั้นไหนก็ได้ — ปุ่ม ✕ ที่ป้ายชื่อแถวในเลนใช้ตัวนี้ตัวเดียว
function fxDropItem(lane, id){
  if (lane === 'text') fxData().texts = fxTexts().filter(x => x.id !== id);
  else if (lane === 'shapes') fxData().shapes = fxShapes().filter(x => x.id !== id);
  else if (lane === 'overlays') fxData().overlays = fxOverlays().filter(x => x.id !== id);
  else if (lane === 'music') fxData().music = fxMusics().filter(x => x.id !== id);
  else return;
  if (fxSel === id) fxSel = null;
  fxTouch();
}

// ── ดึงเสียงจากลิงก์ YouTube ─────────────────────────────────────
//
// อยู่บนสุดของแท็บเพลง เหนือช่องลากไฟล์ เพราะเป็นทางที่ *เริ่มต้นจากมือเปล่า*
// ได้จริง — ช่องลากไฟล์ต้องมีไฟล์อยู่ในเครื่องอยู่แล้วถึงจะใช้ได้
//
// งานวิ่งผ่านคิวเดียวกับขั้นอื่น log จึงไหลเข้าแผง "บันทึกการทำงาน" และปุ่มถูก
// ขีดเส้นกะพริบให้เองโดย poll() — ไม่ต้องทำแถบความคืบหน้าของตัวเองอีกชุด
let ytUrl = '';
let ytBefore = null;      // รายชื่อเพลงก่อนกดโหลด — ใช้หาว่าได้ไฟล์ไหนใหม่มา

async function fxFetchMusic(){
  const u = (ytUrl || '').trim();
  if (!u) return toast('ใส่ลิงก์ YouTube ก่อน', true);
  // งานจบแล้ว poll() จะเรียก load() ซึ่งทับ FX ด้วยของจากดิสก์ได้ — ร่างที่ยังไม่
  // บันทึกต้องลงไฟล์ก่อน ไม่งั้นค่าที่เพิ่งตั้งไว้จะหายไปพร้อมกับเพลงที่เพิ่งได้มา
  if (fxDirty) await fxSave(true);
  ytBefore = new Set((FX.music || {}).tracks || []);
  try {
    await post('/api/music', {url: u});
    logSince = 0; $('#log').textContent = '';
    toast('กำลังดาวน์โหลด — ดูความคืบหน้าที่ "บันทึกการทำงาน"');
    poll();
  } catch(e){ ytBefore = null; toast(e.message, true); }
}

// เรียกหลัง load() ตอนงานโหลดเสียงจบ — บอกว่าได้ไฟล์ไหนมา แล้วเลือกให้เลยถ้ายัง
// ไม่ได้เลือกเพลงไว้ (ถ้าเลือกไว้แล้วไม่แตะ — คนตั้งใจใช้เพลงเดิมอยู่)
function fxMusicArrived(){
  const tracks = (FX.music || {}).tracks || [];
  const add = ytBefore ? tracks.filter(t => !ytBefore.has(t)) : [];
  ytBefore = null;
  if (!add.length)
    return toast('โหลดเสร็จแล้ว แต่ไม่เจอไฟล์เสียงใหม่ในคลัง — ดูบันทึกการทำงาน', true);
  const name = add[add.length - 1];
  step = 5; fxTab = 'music';
  // ยังไม่มีเพลงสักแทร็ก = วางให้เลยคลอทั้งเรื่อง · มีอยู่แล้วไม่แตะของเดิม
  // เพราะคนอาจโหลดมาเก็บไว้ก่อน ยังไม่ได้ตั้งใจใช้ตอนนี้
  if (!fxMusics().length){
    fxAddMusic(name, 0, 0);
    toast(`ได้ ${name} — วางเป็นเพลงคลอทั้งเรื่องให้แล้ว กด "บันทึกเอฟเฟกต์" เพื่อยืนยัน`);
  } else {
    toast(`ได้ ${name} — กด "＋ เพลง" เพื่อวางเป็นแทร็กใหม่`);
  }
  ytUrl = '';
  render();
}

function fxMusicPanel(){
  const w = el('div');
  const M = FX.music || {};
  const tracks = M.tracks || [];

  w.append(fxFetchPanel());

  // ── คลังไฟล์เพลง ──
  const drop = el('div', 'fxdrop');
  drop.append(el('div', 'fxwhat', 'ลากไฟล์เพลงมาวางที่นี่ หรือกดเพื่อเลือก'));
  drop.append(el('div', 'note', 'MP3 · M4A · AAC · WAV · FLAC · OGG · OPUS · ไม่เกิน 40 MB'));
  const pick = el('input'); pick.type = 'file'; pick.hidden = true;
  pick.accept = '.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus';
  pick.onchange = () => { if (pick.files.length) fxUpload([...pick.files], 'audio'); };
  drop.onclick = () => pick.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => {
    e.preventDefault(); drop.classList.remove('on');

  // เพลงเป็นรายการเหมือนข้อความ/รูปทรง/ภาพซ้อน — วางกี่ท่อนก็ได้ คนละช่วงกัน
  // (เพลงเปิดเรื่อง · เพลงช่วงไฮไลต์ · เพลงจบ) แต่ละแทร็กมีความดัง เฟด และ

  hd.append(el('span', 'capt', mmss(a0)));
  hd.append(el('span', 'note', `${mmss(a0)}–${mmss(b0)}`

  if (tracks.indexOf(m.file) < 0)
    wrap.append(el('p', 'note warnnote',
      `ไม่พบไฟล์ ${m.file} ในคลังแล้ว — แทร็กนี้จะถูกข้ามไป`));

  const g = el('div', 'capgrid');

    capNum(() => m.dur, v => { m.dur = v; }, 0, Math.max(1, total), 0.5, 'วิ', fxTouch)));
  g.append(capField('ความดัง', capNum(() => m.gain_db, v => { m.gain_db = v; },

                                     0, 8, 0.1, 'วิ', fxTouch)));

  const au = el('audio');
  au.controls = true; au.preload = 'none'; au.style.width = '100%';

  wrap.append(el('h4', 'caph', 'หลบเสียงพูด'));
  wrap.append(capBool(() => m.duck, v => { m.duck = v; },
                      'ลดแทร็กนี้ลงเองตอนมีเสียงในหนัง', fxTouch));
  if (m.duck){
    const M = FX.music || {};
    const cap = +M.duck_max || 0;

                                            2, 24, 1, 'dB', fxTouch)));
    g2.append(capField('กลับมาดังภายใน',
      capNum(() => m.duck_release, v => { m.duck_release = v; },
             20, 2000, 20, 'ms', fxTouch)));
    wrap.append(g2);
    wrap.append(el('p', 'note',
      'ฟังคลื่นเสียงจริงของหนังแล้วลดตามทุกมิลลิวินาที (sidechaincompress) — '
      + 'ไม่ได้อ่านบทพูด จึงไม่พังเมื่อแก้ไทม์ไลน์ · ช่วงที่ไม่มีใครพูด เพลงกลับ'
      + 'มาดังเต็มระดับที่ตั้งไว้ ไม่ได้ถูกลดค้างไว้ทั้งเรื่อง'));
    // ตัวอัดแยก "มีคนพูด" จาก "เงียบ" ด้วยความดังอย่างเดียว หลบลึกกว่าระยะห่าง
    // ของสองอย่างนั้นไม่ได้ — บอกเพดานตรง ๆ ดีกว่าให้หมุนปุ่มแล้วสงสัยว่าทำไม
    // เสียงไม่ต่างกัน
    if (cap && +m.duck_db > cap)
      wrap.append(el('p', 'note warnnote',
        `หนังเรื่องนี้หลบได้ลึกสุด ${cap} dB (เสียงพูดดังกว่าเสียงพื้นหลังแค่นั้น) — `
        + `ตั้งไว้ ${m.duck_db} dB ก็จะได้ ${(+M.duck_max).toFixed(1)} dB เท่ากัน`));
    else if (cap)
      wrap.append(el('p', 'note',
        `ความลึกจริงกับหนังเรื่องนี้ ≈ ${Math.min(+m.duck_db || 0, cap).toFixed(1)} dB `
        + `(ลึกสุดที่ทำได้ ${cap} dB)`));
  }
  return wrap;
}

// ── ไทม์ไลน์หลายเลนของขั้น 5 ────────────────────────────────────
//
// ก่อนหน้านี้ขั้น 5 ตั้งเวลาได้ทางเดียวคือพิมพ์ตัวเลข "เริ่มที่กี่วินาทีของคลิป"
// ซึ่งตอบไม่ได้เลยว่าของที่วางไปแล้วมันไปตกตรงไหนของหนัง ทับกันอยู่ไหม หรือหลุด
// ออกไปนอกช่วงที่ยังเหลืออยู่หรือเปล่า — ต้อง render จบก่อนถึงจะรู้
//
// เลนพวกนี้ไม่ได้คิดเวลาเอง มันวาดจากตัวเลขชุดเดียวกับที่จะกลายเป็นไฟล์จริง
// (FX.view.cues · FX.view.shapes · FX.overlay.cues ที่เอนจินคำนวณมาให้แล้ว)
// เห็นอะไรบนจอ = ได้อย่างนั้นในไฟล์
//
// **เวลาที่ใช้วาดเป็นเวลาของหนังขั้น 5** (หลังสโลว์โม) ส่วนตัวเล่นเดินด้วยเวลา
// ของขั้น 3 สองอย่างนี้เท่ากันเป๊ะตราบใดที่ไม่มีชิ้นไหนถูกเปลี่ยนความเร็ว —
// ถ้ามี ต้องแปลงกลับไปมา (fxT5/fxT3) ไม่งั้นหัวอ่านจะชี้คนละที่กับที่กำลังเล่น
let fxZoom = 12, fxScroll = 0, fxDrag = null;
let fxSelKind = '';          // เลนของสิ่งที่เลือกอยู่ — id ซ้ำข้ามเลนได้

const fxSegs5 = () => (FX && FX.view && FX.view.segments) || [];
const fxTotal = () => (FX && FX.view && FX.view.total)
  || fxSegs5().reduce((a, s) => a + s.len, 0);

// เวลาในตัวเล่น (ขั้น 3) ↔ เวลาในหนังของขั้น 5
//
// ชิ้นที่ i เริ่มที่ at3 = ผลรวมของ dur ก่อนหน้า และที่ at5 = s.at ที่เอนจินให้มา
// ข้างในชิ้นเดียวกันยืด/หดเป็นสัดส่วน  จำนวนชิ้นไม่ตรงกัน (แก้ไทม์ไลน์ค้างไว้)
// = ไม่มีอะไรให้เทียบ ตกไปใช้เวลาเดียวกันตรง ๆ ซึ่งถูกอยู่แล้วเมื่อไม่มีสโลว์โม
function fxMap(t, to5){
  const segs = fxSegs5();
  if (!segs.length) return t;
  let at3 = 0;
  for (let i = 0; i < segs.length; i++){
    // ความยาวจริงของชิ้นบนไทม์ไลน์ขั้น 3 คือ exact_dur (คิดจากจำนวนเฟรม) ไม่ใช่
    // dur ที่ปัดมาจาก EDL — ใช้ผิดตัวแล้วหัวอ่านจะเลื่อนสะสมไปเรื่อย ๆ ทั้งเรื่อง
    const s = segs[i], d3 = s.exact_dur || s.dur, d5 = s.len;
    const from = to5 ? at3 : s.at, len = to5 ? d3 : d5;
    if (t < from + len || i === segs.length - 1){
      const off = Math.max(0, Math.min(len, t - from));
      const k = len > 0 ? (to5 ? d5 : d3) / len : 1;
      return +((to5 ? s.at : at3) + off * k).toFixed(3);
    }
    at3 += d3;
  }
  return t;
}
const fxT5 = t => fxMap(t, true);       // ตัวเล่น → ขั้น 5
const fxT3 = t => fxMap(t, false);      // ขั้น 5 → ตัวเล่น

// วินาทีที่ N ของหนังขั้น 5 = คลิปไหน วินาทีที่เท่าไรของคลิปนั้น
//
// คู่ตรงข้ามของ fxSpans และเป็นตัวที่ทำให้ "ลากข้ามคลิป" เป็นไปได้ — ของทุกชั้น
// เกาะกับ (คลิป, วินาทีในคลิป) ลากบล็อกไปวางที่นาทีที่ 7 จึงต้องแปลงกลับว่านั่น
// คือคลิปไหน ไม่ใช่แค่บวกเวลาเข้าไปในคลิปเดิมจนหลุดออกนอกช่วงแล้วกลายเป็นกำพร้า
//
// ใช้ FX.view.segments ของขั้น 5 เอง ไม่ใช่ capWhere ของขั้น 4 — ผลเท่ากันเมื่อ
// ไม่มีสโลว์โม แต่ที่นี่ต้องไม่พึ่งข้อมูลของขั้นนั้นอยู่แล้ว
function fxWhere(t5){
  const segs = fxSegs5();
  for (const s of segs)
    if (t5 >= s.at && t5 < s.at + s.len)
      return {name: s.name,
              at: +(s.start + (t5 - s.at) * (+s.speed || 1)).toFixed(3)};
  const last = segs[segs.length - 1];
  return last ? {name: last.name, at: +last.start.toFixed(3)} : null;
}

const fxTexts = () => fxData().texts || (fxData().texts = []);
const fxStyle = () => fxData().style || (fxData().style = {...(fxDefs().style || {})});
const fxAuto = () => fxData().auto_sub || (fxData().auto_sub = {enabled: false});

// ช่วง [at, at+dur] ของคลิปนี้ ไปโผล่ตรงไหนของหนังบ้าง
//
// **ต้องให้ผลตรงกับ fxtext.shape_spans() ฝั่งเอนจินเป๊ะ** — ที่ต้องมีสองที่เพราะ
// ของที่เพิ่งวางหรือกำลังลากอยู่ยังไม่เคยผ่านเอนจิน ถ้ารอค่าจากเซิร์ฟเวอร์อย่าง
// เดียว บล็อกจะไม่โผล่จนกว่าจะกดบันทึก ซึ่งทำให้เลนไม่มีประโยชน์ตอนที่ต้องใช้
// มันที่สุด · ตัวเลขที่ตัดสินไฟล์จริงยังเป็นของเอนจินเสมอ อันนี้เป็นแค่ภาพร่าง
// ที่ต้องตรงกัน (เกณฑ์ 0.20 วิ กับการหารด้วยความเร็ว ลอกมาทั้งคู่)
function fxSpans(name, at, dur){
  const out = [];
  fxSegs5().forEach(s => {
    if (s.name !== name) return;
    const lo = Math.max(+at, s.start), hi = Math.min(+at + +dur, s.start + s.dur);
    if (hi - lo <= 0) return;
    // หารด้วยความเร็วที่เอนจินส่งมา ไม่ใช่เดาจาก len/dur — len คิดจากจำนวนเฟรม
    // จริง สองทางจึงคลาดกันไม่กี่มิลลิวินาที ซึ่งพอให้บล็อกกระตุกตอนกดบันทึก
    const sp = +s.speed || 1;
    const a = s.at + (lo - s.start) / sp, b = s.at + (hi - s.start) / sp;
    if (b - a >= 0.20) out.push([+a.toFixed(3), +b.toFixed(3)]);
  });
  return out;
}

// กระจายชิ้นหนึ่งเป็นบล็อกตามจำนวนที่มันโผล่ — ไม่โผล่เลย = กำพร้า วาดไว้ต้นราง
function fxSpread(it, cls, label, out){
  const sp = fxSpans(it.name, it.at, it.dur);
  if (!sp.length){
    out.push({id: it.id, a: null, b: null, orphan: true, cls, label, item: it});
    return;
  }
  sp.forEach(([a, b], k) => out.push({id: it.id, a, b, cls, label, item: it, nth: k}));
}

// รายการที่จะวาดในแต่ละเลน — รูปแบบเดียวกันหมด {id, a, b, label, cls, item}
function fxLaneRows(lane){
  const v = FX.view || {};
  const out = [];
  if (lane === 'clips')
    return fxSegs5().map((s, i) => ({id: s.key, a: s.at, b: s.at + s.len,
      label: s.name.replace(/^IMG_/, ''), cls: 'clip ' + s.kind, item: s, i}));
  if (lane === 'text'){
    fxTexts().forEach(t => fxSpread(t, 'text', (t.text || '').slice(0, 30), out));
    // ซับอัตโนมัติไม่มีตัวจริงให้แก้ เอาของที่เอนจินคำนวณมาแล้วตรง ๆ
    if (fxAuto().enabled)
      (v.cues || []).filter(c => c.kind === 'auto' && c.a != null).forEach(c =>
        out.push({id: c.id, a: c.a, b: c.b, label: (c.text || '').slice(0, 30),
                  cls: 'text auto', lock: true, item: c}));
    return out;
  }
  if (lane === 'shapes'){
    fxShapes().forEach(s => fxSpread(s, 'shape',
      (fxDefs().shape_kind || {})[s.kind] || s.kind, out));
    return out;
  }
  if (lane === 'overlays'){
    fxOverlays().forEach(o => fxSpread(o, 'overlay', o.file, out));
    return out;
  }
  if (lane === 'music'){
    // เพลงผูกกับวินาทีในหนังตรง ๆ ไม่ต้องผ่าน fxSpans เหมือนชั้นที่เกาะคลิป
    // (เหตุผลอยู่ที่ music.MUSIC) · dur = 0 แปลว่าคลอไปจนจบเรื่อง
    const total = fxTotal();
    return fxMusics().map(m => {
      const a0 = Math.max(0, +m.at || 0);
      const b0 = Math.min(total, +m.dur > 0 ? a0 + +m.dur : total);
      return {id: m.id, a: a0, b: b0, cls: 'music', item: m,
              orphan: b0 - a0 <= 0.05,
              label: `${m.file} · ${(+m.gain_db).toFixed(1)} dB`
                     + (m.duck ? ' · หลบ' : '')};
    });
  }
  return [];
}

// ของที่อยู่ในเลนนี้แก้เวลาได้ไหม — ซับอัตโนมัติมาจากบทพูด เวลาของมันเป็นของ
// คำพูดจริง ไม่ใช่ของที่ใครตั้ง · เพลงคลอทั้งเรื่องอยู่แล้ว ไม่มีขอบให้ลาก
const FX_LANES = [
  ['clips', 'คลิป', 'ชิ้นจากขั้น 3 — คลิกเพื่อตั้งความเร็ว/ซูม/สี/ความดัง'],
  ['text', 'ข้อความ', 'ข้อความของขั้น 5 เอง'],
  ['shapes', 'รูปทรง', 'ลูกศร · แถบ · จุด'],
  ['overlays', 'ภาพซ้อน', 'ภาพ/วิดีโอโปร่งใสจากคลัง'],
  ['music', 'เพลง', 'คลอทั้งเรื่อง'],
];

// หาตัวจริงใน fx.json จาก id ที่คลิกในเลน — เลนวาดจาก "ผลที่คำนวณแล้ว"
// ซึ่งแก้ไม่ได้ ต้องย้อนกลับไปหาต้นฉบับก่อนเสมอ
function fxItemOf(lane, id){
  if (lane === 'text') return fxTexts().find(t => t.id === id);
  if (lane === 'shapes') return fxShapes().find(s => s.id === id);
  if (lane === 'overlays') return fxOverlays().find(o => o.id === id);
  if (lane === 'music') return fxMusicOf(id);
  return null;
}

function fxPick(lane, id){
  fxSel = id; fxSelKind = lane;
  fxTab = lane === 'clips' ? 'clips' : lane === 'text' ? 'text'
        : lane === 'shapes' ? 'shapes' : lane === 'overlays' ? 'images' : 'music';
  render();
}

// ลากบล็อกในเลน — ย้ายทั้งชิ้น หรือลากขอบเพื่อย่อ-ขยาย
//
// ย้าย = คำนวณ "จุดเริ่มใหม่ในหนัง" แล้วถามกลับว่าตรงนั้นคือคลิปไหนวินาทีที่เท่าไร
// (fxWhere ตัวเดียวกับที่ปุ่มเพิ่มใช้) จึงลากข้ามคลิปได้ · ย่อ-ขยาย = แก้ dur
// ตรง ๆ โดยหารด้วยความเร็วของชิ้นที่มันเกาะอยู่ ไม่งั้นลากบนชิ้นสโลว์โมจะได้
// ความยาวไม่ตรงกับที่เห็น
function fxBlockDrag(e, lane, id, side){
  e.preventDefault(); e.stopPropagation();
  const it = fxItemOf(lane, id);
  if (!it) return;
  fxPick(lane, id);
  // เพลงผูกกับวินาทีในหนังตรง ๆ (ดู music.MUSIC) จึงลากง่ายกว่าชั้นอื่น: ไม่ต้อง
  // แปลงเป็นวินาทีของคลิป และไม่มีทางกลายเป็นชิ้นกำพร้าเพราะไม่ได้เกาะคลิปไหน
  if (lane === 'music'){
    const total = fxTotal();
    const st0 = {x0: e.clientX, at: +it.at || 0,
                 dur: +it.dur > 0 ? +it.dur : Math.max(0.5, total - (+it.at || 0)),
                 moved: false};
    const mv = ev => {
      const d = (ev.clientX - st0.x0) / fxZoom;
      if (!st0.moved && Math.abs(ev.clientX - st0.x0) < 3) return;
      st0.moved = true;
      if (!side) it.at = Math.max(0, Math.min(total - 0.5, +(st0.at + d).toFixed(3)));
      else if (side === 'l'){
        const nd = Math.max(0.5, +(st0.dur - d).toFixed(3));
        it.at = Math.max(0, +(st0.at + (st0.dur - nd)).toFixed(3));
        it.dur = nd;
      } else it.dur = Math.max(0.5, +(st0.dur + d).toFixed(3));
      fxPaintLanes();
    };
    const up0 = () => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up0);
      if (st0.moved) fxTouch(); else render();
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up0);
    return;
  }

  const seg = fxSegs5().find(s => s.name === it.name) || {};
  const sp = +seg.speed || 1;                 // หนังขั้น 5 → วินาทีของคลิป
  const span0 = (fxSpans(it.name, it.at, it.dur) || [])[0];
  const st = {x0: e.clientX, at: +it.at, dur: +it.dur, moved: false,
              a5: span0 ? span0[0] : 0};
  const move = ev => {
    const d = (ev.clientX - st.x0) / fxZoom * sp;
    if (!st.moved && Math.abs(ev.clientX - st.x0) < 3) return;
    st.moved = true;
    if (!side){
      // ย้าย = ไปเกาะจุดใหม่ ซึ่งอาจเป็นคนละคลิป — ถามจากไทม์ไลน์ว่าตรงนั้น
      // คืออะไร ไม่ใช่บวกเวลาเข้าไปในคลิปเดิมจนหลุดออกนอกช่วงกลายเป็นกำพร้า
      const w = fxWhere(Math.max(0, st.a5 + (ev.clientX - st.x0) / fxZoom));
      if (w){ it.name = w.name; it.at = w.at; }
    } else if (side === 'l'){
      const nd = Math.max(0.2, +(st.dur - d).toFixed(3));
      it.at = Math.max(0, +(st.at + (st.dur - nd)).toFixed(3));
      it.dur = nd;
    } else {
      it.dur = Math.max(0.2, +(st.dur + d).toFixed(3));
    }
    fxPaintLanes();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (st.moved) fxTouch(); else render();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

// วาดใหม่เฉพาะบล็อกระหว่างลาก — render() ทั้งหน้าทุก pointermove หน่วงจนลากไม่ติดมือ
// (เวลาในหนังของชิ้นที่กำลังลากยังไม่อัปเดตจนกว่าเอนจินจะคำนวณให้ใหม่ตอนบันทึก
//  จึงประมาณเอาจากจุดเกาะปัจจุบันไปก่อน — พอปล่อยแล้ว fxTouch วาดของจริงทับ)
function fxPaintLanes(){
  const it = fxItemOf(fxSelKind, fxSel);
  if (!it) return;
  const nodes = [...document.querySelectorAll(
    `.fxb[data-lane="${fxSelKind}"][data-id="${fxSel}"]`)];
  const total = fxTotal();
  const sp = fxSelKind === 'music'
    ? [[Math.max(0, +it.at || 0),
        +it.dur > 0 ? Math.min(total, (+it.at || 0) + +it.dur) : total]]
    : fxSpans(it.name, it.at, it.dur);
  nodes.forEach((n, k) => {
    // ลากจนหลุดออกนอกช่วงที่เหลืออยู่ = ไม่มีที่ให้วาดแล้ว ซ่อนไว้ก่อน แล้ว
    // ปล่อยให้ render() รอบหลังปล่อยวาดเป็นบล็อกกำพร้าให้เห็นว่ามันหลุดไปแล้ว
    if (!sp[k]){ n.style.display = 'none'; return; }
    n.style.display = '';
    n.style.left = (sp[k][0] * fxZoom) + 'px';
    n.style.width = Math.max(3, (sp[k][1] - sp[k][0]) * fxZoom) + 'px';
  });
}

function fxTimeline(){
  const c = el('div', 'card');
  const total = fxTotal();
  const hd = el('div', 'hd');
  hd.append(el('h3', null, `ไทม์ไลน์แต่งหนัง — ${mmss(total)}`), el('span', 'spacer'));
  const zo = el('button', 'ghost', '−'), zi = el('button', 'ghost', '+');
  zo.title = 'ซูมออก'; zi.title = 'ซูมเข้า';
  zo.onclick = () => { fxZoom = Math.max(2, fxZoom / 1.6); render(); };
  zi.onclick = () => { fxZoom = Math.min(240, fxZoom * 1.6); render(); };
  hd.append(el('span', 'note', 'ซูม'), zo, zi);
  c.append(hd);

  // ── ปุ่มเพิ่มของแต่ละชั้น — วางตรงวินาทีที่หัวอ่านค้างอยู่ ──
  const bar = el('div', 'acts');
  const at = mmss((PV && PV.gt) || 0);
  const bt = el('button', 'sm', '＋ ข้อความ');
  bt.title = `วางข้อความใหม่ตรงนาที ${at}`;
  bt.onclick = fxAddText;
  const bs = el('button', 'sm', '＋ รูปทรง');
  bs.title = `วางลูกศร/แถบ/จุดตรงนาที ${at}`;
  bs.onclick = fxAddShape;
  const bo = el('button', 'sm', '＋ ภาพซ้อน');
  bo.title = 'เลือกไฟล์จากคลังภาพซ้อน';
  bo.onclick = () => { fxTab = 'images'; fxSel = null; render();
    toast('เลือกไฟล์ในคลังแล้วกด "+ วางลงหนัง"'); };
  const bm = el('button', 'sm', '＋ เพลง');
  const lib = ((FX.music || {}).tracks || []);
  bm.title = lib.length
    ? `วางแทร็กเพลงใหม่ตรงนาที ${at} (คลอไปจนจบเรื่อง — ลากขอบเพื่อกำหนดช่วง)`
    : 'ยังไม่มีไฟล์เพลงในคลัง — ลากไฟล์เข้ามาหรือโหลดจาก YouTube ในแท็บเพลง';
  bm.onclick = () => {
    if (!lib.length){ fxTab = 'music'; fxSel = null; render();
      return toast('ยังไม่มีไฟล์เพลงในคลัง — ลากไฟล์เข้ามาหรือโหลดจาก YouTube ก่อน', true); }
    // แทร็กแรกคลอทั้งเรื่อง · แทร็กถัด ๆ ไปเริ่มตรงหัวอ่านแล้วยาวจนจบ
    // (ลากขอบซ้าย-ขวาในเลนเพื่อกำหนดช่วงเองได้ทันที)
    const t5 = fxT5((PV && PV.gt) || 0);
    fxAddMusic(lib[0], fxMusics().length ? t5 : 0, 0);
    toast('วางแทร็กเพลงแล้ว — เลือกไฟล์/ตั้งช่วงข้างล่าง หรือลากขอบในเลน');
  };
  bar.append(bt, bs, bo, bm, el('span', 'spacer'),
             el('span', 'note', `วางตรงหัวอ่าน · ตอนนี้ ${at}`));
  c.append(bar);

  // ── ราง ──
  const wrap = el('div', 'tlwrap');
  const inner = el('div', 'tlinner');
  inner.style.width = Math.max(320, total * fxZoom + 90) + 'px';

  const grid = el('div', 'fxtl');
  // ไม้บรรทัดกินสองคอลัมน์ไม่ได้ในกริดแบบนี้ — ใส่ช่องว่างซ้ายไว้ให้ตรงกัน
  grid.append(el('div', 'fxlname'));
  const ruler = el('div', 'tlruler');
  const stepSec = fxZoom >= 60 ? 1 : fxZoom >= 25 ? 5 : fxZoom >= 10 ? 15
                : fxZoom >= 4 ? 60 : 300;
  for (let t = 0; t <= total; t += stepSec){
    const m = el('i'); m.style.left = (t * fxZoom) + 'px';
    m.append(el('span', null, mmss(t)));
    ruler.append(m);
  }
  ruler.onclick = e => {
    const r = ruler.getBoundingClientRect();
    tlSeek(Math.max(0, fxT3((e.clientX - r.left) / fxZoom)));
  };
  grid.append(ruler);

  // แต่ละบล็อกในแถว — ใช้ซ้ำทั้งแถวรวมของคลิปและแถวย่อยของชั้นที่เพิ่มเอง
  const blockOf = (lane, r) => {
    // ชิ้นกำพร้าไม่มีที่อยู่ในหนังแล้ว วาดไว้ต้นรางให้เห็นว่ามีอยู่ ไม่ใช่หายไปเฉย ๆ
    const a = r.a == null ? 0 : r.a, b = r.b == null ? a + 1 : r.b;
    const d = el('div', 'fxb ' + r.cls + (r.orphan ? ' orphan' : '')
                      + (fxSel === r.id && fxSelKind === lane ? ' sel' : ''));
    d.dataset.lane = lane; d.dataset.id = r.id;
    d.style.left = (a * fxZoom) + 'px';
    d.style.width = Math.max(3, (b - a) * fxZoom) + 'px';
    d.textContent = r.label || '';
    d.title = (r.orphan ? '⚠ เกาะอยู่กับช่วงที่ไม่มีในหนังแล้ว — จะไม่โผล่ · ' : '')
      + `${r.label || ''}${r.a != null ? ` · ${mmss(r.a)}–${mmss(r.b)}` : ''}`;
    if (r.lock){
      d.style.cursor = 'pointer';
      d.onclick = () => fxPick(lane, r.id);
    } else {
      ['l', 'r'].forEach(side => {
        const h = el('div', 'h ' + side);
        h.onpointerdown = ev => fxBlockDrag(ev, lane, r.id, side);
        d.append(h);
      });
      d.onpointerdown = ev => {
        if (ev.target.classList.contains('h')) return;
        if (lane === 'clips'){ fxPick(lane, r.id); return; }
        fxBlockDrag(ev, lane, r.id, null);
      };
    }
    return d;
  };

  FX_LANES.forEach(([lane, label, hint]) => {
    const rows = fxLaneRows(lane);
    // ── แถวคลิป: แถวเดียวเสมอ ──
    //
    // 208 ชิ้นถ้าแยกแถวละชิ้นจะสูงเป็นหมื่นพิกเซล และมันไม่ใช่ของที่ "เพิ่มเอง"
    // อยู่แล้ว — เป็นเส้นอ้างอิงว่าหนังเดินถึงไหน ไม่ใช่ชั้นที่จัดวางทับกันได้
    if (lane === 'clips'){
      const nm = el('div', 'fxlname');
      nm.append(el('b', null, label), el('span', null, String(rows.length || '')));
      nm.title = hint;
      const row = el('div', 'fxlrow clips');
      if (!rows.length) row.append(el('div', 'fxempty', 'ยังไม่มี'));
      rows.forEach(r => row.append(blockOf(lane, r)));
      grid.append(nm, row);
      return;
    }

    // ── ชั้นที่เพิ่มเอง: แถวละชิ้น ──
    //
    // ชิ้นเดียวโผล่ได้หลายที่ในหนัง (คลิปที่มันเกาะถูกใช้ซ้ำ) — ทุกช่วงของชิ้นนั้น
    // ต้องอยู่ *แถวเดียวกัน* เพราะมันคือของชิ้นเดียว ลากอันไหนอีกอันก็ขยับตาม
    // จึงจัดกลุ่มด้วย id ไม่ใช่นับบล็อก
    const byId = [];
    const seen = {};
    rows.forEach(r => {
      if (seen[r.id] === undefined){ seen[r.id] = byId.length; byId.push([r]); }
      else byId[seen[r.id]].push(r);
    });
    if (!byId.length){
      const nm = el('div', 'fxlname');
      nm.append(el('b', null, label), el('span', null, ''));
      nm.title = hint;
      const row = el('div', 'fxlrow');
      row.append(el('div', 'fxempty',
        lane === 'music' ? 'ยังไม่ได้ใส่เพลง — กด ＋ เพลง'
        : lane === 'text' ? 'ยังไม่มีข้อความ — กด ＋ ข้อความ'
        : lane === 'shapes' ? 'ยังไม่มีรูปทรง — กด ＋ รูปทรง'
        : 'ยังไม่มีภาพซ้อน — กด ＋ ภาพซ้อน'));
      grid.append(nm, row);
      return;
    }
    byId.forEach((group, k) => {
      const r0 = group[0];
      const on = fxSel === r0.id && fxSelKind === lane;
      // แถวแรกของชั้นถือชื่อชั้น แถวถัด ๆ ไปย่อหน้าเข้าไปให้เห็นว่าเป็นพวกเดียวกัน
      const nm = el('div', 'fxlname' + (k ? ' sub' : '') + (on ? ' on' : ''));
      nm.title = hint;
      if (!k) nm.append(el('b', null, `${label} ${byId.length}`));
      else nm.append(el('b', null, r0.label || `#${k + 1}`));
      if (!r0.lock || lane === 'music'){
        const del = el('button', 'del', '✕');
        del.title = 'ลบชิ้นนี้';
        del.onclick = e => { e.stopPropagation(); fxDropItem(lane, r0.id); };
        nm.append(del);
      }
      nm.onclick = () => fxPick(lane, r0.id);
      const row = el('div', 'fxlrow');
      group.forEach(r => row.append(blockOf(lane, r)));
      grid.append(nm, row);
    });
  });
  inner.append(grid);

  // หัวอ่าน — แปลงเวลาของตัวเล่นเป็นเวลาของหนังขั้น 5 ก่อนเสมอ
  const head = el('div', 'tlhead');
  head.style.cssText = `left:${86 + fxT5((PV && PV.gt) || 0) * fxZoom}px;top:0;bottom:0`;
  inner.append(head);
  wrap.append(inner);
  wrap.addEventListener('scroll', () => { fxScroll = wrap.scrollLeft; });
  requestAnimationFrame(() => { wrap.scrollLeft = fxScroll; });
  c.append(wrap);

  c.append(el('p', 'note', 'คลิกบล็อก = เปิดค่าของชิ้นนั้นข้างล่าง · ลากตัวบล็อก = '
    + 'ย้ายไปเกาะจุดใหม่ (ข้ามคลิปได้) · ลากขอบ = ย่อ-ขยายช่วง · คลิกไม้บรรทัด = '
    + 'ย้ายหัวอ่าน'));
  const orph = FX_LANES.reduce((n, [l]) => n + fxLaneRows(l).filter(r => r.orphan).length, 0);
  if (orph)
    c.append(el('p', 'note warnnote', `▨ ${orph} ชิ้นเกาะอยู่กับช่วงที่ถูกตัดออกจาก`
      + 'หนังไปแล้ว — จะไม่โผล่ในไฟล์ ลากกลับเข้าช่วงที่ยังอยู่ หรือลบทิ้ง'));
  // คลิปเดียวถูกหยิบมาใช้หลายท่อนได้ ของชิ้นเดียวจึงโผล่ได้หลายที่
  const dup = {};
  FX_LANES.forEach(([l]) => fxLaneRows(l).forEach(r => {
    if (l !== 'clips') dup[r.id] = (dup[r.id] || 0) + 1; }));
  const many = Object.values(dup).filter(n => n > 1).length;
  if (many)
    c.append(el('p', 'note', `${many} ชิ้นโผล่มากกว่าหนึ่งที่ เพราะคลิปที่มันเกาะอยู่`
      + 'ถูกใช้หลายท่อน — ลากอันไหนก็ได้ อีกอันจะขยับตามเพราะเป็นชิ้นเดียวกัน'));
  return c;
}

const FX_TABS = [['clips', 'คลิป'], ['text', 'ข้อความ'], ['shapes', 'รูปทรง'],
                 ['images', 'ภาพซ้อน'], ['music', 'เพลง'], ['journey', 'แผนที่']];

function fxEditor(){
  const c = el('div', 'card');
  const bar = el('div', 'bar');
  const seg = el('div', 'seg');
  FX_TABS.forEach(([k, lab]) => {
    const n = k === 'shapes' ? fxShapes().length
            : k === 'images' ? fxOverlays().length
            : k === 'text' ? fxTexts().length
            : k === 'music' ? fxMusics().length
            : k === 'journey' ? (fxJourney().enabled ? fxStops().length : 0)
            : k === 'clips' ? ((FX.view || {}).touched || 0) : 0;
    const on = false;
    const b = el('button', null, lab + (n ? ` ${n}` : on ? ' ●' : ''));
    b.setAttribute('aria-pressed', fxTab === k);
    b.onclick = () => { fxTab = k; fxSel = null; render(); };
    seg.append(b);
  });
  bar.append(seg, el('span', 'spacer'));
  if (fxTab === 'shapes'){
    const plus = el('button', 'sm', '+ รูปทรง');
    plus.title = 'เพิ่มรูปทรงตรงวินาทีที่ตัวเล่นค้างอยู่';
    plus.onclick = fxAddShape;
    bar.append(plus);
  }
  if (fxTab === 'journey'){
    const plus = el('button', 'sm', '+ หมุด');
    plus.title = 'เพิ่มหมุดตรงวินาทีที่ตัวเล่นค้างอยู่';
    plus.onclick = fxAddStop;
    bar.append(plus);
  }
  if (fxDirty){
    const sv = el('button', 'primary', 'บันทึกเอฟเฟกต์');
    sv.onclick = () => fxSave();
    bar.append(sv);
  }
  c.append(bar);
  c.append(fxTab === 'shapes' ? fxShapeList()
         : fxTab === 'clips' ? fxClipList()
         : fxTab === 'images' ? fxOverlayPanel()
         : fxTab === 'music' ? fxMusicPanel()
         : fxTab === 'journey' ? fxJourneyPanel() : fxTextForm());
  return c;
}

// ── แท็บแผนที่ — เส้นทางที่มีคนเดินวิ่งตามคลิป ────────────────────
//
// ต่างจากชั้นอื่นตรงที่มัน **มีชุดเดียวทั้งเรื่อง** ไม่ใช่รายการของชิ้นที่วาง
// ได้หลายอัน — หนังเรื่องหนึ่งเล่าเส้นทางเดียว หน้าตาจึงเป็นฟอร์มตั้งค่าชุดเดียว
// แล้วมีรายการหมุดอยู่ข้างใน ไม่ใช่การ์ดต่อชิ้นเหมือนข้อความ/รูปทรง
const fxJourney = () => (fxData().journey ||
  (fxData().journey = JSON.parse(JSON.stringify(fxDefs().journey || {}))));
const fxStops = () => (fxJourney().stops || (fxJourney().stops = []));
const fxJourneyView = () => (FX.journey || {});

function fxStopCue(i){
  return (fxJourneyView().stops || []).find(s => s.idx === i);
}

function fxAddStop(){
  const t5 = fxT5((PV && PV.gt) || 0);
  const w = fxWhere(t5);
  if (!w) return toast('ยังไม่มีไทม์ไลน์ให้วางหมุด', true);
  const j = fxJourney();
  const d = fxDefs().stop || {};
  const box = j.box || [1000, 550];
  const n = fxStops().length;
  // หมุดใหม่เกิดบนเส้นทางท้ายสุด ไม่ใช่กลางกล่อง — ลำดับในรายการคือลำดับการเดิน
  // หมุดที่เกิดนอกเส้นแล้วยังไม่ได้ลากจะทำให้คนเดินกระโดดออกนอกทางทันที
  fxStops().push({...d, label: 'จุดใหม่', name: w.name, at: w.at,
    px: box[0] * 0.5, py: box[1] * 0.5,
    lx: box[0] * 0.5, ly: box[1] * 0.5 - 60,
    dist: 0, color: '#E65100', id: 'j' + n});
  j.enabled = true;
  fxTouch();
  toast('เพิ่มหมุดแล้ว — ตั้งชื่อกับระยะทาง แล้วลากหมุดบนแผนที่ให้อยู่บนเส้น');
}

                                             0, 1, 0.02, '', fxTouch)));
  g.append(capField('สีพื้นหลัง', capColour(() => j.panel_color,
                                          v => put('panel_color', v), fxTouch)));
  g.append(capField('เฟดเข้า', capNum(() => j['in'], v => put('in', v),
                                     0, 3, 0.05, 'วิ', fxTouch)));
  g.append(capField('เฟดออก', capNum(() => j.out, v => put('out', v),
                                    0, 3, 0.05, 'วิ', fxTouch)));
  w.append(g);

  w.append(el('h4', 'caph', 'เส้นทางกับคนเดิน'));

  g2.append(capField('ขนาดป้ายชื่อ', capNum(() => j.size, v => put('size', v),
                                           8, 120, 1, '', fxTouch)));
