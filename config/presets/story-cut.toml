# ฉบับสั้น 10–12 นาที — คัดเฉพาะช็อตที่ฟังรู้เรื่องและภาพนิ่ง (สูตร v4 แบบไม่ใช้ AI)
#
# ให้คะแนนช็อตพูดจากความหลากหลายของคำ: ช็อตที่วนซ้ำคำเดิม
# ("นายนายนาย", "ขึ้นกิมมมม") จะถูกตัดออกก่อน
# ช่วงวิวเลือกจากภาพที่นิ่งที่สุดและห้ามเลือกสองชิ้นที่ติดกัน
#
# ⚠️ นี่คือการคัดด้วยกฎ ไม่ใช่ความเข้าใจเนื้อเรื่อง — การแบ่งบทตามการเดินทาง
#    (ออกเดินทาง → ขึ้นเขา → ลานสน → เดินลง) ต้องรอ Phase 4 ที่ใช้ AI

[project]
name = "story-cut"

[talk]
gap_merge = 1.20            # ตัดช่องเงียบเข้มกว่า เพราะต้องการความกระชับ
min_shot  = 3.00

[broll]
motion_bands = [8.0, 15.0]
durations    = [3.5, 2.5, 1.5]
run_max      = 3            # วิวติดกันไม่เกิน 3 ชิ้น (บังคับอีกรอบหลัง select ด้วย)
pick         = "center"
drop_above_motion = 18.0
drop_below_bright = 12.0    # ตัดช็อตมืดจัดตอนกลางคืนออก

[select]
enabled          = true
target_minutes   = 11.0
# ฟุตเทจชุดนี้มี B-roll ที่ผ่านตัวกรองแค่ ~2.5 นาที ถ้าตั้ง talk_ratio ต่ำ
# จะเติมวิวไม่พอแล้วได้ไม่ถึงเป้า — 0.80 ทำให้ลงที่ ~10.8 นาทีพอดี
talk_ratio       = 0.80
min_unique_words = 2
avoid_adjacent   = true

[audio]
target_lufs_talk  = -19.0
target_lufs_broll = -26.0
compressor  = false
denoise     = false
allow_limit = 12.0
