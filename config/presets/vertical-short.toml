# หนังแนวตั้ง 9:16 — TikTok · Reels · Shorts
#
# สูตรนี้เปลี่ยนสามอย่างจากค่าตั้งต้นซึ่งทำมาเพื่อหนังยาวแนวนอน:
#
#   1. ผืนเป็น 1080×1920  คลิปที่สัดส่วนไม่ตรงได้พื้นหลังเบลอ ไม่ใช่แถบดำ
#   2. ตัดชิด — เปิด jumpcut แล้วลดเกณฑ์ทุกตัวลง ประโยคต่อประโยคติดกัน
#      ช็อตสั้นสุด 1.2 วิ (ค่าตั้งต้น 3.0) เพราะคนดู feed เลื่อนผ่านใน 2 วินาที
#   3. ความดังรวมไปจบที่ −14 LUFS ซึ่งเป็นเป้าที่ TikTok/Reels/Shorts ปรับเข้าหา
#      ส่งไปดังกว่านี้แพลตฟอร์มกดลงเอง ส่งไปเบากว่านี้มันไม่ดันขึ้นให้
#
# ใช้จากเทอร์มินัล:  ./vcut run -c vertical-short
# ใช้จากหน้าเว็บ:    แท็บ "ตั้งค่า" → ปุ่ม "หนังแนวตั้ง · TikTok"

[project]
name = "vertical-short"


# ─────────────────────────── ผืน ───────────────────────────
[video]
width  = 1080
height = 1920
# blur_pad ไม่ใช่ crop เป็นค่าตั้งต้น เพราะครอปฟุตเทจแนวนอนลง 9:16 ตัดสองข้าง
# ทิ้งไป 68% ของภาพ และเอนจินไม่มีตัวตามหน้าคน — คนที่ยืนเยื้องขอบจะโดนตัดหัว
# โดยไม่มีอะไรเตือน  เลือก crop เป็นราย ๆ ได้ที่แผงคลังคลิป เมื่อดูตัวอย่างแล้ว
vertical_mode = "blur_pad"


# ─────────────────── ตัดชิด — จังหวะของ feed ───────────────────
[jumpcut]
enabled     = true
noise_db    = -32.0
min_silence = 0.28       # ค่าตั้งต้น 0.45 — คลิปสั้นทนช่องว่างครึ่งวินาทีไม่ได้
pad         = 0.06       # เผื่อน้อยลงตาม ไม่งั้นคว้านออกแล้วเงียบยังอยู่ครบ
min_piece   = 0.45

[talk]
margin_pre  = 0.15
margin_post = 0.25
gap_merge   = 0.40       # ค่าตั้งต้น 1.50 — ยิ่งต่ำยิ่งตัดถี่
min_shot    = 1.20       # ค่าตั้งต้น 3.00

[broll]
# วิวคั่นสั้นกว่าหนังยาวเท่าตัว และห้ามติดกันเกินสองชิ้น — b-roll สามชิ้นซ้อน
# ในคลิป 40 วินาทีกินไปหนึ่งในสี่ของเรื่องโดยไม่มีใครพูดอะไรเลย
durations = [2.0, 1.5, 1.0]
run_max   = 2


# ─────────────────── ความยาว — คุมไว้ที่ 45 วินาที ───────────────────
[compose]
mode           = "pattern"
pattern        = ["TALK", "BROLL"]
target_minutes = 0.75    # 0 = ไม่จำกัด (เอาทุกชิ้นในคลัง)


# ─────────────────────────── เสียง ───────────────────────────
[audio]
same_level  = true       # คลิปสั้นไม่มีที่ว่างให้ "ช่วงวิวเบากว่า" — เสียงหายไปเลย
master_lufs = -14.0      # เป้าของแพลตฟอร์มโซเชียล (หนังยาวใช้ 0 = ไม่ทำ)


# ─────────────────────────── ไฟล์ ───────────────────────────
[encode]
# 1080×1920 มีพิกเซลน้อยกว่า 1920×1080 อยู่แล้ว และปลายทาง re-encode ทุกเจ้า
# 20M ของค่าตั้งต้นจึงเป็นไฟล์ใหญ่ที่ไม่มีใครได้เห็นความต่าง
bitrate = "12M"
maxrate = "16M"
bufsize = "32M"
